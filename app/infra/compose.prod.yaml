# Start from app/ with the production environment file.
name: app-prod

x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/app
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:-app}
  S3_FORCE_PATH_STYLE: "true"

services:
  web:
    build:
      context: ../..
      dockerfile: app/infra/Dockerfile
    environment:
      <<: *app-environment
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL to the public HTTPS URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      DISCORD_FEEDBACK_WEBHOOK_URL: ${DISCORD_FEEDBACK_WEBHOOK_URL:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/login").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    init: true
    restart: unless-stopped

  fake-generation:
    build:
      context: ../..
      dockerfile: app/workers/fake-generation/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      FAKE_GENERATION_ENABLED: "true"
      FAKE_GENERATION_DURATION_MS: ${FAKE_GENERATION_DURATION_MS:-720000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 13m
    restart: unless-stopped

  migrations:
    pull_policy: build
    build:
      context: ../..
      dockerfile: app/infra/Dockerfile.migrations
    environment: *app-environment
    volumes:
      - type: bind
        source: ../../explorer
        target: /srv/explorer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../data/pdf
        target: /srv/data/pdf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-s3.port=8333", "-bucket=${S3_BUCKET:-app}", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
