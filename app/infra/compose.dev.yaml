# Local development only.
# Start from app/: docker compose -f infra/compose.dev.yaml up -d
# Connect: postgresql://postgres:postgres@localhost:5432/app
name: app

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    pull_policy: build
    build:
      context: ../..
      dockerfile: app/infra/Dockerfile.migrations
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: seaweedadmin
      S3_SECRET_ACCESS_KEY: seaweedadmin
      S3_BUCKET: app
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - type: bind
        source: ../../explorer
        target: /srv/explorer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../data/pdf
        target: /srv/data/pdf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  fake-generation:
    build:
      context: ../..
      dockerfile: app/workers/fake-generation/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
      FAKE_GENERATION_ENABLED: "true"
      FAKE_GENERATION_DURATION_MS: "720000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 13m
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -s3.port=8333 -bucket=app -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: seaweedadmin
      AWS_SECRET_ACCESS_KEY: seaweedadmin
    ports:
      - "127.0.0.1:9000:8333"
      - "127.0.0.1:9001:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  seaweedfs_data:
  redis_data:
