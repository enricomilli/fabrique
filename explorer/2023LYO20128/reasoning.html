<style>
/* Layout: app bar, then a reading map (section band + two lists), a KPI row, and a two-column
   iteration timeline (cards left, duration bars right). */
:root {
  --bg: #efeee9; --panel: #f8f7f3; --ink: #1d1f23; --mute: #6c6f76; --line: #d9d7cf;
  --read: #2f4a8a; --unread: #e3e1da; --ochre: #c9a45e; --ochre-deep: #7e5c1d; --ochre-soft: #f4ead6;
  --serif: "Spectral", Georgia, serif; --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
    --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
  --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.brand::before { content: ""; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.doc { color: var(--mute); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs span { font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); }
.tabs .on { border-color: var(--ochre); background: var(--ochre-soft); color: var(--ochre-deep); font-weight: 500; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; }
h1 { font: 500 30px/1.2 var(--serif); margin: 0; display: inline; }
.sub { font: 13px var(--mono); color: var(--mute); margin-left: 14px; }
.label { font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.panel { background: var(--panel); border: 1px solid var(--line); }

/* section band */
.band { display: flex; height: 112px; margin-top: 18px; border: 1px solid var(--line); background: var(--panel); }
.sec { position: relative; border-right: 1px solid var(--line); background: var(--unread); cursor: pointer; min-width: 3px; }
.sec:last-child { border-right: 0; }
.sec .fill { position: absolute; left: 6%; right: 6%; bottom: 0; background: var(--read); }
.sec:hover, .sec:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; z-index: 1; }
.ticks { display: flex; height: 22px; font: 11px var(--mono); color: var(--mute); }
.ticks div { text-align: center; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); margin-top: 4px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.tip { font: 12px var(--mono); color: var(--ink); min-height: 18px; margin-top: 6px; }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.lists .panel { padding: 18px 22px; min-width: 0; }
.lists ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.lists li { display: flex; justify-content: space-between; gap: 12px; }
.lists li b { font: 500 13px var(--mono); color: var(--read); white-space: nowrap; }
.lists li a { color: inherit; text-decoration: none; }
.lists li a:hover { text-decoration: underline; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
.kpis > div { padding: 18px 22px; border-right: 1px solid var(--line); }
.kpis > div:last-child { border-right: 0; }
.kpis strong { display: block; font: 600 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.kpis span { color: var(--mute); font-size: 14px; }

.timeline { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 26px; align-items: start; }
.cards { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 16px 22px 18px; scroll-margin-top: 16px; }
.card.sel { border-color: var(--ochre); box-shadow: 0 0 0 1px var(--ochre); }
.card header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.card header .label { color: var(--ochre-deep); }
.kind { font: 12px var(--mono); color: var(--mute); }
.part { border-left: 3px solid var(--ochre); background: color-mix(in srgb, var(--unread) 55%, var(--panel)); padding: 10px 16px; margin-top: 10px; }
.part.ret { border-left-color: var(--read); }
.part .label { color: var(--ochre-deep); font-size: 11px; }
.part.ret .label { color: var(--read); }
.intent { font: 400 17px/1.55 var(--serif); margin: 6px 0 0; }
.lang { font: 11px var(--mono); color: var(--mute); margin-left: 8px; }
details { margin-top: 8px; }
summary { cursor: pointer; font: 12px var(--mono); color: var(--mute); }
details pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; max-height: 360px; overflow: auto; }
.geste { margin: 6px 0 0; }
.geste em { font-style: normal; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.chip { font: 12px var(--mono); color: var(--read); border: 1px solid var(--read); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.chip:hover { background: var(--read); color: var(--panel); }
.empty { color: var(--mute); font-size: 14px; }
.err { margin: 6px 0 2px; font-size: 14px; color: #b3422b; }
.err code { font: 12.5px var(--mono); }

.durs { padding: 14px 18px; position: sticky; top: 16px; }
.dur { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; background: none; border: 0; width: 100%; color: inherit; font: inherit; text-align: left; }
.dur .num { font: 12px var(--mono); color: var(--mute); }
.dur .track { display: flex; align-items: center; gap: 8px; }
.dur .b { height: 7px; background: var(--ochre); }
.dur .v { font: 12px var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }
.dur .k { font: 10.5px var(--mono); color: var(--mute); margin-left: auto; }
.dur.sel .num { color: var(--ink); font-weight: 600; }
.dur.sel .b { background: var(--ochre-deep); }
.dur:focus-visible { outline: 2px solid var(--ochre); }
.note { color: var(--mute); font-size: 13px; margin-top: 10px; }
.mock { font: 11px var(--mono); color: var(--mute); text-align: right; margin-top: 30px; }
@media (max-width: 860px) {
  .lists, .timeline { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpis > div:nth-child(2) { border-right: 0; }
  .durs { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s, border-color .15s; } }
</style>

 what I have and start writing the note de lecture. I have:", "full": "Now I have extensive material from the thesis. Let me organize what I have and start writing the note de lecture. I have:\n\n1. Introduction (p.37-39) - Objectives, corpus of 700+ documents, 50 years, 5 governors\n2. Methodology (p.38-39, p.52-54) - Prosopography, \"Catastrophe factor\", onomastics, archives vivantes/mortes\n3. Lu-Kirizal (p.132-133, p.143-144, p.165) - First governor, family, death cult\n4. Ur-Lamma (p.171, p.219-220, p.250-259, p.259-260) - Mandate, e2-du6-la debate, death cult\n5. Arad-Nanna (p.298-299, p.304, p.358-359) - Grand vizir, career, family\n6. Conclusion (p.382-383, p.385-387, p.389-390) - Key findings, agency of women, provincial continuity\n\nNow let me start writing the note in multiple passes as required - at most 2 paragraphs per execution. Let me begin with paragraphs 1 (opening) and 2 (methodology).", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige note_part1 (314 mots), note_part2 (344 mots).", "readings": [], "drafts": [{"variable": "note_part1", "words": 314}, {"variable": "note_part2", "words": 344}], "code": "# Start writing the note - Pass 1: Paragraphs 1 (Opening) and 2 (Methodology)\n\nnote_part1 = \"\"\"# *Les gouverneurs de Girsu/Lagaš sous la IIIe dynastie d'Ur (2112-2002 AEC)*\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-07\n\n**Référence :** Sophia WITZIG, *Les gouverneurs de Girsu/Lagaš sous la IIIe dynastie d'Ur (2112-2002 AEC)*, Université Lumière Lyon 2, 2023, 435 p.\n\n---\n\nLa thèse de Sophia Witzig aborde l'un des problèmes centraux de l'histoire administrative de la Mésopotamie du IIIe millénaire : la nature des relations entre la couronne d'Ur III et les élites locales de ses provinces les plus riches et les plus stratégiques. S'appuyant sur un corpus de plus de sept cents documents administratifs et légendes de sceaux couvrant une cinquantaine d'années — soit à peu près la moitié de la durée de la dynastie (2112-2002 AEC) —, cette étude prosopographique se concentre sur les gouverneurs (*ensi₂*) de la province de Girsu/Lagaš et sur leur entourage direct. Le fil directeur qui traverse l'ensemble de la recherche est d'établir « dans quelle mesure les gouverneurs de cette province sous Ur III sont les héritiers de leurs prédécesseurs » (p. 37), et plus fondamentalement de « déterminer la nature des relations entre la couronne et l'administration locale à travers l'étude prosopographique des individus à la tête de Girsu/Lagaš » (p. 37). Les cinq gouverneurs successifs que l'auteur reconstitue — Lu-Kirizal, Ur-Lamma, Nanna-Zišagal, Šarakam et Arad-Nanna — constituent cinq études de cas rigoureusement organisées, qui permettent de suivre la continuité et les ruptures dans la gestion de cette province majeure, l'une des plus riches de l'empire du fait de sa situation stratégique au sud de la Mésopotamie. La thèse se propose non seulement de dresser un bilan administratif de la province, mais de questionner la persistance de l'identité politique et religieuse lagašite après la chute de la deuxième dynastie de Lagaš, en montrant comment les élites locales perpétuent des pratiques de culte et des réseaux économiques qui transcendent les changements de dynastie.\"\"\"\n\nnote_part2 = \"\"\"La démarche méthodologique de la thèse est d'une grande rigueur et repose sur plusieurs niveaux d'analyse complémentaires. L'auteur choisit explicitement une approche « représentative » plutôt qu'exhaustive, conscients des biais inhérents à la conservation d'un corpus qui provient en majorité de fouilles clandestines ou de pillages, et dont l'absence de contexte archéologique quasi systématique prive l'historien de l'information sur les fonds d'archives originaux (p. 38-39). Pour compenser cette difficulté, Witzig mobilise le concept de « Catastrophe factor » de M. Civil (1987), selon lequel « le nombre de tablettes augmente avant une catastrophe, comme une guerre, ou une phase d'instabilité politique, car celles-ci n'ont pas pu être traitées par l'administration » (p. 39) — ce qui conduit à l'hypothèse paradoxale mais documentée que « les périodes les plus instables de la troisième dynastie d'Ur seraient les mieux documentées » (p. 39). Le cadre méthodologique principal est la prosopographie, définie par l'auteur en s'appuyant sur K.S.B. Keats Rohan (2007) comme une méthode qui « vise à brosser le portrait d'individus appartenant à une même classe en se concentrant sur ce qu'il existe de plus général, de commun entre eux » (p. 52). Cette approche est complétée par une analyse onomastique, l'étude des termes de parenté — où la question de la traduction du terme *dumu* (« enfant ») occupe une place centrale dans la démonstration — et par l'analyse des sceaux-cylindres. L'auteur s'appuie sur les bases de données en ligne BDTNS et CDLI pour constituer ses dossiers, et adopte un questionnaire structuré (état-civil, famille, carrière, possessions) pour chaque individu étudié. L'originalité de la démarche réside notamment dans le croisement systématique des sources administratives, juridiques (comptes-rendus de procès) et cultuelles (offrandes funéraires), permettant de reconstituer non seulement les carrières individuelles mais aussi les réseaux familiaux et économiques qui sous-tendent la gouvernance de la province sur plusieurs décennies. La distinction entre « archives vivantes » et « archives mortes », puis la reconstitution *a posteriori* des fonds par critères onomastiques et prosopographiques illustrent une conscience méthodologique pointue des problèmes que pose l'exploitation de corpus décontextualisés (p. 38-39).\"\"\"\n\nprint(\"=== PASSAGE 1 (Opening + Méthodologie) ===\")\nprint(note_part1)\nprint(note_part2)\nprint(f\"\\nNombre de mots approximatif : {len(note_part1.split()) + len(note_part2.split())}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 8, "kind": "lecture", "seconds": 15.48, "header_label": "Itération 8 · 15,5 s", "selected_by_default": false, "intention": {"headline": "Good, I have about 658 words so far. Now I need to write paragraph 3 (Partie II - Lu-Kirizal and early governors) and paragraph 4 (Ur-Lamma and the confiscation debate).", "full": "Good, I have about 658 words so far. Now I need to write paragraph 3 (Partie II - Lu-Kirizal and early governors) and paragraph 4 (Ur-Lamma and the confiscation debate). Let me first extract more passages from the core of these chapters to have precise citations.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Lit 4 passages : 5.4 Gérer la province (p.135) · 6.2.1 Le corpus du gouverneur Ur-Lamma (p.174) · 6.5 Administrer la province (p.197) · 5.7 Conclusion (p.169)", "readings": [{"type": "page_jump", "page": 135, "section_title": "5.4 Gérer la province", "pdf_page": 135}, {"type": "page_jump", "page": 174, "section_title": "6.2.1 Le corpus du gouverneur Ur-Lamma", "pdf_page": 174}, {"type": "page_jump", "page": 197, "section_title": "6.5 Administrer la province", "pdf_page": 197}, {"type": "page_jump", "page": 169, "section_title": "5.7 Conclusion", "pdf_page": 169}], "drafts": [], "code": "# Batch 7: Extract more from Lu-Kirizal's governance and Ur-Lamma's administration core\n\n# Lu-Kirizal governance\npos135 = context.find(\"[p.135]\")\nprint(\"===== EXTRAIT [p.135] → [p.142] =====\")\nprint(context[pos135:pos135+2500])\n\n# Ur-Lamma's functions and justice role\npos174 = context.find(\"[p.174]\")\nprint(\"\\n===== EXTRAIT [p.174] → [p.180] =====\")\nprint(context[pos174:pos174+2000])\n\n# Ur-Lamma administration of province\npos197 = context.find(\"[p.197]\")\nprint(\"\\n===== EXTRAIT [p.197] → [p.203] =====\")\nprint(context[pos197:pos197+2000])\n\n# Lu-Kirizal conclusion\npos169 = context.find(\"[p.169]\")\nprint(\"\\n===== E incipaux domaines de la province. Un document de SH28 porte le sceau de Lu-Kirizal qualifié d'*ensi₂* de Lagaš, à traduire par « prince de Lagaš », à l'instar de ses prédécesseurs (p. 382). Les comptes-rendus de procès (*ditila*) attestent qu'il supervisait la justice dans sa province, la mention *di til-la Lu2-kiri3-zal-kam* (« l'affaire terminée de Lu-Kirizal ») apparaissant sur des tablettes dont le litige persiste sous ses successeurs (p. 135). Ce qui donne de la profondeur à cette reconstitution, c'est la dimension familiale : l'épouse de Lu-Kirizal, Namninanidu, est identifiée par plusieurs inscriptions commémoratives et des sceaux de coursier (p. 143-144), et leur fille Hala-Lamma donne son nom à une maisonnée qui perdure après sa mort (p. 382). Après sa mort, Lu-Kirizal est honoré dans la province par des offrandes funéraires aux côtés des dieux et des anciens princes de Lagaš, comme en témoigne la tablette MVN 9 87 datée de SS07, qui récapitule les quantités de fruits frais versés pour les offrandes régulières (p. 165). P. Michalowski (2013) avait déjà montré que ce phénomène — l'association des souverains défunts au culte des dieux dans leur chapelle mortuaire (*ki-a-nag*) — est propre à Girsu et constitue un indice puissant de la continuité de la légitimité politique lagašite sous Ur III (p. 165).\"\"\"\n\nnote_part4 = \"\"\"Le deuxième chapitre de la Partie II est consacré à Ur-Lamma, le gouverneur le plus longuement documenté de la province. Son mandat, situé entre la 32ᵉ année de Šulgi et la fin de la 3ᵉ année d'Amar-Sin, couvre environ dix-sept années (p. 171), avec une interruption d'environ deux ans pendant lesquelles Alla exerce l'intérim (p. 245-249). Ce gouverneur ne possède pas de sceau d'*ensi₂*, mais un sceau d'intendant (*šatam*) dédié au roi Šulgi (p. 382) — il officie d'abord comme intendant du palais sous le mandat de Lu-Kirizal avant de gouverner la province. L'auteur explore en détail les multiples fonctions d'Ur-Lamma, depuis son rôle dans la justice, où il supervise les procès et les comptes-rendus, jusqu'à l'administration des grands domaines agricoles de la province et à la gestion des transactions avec les bureaux de Puzriš-Dagan (p. 197-198). La question la plus stimulante de cette section concerne l'interprétation de l'expression *e₂-du₆-la*, au cœur du débat sur la déchéance de la famille d'Ur-Lamma. Selon l'interprétation dominante de K. Maekawa (1996a), « la famille d'Ur-Lamma, riche et influente, est tombée en disgrâce et a été destituée par le roi Amar-Sin, qui en a probablement fait exécuter les principaux membres » (p. 41-42), l'expression *e₂-du₆-la* signifiant « confiscation de la propriété privée ». Witzig remet en cause cette lecture en montrant que l'expression « qualifie des dépenses dans des billets » et « peut être associée à la propriété d'une personne » sans nécessairement impliquer de confiscation politique (p. 258). Elle observe en outre que les biens inventoriés ne concernent que quatre des sept fils identifiés d'Ur-Lamma — Ur-Bau, Dudu, Lugal-Zuluhu et Lu-Ningirsu — et que d'autres documents mentionnent l'*e₂-du₆-la* pour des individus sans lien avec le clan d'Ur-Lamma, comme Lu-Igimaše (SH34) ou Ur-Sagamu (SH39) (p. 258). La thèse d'une exécution de masse est donc fragilisée : Ur-Mes est encore attesté sous AS07, et Lugal-Zuluhu apparaît comme observateur (*lu₂-marza*) lors d'un procès datant du mandat d'Arad-Nanna, où il est appelé « fils du gouverneur » bien que son père soit mort (p. 383). Par ailleurs, les offrandes funéraires régulières réservées à Ur-Lamma à la pleine lune et à la nouvelle lune, aux côtés du prince Gudea de Lagaš divinisé, confirment qu'il est « commémoré dans la province » à sa mort et qu'il n'a pas été frappé d'ignominie (p. 259-260).\"\"\"\n\nprint(\"=== PASSAGE 2 (Parties - Lu-Kirizal et Ur-Lamma) ===\")\nprint(note_part3)\nprint(note_part4)\nprint(f\"\\nNombre de mots : {len(note_part3.split()) + len(note_part4.split())}\")"}, "feedback": {"e vinces périphériques, du Sabum au Šimaški (p. 298). Cette inscription, découverte à Girsu dans la zone du Tell-des-tablettes lors des premières campagnes de fouilles — l'une des rares dont le contexte ait été préservé —, présente les titulatures d'Arad-Nanna « à la manière d'un curriculum vitae » (p. 298). L'auteur montre que le rôle d'Arad-Nanna dans la justice à Girsu se distingue aussi de celui de ses prédécesseurs : tandis qu'Ur-Lamma rendait la justice seul, Arad-Nanna agit aux côtés d'un collège de juges — Ur-Ištaran, Lu-Ibgal, Lu-Dingira et Allamu —, ce qui traduit, selon Culberston (2009), un affaiblissement de l'autorité judiciaire du gouverneur au profit d'une élite locale plus pluraliste (p. 327-328). Sa famille, issue du lignage de La-Ni, grand vizir, appartient à la branche cadette du clan d'Ur-Namma (p. 358) et bénéficie d'une proximité avec la couronne : l'une de ses épouses est Geme-Eana, fille du roi Amar-Sin, et une autre est la princesse Šat-Mami (p. 358-359). Sa carrière se poursuit sous Šu-Sin et Ibbi-Sin, et il est possible que son fils Šu-Ea lui succède comme grand vizir en IS07 (p. 385). L'histoire de la province s'arrête avec ses archives à IS04, marquant la fin de l'ère documentée de Girsu/Lagaš sous Ur III.\"\"\"\n\nnote_part6 = \"\"\"En définitive, l'apport majeur de cette thèse réside dans la démonstration que la province de Girsu/Lagaš « est probablement un soutien pour la couronne, plus qu'une simple province intégrée par la force aux territoires d'Ur III » (p. 390). L'auteur atteint ce résultat par une triple voie. Sur le plan empirique, la constitution de dossiers prosopographiques pour cinq gouverneurs successifs et leur entourage, à partir d'un corpus de plus de sept cents documents, offre un tableau diachronique de la gouvernance provinciale rarement disponible pour cette période. La reconstitution des réseaux familiaux — notamment la trajectoire des sept fils d'Ur-Lamma et la longévité administrative de fonctionnaires comme Gudea, suivi sur 35 ans (p. 385), ou Ur-Bau fils d'Ur-Dun et Lu-Utu fils de Bazi (p. 385) — éclaire une continuité bureaucratique qui survit aux changements de dynastie et de souverain. Sur le plan critique, la thèse renverse un consensus assyriologique en démontrant que la thèse de K. Maekawa sur la confiscation et l'exécution de la famille d'Ur-Lamma sous Amar-Sin ne se vérifie pas : « l'étude du corpus de la famille d'Ur-Lamma ne confirme pas la thèse d'une confiscation avancée par K. Maekawa (1996a) et largement soutenue par les assyriologues » (p. 390). Les offrandes funéraires régulières réservées à Ur-Lamma (p. 259-260) et la persistance des fils du gouverneur dans les archives après sa mort (p. 383) invalident l'hypothèse d'une disgrâce politique. Enfin, sur le plan théorique, l'introduction du concept d'agentivité féminine — emprunté à A. Garcia Ventura et F. Karahashi (2023) et défini comme « la capacité d'un individu ou d'un groupe à agir de façon motivée et réfléchie » (p. 389) — enrichit considérablement l'analyse : les épouses et filles des gouverneurs ne sont pas de simples figures rituelles mais « des agents économiques à travers les transactions auxquelles elles contribuent, les maisonnées qu'elles gèrent, ou encore les offrandes qu'elles font et qu'elles reçoivent » (p. 390). L'auteur a raison de souligner que « les femmes de l'élite lagašite [...] peuvent transmettre le pouvoir : c'est notamment le cas avec les filles d'Ur-Bau au sein de la deuxième dynastie de Lagaš, qui à travers le mariage, permettent l'élargissement du clan » (p. 390). La thèse laisse toutefois ouvertes quelques questions. Le caractère représentatif du corpus, bien que justifié par l'absence de contexte archéologique (p. 38), invite à la prudence face aux généralisations : les biais de conservation (pillages, fouilles clandestines) et le « Catastrophe factor » (p. 39) rendent certaines périodes plus visibles que d'autres. Par ailleurs, la spécificité de Girsu/Lagaš — notamment l'absence de sceaux de gouverneur dédiés aux rois d'Ur III, alors qu'à Umma 97,6 % des sceaux de gouverneurs le sont (p. 386) — invite à approfondir la comparaison interprovinciale. Mais ces limites, loin de fragiliser la démonstration, soulignent au contraire la solidité d'une approche qui parvient à tirer du chaos archivistique un récit cohérent de la continuité de l'élite lagašite et de sa capacité à négocier avec la couronne d'Ur son autonomie relative.\"\"\"\n\nprint(\"=== PASSAGE 3 (Arad-Nanna + Conclusion critique) ===\")\nprint(note_part5)\nprint(note_part6)\nprint(f\"\\nNombre de mots : {len(note_part5.split()) + len(note_part6.split())}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 13, "kind": "rédaction", "seconds": 22.29, "header_label": "Itération 13 · 22,3 s", "selected_by_default": false, "intention": {"headline": "I now have all six paragraphs written. Let me assemble the complete note with the citation section at the end, then finalize.", "full": "I now have all six paragraphs written. Let me assemble the complete note with the citation section at the end, then finalize.\n\nTotal word count so far: 658 + 704 + 803 = 2165 words, which is around the target of ~2000.\n\nLet me assemble the complete markdown.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige citation_section (24 mots).", "readings": [], "drafts": [{"variable": "citation_section", "words": 24}], "code": "# Assemble the complete note and finalize\n\ncitation_section = \"\"\"---\n\n## Pour citer ce document\n\n**Note générée automatiquement**, « Compte rendu de *Les gouverneurs de Girsu/Lagaš sous la IIIe dynastie d'Ur* », 2026-10-07.\"\"\"\n\nnote_complet = note_part1 + \"\\n\\n\" + note_part2 + \"\\n\\n\" + note_part3 + \"\\n\\n\" + note_part4 + \"\\n\\n\" + note_part5 + \"\\n\\n\" + note_part6 + \"\\n\\n\" + citation_section\n\nprint(\"=== NOTE COMPLETE ===\")\nprint(note_complet)\nprint(f\"\\n\\nNombre total de mots : {len(note_complet.split())}\")\nprint(f\"Nombre total de caractères : {len(note_complet)}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 14, "kind": "assemblage", "seconds": 24.84, "header_label": "Itération 14 · 24,8 s", "selected_by_default": false, "intention": {"headline": "The note is complete with 2189 words, well within the target of ~2000 words. It has six dense paragraphs, proper page references throughout (p. 37, p. 38-39, p. 39, p. 52, p. 132, p. 382, p. 135, p.", "full": "The note is complete with 2189 words, well within the target of ~2000 words. It has six dense paragraphs, proper page references throughout (p. 37, p. 38-39, p. 39, p. 52, p. 132, p. 382, p. 135, p. 143-144, p. 165, p. 171, p. 245-249, p. 197-198, p. 41-42, p. 258, p. 383, p. 259-260, p. 304, p. 342, p. 298, p. 327-328, p. 358, p. 358-359, p. 385, p. 390, p. 389, p. 38, p. 386). That's well over 8 distinct page references.\n\nThe note follows the required structure, includes the metadata, six substantive paragraphs, and the citation section. Let me finalize it.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Assemble la note et appelle FINAL().", "readings": [], "drafts": [], "code": "FINAL(note_complet)"}, "feedback": {"extracts": [], "error": null, "empty_message": "La note finale (rlm-cli la renvoie sur stdout)."}}]}}, {"id": "iteration_bars", "ui_label": "Les 14 itérations", "shows": "A compact list: one row per iteration with its number, a bar ∝ seconds (scale to max_seconds), the seconds and the kind. Clicking a row selects and scrolls to its card in 'iterations'.", "fields": {"max_seconds": "longest iteration, for the bar scale"}, "data": {"max_seconds": 34.91, "caption": "Chaque itération est un événement : une intention (le raisonnement du modèle), un geste (ce que son code fait), un retour (les extraits que le REPL lui renvoie). Cliquer une barre ouvre sa carte.", "items": [{"n": 1, "seconds": 10.8, "kind": "lecture"}, {"n": 2, "seconds": 9.76, "kind": "lecture"}, {"n": 3, "seconds": 9.46, "kind": "lecture"}, {"n": 4, "seconds": 10.59, "kind": "lecture"}, {"n": 5, "seconds": 11.83, "kind": "lecture"}, {"n": 6, "seconds": 12.75, "kind": "lecture"}, {"n": 7, "seconds": 26.27, "kind": "rédaction"}, {"n": 8, "seconds": 15.48, "kind": "lecture"}, {"n": 9, "seconds": 27.71, "kind": "rédaction"}, {"n": 10, "seconds": 18.27, "kind": "lecture"}, {"n": 11, "seconds": 17.39, "kind": "lecture"}, {"n": 12, "seconds": 34.91, "kind": "rédaction"}, {"n": 13, "seconds": 22.29, "kind": "rédaction"}, {"n": 14, "seconds": 24.84, "kind": "assemblage"}]}}]};                                   // the contract: C.sections[] keyed by id
const S = Object.fromEntries(C.sections.map(x => [x.id, x.data]));
const L = Object.fromEntries(C.sections.map(x => [x.id, x.ui_label]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pdfAt = p => `${C.source.pdf_file}#page=${p}`;
const pct = x => Math.round(x * 100) + " %";

document.querySelector(".tabs").innerHTML = S.header.tabs.map(t => `<span class="${t.active ? "on" : ""}">${esc(t.label)}</span>`).join("");

// reading_map
const M = S.reading_map, secs = M.sections;
$("mapsub").textContent = M.subtitle;
$("band").innerHTML = secs.map((s, i) => `<div class="sec" role="listitem" tabindex="0" data-i="${i}" style="flex:${s.pages} 0 0"
  aria-label="${esc(s.title)} — pages ${s.page_start} à ${s.page_end}, ${s.pages_read} lues">
  <div class="fill" style="height:${(s.share_read * 100).toFixed(1)}%"></div></div>`).join("");
const total = secs.reduce((a, s) => a + s.pages, 0);
$("ticks").innerHTML = secs.map(s => `<div style="flex:${s.pages} 0 0" title="${esc(s.title)}">${s.pages / total > 0.015 && s.tick_label ? s.tick_label : ""}</div>`).join("");
document.querySelectorAll(".sec").forEach(el => {
  const s = secs[+el.dataset.i];
  const show = () => $("tip").textContent = `${s.title} · p. ${s.page_start}–${s.page_end} · ${s.pages_read}/${s.pages} pages lues (${pct(s.share_read)})`;
  el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
  const open = () => window.open(pdfAt(s.pdf_page), "_blank");
  el.addEventListener("click", open);
  el.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
});
$("legend-read").textContent = M.legend.read; $("legend-unread").textContent = M.legend.unread; $("legend-hint").textContent = M.legend.hint;

// most_read / never_opened
$("toptitle").textContent = L.most_read;
$("top").innerHTML = S.most_read.items.map(s => `<li><span>${esc(s.title)}</span><b>${esc(s.display_value)}</b></li>`).join("");

$("never").innerHTML = S.never_opened.items.map(s => `<li><a href="${pdfAt(s.pdf_page)}" target="_blank" rel="noopener">${esc(s.title)}</a><b style="color:var(--mute)">p. ${s.page_start}</b></li>`).join("")
  || `<li class="empty">${esc(S.never_opened.empty_message)}</li>`;

// kpis
$("kpis").innerHTML = S.kpis.items.map(k => `<div data-key="${k.key}"><strong>${esc(k.value)}</strong><span>${esc(k.caption)}</span></div>`).join("");

// iterations

    <div class="part"><div class="label">Geste</div><p class="geste">${esc(g.summary)}</p>

    <div class="part ret"><div class="label">Retour</div>

      ${f.extracts.length

        : `<p class="empty" style="margin:6px 0 0">${esc(f.empty_message)}</p>`}

function select(n, scroll) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.id === "it" + n));
  document.querySelectorAll(".dur").forEach(b => b.classList.toggle("sel", +b.dataset.n === n));
  if (scroll) $("it" + n).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
document.querySelectorAll(".dur").forEach(b => b.addEventListener("click", () => select(+b.dataset.n, true)));
