<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raisonnement — 2024SORUL013</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app bar, then a reading map (section band + two lists), a KPI row, and a two-column
   iteration timeline (cards left, duration bars right). */
:root {
  --bg: #efeee9; --panel: #f8f7f3; --ink: #1d1f23; --mute: #6c6f76; --line: #d9d7cf;
  --read: #2f4a8a; --unread: #e3e1da; --ochre: #c9a45e; --ochre-deep: #7e5c1d; --ochre-soft: #f4ead6;
  --serif: "Spectral", Georgia, serif; --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
    --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
  --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.brand::before { content: ""; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.doc { color: var(--mute); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs span { font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); }
.tabs .on { border-color: var(--ochre); background: var(--ochre-soft); color: var(--ochre-deep); font-weight: 500; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; }
h1 { font: 500 30px/1.2 var(--serif); margin: 0; display: inline; }
.sub { font: 13px var(--mono); color: var(--mute); margin-left: 14px; }
.label { font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.panel { background: var(--panel); border: 1px solid var(--line); }

/* section band */
.band { display: flex; height: 112px; margin-top: 18px; border: 1px solid var(--line); background: var(--panel); }
.sec { position: relative; border-right: 1px solid var(--line); background: var(--unread); cursor: pointer; min-width: 3px; }
.sec:last-child { border-right: 0; }
.sec .fill { position: absolute; left: 6%; right: 6%; bottom: 0; background: var(--read); }
.sec:hover, .sec:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; z-index: 1; }
.ticks { display: flex; height: 22px; font: 11px var(--mono); color: var(--mute); }
.ticks div { text-align: center; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); margin-top: 4px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.tip { font: 12px var(--mono); color: var(--ink); min-height: 18px; margin-top: 6px; }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.lists .panel { padding: 18px 22px; min-width: 0; }
.lists ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.lists li { display: flex; justify-content: space-between; gap: 12px; }
.lists li b { font: 500 13px var(--mono); color: var(--read); white-space: nowrap; }
.lists li a { color: inherit; text-decoration: none; }
.lists li a:hover { text-decoration: underline; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
.kpis > div { padding: 18px 22px; border-right: 1px solid var(--line); }
.kpis > div:last-child { border-right: 0; }
.kpis strong { display: block; font: 600 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.kpis span { color: var(--mute); font-size: 14px; }

.timeline { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 26px; align-items: start; }
.cards { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 16px 22px 18px; scroll-margin-top: 16px; }
.card.sel { border-color: var(--ochre); box-shadow: 0 0 0 1px var(--ochre); }
.card header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.card header .label { color: var(--ochre-deep); }
.kind { font: 12px var(--mono); color: var(--mute); }
.part { border-left: 3px solid var(--ochre); background: color-mix(in srgb, var(--unread) 55%, var(--panel)); padding: 10px 16px; margin-top: 10px; }
.part.ret { border-left-color: var(--read); }
.part .label { color: var(--ochre-deep); font-size: 11px; }
.part.ret .label { color: var(--read); }
.intent { font: 400 17px/1.55 var(--serif); margin: 6px 0 0; }
.lang { font: 11px var(--mono); color: var(--mute); margin-left: 8px; }
details { margin-top: 8px; }
summary { cursor: pointer; font: 12px var(--mono); color: var(--mute); }
details pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; max-height: 360px; overflow: auto; }
.geste { margin: 6px 0 0; }
.geste em { font-style: normal; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.chip { font: 12px var(--mono); color: var(--read); border: 1px solid var(--read); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.chip:hover { background: var(--read); color: var(--panel); }
.empty { color: var(--mute); font-size: 14px; }
.err { margin: 6px 0 2px; font-size: 14px; color: #b3422b; }
.err code { font: 12.5px var(--mono); }

.durs { padding: 14px 18px; position: sticky; top: 16px; }
.dur { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; background: none; border: 0; width: 100%; color: inherit; font: inherit; text-align: left; }
.dur .num { font: 12px var(--mono); color: var(--mute); }
.dur .track { display: flex; align-items: center; gap: 8px; }
.dur .b { height: 7px; background: var(--ochre); }
.dur .v { font: 12px var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }
.dur .k { font: 10.5px var(--mono); color: var(--mute); margin-left: auto; }
.dur.sel .num { color: var(--ink); font-weight: 600; }
.dur.sel .b { background: var(--ochre-deep); }
.dur:focus-visible { outline: 2px solid var(--ochre); }
.note { color: var(--mute); font-size: 13px; margin-top: 10px; }
.mock { font: 11px var(--mono); color: var(--mute); text-align: right; margin-top: 30px; }
@media (max-width: 860px) {
  .lists, .timeline { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpis > div:nth-child(2) { border-right: 0; }
  .durs { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s, border-color .15s; } }
</style>
</head>

graph by paragraph. I'll begin with the first two paragraphs (opening and methodology), then proceed with the three body paragraphs (one per part), and finally the concluding paragraph.\n\nLet me write paragraphs 1-2 first.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para1 (607 mots).", "readings": [], "drafts": [{"variable": "para1", "words": 607}], "code": "# PASS DE RÉDACTION 1 : Paragraphes 1 (Ouverture) et 2 (Méthodologie)\npara1 = \"\"\"# *Les femmes de pouvoir dans le monde maya* par Noémie Jouvet\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-07\n\n**Référence :** Noémie Jouvet, *Les femmes de pouvoir dans le monde maya*, Sorbonne Université, École doctorale 0124 (CERAP), 2024, 488 p.\n\n---\n\nLe rapport entre les femmes et le pouvoir dans le monde maya a longtemps été traité « de manière périphérique voire anecdotique par la recherche » (p. 21). C'est précisément ce déficit que s'emploie à combler Noémie Jouvet dans cette thèse d'archéologie, soutenue en 2024 à la Sorbonne. S'inscrivant à l'intersection de l'archéologie classique des Basses-Terres mayas et des études de genre appliquées au contexte méso-américain, ce travail propose une réinterprétation systématique de l'ensemble des vestiges archéologiques — stèles, sépultures, peintures murales et codex — qui évoquent le féminin dans les sociétés mayas préhispaniques. La thèse centrale est claire : les femmes de l'élite maya ne sont pas des appendices décoratifs du pouvoir masculin, mais des actrices intégrées et hiérarchisées des sphères politique, religieuse et administrative, dont l'insertion varie significativement selon les cités et les périodes (p. 449). Le fil directeur qui traverse les trois grandes parties est la notion de territorialité féminine, telle que l'auteur la définit dès l'introduction : il s'agit de « définir la place des femmes au sein des cités, autant dans le sens social, géographique que symbolique » (p. 30). Cette notion relie l'identification des marqueurs archéologiques (Partie I) à leur intégration mythologique et spatiale (Partie II), puis à leur dialogue avec les récits historiques et leur persistance sociale jusqu'à l'époque de la Conquête (Partie III). La périodisation adoptée, fondée sur le cadre de Christian Duverger, structure l'analyse en cinq époques — de la période formative (Époque II, − 300 à 200 de notre ère) à l'époque de la Conquête —, permettant de suivre les transformations du corpus et du statut féminin à travers un millénaire et demi d'histoire maya.\n\nL'originalité méthodologique de cette thèse réside dans le choix d'aborder le sujet « de manière archéologique », en « part[ant] d'abord de l'analyse factuelle des vestiges avant de présenter une interprétation et d'étayer celle-ci » (p. 38). Jouvet rejette explicitement l'usage du terme « genre », qu'elle estime « particulièrement lié à la pensée occidentale contemporaine » (p. 29), préférant s'appuyer sur la méthodologie d'Anne Augereau distinguant sexe biologique et concepts culturels sans imposer de grille analytique européenne. Le corpus, présenté comme la plus exhaustive compilation possible de vestiges féminins identifiés, repose sur trois catégories principales : les tombes de femmes mayas (dont les sépultures somptueuses d'El Peru-Waka et d'Uaxactun à l'Époque II), les peintures murales (Bonampak, Calakmul), et les sculptures lithiques mettant en scène des personnages féminins (stèles, linteaux, autels, panneaux) (p. 446). Cette focalisation sur le registre lapidaire et funéraire de l'Époque III (200–900 de notre ère) est justifiée par l'état de conservation et la fonction communicative de ces supports : « une stèle en zone maya est un outil de communication des autorités » (p. 32). L'auteur croise ensuite cette analyse archéologique contextuelle — « il est important en archéologie d'analyser le contexte de l'artefact. Le contexte archéologique permet de replacer celui-ci à la fois spatialement, chronologiquement et de le connecter au reste de son environnement » (p. 39) — avec la confrontation de sources ethno-historiques (chroniques espagnoles du XVIe siècle, codex mayas) et d'éléments mythologiques. Cette méthode du double regard, qui va du matériel au symbolique puis à l'historique, permet de dépasser les limites de la conservation du vestige et les biais des sources coloniales, qui « évoquent peu le fonctionnement des sociétés et se contentent de l'aspect anecdotique et militaire » (p. 27).\"\"\"\n\nprint(\"===== PARAGRAPHES 1-2 =====\")\nprint(para1)\nprint(f\"\\nMots : {len(para1.split())}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 9, "kind": "lecture", "seconds": 16.93, "header_label": "Itération 9 · 16,9 s", "selected_by_default": false, "intention": {"headline": "Good, paragraphs 1-2 are written. Now I need to write paragraph 3 (Partie I - Les vestiges archéologiques féminins).", "full": "Good, paragraphs 1-2 are written. Now I need to write paragraph 3 (Partie I - Les vestiges archéologiques féminins). I need to extract new passages from the core of Part I to have precise page references.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Lit 6 passages : 1. Les sacrifiés : un cas particulier (p.50) · 2. La tombe de la « reine rouge » de Palenque : celle d'une ancêtre ou d'un prédécesseur (p.70) · b. Les stèles de Calakmul (p.117) · 4. « La tablette des esclaves » (p.140) · 6. Le travestissement du féminin au masculin. (p.180) · 7. Les liens entre le coquillage et le féminin : (p.197)", "readings": [{"type": "page_jump", "page": 50, "section_title": "1. Les sacrifiés : un cas particulier", "pdf_page": 50}, {"type": "page_jump", "page": 70, "section_title": "2. La tombe de la « reine rouge » de Palenque : celle d'une ancêtre ou d'un prédécesseur", "pdf_page": 7 97, "page_end": 197, "label": "p. 197–197", "pdf_page": 197}], "error": null, "empty_message": null}}, {"n": 10, "kind": "rédaction", "seconds": 25.72, "header_label": "Itération 10 · 25,7 s", "selected_by_default": false, "intention": {"headline": "Now I have enough material for paragraph 3 (Partie I). Let me write it.", "full": "Now I have enough material for paragraph 3 (Partie I). Let me write it.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para3 (471 mots).", "readings": [], "drafts": [{"variable": "para3", "words": 471}], "code": "# PASS DE RÉDACTION 3 : Paragraphe 3 (Partie I - Vestiges archéologiques)\npara3 = \"\"\"La première partie, consacrée aux vestiges archéologiques féminins en zone maya, constitue le socle empirique de la thèse et en est aussi l'apport le plus tangible. Jouvet y procède en deux temps : d'abord en définissant les critères d'identification du féminin dans le registre archéologique, puis en présentant le corpus ainsi constitué. Elle énonce quatre classes de vestiges selon leur sexualisation — féminin, masculin, non sexualisé, mixte — ainsi qu'une catégorie résiduelle de vestiges dont l'état de conservation ou l'insuffisance des connaissances sur le système de pensée méso-américain empêche toute détermination. Le critère le plus formel repose sur l'anthropologie biologique : l'os du bassin « permet l'identification la plus formelle (à plus de 93 %) du sexe pour un squelette adulte » (p. 42). Sur ce fondement, les sépultures de prestige féminines — comme celles d'El Peru-Waka et d'Uaxactun — deviennent le repère initial permettant de confirmer qu'« une femme pouvait posséder un statut élevé dans la société » (p. 64). L'auteur examine ensuite les stèles et sculptures féminines, dressant une liste remarquable de monuments identifiés : la stèle 2 de Bonampak, qui figure deux femmes encadrant un personnage masculin dans une scène d'hommage public (p. 115), et les multiples stèles de Calakmul — la stèle 9, jumelées 23–24, 28–29, 54, 88 — dont la disposition en dyades homme-femme autour de la place centrale témoigne d'une visibilité institutionnelle des femmes de l'élite (p. 117–120). L'identification repose ensuite sur des marqueurs vestimentaires précis : le *huipil*, jupe à motif de croisillons, et surtout un double ornement de ceinture — mâchoire supérieure de jaguar et coquillage scié — que l'auteur réinterprète comme matérialisation symbolique de la capacité génitrice féminine. C'est sur ce dernier critère qu'elle fonde sa contribution la plus novatrice : la réidentification de la stèle H de Copán, traditionnellement présentée comme un « roi habillé en dieu du maïs au genre ambigu », en figure féminine à part entière, « portant une tenue féminine avec à la fois l'ornement de ceinture mais aussi le motif de croisillons sur la jupe » (p. 198). Cette réattribution conteste une interprétation consolidée par l'usage muséal et souligne combien les marqueurs féminins ont pu être invisibilisés par la lecture a priori masculine des monuments mayas. Jouvet montre également que le nombre de figurations féminines connues ne constitue qu'un plancher : certaines femmes de pouvoir ont sans doute été représentées sous traits ou atours masculins, à la manière d'Hatchepsout en Égypte (p. 180), ce qui complexifie la tâche de l'archéologue tout en renforçant l'hypothèse d'une présence féminine plus étendue qu'il n'y paraît à la surface du corpus. La partie s'achève sur l'établissement d'un outil d'identification systématique — les critères morphologiques de la parure et de la tenue — qui sera réinvesti dans les parties suivantes pour analyser la symbolique et la portée politique de ces vestiges.\"\"\"\n\nprint(\"===== PARAGRAPHE 3 =====\")\nprint(para3)\nprint(f\"\\nMots : {len(para3.split())}\")\n\n# Stocker pour assemblage final\nall_paragraphs = [para1, para3]"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confir éminin « porte » littéralement la conception maya de l'espace (p. 181). L'étude des ornements de ceinture confirme cette liaison : la mâchoire supérieure de jaguar, interprétée non plus comme une gueule de monstre marin mais comme « une figuration de cette matrice originelle en lien avec les grottes où dorment ces animaux » (p. 294), se rattache au mythe olmèque de l'émergence de l'humanité d'une caverne-utérus. Le coquillage scié, second élément de l'ornement, renforce cette symbolique de fertilité, le coquillage étant « un symbole du sexe féminin dans de nombreuses cultures » (p. 299). L'application de ce cadre mythologique à l'espace archéologique produit des résultats éclairants : à Palenque, le tombeau de la « reine rouge », placé à l'ouest du tombeau du « roi Pakal », occupe la direction cardinal associée au féminin et au couchant, et les deux sépultures — toutes deux en sarcophage de pierre, toutes deux accompagnées de sacrifiés et ornées d'un masque de jade — manifestent « un statut similaire » (p. 302) au sein de la même structure cérémonielle. La grotte, « matrice originelle d'où émergent les peuples mayas » (p. 450), apparaît ainsi comme l'élément géographique clé qui relie le concept de fécondité à la territorialité politique des femmes de l'élite, dont les figurations sont systématiquement placées « dans les centres cérémoniels, lieux de pouvoir » (p. 452).\"\"\"\n\nprint(\"===== PARAGRAPHE 4 =====\")\nprint(para4)\nprint(f\"\\nMots : {len(para4.split())}\")\n\nall_paragraphs.append(para4)"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 13, "kind": "lecture", "seconds": 22.13, "header_label": "Itération 13 · 22,1 s", "selected_by_default": false, "intention": {"headline": "Good. Now I need to write paragraph 5 (Partie III - Les vestiges en dialogue avec les récits historiques). Let me extract a few more passages from the core of Part III.", "full": "Good. Now I need to w amine d'abord l'évolution des supports de retranscription historique maya — des stèles et sculptures monumentales de l'Époque I à II aux codex et céramiques de l'Époque IV — pour montrer comment le changement de support corrèle avec une transformation politique (p. 360–361). Les chroniques espagnoles du XVIe siècle, malgré leurs biais évidents, fournissent des informations sur la persistance de certaines coutumes : l'alliance matrimoniale reste un levier d'ascension sociale, comme en témoigne le cas de l'Espagnol Guerrero, marié à une « *muy principal muger* » qui sert à « asseoir le statut social d'un étranger valeureux » (p. 379). L'auteur croise aussi les informations de Bernardino de Sahagún sur les femmes nahuas — dont la liste détaillée des outils textiles révèle la centralité du tissage comme activité noble féminine — avec les vestiges archéologiques mayas. Les femmes de l'élite conservent leur marqueur physique dès l'enfance par la déformation crânienne : « une femme ne peut probablement pas être entièrement déchue de son statut car celui-ci est inscrit sur sa physionomie » (p. 396). Dans la sphère religieuse, les codex mayas — notamment les pages 16 à 20 du *Codex de Dresde* — montrent des femmes humaines, non divines, participant activement aux cérémonies, contredisant la lecture restrictive de Diego de Landa qui les cantonnait à un rôle de spectatrices (p. 397). L'hérédité maternelle apparaît comme un axe structurant : à Palenque, les ancêtres féminins sont honorés au même titre que les masculins, « la référence aux ancêtres féminins du souverain pouvant servir à revendiquer la combinaison de deux nobles lignées » (p. 421). Le squelette d'une femme honorée sur l'autel 5 de Tikal, accompagné d'une cérémonie gravée dans la pierre, confirme que certaines lignées « passent par le père et la mère » (p. 422). À l'époque de la Conquête, la pièce de théâtre *Rabinal Achi* conserve le souvenir de l'ascendance maternelle — « Mère du Quetzal, Mère des Plumes Vertes es ne possédaient pas le même statut social au sein de ces deux cités » — à Calakmul, elles ont des supports autonomes, la même taille que les personnages masculins et sont placées « tout autour de la place centrale aux côtés des figures masculines » (p. 451), tandis qu'à Palenque elles n'apparaissent que secondaires, « toujours partie d'une scène et [sans] être le sujet principal » (p. 451). Ce contraste invalide l'idée d'un modèle uniforme de pouvoir féminin maya et ouvre la voie à des études comparatives de cité en cité. L'apport méthodologique est tout aussi significatif : l'établissement de critères morphologiques précis — *huipil*, jupe à motif de croisillons, ornement de ceinture à mâchoire supérieure et coquillage — constitue un outil opératoire pour les archéologues confrontés à des vestiges érodés ou partiellement conservés (p. 449). La réidentification de la stèle H de Copán en figure féminine illustre combien cette grille peut réviser des interprétations consacrées.\n\nQuelques tensions traversent toutefois le travail. La focalisation sur l'élite, imposée par la nature même des vestiges monumentaux et funéraires, laisse dans l'ombre la condition des femmes non élitaires, comme l'auteur le reconnaît (p. 449). La disparité temporelle — sur-représentation de l'Époque III et de l'époque de la Conquête au détriment des Époques II, IV et V — reflète un état des fouilles plus qu'une réalité historique, mais elle limite la portée des conclusions diachroniques. L'absence de textes coutumiers mayas préhispaniques contraint à des inférences à partir du matériel, et la confrontation avec les chroniques espagnoles reste nécessairement filtrée par les biais coloniaux. Enfin, le refus du terme « genre », motivé par une légitime volonté d'éviter le projet occidental, pourrait aussi priver l'analyse d'un concept opératoire pour articuler sexe biologique et construction sociale — l'auteur reconnaissant elle-même que la question de l'identité sexuelle des femmes figurées en atours masculins mérite d'être posée (p. 180). Néanmoins, ces limites ne diminuent pas la force d'un travail qui, par la rigueur de son inventaire et la finesse de ses interprétations contextuelles, réoriente durablement la manière de penser le pouvoir féminin dans les sociétés mayas préhispaniques. Il ouvre des perspectives fécondes : poursuite de la recherche sur les espaces féminins aux époques mal documentées, étude des femmes du peuple non élitaires, et intégration des avancées en épigraphie maya pour éclairer le rôle des femmes dans les longs textes glyphiqes encore partiellement indéchiffrés.\"\"\"\n\n# Assembler la note complète\nclosing = \"\"\"---\n\n## Pour citer ce document\n\n**Note générée automatiquement**, « Compte rendu de *Les femmes de pouvoir dans le monde maya* », 2026-10-07.\"\"\"\n\nnote_complete = para1 + \"\\n\\n\" + para3 + \"\\n\\n\" + para4 + \"\\n\\n\" + para5 + \"\\n\\n\" + para6 + \"\\n\\n\" + closing\n\nprint(\"===== NOTE COMPLÈTE =====\")\nprint(note_complete)\nprint(f\"\\n\\nTOTAL MOTS : {len(note_complete.split())}\")\nprint(f\"TOTAL CARACTÈRES : {len(note_complete)}\")\n\n# Compter les références de page\nimport re\npage_refs = re.findall(r'\\(p\\. \\d+', note_complete)\nprint(f\"\\nRÉFÉRENCES DE PAGE : {len(page_refs)}\")\nfor ref in sorted(set(page_refs)):\n    print(f\"  {ref}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 16, "kind": "assemblage", "seconds": 24.8, "header_label": "Itération 16 · 24,8 s", "selected_by_default": false, "intention": {"headline": "The note is complete. It's 2470 words (close to the ~2000 target), has 38 page references (well above the minimum 8), covers all six paragraphs as required, and follows the French academic style.", "full": "The note is complete. It's 2470 words (close to the ~2000 target), has 38 page references (well above the minimum 8), covers all six paragraphs as required, and follows the Frenc const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pdfAt = p => `${C.source.pdf_file}#page=${p}`;
const pct = x => Math.round(x * 100) + " %";

// header
$("doc").textContent = S.header.doc_label;
document.querySelector(".tabs").innerHTML = S.header.tabs.map(t => `<span class="${t.active ? "on" : ""}">${esc(t.label)}</span>`).join("");

// reading_map
const M = S.reading_map, secs = M.sections;
$("mapsub").textContent = M.subtitle;
$("band").innerHTML = secs.map((s, i) => `<div class="sec" role="listitem" tabindex="0" data-i="${i}" style="flex:${s.pages} 0 0"
  aria-label="${esc(s.title)} — pages ${s.page_start} à ${s.page_end}, ${s.pages_read} lues">
  <div class="fill" style="height:${(s.share_read * 100).toFixed(1)}%"></div></div>`).join("");
const total = secs.reduce((a, s) => a + s.pages, 0);
$("ticks").innerHTML = secs.map(s => `<div style="flex:${s.pages} 0 0" title="${esc(s.title)}">${s.pages / total > 0.015 && s.tick_label ? s.tick_label : ""}</div>`).join("");
document.querySelectorAll(".sec").forEach(el => {
  const s = secs[+el.dataset.i];
  const show = () => $("tip").textContent = `${s.title} · p. ${s.page_start}–${s.page_end} · ${s.pages_read}/${s.pages} pages lues (${pct(s.share_read)})`;
  el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
  const open = () => window.open(pdfAt(s.pdf_page), "_blank");
  el.addEventListener("click", open);
  el.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
});
$("legend-read").textContent = M.legend.read; $("legend-unread").textContent = M.legend.unread; $("legend-hint").textContent = M.legend.hint;

// most_read / never_opened
$("toptitle").textContent = L.most_read;
$("top").innerHTML = S.most_read.items.map(s => `<li><span>${esc(s.title)}</span><b>${esc(s.display_value)}</b></li>`).join("");
$("nevertitle").textContent = L.never_opened;
$("never").innerHTML = S.never_opened.items.map(s => `<li><a href="${pdfAt(s.pdf_page)}" target="_blank" rel="noopener">${esc(s.title)}</a><b style="color:var(--mute)">p. ${s.page_start}</b></li>`).join("")
  || `<li class="empty">${esc(S.never_opened.empty_message)}</li>`;

// kpis
$("kpis").innerHTML = S.kpis.items.map(k => `<div data-key="${k.key}"><strong>${esc(k.value)}</strong><span>${esc(k.caption)}</span></div>`).join("");

// iterations
const IT = S.iterations.items;
$("cards").innerHTML = IT.map(it => {
  const g = it.gesture, f = it.feedback, i = it.intention;
  return `
  <article class="card" id="it${it.n}" aria-labelledby="h${it.n}">
    <header><span class="label" id="h${it.n}">${esc(it.header_label)}</span><span class="kind">${it.kind}</span></header>
    <div class="part"><div class="label">Intention<span class="lang">${esc(i.language_note)}</span></div>
      <p class="intent">${esc(i.headline)}</p>
      ${i.full.length > i.headline.length + 2 ? `<details><summary>raisonnement complet · ${i.full.length} caractères</summary><pre>${esc(i.full)}</pre></details>` : ""}</div>
    <div class="part"><div class="label">Geste</div><p class="geste">${esc(g.summary)}</p>
      ${g.code ? `<details><summary>voir le code</summary><pre>${esc(g.code)}</pre></details>` : ""}</div>
    <div class="part ret"><div class="label">Retour</div>
      ${f.error ? `<p class="err">Le code s'arrête sur une erreur : <code>${esc(f.error)}</code></p>` : ""}
      ${f.extracts.length
        ? `<div class="chips">${f.extracts.length} extrait${f.extracts.length > 1 ? "s" : ""} ${f.extracts.map(x => `<a class="chip" href="${pdfAt(x.pdf_page)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`
        : `<p class="empty" style="margin:6px 0 0">${esc(f.empty_message)}</p>`}
    </div>
  </article>`; }).join("");

// iteration_bars
const B = S.iteration_bars;
$("durtitle").textContent = L.iteration_bars;
$("durcap").textContent = B.caption;
$("durs").innerHTML = B.items.map(b => `<button class="dur" data-n="${b.n}" aria-label="Itération ${b.n}, ${b.kind}, ${b.seconds} secondes">
  <span class="num">${b.n}</span><span class="track"><span class="b" style="width:${(b.seconds / B.max_seconds * 70).toFixed(1)}%"></span><span class="v">${String(b.seconds.toFixed(1)).replace(".", ",")}</span><span class="k">${b.kind}</span></span></button>`).join("");
function select(n, scroll) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.id === "it" + n));
  document.querySelectorAll(".dur").forEach(b => b.classList.toggle("sel", +b.dataset.n === n));
  if (scroll) $("it" + n).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
document.querySelectorAll(".dur").forEach(b => b.addEventListener("click", () => select(+b.dataset.n, true)));
select((IT.find(i => i.selected_by_default) || IT[0]).n, false);
$("mock").textContent = `maquette · run ${C.source.thesis_id}/${C.source.run_id} · ${C.schema} · généré par ${C.source.generator}`;
</script>
</body>
</html>
