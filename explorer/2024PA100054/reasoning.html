:root {

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.brand::before { content: ""; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.doc { color: var(--mute); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs span { font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); }
.tabs .on { border-color: var(--ochre); background: var(--ochre-soft); color: var(--ochre-deep); font-weight: 500; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; }
h1 { font: 500 30px/1.2 var(--serif); margin: 0; display: inline; }
.sub { font: 13px var(--mono); color: var(--mute); margin-left: 14px; }

.panel { background: var(--panel); border: 1px solid var(--line); }

.sec { position: relative; border-right: 1px solid var(--line); background: var(--unread); cursor: pointer; min-width: 3px; }
.sec:last-child { border-right: 0; }
.sec .fill { position: absolute; left: 6%; right: 6%; bottom: 0; background: var(--read); }
.sec:hover, .sec:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; z-index: 1; }
.ticks { display: flex; height: 22px; font: 11px var(--mono); color: var(--mute); }
.ticks div { text-align: center; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); margin-top: 4px; }

.tip { font: 12px var(--mono); color: var(--ink); min-height: 18px; margin-top: 6px; }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.lists .panel { padding: 18px 22px; min-width: 0; }

.card.sel { border-color: var(--ochre); box-shadow: 0 0 0 1px var(--ochre); }

.kind { font: 12px var(--mono); color: var(--mute); }

.part .label { color: var(--ochre-deep); font-size: 11px; }
.part.ret .label { color: var(--read); }
.intent { font: 400 17px/1.55 var(--serif); margin: 6px 0 0; }
.lang { font: 11px var(--mono); color: var(--mute); margin-left: 8px; }

.geste { margin: 6px 0 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.chip { font: 12px var(--mono); color: var(--read); border: 1px solid var(--read); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.chip:hover { background: var(--read); color: var(--panel); }
.empty { color: var(--mute); font-size: 14px; }
.err { margin: 6px 0 2px; font-size: 14px; color: #b3422b; }
.err code { font: 12.5px var(--mono); }

.durs { padding: 14px 18px; position: sticky; top: 16px; }
.dur { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; background: none; border: 0; width: 100%; color: inherit; font: inherit; text-align: left; }
.dur .num { font: 12px var(--mono); color: var(--mute); }
.dur .track { display: flex; align-items: center; gap: 8px; }
.dur .b { height: 7px; background: var(--ochre); }
.dur .v { font: 12px var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }
.dur .k { font: 10.5px var(--mono); color: var(--mute); margin-left: auto; }
.dur.sel .num { color: var(--ink); font-weight: 600; }
.dur.sel .b { background: var(--ochre-deep); }
.dur:focus-visible { outline: 2px solid var(--ochre); }
.note { color: var(--mute); font-size: 13px; margin-top: 10px; }
.mock { font: 11px var(--mono); color: var(--mute); text-align: right; margin-top: 30px; }
@media (max-width: 860px) {

  .kpis > div:nth-child(2) { border-right: 0; }
  .durs { position: static; }

@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s, border-color .15s; } }

aragraph by paragraph, making sure to anchor my claims with specific page references.", "full": "I now have extensive material from the thesis. Let me start writing the reading note. I'll proceed paragraph by paragraph, making sure to anchor my claims with specific page references.\n\nLet me now write paragraphs 1-2 (introduction and methodology) and then continue with the remaining paragraphs in subsequent iterations.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para1 (377 mots).", "readings": [], "drafts": [{"variable": "para1", "words": 377}], "code": "# Now I start writing the note - Paragraphs 1-2 (Ouverture + Méthodologie)\n\npara1 = \"\"\"# *Accès au lexique en Langue des Signes Française (LSF) : impact de la modalité visuo-gestuelle et de la privation langagière*\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-07\n\n**Référence :** Philomène Périn, *Accès au lexique en Langue des Signes Française (LSF) : impact de la modalité visuo-gestuelle et de la privation langagière*, Université Paris Nanterre, 2024, 222 p.\n\n---\n\nLa thèse de Philomène Périn s'inscrit au carrefour de la psycholinguistique et des neurosciences du langage, deux disciplines qui, depuis plusieurs décennies, ont considérablement avancé notre compréhension du traitement du langage en langue vocale (LV), mais qui, à l'inverse, ont longtemps négligé les langues signées (LS). Cette disparité, que l'auteure souligne dès l'ouverture de son introduction — « les LS ont peu fait l'objet de recherches comparativement aux LV » (p. 12) —, constitue le moteur premier de ce travail. Périn formule ainsi deux questions de recherche centrales : « la modalité langagière a-t-elle un rôle particulier dans le traitement du langage ? » et « plus précisément, peut-on observer des différences dans le mécanisme d'accès lexical en LV et LS ? » (p. 12-13). À ces interrogations s'ajoute celle de l'impact de l'âge d'acquisition de la langue et de la privation langagière précoce, phénomène affectant la majorité des enfants sourds qui n'ont pas accès à un input langagier adéquat durant la période critique du développement. La thèse centrale de Périn est que les mécanismes d'accès lexical en Langue des Signes Française (LSF) sont « majoritairement des phénomènes amodaux », c'est-à-dire qu'ils partagent les mêmes architectures cognitives et neurophysiologiques que ceux des langues vocales, bien que des stratégies compensatoires puissent émerger chez les locuteurs ayant subi une privation langagière (p. 204). Le corpus de la thèse repose sur la LSF, langue visuo-gestuelle dont la description linguistique n'a commencé qu'à partir des années 1960 avec les travaux de Stokoe sur l'American Sign Language (ASL), et pour laquelle la recherche psycholinguistique est encore à ses débuts en France (p. 32). La périodisation implicite de l'œuvre suit l'histoire de la linguistique des signes : de l'abbé de l'Épée et la reconnaissance tardive des LS comme langues à part entière, jusqu'aux premières données électroencéphalographiques en temps réel en LSF, produites par l'auteure elle-même dans le cadre de cette thèse.\"\"\"\n\nprint(\"===== PARAGRAPHE 1 RÉDIGÉ =====\")\nprint(para1)\nprint(f\"\\nLongueur : ~{len(para1.split())} mots\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 7, "kind": "rédaction", "seconds": 17.49, "header_label": "Itération 7 · 17,5 s", "selected_by_default": false, "intention": {"headline": "Good, paragraph 1 is done (~377 words). Now let me write paragraph 2 (Méthodologie). I need to anchor this with page references from the FICHE and the extracts I've collected.", "full": "Good, paragraph 1 is done (~377 words). Now let me write paragraph 2 (Méthodologie). I need to anchor this with page references from the FICHE and the extracts I've collected.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para2 (399 mots).", "readings": [], "drafts": [{"variable": "para2", "words": 399}], "code": "# Paragraph 2 - Méthodologie\n\npara2 = \"\"\"L'originalité méthodologique de cette thèse réside dans le déploiement d'une démarche empirique tripartite, dont chaque étape repose sur la précédente, dans une logique de construction progressive du matériel expérimental. Périn souligne à juste titre que « l'absence d'informations psycholinguistiques et lexicales en LSF » constituait « un frein important aux investigations » sur le traitement du langage dans cette langue (p. 189). La première étape consiste donc en l'élaboration de FLexSign, présentée comme « la première base de données lexicale en LSF », comprenant 546 signes évalués par 33 signeurs natifs et tardifs sur trois dimensions psycholinguistiques : la Familiarité, la Concrétude et l'Iconicité (p. 106). Chaque signe est noté sur une échelle de Likert à cinq points, produisant ainsi les premières normes psycholinguistiques quantitatives pour la LSF. Cette base de données sert de fondation aux deux expériences subséquentes : elle permet de sélectionner des stimuli contrôlés selon les extrêmes de chaque dimension, et d'identifier des corrélations — par exemple entre l'Iconicité et la Concrétude, ou entre la Familiarité et la Concrétude, tout en l'absence de lien entre Familiarité et Iconicité (p. 189). La deuxième expérience consiste en une tâche de décision lexicale signes contre pseudo-signes, réalisée auprès de 20 participants sourds répartis en trois groupes selon leur âge d'acquisition. Les temps de réaction et les pourcentages de réponses correctes constituent les mesures comportementales recueillies (p. 190). La troisième et dernière étude constitue l'apport le plus novateur de la thèse : il s'agit des toutes premières données électroencéphalographiques (EEG) en temps réel produites en LSF, enregistrées auprès de 25 participants sourds (natifs et tardifs) réalisant une tâche de compréhension de phrases présentant des violations sémantiques ou morphosyntaxiques (p. 157). L'EEG, avec sa résolution temporelle de l'ordre de la centaine de millisecondes, permet d'observer le décours précis du traitement neurophysiologique du langage, y compris la présence ou l'absence de composantes ERP caractéristiques telles que la N400 et la P600 (p. 67). Cette triple approche — normalisation lexicale, mesure comportementale, enregistrement neurophysiologique — forme un arc méthodologique cohérent et progressif, qui permet de passer de l'identification des facteurs lexicaux à leur observation en temps réel dans l'activité cérébrale des signeurs. L'auteure insiste également sur le choix de travailler avec une population hétérogène, incluant à la fois des signeurs natifs et non-natifs, afin de saisir la réalité des profils linguistiques des sourds, et non une idéalisation de la population cible (p. 13).\"\"\"\n\nprint(\"===== PARAGRAPHE 2 RÉDIGÉ =====\")\nprint(para2)\nprint(f\"\\nLongueur : ~{len(para2.split())} mots\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 8, "kind": "lecture", "seconds": 14.74, "header_label": "Itération 8 · 14,7 s", "selected_by_default": false, "intention": {"headline": "Good, paragraph 2 is done (~399 words). Now I need to write paragraphs 3, 4, and 5 (the three parts/axes of the thesis).", "full": "Good, paragraph 2 is done (~399 words). Now I need to write paragraphs 3, 4, and 5 (the three parts/axes of the thesis). Let me first extract more targeted passages from the heart of each part to ensure dense page anchoring (3+ pages per paragraph).\n\nLet me extract passages about:\n- Paragraph 3: Theoretical framework (linguistics of LSF, lexical access models)\n- Paragraph 4: Experimental results (FLexSign + lexical decision)\n- Paragraph 5: EEG results and Discussion on AoA\n\nLet me extract more detaile  32). En LSF, le système phonologique repose sur huit paramètres — quatre manuels (CONFIGURATION, EMPLACEMENT, ORIENTATION, MOUVEMENT) et quatre non-manuels (expressions faciales, mouvements de la tête et du corps, mouvements labiaux, regard) — qui se combinent selon des contraintes phonotactiques pour former les signes (p. 40). Le lexique de la LSF se distingue par sa relation particulière avec l'iconicité, définie par l'auteure comme « le degré de ressemblance entre la phonologie d'un signe (combinaison de paramètres) et le concept qu'il représente » (p. 42). Cette propriété, spécifique aux langues signées, occupe une place centrale dans la création lexicale et dans la réflexion sur l'accès lexical en LS. Périn aborde ensuite le mécanisme d'accès lexical proprement dit, défini comme « l'unité minimale porteuse de sens qui existe au sein d'un système linguistique » (p. 56), et qui correspond au mot en langue vocale ou au signe en langue signée. Le cadre théorique s'appuie sur deux grandes familles de modèles de reconnaissance lexicale : les modèles d'activation, tels le modèle logogène de Morton (1969), qui postulent un accès direct par accumulation passive d'informations, et les modèles de recherche, tel celui de Forster (1976), qui conçoivent le lexique comme une base de données dans laquelle une recherche algorithmique identifie la cible parmi un ensemble de candidats (p. 79). L'auteure intègre également l'apport de la neurophysiologie, en présentant la N400 — « une large négativité dont la distribution, ou localisation, est centro-pariétale dont le pic d'intensité se situe autour de 400 ms » — comme biomarqueur cognitif de l'accès lexical et du traitement sémantique, et la P600 comme indice de réanalyse syntaxique (p. 70). Ces composantes ERP, robustes et reproductibles dans les langues vocales, constituent le référentiel neurophysiologique que la thèse s'attache à transposer en LSF. Enfin, la section sur les modèles de traitement du langage en LS (p. 95) distingue les processus potentiellement amodaux — acquisition, unités sublexicales, traitement lexical, effet de fréquence — des dimensions spécifiquement modales — âge d'acquisition, bilinguisme bimodal, place de l'iconicité, syntaxe spatiale —, fournissant ainsi le cadre conceptuel sur lequel s'appuient les trois études expérimentales.\"\"\"\n\nprint(\"===== PARAGRAPHE 3 RÉDIGÉ =====\")\nprint(para3)\nprint(f\"\\nLongueur : ~{len(para3.split())} mots\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 10, "kind": "rédaction", "seconds": 20.05, "header_label": "Itération 10 · 20,1 s", "selected_by_default": false, "intention": {"headline": "Good, paragraph 3 is done (~425 words, with pages 32, 40, 42, 56, 79, 70, 95 = 7 page references). Now I need paragraphs 4 and 5 about the experimental results.", "full": "Good, paragraph 3 is done (~425 words, with pages 32, 40, 42, 56, 79, 70, 95 = 7 page references). Now I need paragraphs 4 and 5 about the experimental results. Let me write paragraph 4 on FLexSign and lexical decision, and paragraph 5 on EEG and AoA.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para4 (376 mots).", "readings": [], "drafts": [{"variable": "para4", "words": 376}], "code": "# Paragraph 4 - Résultats expérimentaux : FLexSign et décision lexicale\n\npara4 = \"\"\"La partie expérimentale livre des résultats d'une portée considérable, en comblant un vide empirique longtemps resté béant dans l'étude de la LSF. L'étude 1, consacrée à FLexSign, produit les premières normes psycholinguistiques quantitatives pour 546 signes de la LSF (p. 189). Trois résultats structurent cette contribution : d'abord, les scores de Familiarité sont distribués de façon asymétrique, la majorité des signes étant jugés familiers — un phénomène que l'auteure explique par le fait que les concepts rares ne sont généralement pas lexicalisés en signe mais épelés par dactylologie (p. 106). Ensuite, les scores de Concrétude et d'Iconicité présentent une distribution homogène et sont fortement corrélés : « les signes très iconiques renvoient généralement à des concepts très concrets » (p. 106). Enfin, et plus surprenant, aucune corrélation n'est observée entre Familiarité et Iconicité, ce qui « évoque un traitement lexical en accès direct pour les signes familiers, c'est-à-dire sans recours au caractère plus ou moins iconique du signe » (p. 189). L'étude 2, une tâche de décision lexicale signes/pseudo-signes auprès de 20 signeurs sourds, valide cette intuition : un effet de Familiarité prédominant est clairement mis en évidence, les signes les plus familiers étant reconnus plus rapidement et plus précisément. En revanche, ni l'Iconicité ni la Concrétude n'exercent d'effet significatif sur les temps de réaction ou la précision (p. 190). Périn commente ce résultat inattendu en soulignant que « l'accès lexical serait davantage influencé par des processus liés à l'expérience linguistique et psycholinguistique du locuteur [...] plutôt qu'aux caractéristiques lexicales intrinsèques du signe » (p. 193). L'effet de lexicalité — reconnaissance plus rapide des signes que des pseudo-signes — quant à lui, est robuste et confirme la présence de mécanismes de traitement identiques à ceux observés en langue vocale (p. 190). L'ensemble de ces résultats comportementaux soutient l'hypothèse d'un traitement lexical amodal : la capacité du locuteur à traiter de façon plus efficace un signe hautement familier est analogue à celle qu'il déploie pour un mot familier en langue vocale, indépendamment de la modalité. L'absence d'effet d'Iconicité dans la tâche de décision lexicale directe, en particulier, remet en question l'attente théorique selon laquelle l'iconicité, tant centrale dans la structure du lexique signé, devrait faciliter le traitement comme la Concrétude le fait en langue vocale (p. 193).\"\"\"\n\nprint(\"===== PARAGRAPHE 4 RÉDIGÉ =====\")\nprint(para4)\nprint(f\"\\nLongueur : ~{len(para4.split())} mots\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 11, "kind": "rédaction", "seconds": 20.92, "header_label": "Itération 11 · 20,9 s", "selected_by_default": false, "intention": {"headline": "Good, paragraph 4 is done (~376 words, with pages 189, 106, 190, 193 = 4 distinct pages).", "full": "Good, paragraph 4 is done (~376 words, with pages 189, 106, 190, 193 = 4 distinct pages). Now I need paragraph 5 about the EEG study and the AoA discussion, and paragraph 6 about the critical synthesis. Let me write paragraph 5.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para5 (355 mots).", "readings": [], "drafts": [{"variable": "para5", "words": 355}], "code": "# Paragraph 5 - Étude EEG et question de l'âge d'acquisition\n\npara5 = \"\"\"L'étude 3, la plus ambitieuse de la thèse, apporte les premières données neurophysiologiques EEG en LSF. En soumettant 25 signeurs sourds (natifs et tardifs) à une tâche de compréhension de phrases présentant des violations sémantiques ou morphosyntaxiques, Périn observe, chez les signeurs natifs, une onde biphasique N400-P600 en réponse aux incongruités sémantiques (p. 157). La N400 apparaît dans la fenêtre temporelle classiquement attendue, aux alentours de 350-550 ms, sans le décalage latéral qui avait parfois été rapporté dans les études antérieures en langue signée — résultat que l'auteure met en relation avec le protocole de déclenchement du signal EEG (p. 175). Cette composante négative centro-pariétale, biomarqueur du traitement lexico-sémantique, est suivie d'une positivité antérieure autour de 720 ms chez les signeurs natifs, mais non chez les signeurs tardifs. Ces derniers, à l'inverse, présentent une positivité centro-pariétale (P600) typique d'un mécanisme de réanalyse syntaxique, même dans la condition sémantique (p. 191-192). Cette divergence entre groupes suggère que les stratégies de traitement mises en œuvre par les signeurs tardifs diffèrent qualitativement de celles des signeurs natifs. Périn interprète cette différence comme la manifestation de stratégies compensatoires : « la privation langagière précoce et l'âge d'acquisition tardif [...] peuvent avoir des répercussions sur les stratégies de traitement langagier développées par les locuteurs » (p. 204). Les signeurs non-natifs, ayant subi une période de privation langagière, semblent développer un appui accru sur l'Iconicité pour l'apprentissage et la reconnaissance des signes, comme le suggèrent les données de FLexShow — les signeurs non-natifs montrant une sensibilité plus marquée à l'Iconicité que les natifs (p. 194). L'absence d'effet de négativité antérieure gauche (LAN) dans la condition de violation morphosyntaxique, constaté dans l'étude EEG, constitue un résultat qui ne confirme pas l'ensemble des données de la littérature en LS (p. 157). Périn propose une interprétation méthodologique : la nature visuo-spatiale des stimuli signés, et en particulier la simultanéité partielle des paramètres, pourrait modifier le déclenchement des composantes ERP par rapport aux stimuli sériels des langues vocales (p. 198-199). Cette tension entre résultats attendus et résultats observés ouvre des perspectives de recherche importantes sur l'adaptation des protocoles expérimentaux aux spécificités de la modalité signée.\"\"\"\n\nprint(\"===== PARAGRAPHE 5 RÉDIGÉ =====\")\nprint(para5)\nprint(f\"\\nLongueur : ~{len(para5.split())} mots\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 12, "kind": "rédaction", "seconds": 24.02, "header_label": "Itération 12 · 24,0 s", "selected_by_default": false, "intention": {"headline": "Good, paragraph 5 is done (~355 words, with pages 157, 175, 191-192, 204, 194, 198-199 = 6 distinct page re \\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\\n\\n**Date :** 2026-10-07\\n\\n**Référence :** Philomène Périn, *Accès au lexique en Langue des Signes Française (LSF) : impact de la modalité visuo-gestuelle et de la privation langagière*, Université Paris Nanterre, 2024, 222 p.\\n\\n---\\n\\n\"\np2 = \"La thèse de Philomène Périn s'inscrit au carrefour de la psycholinguistique et des neurosciences du langage, deux disciplines qui, depuis plusieurs décennies, ont considérablement avancé notre compréhension du traitement du langage en langue vocale (LV), mais qui, à l'inverse, ont longtemps négligé les langues signées (LS). Cette disparité, que l'auteure souligne dès l'ouverture de son introduction — « les LS ont peu fait l'objet de recherches comparativement aux LV » (p. 12) —, constitue le moteur premier de ce travail. Périn formule ainsi deux questions de recherche centrales : « la modalité langagière a-t-elle un rôle particulier dans le traitement du langage ? » et « plus précisément, peut-on observer des différences dans le mécanisme d'accès lexical en LV et LS ? » (p. 12-13). À ces interrogations s'ajoute celle de l'impact de l'âge d'acquisition de la langue et de la privation langagière précoce, phénomène affectant la majorité des enfants sourds qui n'ont pas accès à un input langagier adéquat durant la période critique du développement. La thèse centrale de Périn est que les mécanismes d'accès lexical en Langue des Signes Française (LSF) sont « majoritairement des phénomènes amodaux », c'est-à-dire qu'ils partagent les mêmes architectures cognitives et neurophysiologiques que ceux des langues vocales, bien que des stratégies compensatoires puissent émerger chez les locuteurs ayant subi une privation langagière (p. 204). Le corpus de la thèse repose sur la LSF, langue visuo-gestuelle dont la description linguistique n'a commencé qu'à partir des années 1960 avec les travaux de Stokoe sur l'American Sign Language (ASL), et pour laque   || `<li class="empty">${esc(S.never_opened.empty_message)}</li>`;

// kpis
$("kpis").innerHTML = S.kpis.items.map(k => `<div data-key="${k.key}"><strong>${esc(k.value)}</strong><span>${esc(k.caption)}</span></div>`).join("");

// iterations
const IT = S.iterations.items;
$("cards").innerHTML = IT.map(it => {
  const g = it.gesture, f = it.feedback, i = it.intention;
  return `
  <article class="card" id="it${it.n}" aria-labelledby="h${it.n}">
    <header><span class="label" id="h${it.n}">${esc(it.header_label)}</span><span class="kind">${it.kind}</span></header>
    <div class="part"><div class="label">Intention<span class="lang">${esc(i.language_note)}</span></div>
      <p class="intent">${esc(i.headline)}</p>
      ${i.full.length > i.headline.length + 2 ? `<details><summary>raisonnement complet · ${i.full.length} caractères</summary><pre>${esc(i.full)}</pre></details>` : ""}</div>
    <div class="part"><div class="label">Geste</div><p class="geste">${esc(g.summary)}</p>
      ${g.code ? `<details><summary>voir le code</summary><pre>${esc(g.code)}</pre></details>` : ""}</div>
    <div class="part ret"><div class="label">Retour</div>
      ${f.error ? `<p class="err">Le code s'arrête sur une erreur : <code>${esc(f.error)}</code></p>` : ""}
      ${f.extracts.length
        ? `<div class="chips">${f.extracts.length} extrait${f.extracts.length > 1 ? "s" : ""} ${f.extracts.map(x => `<a class="chip" href="${pdfAt(x.pdf_page)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`
        : `<p class="empty" style="margin:6px 0 0">${esc(f.empty_message)}</p>`}
    </div>
  </article>`; }).join("");

// iteration_bars
const B = S.iteration_bars;
$("durtitle").textContent = L.iteration_bars;
$("durcap").textContent = B.caption;
$("durs").innerHTML = B.items.map(b => `<button class="dur" data-n="${b.n}" aria-label="Itération ${b.n}, ${b.kind}, ${b.seconds} secondes">
  <span class="num">${b.n}</span><span class="track"><span class="b" style="width:${(b.seconds / B.max_seconds * 70).toFixed(1)}%"></span><span class="v">${String(b.seconds.toFixed(1)).replace(".", ",")}</span><span class="k">${b.kind}</span></span></button>`).join("");
function select(n, scroll) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.id === "it" + n));
  document.querySelectorAll(".dur").forEach(b => b.classList.toggle("sel", +b.dataset.n === n));
  if (scroll) $("it" + n).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
document.querySelectorAll(".dur").forEach(b => b.addEventListener("click", () => select(+b.dataset.n, true)));
select((IT.find(i => i.selected_by_default) || IT[0]).n, false);
$("mock").textContent = `maquette · run ${C.source.thesis_id}/${C.source.run_id} · ${C.schema} · généré par ${C.source.generator}`;
</script>
</body>
</html>
