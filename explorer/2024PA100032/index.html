en 旗人) puissent s'identifier aux « Mandchous » 满洲人, certains traits de reconnaissance physique sont tout de même avancés par les personnes ayant des origines mandchoues. Par exemple, M. Guan a des cheveux très bouclés, à l'inverse de la plupart des Chinois Han qui ont des cheveux plutôt lisses, tandis\n\n<<< PAGE 96 >>>\n\nque les cheveux de Mme Zhao sont partiellement bouclés. Il arrive en outre que la prunelle des yeux de certains Mandchous (ou, encore une fois, certaines personnes ayant des ancêtres mandchous) soit de couleur plus claire. Fait singulier : le fidèle Guan m'a appris que ses deux petits orteils n'ont pas d'ongle, mais arborent seulement une très légère strie transversale, et qu'il pourrait s'agir d'une caractéristique physique que beaucoup de Mandchous possèdent. Selon les propos de Guan, il s'agit d'un trait physique qu'il avait aussi constaté longtemps auparavant dans certains foyers mandchous de Yichun dans le Heilongjiang à qui il avait rendu visite, de même que dans des familles du comté autonome mandchou de Xiuyan, dans le Liaoning. De plus, cette singularité physique m'avait également été mentionnée durant ma deuxième enquête, au printemps 2021 par la fidèle Mme Meng, qui était au départ ma camarade de classe au lycée en 2008. Sa grand-mère maternelle est Mandchoue, dont le patronyme mandchou fut Fucha 富察 (en mandchou : Fuca Hala). Au sujet des cheveux, Mme Meng a confié qu'elle était en fait un peu bouclée quand elle était enfant, et maintenant à l'âge adulte, ses cheveux ne sont plus aussi bouclés qu'avant, mais restent quand même bien ondulés.\nPar ailleurs, Mme Meng a consulté il y a quelques années la moniale Luo Zonghua du temple Guandi, au sujet d'un certain changement de lieu de travail. Luo Zonghua travaillait à l'époque en tant que médium libre, et n'était pas encore entrée en religion taoïste dans le temple Daode, ce qu'elle fit au printemps 2021. Soulignons que bien que Mme Meng se considère davantage comme Han – tout comme son mari dont la mère est Mandchoue – et qu'elle soit enregistrée comme Han sur son carnet de résidence, elle affirme également être en possession d'affinités sélectives avec les animaux Esprits-Immortels. Elle me l'a confié ainsi :\n> « Je suis souvent en résonance avec les animaux Esprits-Immortels (\"和它们有感应\"). Parfois, j'ai le cœur troublé sans raison. Ils m'aiment bien je crois, car ils m'ont dit une fois qu'ils voulaient me suivre parce qu'ils pensent que je suis quelqu'un de bienveillant. D'ailleurs, depuis que je suis mariée avec mon compagnon, je vais mieux qu'avant, c'est aussi parce qu'il est tolérant et très sympa. [...] Je sais que parmi les esprits d'animaux qui s'attachent à moi, il y a aussi le serpent Esprit-Immortel. À ce que je sache, les animaux Esprits-Immortels semblent avoir goût pour la viande de poulet. Avant, je suis déjà allée consulter plusieurs médiums [dans et aux alentours de Qiqihar], tous m'ont dit presque la même chose en me confirmant que je possède des affinités avec les animaux Esprits-Immortels : 'Tu seras vouée à exercer le métier\n\n<<< PAGE 97 >>>\n\nde médium dans le futur ! '¹²⁵ Par ailleurs, certains d'entre eux m'ont également suggéré de me rendre souvent au temple pour brûler de l'encens, mais comment trouver le temps de faire cela ? D'autres m'ont aussi conseillé de vénérer une liste des noms des animaux Esprits-Immortels dite *tangdan*堂单¹²⁶, mais du fait que nous avons plusieurs appartements différents, et que nous n'habitons pas toujours au même endroit, ce n'est donc non plus très faisable pour l'instant à mon avis. »\nEn plus de la contrainte associée à son lieu de résidence, elle a ajouté qu'en réalité, elle n'est pas en mesure de vénérer une liste d'animaux Esprits-Immortels *tangdan* parce qu'elle est actuellement fonctionnaire chargée de mission administrative au niveau local. De plus, en raison du fait que son compagnon, lui aussi fonctionnaire et travaillant dans l'armée, il est possible que leur résidence soit plus surveillée par rapport à celles d'autres fonctionnaires, afin de s'assurer qu'il n'y ait pas émergence d'éléments désignés comme « superstitions féodales » *fengjian mixin* 封建迷信 par le pouvoir communiste. Selon Mme Meng, d'un côté, ses affinités sélectives avec les esprits d'animaux auraient pu provenir de ses origines mandchoues. Cette réflexion personnelle permet ainsi de faire écho à l'énoncé de Mme Wang Yu : le chamanisme mandchou ne peut se transmettre qu'à travers le prisme de la consanguinité. D'un autre côté, ces affinités proviennent aussi de sa personnalité bienveillante que les esprits d'animaux semblent apprécier, selon elle.\n\n<<< PAGE 98 >>>\n\n2.3 « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? » : à qui revient-il de définir la sinisation ?\nComme montré précédemment, durant la gouvernance de l'empire mandchou des Qing, ce fut davantage le statut héréditaire relevant du système des huit bannières qui définissait l'identité mandchoue. Aussi, après la fondation de la Chine communiste, un individu est classé dans la catégorie des « Mandchous » *Manzu* 满族 en tant qu'une ethnie minoritaire de la République populaire de Chine à la condition que son statut d'origine (ou celui de ses parents) soit issu du système des huit bannières et pouvant être prouvé. Tant au XVIIe siècle qu'au XXe siècle, l'ethnicité mandchoue reste une catégorie « inventée et construite » pour reprendre la mention de Mark Elliott¹²⁷. En effet, cette identité est à priori étroitement liée au système des huit bannières. C'est également un fait.\nOr, d'un point de vue moins évident, cette même identité peut en réalité être définie et manifestée de manière encore plus étendue, car la classification fondée sur le système des huit bannières se rapporte en réalité à une vision allant de haut en bas. Ainsi, même si certains discours nationalistes chinois contemporains ont tendance à déclarer que « les ethnies minoritaires du Nord-est » sont presque intégralement sinisées, en réalité ce n'est pas vraiment le cas. Cela non seulement parce qu'il y a des Mandchous issus d'intermariages se reconnaissant encore en tant que Mandchous plutôt que Han, mais aussi parce qu'il arrive souvent que d'autres, même s'ils se déclarent non croyants, ou sont enregistrés en tant que «\n\n<<< PAGE 99 >>>\n\nHan » sur leurs carnets de résidence dès la naissance, n'ont pourtant pas coupé le lien avec le chamanisme local. Et ils continuent à manifester des affinités électives avec les esprits d'animaux considérés comme ayant déjà possédé leurs ancêtres : tel est le cas de M. Guan.\nEn résumé, originaire de Moqi, la bannière autonome daur de l'Est de la Mongolie intérieure, M. Guan, âgé de près de quarante-cinq ans, est un habitué des temples gérés par la Supérieure maître taoïste Wang Liyan. Il semble avoir une préférence pour le temple Daode, car d'après lui, c'est dans ce temple-ci qu'il ressent plus de quiétude. M. Guan se définit en tant que médium chamanique *saman* 萨满, ses activités et pratiques se font davantage à Moqi. Selon lui, ses affinités avec le chamanisme innées proviennent de ses origines mandchoues. Et en parallèle, les liens avec les pratiques chamaniques dont il est doté contribuent aussi au renforcement de son identité mandchoue. Ci-dessous figurent ses explications à ce sujet :\n> « Tout d'abord, je me définis avec fermeté comme Mandchou, et cela ne changera pas. Parce qu'en effet, il y a la filiation. Ce n'est pas par simple fierté ou par quoi que ce soit que j'admetス que je suis Mandchou, mais parce que les liens existent entre le chamanisme et les Mandchous [le terme employé par M. Guan est Manzu], c'est cet aspect-là dont je suis fier. La priorité est d'être sûr de savoir où se trouve tes attributs culturels et tes affinités. Par exemple, je suis d'origine mandchoue, ma famille a cette transmission de danses (pratiques) chamaniques remontant à mes ancêtres. En ce qui concerne ma génération, la raison pour laquelle j'ai reçu ce don, c'est parce que je suis issu de cette famille et de cette ethnie, je ne peux pas m'en détacher, c'est-à-dire que je ne peux pas m'évader, c'est mon destin. »\n> “首先我个人坚定地认为我是满族人，这个是不会变的。因为确实是这个血统。我承认自己是满族人不是因为我骄傲或因为什么，而是说因为萨满跟满族有关系，这一方面我骄傲，这个首先要确定你的文化属性在哪里，机缘在哪里。就比如我是满族血统，我家祖上就是有跳萨满的这个传承。\n> 等到了我这代了，我为什么会接到这个，那就是因为我是这个家族的人，我是这个民族的人，我离不开，就是说我逃不掉，这是我的宿命。”\nDe plus, en évoquant la question relative à la situation de la langue, M. Guan commentait :\n> « Que ce soient les Mandchous, les Daurs, ou les Mongols, on dit qu'ils sont sinisés, mais au fond, qui est en mesure de définir la sinisation ? S'agit-il vraiment de sinisation si l'on parle le chinois ? Peut-on être considéré comme sinisé juste parce que l'on mange la nourriture des Han, ou parce que l'on porte les vêtements des Han ? C'est vrai que beaucoup de Mandchous ne\n\n<<< PAGE 100 >>>\n\nsavent plus parler le mandchou, de même que certains Daurs ne savent plus non plus parler le daur, mais est-ce vraiment ça la sinisation ? Ne serait-ce pas juste parce que sans savoir parler le chinois, il est impossible de vivre dans la société actuelle ? Pour aller à l'université, les jeunes Daurs doivent savoir parler chinois, sinon ils ne peuvent pas étudier parce que personne n'y enseigne en daur. »\nEn se référant au fait que la langue mandchoue n'est plus parlée au quotidien par la majorité des populations en Mandchourie, M. Guan ne le renvoie pour autant pas à la sinisation. Plus précisément, il remet en cause les idées couramment répandues aujourd'hui par le nationalisme faisant croire que les peuples non-Han sont censés être sinisés parce qu'ils parlent déjà le mandarin. Ainsi, il s'interroge sur les critères de définition de la sinisation. Ses propos visent à démontrer que les formes extrinsèques allant des vêtements, de la nourriture à la langue, ne suffisent pas à justifier une sinisation supposée. En tant qu'un individu né de parents Han et non-Han, sa perception de l'ethnicité est davantage basée sur les affinités prédestinées qu'il nourrit avec le chamanisme mandchou lui ayant été transmis par la parenté et la consanguinité du lignage patrilinéaire. Aussi, ces affinités sont sélectives¹²⁸ dans la mesure où c'était ce don qui l'avait sélectionné, et qui lui avait été parvenu au moment où il est né, au lieu de lui laisser la possibilité d'orienter son sort de façon autonome¹²⁹. En l'occurrence, les éléments religieux ayant trait au chamanisme de caractère local contribuent de manière intrinsèque au processus de la construction de l'identité individuelle. Comme l'a remarqué la chercheuse Jiang Xiaoli :\n> « In a faith-based organization, religion serves to integrate the organization. Since in shamanism, faith-based and blood ties-based organizations overlap, shamanism plays a pivotal role in integrating and cementing the bonds among Manchu clans. It has played a great role in ensuring the existence of the clan organization of Manchus throughout the Qing Dynasty. »¹³⁰\nAjoutons que Jiang concluait aussi :\n> « [...] the future of shamanic sacrifices hinged on the livelihood of the Eight Banners in the Qing Dynasty. In the early Qing Dynasty, Manchu bannermen were prosperous and their sacrifices elaborate. In the middle and late period of the dynasty, the lives of the bannermen\n\n<<< PAGE 101 >>>\n\nbecame harder, which was one among several factors that led to the gradual decline of shaman\nsacrifice activities. »¹³¹\nEn revanche, si la prospérité des rituels et pratiques chamaniques résultaient en grande partie\ndes conditions de vie des hommes des huit bannières durant la dynastie mandchoue des Qing,\nla mention du « déclin des activités chamaniques » reste encore à être interrogée, et nous\nsuggérons de préférer le terme de « métamorphose » à celui de « déclin ». De fait, les\nobservations ethnographiques qui ont été menées nous ont conduits à comprendre qu'à la\npériode contemporaine où nous vivons, la vigueur des pratiques religieuses définies comme\nchamanisme local/chamanisme du Nord-est est encore forte, au point qu'elles participent\ntoujours à façonner le paysage religieux et l'espace social locaux. Malgré le fait que les\nactivités de ce type que nous pouvons constater aujourd'hui ne soient certes plus tout à fait\nanalogues à celles du passé, l'idée est davantage de saisir la portée importante et indéniable\nde la dimension mandchoue et de l'étendue de la « mandchourisation ». En effet, il est en\npartie juste de parler de déclin dans la mesure où le chamanisme local est souvent amené à\ns'adosser (voir se soumettre) aux religions institutionnalisées, telle que la religion taoïste.\nMais, à un autre niveau, la religion taoïste locale à l'échelle de la Mandchourie dépend elle\naussi des pratiques chamaniques locales de sorte qu'elle puisse au mieux s'enraciner au\nniveau local. Nous étudierons ces aspects en profondeur dans la suite de la présente recherche.\nLes éléments découlant du chamanisme local constituent aussi une des nombreuses\nparticularités de la Mandchourie d'un point de vue religieux. Ainsi, l'ethnicité mandchoue se\nrenouvelle au point qu'elle prend également part à la construction de l'identité partagée par\nl'ensemble des populations de ce territoire au nord de la passe Shanzhai de la Grande Muraille.\nAujourd'hui, si la sinisation peut s'identifier à une sorte « d'ethnicisation du nationalisme –\nou de Han-centrisme »¹³², elle a eu ses limites en Mandchourie.\n\n--- Chapitre 7 La présence des animaux Esprits-Immortels et ses définitions locales (pp.273-322) ---\n<<< PAGE 273 >>>\n\nJe précise que localement, à Qiqihar dans la province du Heilongjiang, en Mandchourie septentrionale, et dans un sens plus large, dans le nord-est de Chine, le terme Immortel(s) xianjia sert principalement (voire exclusivement) à désigner des animaux Esprits-Immortels, notamment les suivants : *hu huang bai liu hui* 胡(狐)黄白柳灰, autrement dit les renards immortels *huxian* 狐仙, les putois immortels *huangxian* 黄仙, les hérissons immortels *baixian* 白仙, les serpents immortels *liuxian* 柳仙, et les souris immortelles *huixian* 灰仙. Le terme xianjia renvoie ainsi à une série d'animaux très précise et donnée dans un ordre très souvent le même, mais qui peuvent aussi plus rarement être appelés : *hu huang chang man* 胡(狐)黄常(长)蟒 les renards immortels, les putois immortels, et les pythons immortels, mais pas les souris immortelles, ni les hérissons immortels. Là où on parle de divinités célestes *shenxian* 神仙 dans d'autres régions de Chine. Dans mes deux enquêtes ethnographiques, il m'est arrivé soit au sein de ces temples en réseau, soit en dehors, chez certains requérants, de voir quelques listes d'animaux Esprits-Immortels vénérés dans les familles *tangdan*. Sur ces listes, figurent en général différents noms dont chacun correspond précisément à un animal Esprit-Immortel. Selon l'anthropologue chinoise Liu Zheng-ai, « Chaque animal Esprit-Immortel possède un nom faisant écho aux noms du clan patriarcal... »³⁴⁰. De plus, les renards et les putois immortels qui figurent en haut des listes sont considérés comme étant les plus puissants et ils apparaissent aussi plus souvent dans les récits des gens. Soulignons qu'il n'est pas rare de constater que sur les listes des animaux Esprits-Immortels *tangdan*, le caractère *hu* 胡 se substitue à *hu* 狐 par homophonie, et il en va de même pour le caractère *chang* 长, littéralement « long/longue(s) » qui désigne les serpents immortels, remplacé souvent par *chang* 常³⁴¹. Les putois immortels *huangxian* 黄仙 (*\"huang\"* est la première syllabe du mot putois en chinois) peuvent aussi être nommés directement les putois *huangshulang* 黄鼠狼, ou encore *huangpizi* 黄皮子 (une façon plus familière de dire le putois), ou simplement *huang* 黄, mais les gens suggèrent qu'ils parlent de façon privilégiée\n\n<<< PAGE 274 >>>\n\nde huangxian 黄仙 car cette appellation est considérée comme plus respectueuse en raison\ndes forces spirituelles des animaux Esprits-Immortels.\nMais surtout, il est une phrase-clé qui revient assez souvent chez les moines taoïstes et les\nnombreux fidèles laïcs qui interagissent eux : « Dans le Nord-Est, les Esprits-Immortels sont\npartout \"在东北地区,到处都是仙家\" » . Durant mon enquête de terrain, je n'ai pas travaillé\ndirectement sur la communauté des gens sur qui les animaux Esprits-Immortels sont\nconsidérés comme s'accrochant, ni sur les séances thérapeutiques effectuées par celles et\nceux qui sont déjà en capacité de guérir les maladies invisibles des autres, mais je me suis\nintéressée à certaines situations que j'ai pu observer en lien avec les pratiques taoïstes dans le\ncadre des temples taoïstes en réseau. Dans la mesure où des liens évidents existent entre les\ntemples taoïstes et des personnes qui considèrent avoir reçu un don (l'expression en chinois\nque les gens utilisent presque à chaque fois dans ces circonstances est en fait « les affinités\nprédestinées » yuanfen 缘分 qui les relient aux animaux Esprits-Immortels), il importe\nd'être attentif à ces phénomènes qui sont nombreux et dynamiques, et constituent un aspect\nsignificatif du paysage taoïste local. Quoi qu'il en soit, ces observations ont une chose en\ncommun : les personnes qui en font l'objet sont toutes venues au temple taoïste pour régler\nleur problème à travers une suite de pratiques religieuses auxquelles ils avaient recours. Il\ns'agit aussi bien de gens qui ont hérité d'affinités prédestinées yuanfen avec les animaux\nEsprits-Immortels mais qui n'étaient pas encore en mesure d'utiliser ce don, qui en\nsouffraient et qui sollicitaient en dernier recours l'aide des taoïstes, que de personnes ayant\nfait le choix d'accepter de devenir chamanes, et pour qui, l'aide des maîtres taoïstes et leurs\npratiques rituelles paraissent également nécessaires.\n\n<<< PAGE 275 >>>\n\n## 7.1 Quand on n'est pas encore en mesure de maîtriser les animaux Esprits-Immortels...\nDurant ma recherche ethnographique, j'ai pu constater que les animaux Esprits-Immortels peuvent être dénommés de façon différente tant par les religieux que par les requérants qui les appellent « les maîtres s'attachant aux corps des humains » (shenshang de shifu 身上的师父), « les Immortels terrestres » (dixian 地仙), « celles et ceux (les animaux) qui ont du pelage et de l'enveloppe dure » (pi mao dai jia de 披毛带甲的), ou encore « les vieux maîtres » (lao xianjia 老仙家) etc, dans beaucoup de cas, ils sont simplement nommés « les Immortels » xianjia.\nDans un premier temps, je détaillerai quelques cas de requérants, en rapportant des extraits des dialogues qu'ils ont eus avec des moines ou des moniales taoïstes et qui devront permettre dans une certaine mesure de reconstituer les moments de consultations dans les temples.\nLe premier cas révèle l'une des consultations typiques que j'ai observées dans le temple Daode. Il s'agit d'un jeune couple venu consulter une moniale, disciple de la Supérieure. Une autre fidèle (que l'on ne voit pas sur la photo ci-dessous) qui était également présente sur place, prit part à cette consultation, je la nommerai Yin par la suite. La crise sanitaire du Covid-19 a amené leur restaurant ouvert en novembre 2019 à une fermeture définitive au sortir du confinement de tout le pays au printemps de l'année 2020. Le conjoint est alors devenu livreur, et la conjointe travaille dès lors dans un autre restaurant en tant que serveuse.\nÀ peine entrés dans le bureau du temple, le couple a expliqué qu'ils avaient ouvert un restaurant mais dû mettre la clé sous la porte à cause du contexte sanitaire. Leur récit a permis de comprendre que l'homme a des « affinités prédestinées » avec les animaux Immortels et qu'ils vénéraient chez eux \"une liste sur laquelle figurent les noms des animaux Immortels\" dite tangdan (qui avait été faite par un(e) certain(e) médium par le passé), dont le couple cherchait toutefois ce jour-là à se débarrasser. C'était la raison principale de leur visite au temple, et tous deux semblaient déterminés. Je présenterai par la suite les raisons qui les ont amenés à prendre une telle décision, et m'interrogerai sur la façon dont se sont manifestées les « affinités prédestinées » du conjoint mentionnées précédemment. Pour cela, je me\n\n<<< PAGE 276 >>>\n\npermets de reproduire le dialogue quasi complet entre ces quatre personnes (le couple, la\nmoniale Su, et la fidèle Yin) qui devra nous donner à saisir les circonstances détaillées et\nconcrètes de cette consultation, afin de mieux comprendre leur histoire.\nFigure 1 : Le jeune couple en discussion avec la moniale Su Zonghui, gestionnaire des affaires du temple Daode quand la Supérieure n'est pas au temple.\nAlors qu'ils étaient en train de parler de la liste des noms des animaux Esprits-Immortels honorés sur le sanctuaire privé *tangkou* :\nLa fidèle Yin [s'adresse à l'homme] : « ... Si tu ne soignes pas les autres, tu n'auras plus besoin de la vénérer (cette liste), sinon tu te créeras des embarras en continuant à la vénérer, plus tu les vénères, plus ils [les animaux Esprits-Immortels xianjia] se jettent sur toi [s'attachent à toi et font de toi leur médium]. » (你要是不给别人看病，就不要找麻烦了，你越供，它往你身上扑得越厉害。)\nLe jeune homme : « Avant, quand j'ai commencé à les vénérer, je n'ai jamais eu l'intention de compter sur ça pour gagner de l'argent en soignant les gens, jamais, j'étais juste obligé de les vénérer car j'ai été si tourmenté que j'étais au bout de tout... À ce moment-là, même quand je marchais sur le chemin... (La parole a été interrompue par la fidèle Yin) » (我供的\n\n<<< PAGE 277 >>>\n\n时候也没指望给别人看病挣钱，压根就没寻思，那时候就是我被折腾得不行了，正走着，就...)\nLa fidèle Yin : « Que tu y penses ou pas, ta famille a cette affinité prédestinée. Ce n'est pas toi qui peux le décider. » (不是你寻思的事，你家有那个缘分。)\nLe jeune homme : « Ma grand-mère paternelle soignait les gens par le passé. » (我奶奶原来给别人看病)³⁴².\nLa moniale Su : « Ta famille a ce genre de don. » (你家有那个缘分。)\nLa fidèle Yin : « Tu as ce don, mais tu es si jeune, c'est un chemin qui n'est pas facile, tu pourrais peut-être négocier avec les maîtres qui se sont accrochés à toi pour repousser les choses à plus tard, quand tu seras plus vieux, à la retraite. » (你有这个缘分，但你还这么年轻，你走这条道，多不容易啊，你可以和你身上的师父说，多少年以后，或工作退休了，你再走这条道也不晚。)\nLa jeune femme : « Ou bien pourrait-il ne faire que de communiquer avec ces maîtres, et de ne jamais devenir médium ? » (那能不能始终就和师父沟通，最后就是不走这条道？)\nLa fidèle Yin : « Ne dis pas ça, il faut laisser les choses suivre leur cours. Il pourrait juste les reporter à plus tard mais laisser les animaux immortels faire leur pratique chez vous. » (别说这话，顺其自然，可以往后推迟一下，让它在你们这里修呗。)\nLa jeune femme : « Mais lui (jusque-là), il n'a eu aucune manifestation. » (但他还真啥反应没有。)\n\n<<< PAGE 278 >>>\n\nLa moniale Su : « Tout le monde en a, tout le monde en a, ça dépend de quelle sorte de don on a. » (人人都有，哪个人都有，这要分是什么缘分。)\nLe jeune homme : « Oui un jour, il m’est arrivé de ne plus sentir l’existence de mes jambes, que je les pince ou autre, ça ne changeait rien, puis je me suis mis à pleurer en m’asseyant, et les autres se moquaient de moi en me demandant pourquoi un grand garçon comme moi pleure comme ça ? Mais moi j’étais hors de contrôle, je ne faisais que pleurer, larmoyer. »(那时候走着走着，这腿就没有了，掐啊还是怎样，都没感觉，然后我坐下就哭，别人笑着问：大老爷们哭啥啊？但不行我就是哭，眼泪止不住。)\nLa fidèle Yin : « Comme vous habitez tout près, vous pourriez venir ici les 1ers et 15èmes jours de chaque mois lunaire pour brûler des encens, vénérer les divinités, et dénouer les affinités prédestinées, ne serait-ce pas une bonne idée ? Ça pourrait aider à ce que ça aille mieux pour vous. » (你们住得这么近，初一十五就来这里上上香，拜一拜，解解缘分，这也挺好么！以后办什么事就顺了。)\nLa moniale Su : « Bien, c’est fini, si on est d’accord ? » (那就这样吧。)\nLa jeune femme : « D’accord, et comme nous sommes en contact sur Wechat, on en reparlera quand on aura le temps. Pour venir régler le problème, j’ai pris une demi-journée de congé, et j’ai même fait un mensonge en ayant déclaré que j’étais enhumée et avais le nez qui coule, et que j’étais sous perfusion. » (那就这样吧，咱俩有微信，有时间聊。为这事，我请了半天假，还撒了谎，说感冒流鼻涕，打吊瓶。)\nLa fidèle Yin : « Mais ne t’inquière pas, ça ne sert à rien d’avoir de la chaleur endogène³⁴³. Tout peut être réglé assez facilement, en plus vous avez vraiment de la chance d’habiter si proche d’ici. » (别上火，上火也没用，什么都好解决，你离得近多好啊。)\n\n<<< PAGE 279 >>>\n\nLa jeune femme « Nous nous sommes rendus en premier au temple Daode, car je me suis dit que je ne crois absolument pas aux médiums en dehors, il y a trop d'escrocs, et leurs propos peuvent être différents de l'un à l'autre. » (我们立刻就来道德院了，我说我可不相信那些大仙，骗子太多了，说什么的都有。)\nLe jeune homme : « La dernière fois, je suis allé à Shuang ya shan³⁴⁴ (en ayant eu recours au(x) médium(s) de là-bas), et ça m'a coûté seize milles yuans, et sans résultat. » (去趟双鸭山，一趟就一万六，啥也没看着。)\nLa jeune femme : « Et à ce moment-là, je me suis dit que comme ces drôles de choses suivent les personnes (qui ont des « affinités prédestinées avec eux »), et qu'il (le conjoint) pouvait être considéré comme faisant partie de mes proches (vu que nous étions déjà en couple), et moi j'ai contacté ma belle-sœur qui est capable de voir les choses des autres, après cela, mon conjoint, s'est mis à vénérer (ces animaux Esprits-Immortels). » (我当时说，这玩意儿不都是跟着人走嘛，而他不就算是自己的人吗，就这样，我找了我家的一个嫂子，她会给人看。之后就开始供。)\nLa moniale Su : « Oui c'était cher, si ça a couté plus de dix mille yuans, ce voyage à Shuang ya shan. » (去一趟双鸭山，一万多，也不少啊。)\nLa jeune femme : « Hélas ! À ce moment-là, nous ne nous connaissions pas encore ! Il était avec son ex-femme. » (哎呀，那时候我们俩还不认识呢！那时候他和他前妻。)\nLe jeune homme : « Et après que nous nous sommes rencontrés, nous avons en effet payé pour s'occuper du sanctuaire où on vénère les animaux Esprits-Immortels. Et ça a couté entre quatre mille et cinq mille yuans à chaque fois, à chaque fois. » (我们俩认识后，也弄过堂口，整一回四、五千，整一回四、五千。)\nLa fidèle Yin : « Ne fais plus ça. » (别整。)\n\n<<< PAGE 280 >>>\n\nLa jeune femme : « Oh là là, on n'en peut plus, c'est un vrai supplice, en plus ça fait peur à notre enfant quand il/elle le voit (le sanctuaire). Il/elle le redoute. Et nous avons discuté, et avons donc décidé de trouver un temple ordinaire pour tout bien comprendre clairement, et de rendre ce que nous devons s'il y a lieu, et désormais, d'avoir la conscience tranquille, sans laquelle on n'échappera pas au karma. » (哎呀，可受够了，折磨人，我家孩子看到那玩意儿还害怕，就害怕。所以赶紧找个正规寺庙，找个正规道院，整明白清楚，该还的我们还，以后就把良心摆正，良心不正，因果还不得找你啊？)\nLa fidèle Yin : « Mais tu as tout à fait raison ! » (对，这句话说得对！)\nLe jeune homme : « Ces dernières années, on n'arrive pas à nous en sortir, on perd de l'argent dans tout ce qu'on fait... » (这些年啊，干啥啥不行，干啥都赔钱...)\nLa jeune femme : « Si nous étions du genre paresseux, nous aurions abandonné, mais au contraire, nous avons toujours eu le courage d'investir, et puis d'un seul coup, nous nous trouvons au bout de tout ! » (我们要是懒人也就算了，但我们俩敢张罗，张罗完一下就到底了！)\nLe jeune homme : « Lorsque notre restaurant était ouvert, nous nous levions à 9h du matin et travaillions jusqu'à 3h, 4h du matin, et nous dormions dans le restaurant, sur un matelas en mousse placé sur le sol. » (我们俩在那边开饭店的时候，早晨9点起来，一直到晚上3、4点钟，然后就在饭店睡，铺海绵垫在地上睡。)\nLa fidèle Yin : « C'était vraiment dur... » (那可太不容易了...)\nLa jeune femme : « (En poussant un soupir), on n'a plus besoin d'évoquer les amertumes que nous avons vécues. » (唉，吃过的苦就不用提了。)\nLe jeune homme : « Il nous est même arrivé de dormir sur le matelas en mousse pendant une dizaine de jours d'affilée sur le sol du restaurant et de ne pas pouvoir rentrer chez nous. Mais il n'y avait rien à faire, nous rencontrions toujours des difficultés dans tout ce que nous faisions. » (睡地上十来天都不能回家，在垫子上睡。没招儿，干啥啥不顺。)\n\n<<< PAGE 281 >>>\n\nLa fidèle Yin : « Est-ce que vos signes astrologiques s'assortissent bien ? » (你们俩属相合不合呀？)\nLa jeune femme : « Lui il est serpent et moi je suis bœuf. » (他属蛇，我属牛。)\n(Quelques secondes de silence.)\nLe jeune homme : « Ça va, non ? (Il sourit) » (还行是吧？)\nLa fidèle Yin : « Rentrez doucement (Au revoir) ! » (慢走啊！)\nLa moniale Su : « Rentrez doucement (Au revoir) ! » (慢走啊！)\nLa jeune femme : « Merci à vous, maîtres, je te transférerai de l'argent (sur Wechat) une fois que j'aurai touché mon salaire (la moniale Su a dit d'accord), aujourd'hui je ne l'ai pas encore reçu, il faudra attendre lundi prochain. » (谢谢你们啊师父，等到开支我就给你转过去，今天不开支，要等周一。)\nLe couple est revenu deux jours après, le 19 août 2020 -le 1er jour du 7e mois lunaire- vers 7h30 du matin, pour faire le rituel d'« Envoi de requête [dans le monde céleste] » dit shengshu 升疏 durant lequel leur requête a été brûlée et transmise ainsi à la Mère Noire 黑妈妈, dont le nom complet est la Vieille dame noire Protectrice de la liturgie (Shenshi hufa daxian heilaotai 神师护法大仙黑老太). C'est une divinité féminine taoïste locale très importante dans cette région, considérée comme en charge des animaux Esprits-Immortels (xianjia) et placée au rang de Protectrice de la liturgie taoïste. Dans chacun des temples de la région gérés par la même Supérieure et fonctionnant en réseau, une statue de la Mère Noire y est vénérée dans la salle de la Protectrice de la liturgie taoïste (hufa dian 护法殿)³⁴⁵. Ainsi pour adresser un vœu à la Mère Noire, il faut donc réaliser le rituel d'envoi de requête en la transmettant par le feu. Ce matin-là, les moines du temple avaient à peine pris leur petit-\n\n<<< PAGE 282 >>>\n\ndéjeuner (appelé souvent « prendre un repas de jeûne » guozhai 过斋) quand ce jeune couple est arrivé. Le moine Cheng Zonghe a commencé par prendre la requête rédigée par avance selon les informations personnelles envoyées en ligne par le couple, contenue dans une enveloppe jaune rectangulaire sur laquelle est écrit le nom du palais de la Mère Noire : le Palais de la longévité (Yanshou gong 延寿宫) auquel devra être destinée la requête. Il a accompagné le couple dans la salle de la Protectrice de la liturgie taoïste, puis a demandé au conjoint de s'agenouiller sur le coussin devant la grande statue de la Mère Noire alors que sa femme se tenait debout à côté de lui. Le moine a allumé le haut de l'enveloppe rectangulaire avec un briquet, et s'est mis à réciter par cœur *Le classique merveilleux du Sceau du Cœur du Suprême Empereur de Jade*, le Wushang Yuhuang Xinyin Miaojing 无上玉皇心印妙经 (qui est extrait du texte canonique du rituel du matin du temple), en battant son poisson de bois, jusqu'à ce que le formulaire céleste achève de se consumer. Dans une deuxième étape, le moine a conduit le couple dans la cour arrière du temple où se trouve le grand brûlepapiers d'offrandes en fer dit « fourneau pour chasser les calamités » xiaozai lu 消灾炉, pour brûler leur liste des noms des animaux Immortels en tissu de couleur rouge³⁴⁶, et le moine a fini par verser dans le fourneau un certain nombre de monnaies d'offrande en forme de lingot d'or en papier.\n\n<<< PAGE 283 >>>\n\nFigure 2 : Ce matin-là, devant la statue de la Mère Noire dans la salle de la protectrice de la liturgie, le moine Cheng fait le rituel d'envoi de requête, dit shengshu 升疏 pour ce jeune couple.\nCe rituel accompli dans le temple par les moines taoïstes locaux est une pratique taoïste qui se déroule en deux phases en plus de la consultation en face à face : envoyer la requête à la Mère Noire, et brûler la liste, la finalité étant de mettre un terme à la vénération des animaux Esprits-Immortels tenus pour s'être attachés à l'homme ou pour posséder celui qui a des affinités prédestinées yuānfen avec eux, laissant transparaître ici des éléments d'une forme de chamanisme local. Un autre fait important qui doit être souligné c'est que les animaux Esprits-Immortels sont aussi appelés « les maîtres s'attachant aux corps des humains » shenshang de shifu 身上的师父 en plus de xianjia, au lieu d'être nommés par des termes renvoyant directement aux animaux. En outre, selon les informations données dans cette discussion, nous pouvons nous rendre compte que ce type de don peut être transmissible au sein de la famille mais sans que personne ne puisse savoir par avance à qui. Le descendant qui reçoit le don peut manifester des signes estimés peu ordinaires de différentes manières, autrement dit les affinités prédestinées se présentent, par exemple, sous la forme de douleurs inhabituelles sur le corps humain, ou de malheurs survenus de façon récurrente. La présence des animaux Esprits-Immortels sur le corps humain doit d'abord être attestée par un médium ou chamane, car cette présence reste invisible aux gens ordinaires. En revanche, malgré l'existence d'une telle « affinité prédestinée », cet homme ne peut pas être reconnu comme un\n\n<<< PAGE 284 >>>\n\nchamane, ou du moins il ne l'est pas pour l'instant, car il n'arrive pas à contrôler ni à maîtriser ces animaux esprits-Immortels.\nPar la suite, j'ai pu échanger avec le moine Cheng sur le cas de ce requérant et sur les pratiques religieuses réalisées, et il m'a donné son avis : « La liste qui a été brûlée est un objet visible, tandis que les maîtres animaux Esprits-Immortels s'accrochant sur son corps sont invisibles, ils se dissimuleront dans le vide de la sphère liturgique, et seuls les yeux de la sagesse³⁴⁷ peuvent les apercevoir. Mais moi je ne suis pas certain non plus qu'ils pourront être renvoyés, il est possible que ses animaux Esprits-Immortels se rendent compte dans quelques temps des actes faits à la liste, certains partiront peut-être, tandis que d'autres, tels que ceux transmis par les ancêtres, continueront probablement à le suivre et à le protéger de façon souterraine. » (烧掉的堂单是有形的，虚空法界中他身上的仙家师父会隐藏起来，没有慧眼是看不见的，办了之后，仙家也能知道，但是走不走我也不确定，有的可能会走，有的是祖上的，就还会跟着他，在暗中保他。) Selon le commentaire de ce moine taoïste, le fait religieux de brûler la liste des noms des animaux Esprits-Immortels n'a peut-être pas pour résultat le renvoi de tous les animaux Esprits-Immortels qui se seraient attachés sur quelqu'un, mais il permet de mettre un terme à leur vénération de manière à rassurer les personnes concernées, et cette pratique rituelle fait comprendre que ce genre de liste doit davantage être prise en charge par les « spécialistes estimés plus légitimes » que par les requérants eux-mêmes, c'est-à-dire les moines taoïstes, vers lesquels les requérants se tournent le plus souvent, et parfois aussi de certains des fidèles les plus investis dans la vie du temple qui (comme Yin) les assistent de près ou de loin. Ainsi au moment où le moine s'est apprêté à allumer le bas du tissu rouge qui représentait la liste, la jeune femme, qui était satisfaite de la voir se consumer par le feu a dit : « ... Enfin, c'est fait. Les médiums de dehors ont dit que la liste ne devrait pas être brûlée. » Certains animaux Esprits-Immortels hérités des ancêtres sont supposés protéger la famille, d'où la dénomination « les (animaux) Immortels protégeant la famille (baojia xian 保家仙) », mais ces derniers n'équivalent pas exactement à ceux dont on considère qu'ils possèdent les humains pour faire d'eux des chamanes.\n\n<<< PAGE 285 >>>\n\nAprès avoir vu le cas d'un homme qui souhaite renoncer à son don, nous allons considérer celui d'une jeune fille dont on dit qu'elle n'est pas en âge de pouvoir faire usage du don qu'elle a reçu. Le deuxième cas se réfère à une observation au temple Guandi, un autre de ces temples fonctionnant en réseau. Il s'agit d'une famille, les jeunes parents accompagnent leur fille âgée seulement de dix ans qui est le suhet de la consultation, ils viennent d'un comté de la ville. Comme souvent, la Supérieure se trouvait ailleurs le jour où cette famille est venue au temple, et ne rentrerait dans les temples en réseau de Qiqihar que dix jours après. Mais ayant été prévenue de la visite de la famille lors de son absence, elle avait confié par avance cette consultation à son disciple le maître Zhao. Ce jour-là, il était près de midi, quand le couple a appelé le maître Zhao pour lui confirmer qu'ils allaient bientôt arriver. Quand ils sont rentrés dans le bureau du temple, le couple a commencé par présenter brièvement la situation de la fillette qui s'est installée face au maître Zhao. Il n'y avait personne d'autre dans le bureau qui avait été rempli de monde toute la matinée ; les autres maîtres étaient allés prendre leur déjeuner ou faire un pause.\nDans leur récit, le couple raconte qu'il y a près d'un an, leur fille et eux sont rentrés chez eux très tard le soir, et que cette expérience a effrayé l'enfant. Depuis lors, la fille n'est plus telle qu'elle était auparavant, et présente des « symptômes » peu ordinaires, dont le plus caractéristique est de « parler la langue des animaux Esprits-Immortels » toute seule de temps à autre au point que ses parents, qui n'arrivent pas à en comprendre un mot, ne puissent plus communiquer avec elle. De plus, le couple a précisé au maître taoïste que leur fille leur avait appris qu'elle voyait souvent à la maison une vieille dame. Alors que cette dernière restait invisible pour eux, ils avaient toutefois aperçu eux-mêmes plusieurs fois leur fille en train de « communiquer dans la langue des animaux Immortels » avec cette vieille dame invisible. Le couple a d'abord pensé à aller voir les médiums de leur comté. Celles et ceux à qui ils ont eu recours ont tous conclu que la petite fille est possédée par un esprit, mais aucun d'entre eux n'a réussi à lui faire retrouver un état normal. Comme certains d'entre eux le leur ont suggéré, ce jeune couple est donc venu en ville pour rendre visite à la Supérieure des temples en réseau en vue de solliciter son aide.\nÀ peine installé, le maître Zhao a d'abord demandé la date et l'heure de naissance de l'enfant. J'ai vu le maître Zhao faire très sérieusement des calculs sur ses doigts pendant quelques instants, puis il s'est adressé au couple et leur a demandé s'ils vénéraient des divinités chez\n\n<<< PAGE 286 >>>\n\neux, le couple lui a appris qu'ils vénéraient des animaux Immortels protégeant la famille (*baojia xian* 保家仙). Quelques secondes après, le maître Zhao a résumé les choses ainsi au couple : « En premier lieu, il faudra faire rentrer son âme³⁴⁸ dans son corps, car pour l'instant son âme s'est [échappée et] perdue (让孩子们魂魄归身，她现在魂魄丢了). En second lieu, vous devriez apaiser ce qui la possède par le rituel *chaodu* (要超度她身上东西。) » Or, à ce moment-là, la mère a semblé ne pas avoir entièrement compris ce que le maître venait d'évoquer, et a essayé de lui expliquer ce qui était arrivé à sa fille, avec un air préoccupé : « En fait, ça fait longtemps que ma ville est possédée par une vieille dame, elle la suit tout le temps, et elles peuvent aussi communiquer entre elles ! (已经很长时间了，她身上有个老太太，一直跟着，她们还能对话 ! ) » « Mais l'enfant est trop petite ! Elle est encore à l'école, qu'est-ce que nous pourrions faire ? Nous ne pouvons pas la laisser tomber dans un piège ! » (孩子现在岁数太小了！她还要上学啊，不然让她怎么办？那不是坑孩子吗？) a dit le maître. En l'entendant parler ainsi, la mère s'est détendue. Tout à fait d'accord avec le maître, elle s'est rendue compte qu'il avait bien compris la situation de leur fille sans qu'elle n'ait à l'explicite davantage (Alors que pour moi, ce n'était pas encore très clair à ce moment-là, et que je n'ai mieux compris la situation que quand la consultation en était presqu'à la moitié). Puis, le maître a demandé au couple si quelqu'un est médium dans leur famille, la mère a dit oui et non, car d'une part la personne à qui elle pense alors n'est qu'un parent très éloigné, et d'une autre part, elle est déjà décédée, et n'a été médium que pendant quelques années avant sa disparition. La mère a ajouté que certains chamanes de leur comté, entrés en transe une fois possédés par leurs animaux Esprits-Immortels (le terme que la mère a employé pour désigner ces chamanes est *daxian* 大仙) ont tenté d'interroger l'animal Immortel qui possède la fillette - comment s'appelle-t-il, et d'où vient-il-, mais celui-ci n'a jamais répondu, et que parfois, même si tel ou tel autre chamane semble avoir temporairement réussi à convaincre l'animal Esprit-Immortel de quitter l'enfant, ou au moins de lui permettre d'abord de finir ses études, l'animal Esprit-Immortel concerné ne tenait sa promesse que pendant un certain temps puis finissait toujours par revenir à la fille qui se\n\n<<< PAGE 287 >>>\n\nremettait alors comme avant à dire, sans en être nécessairement tout à fait consciente, des\nphrases dans une langue incompréhensible pour les autres. Le processus se produisait ainsi de\nmanière récurrente.\nLa fille est calme et polie, et à chaque fois que l'on lui fait un sourire, elle sourit aussi en\nguise de réaction ; des fossettes bien visibles se dessinent au niveau de ses joues. Le maître\nZhao et elle se regardent dans les yeux. Tous sont tous installés dans les chaises placées\nautour du bureau. Le moment est venu de rompre le silence : le maître taoïste commence à\ndiscuter avec « la fille », ou plus précisément avec l'animal Esprit-Immortel qui est censé la\nposséder : « Veux-tu que l'on se parle ? Si tu trouves qu'il existe des affinités prédestinées\nentre nous, tu pourras compter sur moi et me raconter ce que tu souhaites ». La fille lui\nrépond par un simple signe affirmatif de tête. Quand il suggère à l'animal Immortel de\ndiscuter avec lui, il affiche un air tant aimable que sérieux. Comme il reçoit une réponse\npositive, il propose ensuite à la fille d'aller s'asseoir tous les deux autour d'une autre table\nplacée dans un coin plus tranquille du bureau. À cet instant, le maître Zhao portait une\ndoudoune fine et sans coiffe taoïste. Soudain, il se retourne et m'adresse la parole : « Peux-tu\naller chercher ma robe et ma coiffe taoïstes dans ma chambre s'il te plaît ? » (La phrase que\nle maître a prononcée est en fait \"to me room help me put three衣和混元巾拿來<sup>349<\/sup>\")\nAprès avoir revêtu sa robe et sa coiffe taoïstes noires, il a dit à l'animal Immortel en\nregardant la fille dans ses yeux : « Malgré tout, je dois me changer pour rester respectueux\nvis-à-vis de toi » (不管怎么说,我得对你表示尊重,要换上衣服) Les jeunes parents se\ntenaient debout à côté, stressés, l'air grave. « Dis-moi, qu'est-ce que tu veux faire ? Pourquoi\ntu t'attaches à cet enfant ?» a murmuré le maître.\n« XXX... » a répondu l'animal Immortel dans une langue incompréhensible à travers la\nbouche de la petite fille, il faut également souligner que quand la fille s'est mise à parler avec\nle maître, elle semblait s'être transformée en quelqu'un d'autre : le regard plutôt méfiant, elle\néprouvait une certaine impatience, ses doigts se recroquevillaient et elle n'arrêtait pas de\ns'effleurer le menton. « Mais tu dois t'exprimer dans la langue humaine au lieu de la langue\nanimale, parle en chinois, en mandarin de sorte que nous puissions te comprendre, d'accord ?\nTu sais le faire, non ?» lui demande alors le maître sur un ton tendre. « Je veux faire la\n\n<<< PAGE 288 >>>\n\npratique de soi... ³⁵⁰» (我要修道), a déclaré l'animal Esprit-Immortel avec une voix un peu rauque par la bouche de la fille, une scène qui semble correspondre à la notion du « contact direct » que Roberte Hamayon emploie pour désigner un type précis de contact avec le ou les esprits impliqués³⁵¹.\nFigure 3 : À peine entrée cette famille dans le bureau du temple Guandi, la consultation commence avec le maître Zhao.\n« Mais tu sais, l'enfant est encore trop jeune pour te servir, elle serait obligée de mettre ses études de côté si elle acceptait d'être possédée par toi et de régler les problèmes des autres afin de te permettre de faire la pratique de soi, tu comprends ? Tu dois arrêter de la gêner pour l'instant, et la laisser grandir au moins jusqu'à l'âge adulte et finir ses études !» tente de négocier le maître. Très vite, nous voyons la fille secouer la tête pour indiquer que cette proposition ne lui a pas plu, et elle recommence à dire plusieurs longues phrases dans la langue mystique. Cette scène a tout de suite affecté la jeune mère. « Mais parle en chinois, en mandarin ! Si tu ne parles pas dans la langue humaine, tu ne pourras pas te faire comprendre\n\n<<< PAGE 289 >>>\n\npar les autres même si un jour tu verras vraiment les choses des autres (en t'attachant à elle),\nn'est-ce pas ?» dit le maître, « Sinon prends ce stylo, et écris ce que tu voulais dire, d'accord ?\nTu sais écrire ?» et il lui a tendu un stylo et un morceau de papier. La fille a pris le stylo, et\nn'a pas tardé à tracer à toute allure quelques lignes d'une écriture indéchiffrable, puis a posé\nle stylo sur le bureau. Cette écriture presque verticale rappelle à la première vue un peu le\nmandchou ou le mongol. Jusqu'à ce moment-là, nous avions cru que l'animal Esprit-\nImmortel qui la possédait pouvait comprendre le chinois, le mandarin, mais ce n'était peut-\nêtre pas évident pour lui de le parler couramment. Le maître a réfléchi un instant, et a dit : «\nTu es vraiment d'un mauvais tempérament ! Tout à l'heure, je ne voulais pas blesser ton\namour-propre, ni te faire perdre la face en divulguant tout de suite la vérité, mais tu crois que\nje n'étais pas conscient de ce que tu es ? Tu es un petit putois femelle Immortel. » La fille\nfixait son regard sur le maître, silencieuse. « Laisse la tranquille pendant dix jours, d'accord ?\nEnsuite, si tu le veux, dès le retour de la Supérieure, tu reviendras la voir. » La fille a enfin\ndonné un signe positif de tête.\nLe maître s'est levé du bureau, la consultation a ainsi été menée à sa fin. Les jeunes parents ont été d'accord de retourner chez eux dans leur comté qui est à près de trois heures en voiture, et de ramener leur fille au temple dans dix jours. Avant leur départ, le maître a réalisé une autre pratique permettant de mieux prendre en compte le rôle de la déesse qu'est la Mère noire et celui du Dieu du sol. Il a conduit cette famille là où sont respectivement vénérés la Mère Noire et le Dieu du sol. D'abord, il s'est arrêté devant la Salle de la Protectrice de la liturgie, et a demandé à la fille en jetant un coup d'œil à la statue de la Mère Noire si elle la connaissait, la fille s'est rapprochée de l'entrée de la salle et a regardé la statue pendant quelques instants et ne lui a pas répondu tout de suite, si bien que sa mère a cru que l'animal Esprit-Immortel était temporairement parti. Le maître a alors proposé à la fille de regarder la statue de la divinité de plus près, et peu après la fille a indiqué qu'il lui semblait l'avoir vue quelque part, mais elle n'avait pas l'air d'être très sûre. En revanche, quand elle a vu la statue du Dieu du sol vénérée dans la salle d'à côté, elle a immédiatement dit : « Lui je le connais. » (这个认识). Le maître leur a ensuite appris que c'est parce que les animaux esprits-Immortels sont en fait des Immortels terrestres Dixian 地仙, ils doivent tous passer par le Dieu du sol.\n\n<<< PAGE 290 >>>\n\nFigure 4 : Les traits indéchiffrables écrits par la fille lors de la consultation avec le maître Zhao dans le bureau du temple Guandi.\nDix jours plus tard, cette famille est revenu faire la 2ᵉ consultation avec la Supérieure des temples comme prévu. Cette 2ᵉ consultation s'est déroulée dans une ambiance paisible, la Supérieure a mis du temps à négocier avec l'animal Esprit-Immortel supposé posséder la fille ; de façon générale, elle s'est montrée amicale mais sévère et ferme dans le dialogue. Au début, en réponse aux questions de la Supérieure, la jeune mère a précisé que son mari travaille en tant que livreur chez *Avez-vous faim* (ele me 饿了么)³⁵², alors qu'elle tient une\n\n<<< PAGE 291 >>>\n\népicerie dans le comté où ils habitent pour s'occuper plus facilement de la petite fille. Quand la Supérieure a adressé la parole à la fille, elle avait l'air de comprendre mais répondait à chaque fois en langue incompréhensible, et ne s'est mise à parler en chinois qu'après que la Supérieure l'a exigé. « Au début, un certain médium que nous avons consulté dans notre comté au sujet de l'affaire de notre fille nous a appris que notre fille a des « affinités prédestinées » avec les bouddhas et qu'il faudrait inviter des statues de bouddhas et les vénérer chez nous, alors que nous ne le voulions pas, parce que nous sommes locataires pour l'instant et n'avons pas notre propre logement. En fait, si nous devions vénérer des statues, nous préférerions le faire quand nous aurons acheté notre propre logement plus tard. Toutefois ce médium-là a tellement insisté qu'il nous a même dit : 'Vous voyez ? Ces statues de bouddhas vous ont montré un sourire !' Et comme nous ne connaissons pas grand-chose là-dessus, nous avons accepté et avons donc payé plus de mille yuans à la fin pour inviter ces statues de bouddhas chez nous. Or, les symptômes que notre fille avait ont continué au lieu de s'améliorer, pour être plus clair, la personne avait seulement pour but de gagner de l'argent. » a raconté la jeune mère. (我们当初在当地看病的³⁵³那里看，然后他说我们有佛缘，要我们请佛像。我告诉他我们现在租的房子，等我们有房子再请。他说你看这佛对你们笑呢！我们也不懂啊，就花了一千块钱请了，孩子也没好，说白了他就是想挣钱。)\nLa supérieure, ne semblant pas de l'avis du médium décrit dans cette histoire, a ajouté : « Ce n'est pas le problème des bouddhas, nous ne devrions pas imputer la faute aux bouddhas. Cet enfant a en effet des 'affinités prédestinées' avec le bouddhisme et le taoïsme, or, cela ne signifie pas que vous êtes obligés de vénérer les statues. Pour le cas de cet enfant, ce n'est pas compliqué, c'est une maladie³⁵⁴ de l'ordre de la frayeur, et inviter les statues de bouddhas ne sert pas à grand-chose. Dis-moi, comment se comporte cet enfant au quotidien ? » (不是佛的事，别怪佛。孩子和佛教、道教有缘，但不是说非要让你们供，这个孩子吧，很简单这就是惊吓而引起的病，你请佛并没有用。孩子平时都怎样啊？)\n\n<<< PAGE 292 >>>\n\n« Elle ne parle plus en chinois à chaque fois qu'elle 'tombe malade', il paraît que quelque chose s'est agrippé sur son corps, selon elle, c'est une vieille dame. Quelquefois, ses yeux s'écarquillent³⁵⁵, et voilà, elle entre en transe/la possession commence (littéralement [l'animal Esprit-Immortel] « monte » shanglaile 上来了). Surtout quand nous ne sommes pas à la maison, elle se met à parler (l'animal Esprit-Immortel parle à travers elle) à l'insu de nous, et dès mon retour, elle se remet à s'adresser à moi normalement en chinois, parfois elle nous traduit ce qu'elle disait, tel que, \" Ce sera bientôt la fête des morts, j'ai constaté qu'il y avait du monde qui brûlait des monnaies d'offrande aux carrefours des rues, j'ai envie d'aller les leur arracher, mais je suis quelqu'un de décent, donc je ne le ferai pas. \" Ou encore, \" Parmi plusieurs maîtres auxquels tu as eu recours, personne n'est en mesure de me neutraliser. \" Tantôt elle dit (l'animal dit à travers la bouche de ma fille) \" Je suis une vieille femme, je peux me métamorphoser en coq ou en bœuf. \" Vous savez, (l'animal Esprit-Immortel) voulait nous intimider avec ces propos. » a répondu la mère. (她'犯病'的时候不说中国话,她身上就像招了个东西,她自己说身上就是个老太太。她的两个眼睛有时候就一瞪,就上来了。尤其屋里没人时,就偷着说,等我一回来,就又说正常话了,还会给你翻译过来,说什么'快清明了,我看十字路口很多烧钱的,我想去抢,但我是正经人,我不抢。'还有就是,'你找好几个师父了,也没治得了我。'一会儿说什么,'我是老太太,我还能变成鸡,我还能变成牛。'就吓唬人啊知道吗?)\n« Si nous discutions ? Oui ? Dis-moi pourquoi tu t'accroches à une si jeune enfant ? Elle est en pleine croissance, et doit aller à l'école, et pourtant tu t'empares d'elle, n'est-ce pas disgracieux ? » s'est adressée la Supérieure à l'animal Esprit-Immortel sur un ton sérieux en regardant la petite fille dans les yeux. (我们俩聊一聊? 孩子这么小,你上人家身上干嘛? 孩子正在成长、上学,你找到人家,这是不是不好啊?)\nAu moment où la Supérieure a proposé à l'animal Esprit-Immortel de quitter la fille, l'enfant a secoué la tête, et quand la Supérieure a fait semblant d'indiquer à l'animal Immortel de\n\n<<< PAGE 293 >>>\n\nlaisser la fille devenir moniale et s'installer au temple taoïste, l'enfant a à nouveau donné une réponse négative (pour dire non) par un sec secouement de tête. Puis, la Supérieure a fait une approche exploratoire en demandant si l'animal Esprit-Immortel voulait chercher à s'attacher à ses parents. La réaction surprenante de l'enfant a fait rire à tout le monde : « la fille » avait l'air de se fâcher, les yeux écarquillés, en décochant un regard sévère à sa mère et à son père l'un après l'autre. Cette négociation entre la Supérieure et la fille (ou l'animal Esprit-Immortel) a duré près d'une demi-heure, et est parvenue à ce qui semble aux yeux de tous un plutôt bon résultat : la Supérieure a appris à l'animal Esprit-Immortel que dans l'idéal, les animaux immortels doivent aller faire la pratique de soi dans les temples, ou dans les montagnes, mais que dans son cas il faut au moins qu'il quitte la fille immédiatement pour que sa vraie âme³⁵⁶ rentre dans son corps (zhen hun guishen 真魂归身), et la laisse grandir jusqu'à l'âge adulte et finir ses études. Elle a également ajouté que s'il veut persister, alors qu'il s'attache à elle-même (c'est à dire la Supérieure). L'animal Esprit-Immortel a été d'accord en répondant par l'affirmative de s'arrêter de posséder la fille et d'envisager de revenir sur elle après ses dix-huit ans. Dans une dernière étape, la Supérieure a tenu les mains de la fille, et a ensuite pressé l'intérieur de ses poignets en déclarant qu'il s'agit d'empreintes yin 國, sur la main droite, c'est l'empreinte céleste et sur la main gauche, c'est l'empreinte terrestre, et qu'elles resteront ineffaçables. Elle a aussi fait un massage à la fille sur la poitrine, la tête, dans le dos, ainsi que sur les jambes. Enfin, la Supérieure a expliqué au couple qu'il fallait faire deux rituels pour leur fille, qui devraient tous deux avoir lieu le 1er jour du mois lunaire prochain (La consultation a eu le 22e jour du mois) : le rituel chaodu en vue de l'apaisement des âmes des défunts, de même que le rituel d'offrande pour rembourser des dettes karmiques dit dabaozhai.\nAlors que les deux cas que nous venons d'exposer concernent des requérants, le troisième cas peut paraître un peu particulier dans la mesure où il est propre à l'expérience d'une moniale taoïste dénommée Wang Zongjie³⁵⁷ du temple Daode de ce réseau. Je l'ai rencontrée pour la première fois en juillet 2019 dans le bureau du temple Daode, tandis qu'elle n'était alors qu'une fidèle laïque en vêtements ordinaires, fréquentant régulièrement le temple Daode et y prenant part au travail pour y aider les moines taoïste. À travers nos quelques premiers\n\n<<< PAGE 294 >>>\n\néchanges de conversations, j'ai appris qu'elle était habitante du district de banlieue dénommé Meilisi 梅里斯区³⁵⁸. Elle était de l'ethnie Han, âgée de près de soixante ans, et avait travaillé avant dans le secteur de l'assurance. Elle avait été médium pendant quelques années, et elle avait deux fils qui étaient tous les deux adultes. Par la suite, vers le mois d'octobre 2020, au milieu de ma deuxième période d'enquête ethnographique, je l'ai revue au temple Daode, elle y était hébergée et y est restée pendant plus d'une semaine, avant de rentrer chez elle pour quelques temps. Quand elle est revenue en ville et au temple Daode en novembre 2020, elle y est entrée en religion et porte depuis la longue robe taoïste de couleur bleu foncé et la coiffe de couleur noire.\nDepuis son intégration à la vie monacale au monastère taoïste, elle vit et dort au temple, et participe aux consultations, au travail du temple. Dans son récit, elle s'est livrée à moi en décrivant ce qui s'était produit en elle il y a une dizaine d'années déjà :\n« ... Quand je suis dans cet état-là (en transe), je ne suis plus en possession de mon corps, la durée de cet état est toutefois incertaine, quand ça m'arrive, je ne m'appartiens plus à moi-même, ce dont je parle n'est pas de moi non plus, aussi suis-je privée du contrôle sur moi-même, mais asservie aux autres (aux animaux Esprits-Immortels), ça peut se passer tous les jours, et me faire chanter ou danser, alors que je ne savais pas du tout danser moi-même jusque-là. Et je ne me rappelle jamais ce que j'ai dit ou ce que j'ai fait, ce sont toujours les autres personnes qui me le racontent après. En outre, je sais qu'il m'est aussi arrivé de changer d'âme deux ou trois fois, ça veut dire que l'âme n'est plus celle que l'on avait auparavant. La personne reste la même, mais c'est l'esprit qui n'est plus tel qu'il était avant. La première fois c'était au printemps de l'année 2014, et c'est arrivé à nouveau par la suite une autre fois, je m'en souviens. En fait, j'ai besoin de me reposer quand ça (le changement d'âme) commence, une ou deux ou trois heures de repos. J'ai dû annoncer aux autres personnes (qui étaient auprès de moi) que j'allais dormir et que pendant que je dormirai, personne ne devrait me faire bouger. Ça se terminerait quand je serai réveillée. Le reste, je ne sais pas trop non plus. D'ailleurs, quand je suis possédée/en transe, je ne peux qu'être un otage, hors de contrôle. Maintenant encore, les animaux Esprits-Immortels s'attachent souvent à moi, ils viennent quand ils en ont besoin. Par exemple, dans le cas où un requérant rentre, et qu'il espère avoir une consultation. Ensuite, si l'on parle de chuma (je reviendrai plus tard sur ce terme qui désigne en résumé le fait de\n\n<<< PAGE 295 >>>\n\ndevenir médium en étant possédé par les animaux Esprits-Immortels) alors on est dans la vie séculière, tandis qu'ici au sein du temple, nous devons pratiquer le perfectionnement de soi selon la voie du taoïsme, le Grand Dao, ce sont deux notions distinctes l'une de l'autre. Tout cela ne peut être pris que pour des histoires folkloriques *minjian gushi* 民间故事, si on en parle, ce n'est qu'une simple histoire aux yeux des gens qui l'écoutent, mais cela ne suffit pas pour qu'ils comprennent sans l'avoir eux-mêmes expérimenté. Il est convenable de promouvoir et de développer la loi liturgique du taoïsme, mais pour ce qui se rapporte à la sorcellerie *wushu* 巫术 ou aux histoires folkloriques, ce sont des choses qui ne doivent pas apparaître au premier plan, ni figurer dans le taoïsme. »³⁵⁹\n(...我的身体就不归我使用了，这个持续的时间是不确定的，那个时候我就不归自己管了，自己说什么话也管不了，你也控制不了自己了，被别人控制了，每天都有，说唱歌就唱歌，说跳舞就跳舞，我本身也不会跳舞。但都是过后别人说我做过什么我才知道，我自己不记得。我知道我还换过两、三次神识，换了就是不是以前的那个灵魂了，人还是这个人，但思想不是原来的了思想了，14年春天一次，后来又一次，就是我要休息，一个小时或两、三小时，我休息的时候任何人不要碰我动我，等我醒过来时就完事了，其他别的不知道。另外，被附体时，什么事情都不由得自己，控制不了。现在，上身也还是频繁，要是有事人家就来，没事就不来。比方说来人了，这人要说说事的时候。出马，是指在家，在这里来说，是修大道，修道，这是两个概念。这些只能说是民间故事，没有经历过的人，他/她不会感受到。弘扬道法可以，但那些巫术、民间故事拿不到台面的，在道教里面是说不出去的。)\n\n<<< PAGE 296 >>>\n\nFigure 5 : La moniale Wang Zongjie participe au rituel d'apaisement des âmes *chaodu* au temple Daode, en mars 2021. Nous la voyons introduire le bâton dans le fourneau à chasser les calamités pour que les cendres soient complètement brûlées.\nAvant d'avancer dans l'analyse de ce cas, je souligne que deux moniales de ces temples en réseau, l'une de plus de soixante ans, l'autre une vingtaine d'années, ont respectivement utilisé l'une après l'autre le terme « chamanisme » ou « la culture chamanique » *saman wenhua* 萨满文化, dans des discussions avec moi au sujet des animaux Esprits-Immortels qui s'accrochent aux humains. La plus âgée a expliqué que dans la région du nord-est de la Chine, les animaux Esprits-Immortels sont très répandus, et que depuis que les immigrants Han qui sont venus en masse par le passé dans ce territoire relativement vaste, pour beaucoup en provenance des provinces du Hebei et du Shandong, ces croyances se sont répandues parmi eux aussi. Le nombre des unions entre les Hans et les populations indigènes classées à notre époque contemporaine dans la catégorie des « minorités ethniques nationales » *Shaoshu minzu* est élevé. Parmi les peuples locaux, nous comptons notamment les populations indigènes toungouses dont les Daurs, et les Mandchous, les Évenks, ainsi que les Mongols, et les Han qui aujourd'hui y sont majoritaires. Durant mes observations, le thème du « chamanisme » est revenu souvent, et avant tout à travers les termes « des (animaux) Esprits-Immortels » *xianjia*, « des maîtres s'attachant aux corps humains » *shenshang de shifu*, « des Immortels terrestres » *dixian*, ou encore « des vieux maîtres » *lao xianjia* qui sont prononcés\n\n<<< PAGE 297 >>>\n\nle plus souvent en chinois par mes interlocuteurs³⁶⁰. Au sein de ces temples taoïstes en réseau,\nparfois les gens mentionnent également de façon plus simplifiée les animaux Esprits-\nImmortels en les appelant directement les Immortels xianjia, qui ne devront pas être\nconfondus avec les divinités et les dieux célestes shenxian du panthéon du taoïsme.\nDans les trois cas cités ci-dessus, nous pouvons tenir compte de certains points significatifs\nconstituant un aspect commun, parmi ces trois personnes susceptibles d'être possédées par les\nanimaux Esprits-Immortels, en plus d'être affectés et souvent troublés dans leur vie\nquotidienne par ces derniers. Personne ne semble disposé à vouloir faire la moindre\nconcession à ceux qui leur demandent de devenir une/un chamane, en revanche, ils s'en\npréoccupent tellement (pour la petite fille, il s'agit de ses parents) qu'ils cherchent à s'en\néloigner par tous les moyens à leur disposition. Tous se sont tournés vers les pratiques\ntaoïstes. En outre, il y a un terme qui attire notre attention : la maladie. Le don pour\ncommuniquer avec les animaux Esprits-Immortels peut être désigné tant comme des «\naffinités prédestinées » yuanfen, que comme une sorte de maladie, quelle que soit sa nature,\nhéréditaire ou survenue inopinément dans la vie. Or, à travers certains traits inclus dans ces\nquelques exemples typiques, il apparaît que ce sont pour beaucoup des maux qui entrent dans\nla catégorie vernaculaire des « maladies invisibles » xubing dont les gens parlent. Vu que les\n« maladies invisibles » peuvent être provoquées par de multiples causes selon les « examens\n» effectués par les maîtres et les moines taoïstes au cours des consultations, par conséquent,\nici je voudrais surtout centrer mon propos sur la description et l'analyse des manifestations se\nrapportant à la croyance en des animaux Esprits-Immortels dans la sphère des temples\ntaoïstes. J'ai constaté quelques fois qu'il y a des requérants qui commencent, pour décrire ce\nqui leur est arrivé, par dire une formule globalement identique : « Je ne suis pas en bonne\nsanté depuis un moment, mais mais à l'hôpital, aucun docteur n'a trouvé ce que j'avais. » (身\n体一直不太好,但到医院也查不出来。) Ces symptômes des « maladies invisibles »\ndéclarés en rapport avec les animaux Esprits-Immortels peuvent respectivement se traduire\npar des douleurs étranges sur le corps de la personne possédée, des vomissements, une\nsensation de froid dans le dos, des membres qui deviennent brutalement immobiles, ou des\ncomportements hors du commun, tels que pleurer ou rire aux éclats sans pouvoir se contrôler,\n\n<<< PAGE 298 >>>\n\nchanter et danser (comme ce que la moniale mentionnée dans le troisième cas a vécu), être\ncapable de communiquer avec « quelqu’un » dans une langue incompréhensible, se mettre\nsoudainement à boire de l’alcool alors que la personne n’en boit pas d’habitude, ou encore,\nles personnes concernées déclarent qu’elles font de temps à autre des rêves qui leur semblent\ninitiatiques (Je donnerai un exemple ci-après). Ensuite, au sein des temples taoïstes, les\nrequérants présumés possédés par les animaux Esprits-Immortels se voient souvent apaisés\naprès les consultations avec les officiants taoïstes, et les pratiques religieuses effectuées par\nces derniers. Et ce, d’autant plus que parmi les requérants concernés, certains étaient sortis\ndes hôpitaux inquiets et déçus de ne pas avoir eu de résultat, mais que d’autres avaient pu être\npris par les hôpitaux ordinaires pour des personnes souffrant de problèmes psychologiques et\nautres paranoïaques caractérisés par des troubles mentaux. De plus, le regard des gens\nordinaires au sein de la société n’est pas toujours facile. Par exemple, dans une discussion\navec le propriétaire de deux boutiques d’artisanat *gongyipin dian* 工艺品店 (où on peut\ntrouver notamment des statues de divinités et des objets rituels, tels que les monnaies\nd’offrande en lingot d’or en papier) situées dans le quartier où se trouve le temple Daode³⁶¹,\nqui se présente lui-même comme un spécialiste en géomancie *fengshui* 风水 et du *Classique\ndes changements* Yi jing 易经, qui se dit aussi membre du parti communiste chinois et\ndiplômé en sociologie, j’ai relevé que quand il a évoqué la communauté des médiums dont\nles animaux Esprits-Immortels sont prétendus s’emparer, il les a qualifiés « d’escrocs » *pianzi*\nfrauds avec plus ou moins un certain mépris en ajoutant qu’ils sont interdits depuis les années\n1960 par le pouvoir en place, par conséquent ceux qui surgissent ces dernières années ne sont\npour la plupart que des imposteurs, et que beaucoup d’entre eux ont déjà été arrêtés par les\nforces de l’ordre locales, de même qu’il a souligné plusieurs fois qu’il ne s’agit que de\nsuperstitions quand il est question des animaux Esprits-Immortels. Cette conception rappelle\nque durant le temps de la Révolution Culturelle, le culte de Mao arrivait en tête, alors que\nd’autres croyances populaires se sont vues réduites au rang des « ennemis de classe » :\n\n<<< PAGE 299 >>>\n\n« ... en 1962, Mao appela à l'extension et à l'approfondissement de la lutte des classes, les questions religieuses en vinrent à être considérées comme des questions de lutte et de conscience de classe... Dans le même temps, les ennemis de classe étaient combattus avec une virulence accrue, en s'appuyant sur l'imaginaire de la démonologie chinoise - ils étaient étiquetés comme ' démons bœufs et esprits serpents niu gui she shen 牛鬼蛇神'... »³⁶²\nCependant, dans une de ses boutiques d'artisanat, nous constatons qu'il y a sur les étagères certains objets se rapportant au culte des animaux Esprits-Immortels, tels que des petites statues de la Mère Noire, ou encore de petits sachets en papier sur lesquels nous voyons par exemple les termes suivants : le putois immortel huangxian, le serpent immortel changxian etc. Le serveur employé dans la boutique, qui se présente aussi comme le disciple de ce propriétaire, m'a brièvement indiqué que dans sa propre famille (la famille de ce serveur lui-même), ce don existe aussi, avec notamment les renards et les putois immortels. Son arrière-grand-mère était chamane, puis son père, et il parle de ces éléments comme relevant d'une sorte de chamanisme local : le chamanisme du nord-est dongbei saman 东北萨满. En réalité, bien que ma recherche ethnographique ne se soit pas déroulée principalement dans la communauté des personnes qui « voient les choses des autres » en étant possédés par les animaux Esprits-Immortels, j'ai discerné à travers des rencontres que cette communauté ne fonctionne pas de façon unanime: beaucoup d'entre eux travaillent discrètement pour éviter d'être ciblés par les autorités, et parmi eux certains sont reconnus comme « compétents » par leurs propres requérants qui les présentent ensuite à d'autres qui éprouvent le besoin de les consulter. Cependant, il existe aussi celles et ceux qui peuvent accueillir directement les clients dans une boutique, qui peut être nommée par exemple « XXX Atelier de géomancie » ou « XXX Boutique d'artisanat » etc. Dans ce cas-là, certains propriétaires sont au contraire « autorisés et protégés » par les autorités pour avoir une bonne relation avec ces dernières, et donc bénéficient d'une faveur accordée par ces personnages haut placés. Tel est le cas d'un jeune médium local que je voyais parfois venir aider les moines dans le temple Guandi en tant que disciple laïc du temple, il a aussi un nom taoïste et a ouvert un tel atelier de\n\n<<< PAGE 300 >>>\n\ngéomancie. Dans notre discussion, il a décrit son lieu de travail comme un endroit « où on trouve de l'énergie positive »³⁶³ (主要是正能量的).\nDans le cadre de ces temples taoïstes en réseau au contraire, malgré que les moniales et les moines privilégient dans tous les cas le discours taoïste, et que quelques fois certains auraient tendance à reléguer les expériences en question dans la catégorie des histoires folkloriques, ce qui est relatif aux animaux Esprits-Immortels ne s'avère pas incompatible avec le taoïsme local contrairement à ce que nous pourrions imaginer ou à ce que l'on aurait pu croire en observant le taoïsme au sens traditionnel du terme. D'après ce que j'ai pu voir, il n'y a pas d'antagonisme qui émerge ; les modes d'organisation et de fonctionnement des animaux Esprits-Immortels et les pratiques taoïstes s'adaptent mutuellement.\nLes éléments relevant du culte des animaux Esprits-Immortels ne sont pas écartés du milieu taoïste local, au contraire, le système des temples taoïstes fonctionnant en réseau aurait tendance à faire d'eux des composantes contribuant au développement du taoïsme et à l'élargissement des gammes d'utilisation des pratiques taoïstes à l'échelle régionale. En plus, je me suis rendue compte dans mes enquêtes ethnographiques qu'en dehors des temples taoïstes locaux, les médiums (dont beaucoup exercent assez discrètement pour ne pas attirer trop l'attention) considérés comme des guérisseurs n'ont cependant jamais été déconsidérés aux yeux des requérants, et sont même au contraire souvent sollicités en premier lieu, en particulier dans la banlieue ou dans les comtés où il n'y a pas forcément de monastères taoïstes. Mais ce qui est curieux, c'est qu'en réalité « l'habit fait le moine » pour de nombreux requérants : les temples et les moniales et moines taoïstes en costume religieux sont reconnus comme ayant un statut plus formel et étant une communauté bénéficiant de plus d'autorité que les « médiums populaires », même si parfois les requérants sont portés à penser aux maîtres taoïstes en guise de dernier recours³⁶⁴. Cette remarque permet de supposer qu'à l'issu de la Révolution culturelle, en dépit de la reconstruction massive des lieux de culte, de la réhabilitation des spécialistes religieux, et de l'assouplissement du contrôle de la part des autorités locales sur les temples tant taoïstes que bouddhiques à l'ère post-maoïste, les pratiques et les cultes populaires restent quand-même souvent dans une position subalterne, et sont cantonnés au champs des pratiques d'ordre superstitieux. En outre, j'ai mentionné plus\n\n<<< PAGE 301 >>>\n\nhaut que parfois nous pouvons apercevoir des médiums locaux rendre visite aux moines taoïstes avec qui ils s'entendent comme amis proches, et dont certains prennent part à des travaux dans les temples. Cependant il arrive aussi de temps à autre que l'on puissevoir entrer dans ces temples des chamanes guérisseurs dont les techniques pour « voir les choses des autres » dépendent des animaux Esprits-Immortels possédant leur corps et leur esprit, mais qui ont une autre particularité, c'est d'y amener leurs propres requérants. Des fois ces chamanes les accompagnent pour faire des vœux dans ces temples, en brûlant de l'encens et se prosternant devant les statues des divinités, mais leur venue a plus souvent pour but de solliciter les services rituels des officiants taoïstes pour des besoins propres aux requérants des chamanes, par exemple dans le cas où l'envoi de requêtes à certaines divinités taoïstes est requis, ou pour la consécration de nouvelles statues de divinités. Par conséquent, ces chamanes sont aussi « consultants » de leurs clients que requérants des temples taoïstes. De plus, ces temples taoïstes se proposent également d'être des lieux capables d'accueillir toutes sortes de requérants, et parmi eux la communauté de celles et ceux marqués par le don pour communiquer avec les animaux Esprits-Immortels. Dans cet espace public animé par les temples taoïstes, la confiance de cette communauté de requérants se crée vis-à-vis des maîtres taoïstes et des divinités du panthéon taoïste³⁶⁵, à mesure que ces temples taoïstes en réseau œuvrent à l'adaptation et à l'évolution des normes, des services rituels et des pratiques religieuses, pour mieux s'accommoder aux besoins réels des requérants et aux particularités du paysage religieux local.\n\n<<< PAGE 302 >>>\n\n## 7.2 Devenir chamane à travers « une démarche administrative taoïste » : Un cas d'étude\nÀ propos de certaines personnes qui parviennent à maîtriser les animaux Esprits-Immortels supposés s'attacher sur eux, elles peuvent désormais devenir officiellement chamanes et guérir les « maladies invisibles » des autres par la transe et se laisser posséder par les animaux Esprits-Immortels en question. Dans ce cas, ces personnes sont localement appelées *chuma xian* 出马仙, *daxian* 大仙, ou *chuma dizi* 出马弟子³⁶⁶, ou encore *kanshide* 看事的³⁶⁷. J'ai interrogé certains de mes interlocuteurs sur ce qu'ils entendent par le terme *chuma*, et des éclaircissements intéressants sont respectivement apportés par une jeune manucure qui a aussi le don de communiquer avec les animaux Esprits-Immortels (je décrirai son cas au fil de ce chapitre) et le moine du temple Daode. La première m'a expliqué qu'à son avis, *chuma* peut se traduire par un acte accompli par un certain groupe de personnes qui servent de médiateurs en vue de relier deux univers, alors que selon le moine, la réponse paraît encore plus concise et directe, puisqu'il a conclu ainsi : « *chuma*, c'est être possédés (par les animaux Esprits-Immortels)» (出马就是附体). Dans son article destiné à présenter quelques traits du chamanisme notamment chez les Daurs, l'un des peuples indigènes locaux, l'historien M. Zhang Shousheng a également cité plusieurs lexiques qui font écho au terme *chuma*.\n« ... Jusqu'à la dynastie des Qing, le chamanisme se transmit de génération en génération chez les peuples installés à Qiqihar, tels que les Daurs, les Évenques, les Mandchous, et les Mongols etc. Les chamanes ne disparurent qu'à partir des années 1950... Le chamanisme existe depuis longtemps au sein des sociétés indigènes du Heilongjiang, il domina le monde spirituel des gens dans la vie sociale, en particulier dans les régions rurales... Ce sont toujours des gens dans un état de santé vulnérable qui peuvent assumer le rôle de chamanes. Après\n\n<<< PAGE 303 >>>\n\nune révélation faite par un(e) chamane (lui indiquant qu'il/elle a aussi le don de devenir chamane), la personne concernée ne pourra \" devenir chamane \" qu'après que lui-même/ elle-même, et sa famille aient donné leur accord. »³⁶⁸\nLe terme qu'il a utilisé dans cet article est *chuman* 出满, puis lors d'une discussion avec ce chercheur, il a mentionné qu'en réalité le fait de devenir chamane peut aussi être nommé *chūmǎ*, et que de nos jours, il est devenu usuel de parler de *chūmǎ* parmi le peuple. Selon l'explication du terme dans le dictionnaire chinois³⁶⁹, *chūmǎ* contient deux significations : premièrement et initialement, il désigne les soldats qui se mettent au combat, alors qu'aujourd'hui le terme se rapporte plutôt à la personne qui agit en premier. Deuxièmement, ce vocabulaire signifie aussi littéralement « aller visiter les malades », « fournir des soins médicaux ». Par conséquent, nous pouvons supposer que l'expression orale qu'est *chūmǎ* faisant habituellement l'objet du discours des requérants en matière d'animaux Esprits-Immortels prend le deuxième sens du terme. Le fidèle M. Guan Hui a plusieurs fois évoqué que par le passé, le chamanisme que pratiquent les peuples indigènes du nord tel que les Mandchous n'est pas identique à ce que l'on appelle localement *chuma* de façon plus générale, tout en expliquant simplement que c'est sur l'animisme *wanwu youling* 万物有灵 que reposa le chamanisme des Mandchous auparavant, et que les êtres auxquels on voue un culte ne se limitent pas aux quatre ou cinq sortes d'animaux tels que les renards, les putois, et les serpents immortels en particulier. Sur la base de mes observations et des expressions locales telles que « la culture chamanique » *saman wenhua* 萨满文化, ou le chamanisme du nord-est *dongbei saman* 东北萨满, utilisées souvent par les gens comme une sorte de concept d'« Experience-near»³⁷⁰ mentionné par Clifford Geertz, auquel correspondent dans une certaine manière les cas que j'ai constatés dans mes enquêtes, je me permets d'employer plutôt l'expression « le chamanisme à caractère local ».\n\n<<< PAGE 304 >>>\n\nAinsi, ces temples taoïstes locaux proposent une sorte de service rituel visant à permettre aux requérants sur le point de devenir médiums *chuma*, jadis souvent qualifiées de « malades » à travers un tel rituel de passer à l'étape supérieure en se transformant eux-mêmes en « disciples des animaux Esprits-Immortels chargés de guérir les maladies invisibles ». Pour cela, il faut accomplir « une démarche administrative taoïste » nommée *qingling* 请令, littéralement la « demande de mandat céleste », qui doit également se faire à travers le rituel d'offrande pour rembourser des dettes karmiques dit *dabaozhai* dont le prix est fixé à 1500 yuans par requérant. Dans un cas typique observé dans le temple Guandi au début du printemps 2021, la requérante est une jeune femme arrivée au temple en compagnie de sa famille, ils étaient cinq ou six personnes. C'était le 19 mars, il faisait entre -3 °C et 7 °C, les requérants portaient encore des vêtements chauds. Dès que cette famille est entrée dans le bureau du temple, ils ont précisé que leur visite avait pour objectif de faire la « demande de mandat céleste » *qingling* afin de pouvoir officiellement régler les problèmes de *chuma*. Originaires de la province du Shandong, ils sont venus par l'entremise de quelqu'un d'autre, et ont déjà contacté par avance la Supérieure qui était absente lors de leur visite. C'était le maître Zhao Zongqing qui les a reçus, vu que cette famille devait retourner dans le Shandong le jour même dans l'après-midi, et qu'ils souhaitaient aussi voir les rituels de leurs propres yeux, le maître Zhao a donc téléphoné à sa maître pour discuter avec elle. La Supérieure leur a prescrit un rituel divisé en deux parties : pour l'ère partie, un rituel d'envoi de requête (au contenu de laquelle e n'ai pas eu accès) destinée au Vénérable céleste de la puissance divine et du tonnerre Shenwei yuanzhen tianzun 神威远震天尊, autrement dit Guandi « Empereur Guan », et accompagné aussi d'une « montagne d'encens » *xiangshan* 香山 équivalent à 330 yuans, ainsi que de lingots d'or en papier et de quelques liasses de papiers jaunes servant de monnaies d'offrande. La femme s'est agenouillée, et tenait l'enveloppe jaune dans laquelle la requête avait été placée, le maître Zhao s'est mis à battre le poisson de bois en récitant le *Classique merveilleux du Sceau du Cœur du Suprême Empereur de Jade* Wushang yuhuang xinyin miaojing 无上玉皇心印妙经. Et pour la 2ème partie, la « formalité administrative » proprement dite qu'est la « demande de mandat céleste » par le rituel d'offrande (car il existe plusieurs types de rituels d'offrande). La 1ère partie devra se faire ce jour-là, et la 2ème partie une semaine après, le 15e jour de ce mois lunaire là, avec des textes de requêtes rédigés sur douze sachets en papier beige contenant des lingots d'or en papier en guise de rituel d'offrande. Ce jour-là, lorsque le premier rituel pour cette femme était en cours, j'ai pu\n\n<<< PAGE 305 >>>\n\nrapidement échanger avec quelqu'un de la famille de cette jeune femme. Un monsieur âgé\nqui s'est contenté d'assister au 1er rituel m'a appris que le sanctuaire domestique tangkou\nvenait d'être établi pour elle le jour précédent. Les animaux Esprits-Immortels qui y sont\nvénérés sont respectivement les renards immortels, les putois immortels, les serpents\nimmortels, et les pythons immortels (hu, huang, chang, mang). La Supérieure a envoyé le\nlendemain à une de ses disciples la photo du texte rituel à remplir sur les douze sacs beiges en\npapier voués à la « demande de mandat céleste » de cette femme. Les maîtres du bureau\nétaient très occupés, l'une d'entre elle n'avait le temps que d'en remplir le premier, par\nconséquent, c'est moi qui ai terminé l'écriture sur les onze sacs restants avec un stylo noir en\ncopiant le contenu déjà écrit sur le 1er sac. Le rituel de la « demande de mandat céleste »\nn'est toutefois pas immuable, et celui-ci paraît particulier par rapport à ceux du même type\nétudié au temple Daode de ce réseau, dans la mesure où on recourt rarement aux « montagnes\nd'encens ». Pour le cas de cette jeune requérante, vu que toute la famille devait partir le jour\nmême, et ne pouvait pas revenir assister à la 2ème par
