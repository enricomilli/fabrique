tie du rituel, une telle montagne\nd'encens, de même que des lingots d'or en papier et des liasses de papier jaune incarnent\ndonc plutôt une pratique qui offre un « raccourci rituel » en cas d'urgence dont l'efficacité\nrituelle est tout de même assurée. Ainsi, à partir du moment où la première partie du rituel a\nété accomplie (par l'envoi de la requête et la montagne d'encens brûlée), elle est censée\nprochainement devenir médium en effectuant l'acte qui permet de devenir chuma (désignant\nfinalement selon les contextes les chamanes et leurs pratiques), et a désormais le droit de\nrégler les problèmes des autres, ainsi que de guérir les maladies invisibles en tant que\nguérisseuse. En revanche, il convient de mentionner ce que le moine Cheng du temple Daode\ncommenta en ce qui concerne ce groupe de personnes en question. Dans son récit, chaque\nindividu est unique, si bien que l'effet du rituel peut varier de personne en personne et que\ntout le monde n'est pas certain d'obtenir l'autorisation de sa « demande de mandat céleste ».\nIl peut aussi y avoir des disciples des animaux Esprits-Immortels qui peuvent procéder à la\nguérison des « maladies invisibles » et à la divination sans pour autant passer par la «\ndemande de mandat céleste ». La première partie du rituel sur laquelle s'appuie la famille de\ncette requérante prend son sens notamment dans la mesure où sa demande fut directement\ntransmise à des divinités taoïstes.\n\n<<< PAGE 306 >>>\n\nFigure 6 : Les maîtres taoïstes du temple Guandi réalisent la première partie du rituel de la « demande de mandat céleste » pour la jeune requérante.\n## 7.3 Quand la personne peut bien s'entendre avec son renard Esprit-Immortel: Un cas d'étude\nLes interactions avec les temples taoïstes ne sont pas exclusivement réservées à des requérants ayant le don de réagir aux animaux Esprits-Immortels ou à des futurs médiums, mais peuvent également se produire chez les médiums déjà en activité, dont de nombreux entretiennent des relations de natures diverses avec les moines taoïstes locaux, qu'ils soient amis, confrères, maîtres et disciples (je décrirai cette relation plus bas à propos d'un autre cas) ou requérants réguliers. Dans le cas suivant, il s'agit d'une consultation qui s'est déroulée dans le bureau du temple Guandi, accomplie par la Supérieure Wang Liyan elle-même de retour dans la ville. Le contenu de leur conversation laisse à penser que ce n'est pas la première fois que la Supérieure rencontre la requérante en question, une jeune femme qui paraît avoir une trentaine d'années venue en compagnie d'une autre femme. La Supérieure\n\n<<< PAGE 307 >>>\n\nWang semble connaître plus ou moins sa situation³⁷¹. En résumé, cette requérante est elle-même un médium, et a l'air d'accepter de l'être. C'est un renard Esprit-Immortel qui s'accroche à elle, et elle dit bien s'entendre avec lui, parvenant à « voir les choses des autres » assez favorablement, en se laissant posséder par le renard Esprit-Immortel. Le motif de sa visite au temple provient en réalité d'un embarras que dit avoir rencontré ce renard Esprit-Immortel qui s'attache à elle, si bien que le requérant principal est en fait le renard Esprit-Immortel lui-même, qui compte sur la Supérieure taoïste et se tourne vers elle quand il fait face à une difficulté. Pour cela, il a dû faire venir sa « disciple » au temple taoïste, c'est-à-dire cette jeune femme. Au tout début de la consultation, après avoir échangé quelques simples formules de politesse, la Supérieure a demandé en souriant à la jeune femme installée en face d'elle d'indiquer à son renard Esprit-Immortel de « remonter » shanglai 上来 (C'est le terme employé par la Supérieure dans cette circonstance en vue d'engager la communication avec le renard Esprit-Immortel de cette jeune femme.)\nLa transformation n'a pas tardé à se manifester, la jeune femme a été saisie d'un ou deux mouvements rapides et involontaires qui sont comme des rots, ensuite elle s'est mise à parler à la Supérieure Wang en chinois, avec une voix différente de celle qu'elle avait plus tôt, l'air sombre et grave. Une autre requérante plus âgée qui faisait la queue en se tenant debout à côté de moi a profité de ce moment pour me confirmer discrètement que c'était en fait le renard Esprit-Immortel qui venait de s'exprimer en s'adressant à la Supérieure Wang. Cependant, la jeune requérante a parlé si vite que je n'ai réussi à comprendre le sens de ses paroles qu'après que la Supérieure a résumé leur dialogue. La jeune médium (ou plutôt le renard Esprit-Immortel) a appris à la Supérieure Wang que les âmes de deux de ses ancêtres décédés issus de son groupe de filiation patrilatéral ne souhaitaient pas que le renard Esprit-Immortel continue à faire la pratique de soi en s'accrochant à cette femme (donc leur descendante) en faisant d'elle une médium. Les deux âmes mentionnées sont respectivement\n\n<<< PAGE 308 >>>\n\ncelle du frère cadet du grand-père paternel de cette jeune femme *niangjia erye* 娘家二爷³⁷²,\net celle de la femme de ce dernier *ernai* 二奶³⁷³. L'échange qui a suivi est le suivant³⁷⁴ :\nLa Supérieure : « D'accord, je comprends, c'est pas mal, pense à bien diriger XX (le nom de la requérante) désormais, la transmission est quasiment achevée, (le renard Esprit-Immortel) peut remonter à tout moment quand on le souhaite. Nous allons là-bas écrire le nom du frère cadet de ton grand-père paternel de ta famille d'origine pour le rituel d'apaisement des âmes, et connais-tu le nom de famille de sa femme? » (好的，知道啦，挺好的，好好带着 XX 吧，现在传得差不多了，说上来就上来了。去那边写，超度，把娘家的二爷名字写上，二奶的姓氏知道吗？)\nLa jeune femme : « Non, je n'en sais pas. » (不知道)\nLa Supérieure : « Alors dans cette circonstance, nous allons mettre la femme du frère cadet du grand-père du côté paternel, et le nom de famille du frère cadet de ton grand-père est X? Est-il le Beiwang 碑王, « le dirigeant de la stèle »³⁷⁵? » (不知道那就写堂二奶，这个二爷姓 X？是碑王？)\n\n<<< PAGE 309 >>>\n\nLa jeune femme : « Oui c'est ça, il a été médium (de son vivant), je ne suis pas certaine que sa femme le fût aussi, mais pour le frère cadet de mon grand-père paternel, j'en suis sûre. » (对，他以前是大仙，二奶会不会看我不知道，但二爷我知道)\nLa Supérieure : « Pas de souci, tu es pas mal maintenant, en plus, l'Esprit-Immortel (le renard Esprit-Immortel) de chez toi est aussi bienveillant. » (没事，你现在行了，你们家仙家也挺好的)\nLa jeune femme : « D'accord, c'est vrai que cela (mon état en transe) se stabilise beaucoup plus qu'auparavant, souhaitons que l'on puisse bien faire la pratique de soi alors³⁷⁶. » (嗯，现在比以前要稳好多了，好好修吧)\nLa Supérieure : « Les maîtres, autrement dit, ils sont les guides vous dirigeant sur le chemin du perfectionnement de soi, durant lequel, vous serez confrontés à bien des obstacles. » (师父嘛，就是导师，带领你们修行，修行的路上磨难挺多的。)\nMalgré que nous ne pouvons pas savoir si la requérante qui a fait l'objet de cette consultation exerce aussi une autre profession dans la vie, elle est dans tous les cas une médium différente de celles et ceux qui souhaitent davantage se décharger des affinités prédestinées avec les animaux Esprits-Immortels, dans la mesure où elle s'est rendue volontiers au temple taoïste en vue de délivrer son « maître » le renard Esprit-Immortel d'une entrave à la pratique de soi, laquelle étant supposée avoir été causée par les âmes de deux de ses ancêtres relativement éloignés. D'une part, visiblement, cette jeune femme s'est positionnée du côté de son renard Esprit-Immortel, et a accepté la proposition de faire le rituel d'apaisement tel que la Supérieure lui a prescrit : une pratique taoïste qui devrait permettre à ce renard Esprit-Immortel de s'attacher à la personne sans pour autant être bloqué par les ancêtres de cette dernière. D'autre part, pour ce qui est de cette moniale taoïste, elle a manifesté également une attitude plutôt non défavorable à l'égard tant de la présence de l'animal Esprit-Immortel sur\n\n<<< PAGE 310 >>>\n\nsa requérante que de sa possession. Ainsi, en tant que pratique taoïste, le sens du rituel d'apaisement des âmes s'élargit par rapport à de nombreuses situations dans lesquelles ce rituel s'applique comme un moyen visant à la délivrance des âmes en souffrance (en particulier celles des ancêtres), si bien que les descendants affectés peuvent également être libérés ensuite des infortunes qu'ils affrontent dans la vie. Tandis que dans le cas de cette jeune médium, c'est d'abord le renard Esprit-Immortel qu'elle considère comme son « maître » qui est devenu la cible des âmes sans que nous puissions en connaître la raison, et qui est censé pouvoir bénéficier de l'effet du rituel d'apaisement des âmes auquel seront soumis les deux ancêtres éloignés de l'individu qu'il possède. En outre, de ce que la Supérieure a commenté quant à ce renard Esprit-Immortel, « Il est bienveillant/ il est maître », nous apprenons que pour la Maître taoïste Wang Liyan, Supérieure de plusieurs temples taoïstes interrégionaux en réseau, ces animaux Esprits-Immortels se mobilisent en faveur d'une double pratique de soi qui profite tant à eux-mêmes qu'à leurs disciples qui sont des humains. Cette conception des animaux Esprits-Immortels s'apparente aussi à deux autres convictions très intéressantes du moine Cheng qui semblent être analogues d'une certaine manière : à son avis, ces animaux Esprits-Immortels invisibles aux yeux des gens ordinaires auraient toutefois pu être blessés par les objets visibles des humains. Par exemple, selon lui, en premier lieu, en cas de déménagements suivis d'installations, il devrait être interdit de parsemer des grains et des céréales sur le sol pour purifier la maison à des fins d'expulsion des esprits maléfiques éventuels comme le font certains maîtres dans le sud du pays, car un tel comportement risque de blesser les animaux Esprits-Immortels qui demeurent peut-être à l'intérieur. En second lieu, il faut éviter de choisir de se faire soigner par l'acupuncture pour celles et ceux sur qui les animaux Esprits-Immortels s'attachent, car ce serait au péril de ces derniers, cette idée peut nous rappeler ce que Pierre Bourdieu précisait :\n> « [...] Tous les ordres sociaux tirent systématiquement parti de la disposition du corps et du langage à fonctionner comme dépôts de pensées différées, qui pourront être déclenchées à distance et à retardement, par le simple fait de replacer le corps dans une posture globale propre à évoquer les sentiments et les pensées qui lui sont associés... »³⁷⁷\nPar conséquent, la croyance en des animaux Esprits-Immortels xianjia 仙家 s'avère particulièrement impactante dans la gestion du corps, si bien que les intérêts des animaux Esprits-Immortels précèdent les besoins des humains, et que le corps humain n'est plus\n\n<<< PAGE 311 >>>\n\nsupposé n'être qu'à la disposition de soi-même, dans la mesure où la présence des animaux Esprits-Immortels peut intervenir dans la vie quotidienne de certains, en leur faisant modifier le choix de leurs propres traitements médicaux afin que ceux-ci s'adaptent de façon privilégiée à l'existence des animaux Esprits-Immortels. Ainsi pour mieux protéger ces derniers et exclure tout risque de les offenser, il peut arriver aux gens concernés de refuser résolument toute proposition d'acupuncture en tant que soin traditionnel de la médecine chinoise même si jugé nécessaire et fort recommandé par les médecins.\nD'autre part, dans le cas de cette jeune médium décrite plus haut, le don provient de la parenté, et il est typiquement héréditaire, même s'il vient d'un lignage éloigné, et se transmet quels que soient le sexe et l'âge des personnes, d'où une incertitude quant à celui ou celle qui pourrait être sélectionné(e) parmi les descendants si l'un des ancêtres fut médium de son vivant en étant possédé par les animaux Esprits-Immortels. D'ailleurs, en plus de la base des ancêtres, les gens considèrent que les affinités prédestinées avec les animaux Esprits-Immortels peuvent également se nouer et se multiplier par alliance.\nEn avril 2021, j'ai rencontré une jeune femme nommée Mme K sur le Mont Luotong situé dans la province du Jilin, lorsque j'y suis allée observer quelques rituels tenus au temple Sanqing. Cette femme est une habitante locale du Jilin, elle est aussi disciple laïque du maître Zhao Zongqing décrit antérieurement. Lors d'une discussion succincte, elle m'a appris que le don qu'elle a avec les animaux Esprits-Immortels accrochés sur son corps est issu tant du sanctuaire privé de sa grand-mère paternelle que de celui de sa belle-mère (la mère de son mari), mais elle n'avait pas encore réussi à percevoir de quels animaux Esprits-Immortels s'agissait-il exactement. Elle a ajouté en décrivant les moments où le don se manifestait comme le fait d'« avoir une crise (maladie) » fanbing 犯病, que quand cela lui était arrivé la dernière fois, elle avait été amenée à pleurer involontairement, elle s'était sentie nauséeuse puis avait vomi, avant de se mettre rire aux éclats, sans parvenir à se contrôler. De plus elle ne pouvait plus mobiliser ses jambes ni ses mains comme si elles étaient attachées, et elle éprouvait aussi des signes de nervosité quand elle restait toute seule. (Ses propos originaux sont les suivants: 我身上有我奶奶家的一堂仙, 也有我婆婆家一堂, 具体现在没有啥感 应是哪位仙家。前段时间犯病的时候就哭, 恶心、吐, 后来就大笑, 再就是手腿都捆 着动不了。)\n\n<<< PAGE 312 >>>\n\nAu début, c'était par l'entremise du maître Zhao que je l'ai connue, comme ce moine taoïste est initialement entré en religion au temple Sanqing sur le Mont Luotong, il y a vécu près de sept ans avant de rejoindre le temple Guandi à Qiqihar au Heilongjiang, alors que Mme K vit dans un comté dénommé Liuhe proche du Mont Luotong dans le Jilin. Elle m'indiquait qu'elle se contentait de venir au temple, voire d'y passer quelques nuits, et qu'elle pensait que le fait de loger au temple peut être favorable à son état de santé, car selon ses propres termes, elle n'est « pas en très bonne santé » (身体不太好). Quand je l'ai interrogée sur ce que ça pouvait être plus précisément, voici ce qu'elle a clarifié :\n« En fait, je n'aurais pas cru (aux animaux Esprits-Immortels) si je n'étais pas tombée malade, ce n'est que maintenant que je les reconnais, je n'ai pas eu beaucoup de chance ces dernières années, je suis « malade » depuis l'an dernier. Les hôpitaux m'ont confirmé que je suis en bonne santé, mais moi je souffre mortellement. Ensuite, deux médiums que j'ai trouvés m'ont appris qu'il faudrait faire un sanctuaire privé (où devra être vénérée la liste sur laquelle figurent les noms des animaux Esprits-Immortels), alors que moi je ne croyais pas, et j'en souffre encore maintenant. Bon, laissons plutôt la tendance naturelle suivre son cours, on verra, si jamais le jour où je serai obligée de me mettre sur ce chemin (de devenir médium à mon tour) arrivera, alors j'accepterais. Sinon comment devrais-je agir ? Il faut affronter ce qui arrive. Ma grand-mère était médium de son vivant. Par la suite, (l'animal Esprit-Immortel en question) a trouvé ma mère, mais ma mère l'a refusé, puis il a choisi un de mes oncles paternels, en fait ils sont sept au total, mon père est l'enfant benjamin de la famille, c'était mon quatrième oncle qui a été ciblé, cependant, il pensait qu'en tant qu'un homme, il allait se faire moquer s'il acceptait (d'être un médium) et de guérir les maladies (surtout invisibles) des autres³⁷⁸, par conséquent, (l'animal Esprit-Immortel) a quitté sa famille, et moi je suis devenue sa cible à mon tour. Notre famille a le don d'être médium (le terme prononcé par Mme K est *laoxianggen* 老香根, signifiant littéralement « la vieille racine de l'encens ». Je tiens à souligner que c'était la première fois que j'ai entendu cette appellation dans mes enquêtes, les termes décrivant des médiums et des chamanes de cette sorte dans la province du Heilongjiang que j'entendais le plus souvent sont plutôt *daxian* 大仙, *chumaxian* 出马仙, ou *chuma dizi* 出马弟子). De mes connaissances, jusqu'à moi, c'est la sixième personne héritant d'un tel don des ancêtres. Moi j'ai ce type d'affinités prédestinées. En plus, j'étudie le bouddhisme et le taoïsme simultanément, j'ai également de très profondes affinités prédestinées avec le bouddhisme, comme j'aperçois à chaque fois des encensoirs ou des statues de bouddhas dans mes rêves. ) »\n\n<<< PAGE 313 >>>\n\n(说白了如果我没病的话,也不是很信这个,到现在了才认可,我就是近几年很不顺,去年就一直有病,去医院看就是没病,折腾得我要命,后来找了两个看这方面的说我必须立堂口。我没信。后来折腾到现在。一切顺其自然吧,等等看到时候如果我必须走这个道了,那我就认可吧。能怎么办?来了就必须面对。我奶奶是老香根,她去世了。然后(仙家)就找我妈,但我妈没干,后来就找我一个大爷,我爸他们一共七个,我爸是最小的,找的是我四大爷,结果我四大爷他认为他一个男的给人看病会让人笑话,于是它(仙家)就不在他家待了,就来找我了,我们家是老香根。要是从我知道的情况下,找到我是第六个人了,从祖辈传下来的。我有这个缘分。我是佛道双修的,我佛缘也特别深,每次做梦,都能梦到香碗、佛像啊这些。)\n## 7.4 Les animaux Esprits-Immortels et l'être humain vivent ensemble et s'attachent l'un à l'autre: Une jeune manucure et ses « vieux animaux Esprits-Immortels»\nDans le cas précédemment mentionné, en raison de la présence du lien voué aux animaux Esprits-Immortels, Mme K s'est tournée vers le taoïsme et/ou le bouddhisme, et est notamment devenue une disciple laïque du maître taoïste Zhao Zongqing, mais elle n'est pas l'unique disciple de ce dernier. Dans cette sous-section, il convient de mettre l'accent sur une autre de ses disciples laïcs, qui considère que sa vie est également très marquée par les animaux Esprits-Immortels, et qui tient le maître Zhao en grande estime. Son récit devra permettre d'interpréter plus avant les caractéristiques des animaux Esprits-Immortels telles qu'elles sont conçues, ainsi que les relations entre ces disciples laïcs et les officiants taoïstes locaux, autour des expériences relevant des animaux Esprits-Immortels. Cette jeune femme, née dans les années quatre-vingt, est âgée de trente-huit ans, maisna l'air d'avoir qu'une vingtaine d'années. Elle habite à Harbin, la capitale provinciale actuelle du Heilongjiang, à une heure de train de Qiqihar. C'était dans un train en direction de la province du Jilin où je\n\n<<< PAGE 314 >>>\n\nme rendais pour assister aux rituels qui devront avoir lieu sur le Mont Luotong que je l'ai rencontrée, nous étions assis ensemble tous les trois, avec le maître Zhao qui serait en charge des rituels comme maître de cérémonies. Elle travaille en tant que manucure dans un petit institut de beauté décoré à la mode, qu'elle a ouvert en s'étant associée avec quelques autres collaborateurs il y a quelques années. L'établissement est situé à l'intérieur d'un centre commercial urbain en vue de pouvoir attirer des clientes pendant qu'elles font les magasins.\nDans leur atelier, chaque manucure et esthéticien a son propre surnom artistique yiming 艺名, et le sien est Christal. Par le passé, elle a suivi des formations de beauté à Tokyo, au Japon, après avoir reçu une bourse grâce aux motifs qu'elle a conçus et a dessinés elle-même, et elle s'y rendait régulièrement pour se perfectionner avant la crise sanitaire du Covid-19. Dans cette partie, le cas de la jeune manucure Mme Christal, décrit et analysé, rapporte également nos différentes conversations en face à face et certaines discussions que nous avons eues en ligne, tantôt par écrit, tantôt par messages vocaux, que j'ai transcrites pour faciliter la lecture.\n« [...] Depuis mon plus jeune âge, je pouvais déjà souvent apercevoir des choses invisibles pour les autres, tels que les animaux inconnus. Quand j'étais petite, un jour, mes parents et moi sommes allés visiter la Tour commémorative de la défense contre les crues de Harbin, je me souviens d'avoir aperçu un dragon alors que ni ma mère ni mon père ne l'avait vu, ensuite j'ai été un peu malade aussitôt rentrés chez nous, j'ai une santé un peu fragile depuis mon jeune âge.\n[...] En revanche, maintenant, en dépit des inspirations divines qui surgissent de temps à autre, j'en éprouve assez rarement auprès des autres. Parfois, si je vois quelque chose concernant des personnes que je connais, ou avec qui on s'entend bien, par exemple s'il y a eu un avortement récent, alors là je tente peut-être de lui en toucher un mot en fonction de la manière dont la personne réagit. Dans le cas où la personne préfère ne pas souffler mot sur ce sujet, alors j'abandonne, et je m'arrête d'intervenir dans cette affaire. En plus, en réalité, chez beaucoup de personnes, plus elles déclarent y croire moins elles y croient, parce qu'il arrive que la personne ne veuille pas payer le moindre sou pour une consultation divinatoire. [...] Les animaux Esprits-Immortels qui s'accrochent sur moi, euh... Ils sont plusieurs. Mais je ne les vénère pas encore chez moi, aussi parce que ma situation financière est un peu modeste pour l'instant, et qu'il n'y a pas assez de place chez moi, donc je n'ai pas encore sollicité quelqu'un disposant du savoir-faire pour écrire une liste des noms (des animaux Esprits-Immortels) et pour faire un sanctuaire privé pour moi, j'espère pouvoir le faire dans le futur, ça me permettrait de pouvoir vénérer ces animaux Esprits-Immortels. En fait, ils sont vraiment très pauvres, ce ne sont que de petits animaux, très simples d'esprit, traçant une ligne de démarcation sans ambiguïté entre ce qu'ils aiment et ce qu'ils haïssent, et ils tiennent beaucoup mieux parole que les humains. Ils viennent\n\n<<< PAGE 315 >>>\n\ndes montagnes et de la nature, et ont fait la pratique de soi pendant longtemps. Cependant,\nl'environnement du milieu naturel s'est dégradé, sans parler du processus d'urbanisation à\npartir du moment où l'efficacité rituelle des endroits où les vieux animaux Esprits-Immortels\nfaisaient d'habitude la pratique de soi a été endommagée, et ils ont été obligés de quitter les\nmontagnes et de rejoindre le monde humain. En vue de sauver des humains, nombre d'animaux\nEsprits-Immortels vont chercher des êtres humains pour s'y attacher, et font d'eux des médiums\nde sorte qu'ils puissent voir des choses, guérir des maladies, et régler les problèmes des autres.\nCela explique pourquoi ce type de choses (être possédés) sont devenues si répandues\naujourd'hui, car les endroits dotés d'efficacité rituelle sont largement réduits. [...] Il me manque\nencore de trouver la bonne occasion pour le faire accepter à mes parents, qui, eux n'y croient\npas. Ils ne souhaitent non plus que je me rende dans les temples. Mon père est quelqu'un qui\npourrait probablement casser le sanctuaire privé (une fois fait) dans le cas où il se fâcherait.\nDonc je n'ai qu'à gagner plus d'argent pour partir louer un appartement en dehors toute seule,\nmais au fond, j'espère vraiment que mes parents pourront l'accepter. Comment décrire mon état\nd'esprit ? C'est un peu comme avoir un(e) petit(e) ami(e) qui n'est pas accepté(e) par les\nparents... [...] Parfois, je sens soit le putois Esprit-Immortel, soit le renard Esprit-Immortel\ns'appuyer sur moi à côté de mes mains, il est tout doux, bien chaud, et je peux aussi me sentir\npincer quelques fois. Il y a également un serpent Esprit-Immortel qui s'attache sur moi, ce qui\nfait que j'ai froid sur le corps de temps en temps. Les putois Esprits-Immortels sont plus\nturbulents. Il y a quelques jours, j'étais dans notre institut de beauté, c'était tard le soir, et après\navoir éteint les lumières, j'ai entendu des bruissements en provenance de la zone où je fais la\nmanucure, comme si des choses avaient été touchées, c'était très marrant ! Ces animaux\nEsprits-Immortels sont si mignons et innocents, je les adore. Avant-hier, j'ai travaillé jusqu'à\nminuit, j'étais crevée, je faisais la manucure à une de mes collaboratrices, c'est quelqu'un\nd'assez difficile, j'avais l'impression que mes animaux Esprits-Immortels étaient irrités, puis\nque je faisais tomber les objets ou qu'ils tombaient tout seuls, tout était agité durant une dizaine\nde minutes (l'expression que Mme Christal a utilisée était ji fei gou tiao 鸡飞狗跳, signifiant\nlittéralement les coqs s'envolent, et les chiens sautent, pour décrire une situation\ntroublante.). Très vite, je me suis mise à murmurer ainsi : « Ne soyez pas énervés, ce sera\nbientôt terminé. » Et c'est comme ça que le calme s'est enfin réinstallé. J'ai aussi une collègue\nqui ne leur plaît pas du tout (à ces animaux Esprits-Immortels), il me semble que son arrivée les\nénerve à chaque fois. Cette collègue est très infidèle, elle est en relation avec quatre ou cinq\npetits amis, mes vieux animaux Esprits-Immortels sont très méprisants à son égard. Si nous\nsommes plusieurs personnes à sortir, ça va encore, mais si elle et moi restons toutes seules,\ndans ce cas-là, l'ambiance peut devenir assez gênante. [...] Il ne faut pas trop raisonner avec les\nanimaux Esprits-Immortels, je suis capable de ressentir leur joie ou leur colère. La dernière fois,\n\n<<< PAGE 316 >>>\n\nil y avait une cérémonie rituelle au temple Guandi, cependant, je ne pouvais pas me rendre à\nQiqihar, par conséquent, ils n'étaient pas très contents. Et comme s'ils étaient victimes d'une\ninjustice, l'un d'entre eux -je ne sais pas duquel il s'agissait- s'est même mis à pleurer. J'ai\nsouvent la sensation d'être entourée d'eux. L'inconvénient d'avoir cette communion d'esprit\nentre nous est que mon moral peut être affecté par eux. [...]Depuis toujours, mes vieux animaux\nEsprits-Immortels sont très gentils avec moi, nous ne sommes pas comme certains autres\nanimaux Esprits-Immortels et leurs disciples qui tirent profit les uns des autres. Quand je suis\nallée au temple taoïste, j'ai fait des prières pour eux devant la salle où la Mère Noire est\nvénérée. En temps ordinaire, je n'ai pas toujours beaucoup de clients, et j'en ai encore moins\ndepuis la crise sanitaire. Depuis quelques temps, je n'avais presque pas de revenu, et j'ai\nchuchoté à mes animaux Esprits-Immortels, ensuite les clients sont venus. [...] Ils sont comme\nles humains, chaque animal Esprit-Immortel est unique en termes de caractère et de moyens de\nrégler des choses. Ce qu'ils demandent le plus souvent, c'est du tabac et de l'alcool. Il faut les\nappeler XXX Immortels plutôt que d'écrire directement les renards ou les putois, car c'est\nirrespectueux, sinon on aurait peur d'être punis par le ciel. Ce sont des Immortels beaucoup\nplus forts que les humains, nous devons les estimer. »\n( [...] 我从很小的时候就常能看到别人看不见的东西，比如一些不认识的动物。小时候\n有次和爸妈去哈尔滨防洪纪念塔玩，我记得看到一条龙，但我爸妈都没看到，回到家后\n我就有些不舒服了，从小身体就不太好。[...] 有时熟一些关系好些的人，如果我在对方\n身上看到什么，比如看到对方近来有堕胎，也许会看情况和对方的反应试探问一下，如\n果对方不愿多讲，那就算了，我也就不想多说什么了。而且，很多越表示自己相信的人，\n其实越是不信的，因为这个人可能连一点看卦费都不愿出。[...] 我身上的仙家，嗯...不\n止一位。但现在还没有供奉，因为目前条件也不是很好，没有地方供奉，所以也就还没\n有请更高明的人帮我写堂单和立堂口，希望今后可以吧，这样就能供奉这些仙家了。它\n们其实很可怜的，都是小动物，很单纯的，爱憎分明，也比人类信守承诺得多。从山里\n或野外出来的，修炼过很长时间，但现在自然环境被破坏，加上城市化等原因，老仙家\n们修行的灵气之地被人类破坏了，没办法只好下山救世了，它们有很多会来寻找人类附\n体，让这个人为其他人看事看病解决问题，所以现在这样的事情很多。有灵气的地方现\n在太少了。[...] 我缺少一个特别好的契机让家人去接受，我爸妈是不相信这些的，他们\n\n<<< PAGE 317 >>>\n\n也都不喜欢让我来庙里，我爸是那种脾气来了能把堂口砸了的人。只好顺其自然多赚钱，\n实在不行我自己出去租房子弄，但我心里总是希望父母能接受，这种心情怎么说呢，就\n像有个不被家长认可的男朋友... [...] 有时我感觉不是黄仙就是狐仙在我手边靠着我，软\n绵绵热乎乎的，还有被掐的感觉，身上也有蛇仙，有时就感觉身体很凉。黄仙就比较活\n泼好动。我前几天晚上在店里，灯矣了我听见我美甲的那个区域沙沙响，不知道什么东\n西被动了哈哈，很可爱的我很喜欢他们，很纯真。前天我干活到十二点，太累了，给我\n合作伙伴做指甲，她这人事特别多，我感觉老仙明显烦了。拿东西就掉，不拿也掉，那\n十来分钟鸡飞狗跳的，我赶紧念叨，别生气快结束了，快结束了，才好了。他们也特别\n烦我一个同事，每次来明显感觉他们都不高兴，我这个同事她很花心，交往四五个男朋\n友，我家老仙特别看不上她，除非是几个人一起玩，否则如果就我俩，那气氛很尴尬。\n\n[...] 跟仙家不能太去理论道理的，他们的喜怒我能感觉到，上次关帝庙有法会，我去不\n了齐齐哈尔，他们就是不太开心，委屈，还有个哭的，不知道是谁，我经常感应到他们\n在我周围。心灵相通的坏处就是我会被影响情绪。[...] 我家的老仙家对我一直很好，不\n像有些人的仙家和弟子是那种互相利用的关系。去庙里我就去黑妈妈殿那里跪着求。平\n时客人不多，疫情之后客人更少，之前有段时间几乎没赚到钱，后来我就和仙家小声说，\n之后就来客人了。)\nLe récit de Mme Christal comporte d'importantes informations, tant sur l'expérience personnelle d'un individu présumé être « accompagné » par plusieurs animaux Esprits-Immortels, que sur la façon particulière dont elle conçoit le milieu de ces derniers, ainsi que sur le lien étroit qu'elle entretient avec les temples taoïstes. D'ailleurs, les animaux Esprits-Immortels sont quasiment pris pour des membres de la famille même s'ils ont été honorés en même temps avec leurs noms figurant sur des listes tangdan sur le sanctuaire privé tangkou.\nDans cette partie, l'idée est surtout de souligner les caractéristiques de la personnification des animaux Esprits-Immortels. Dans la cosmologie de Mme Christal, ces animaux Esprits-Immortels sont aussi bien de « petits animaux » simples sans que les gens puissent les appeler\n\n<<< PAGE 318 >>>\n\ndirectement par des dénominations zoologiques précises, que des Immortels beaucoup plus\nforts que les humains et qui sont devenus plus nombreux ces dernières années en raison de la\ndégradation des conditions environnementales et de l'urbanisation. Celles-ci constituent ainsi\nles motifs principaux du départ de leur habitat original où ils faisaient la pratique de soi.\nAutre raison: la possession désormais élargie afin de « sauver le monde des hommes ».\nPendant que les animaux Esprits-Immortels s'attachent sur les humains, ils partagent\négalement d'une certaine manière l'espace de vie de « ces disciples humains », en particulier\nde celles et ceux qui servent déjà en tant que médiums. Dans ce dernier cas, ils cohabitent\naussi, hors du temps de consultations durant lequel ils se préoccupent de faire des humains\nleurs médiums, des intermédiaires faisant passer leur parole aux requérants. Les demandes\ndes animaux Esprits-Immortels s'adaptent aussi aux circonstances objectives de la société\nhumaine. Dans son article basé sur les enquêtes réalisées autour de Pékin, la chercheuse Ju Xi\nl'explique ainsi :\n> « [...] Chaque animal Esprit-Immortel est considéré comme ayant sa personnalité, son tempérament et ses préférences respectifs, toutefois, leur personnalité n'est définie ni par ces modalités, ni par l'apparence ou les habitudes, mais plutôt montrée à travers la communication et l'interaction avec les humains. [...] Au lieu de dépendre de la société humaine, ils ont leur propre monde, leur propre société, et leur propre espace, ils maintiennent une relation parallèle avec le monde des humains. [...] »³⁷⁹\nPour Mme Christal, comme pour le cas de la jeune médium qui consulte la Supérieure taoïste\nWang Liyan dans le temple Guandi, les animaux Esprits-Immortels et les humains qu'ils ont\n« sélectionnés » développent une relation de « maîtres et disciples » qui emprunte donc aux\nrelations humaines, les non-humains sont maîtres alors que les humains sont disciples, les\npremiers approfondissent la pratique de soi en même temps que les seconds font la leur en\nréglant les problèmes des autres en transe, et s'organise un système d'avantages mutuels, de\ncoopération, et de réciprocité qui bénéficie à l'un comme à l'autre, d'autant que d'un point de\nvue financier, certains médiums de ce type exercent ce métier à plein temps, dont le tarif peut\nêtre fixé et quelque peu élevé. En revanche, les médiums actifs ne se livrent pas passivement\nà des transes, et pour les « futurs médiums » volontaires dont fait partie Mme Christal, la\npossession n'est pas un acte qui leur est infligé non plus. Puisque d'une part, la\n\n<<< PAGE 319 >>>\n\ncommunication entre les médiums disciples et leurs maîtres animaux Esprits-Immortels est aussi fondée sur un échange bidirectionnel, cette notion rappelle ce que Philippe Descola a précisé comme « une relation d'apprivoisement qui caractérise le lien des chamanes à leurs animaux et esprits auxiliaires, [...] un rapport de dépendance et de contrôle relatifs que les humains réussissent à imposer à des non-humains de diverses sortes... »³⁸⁰, d'autre part, pour les personnes souffrant de l'intervention des animaux Esprits-Immortels dans leur vie et qui ne souhaitent pas soumettre à une telle relation avec ces derniers, ils font donc appel aux moines taoïstes pour s'en protéger au moyen des pratiques taoïstes.\n## 7.5 « Les animaux Esprits-Immortels ne dépassent pas la passe de Shanhaiguan » (仙家不过山海矣)\nParmi les maîtres taoïstes de ces temples en réseau, l'une d'entre eux m'a raconté que dans la région du nord-est de Chine qu'est la Mandchourie, les animaux Esprits-Immortels sont particulièrement répandus, et que depuis que les immigrants Han sont venus en masse dans ce territoire par le passé, le nombre des unions entre les Hans et les populations indigènes classées à notre époque contemporaine dans la catégorie des « minorités ethniques nationales » (shaoshu minzu) est très élevé. En outre, elle a également évoqué qu'à priori les animaux Esprits-Immortels ne peuvent pas aller au-delà de la passe de Shanhai, en ajoutant que dans certains cas, pour les gens en provenance de Mandchourie et sur qui les animaux Esprits-Immortels s'attachent, le passage vers l'autre côté de la Grande Muraille ne peut avoir lieu uniquement à travers des pouvoirs rituels, tel ceux d'un « passeport tamponné » appelé « papier de dédouanement tongguan wendie 通关文牒 » qui n'est autre que ce que l'on peut facilement se procurer à tout moment au guichet sur le site de la passe de Shanhaiguan en\n\n<<< PAGE 320 >>>\n\nguise de souvenir touristique. Elle a déclaré qu'elle en a acheté pas mal l'été dernier et les a remplis pour les donner ensuite aux gens ayant recours à elle, sinon, ces derniers auraient tendance à rencontrer des difficultés une fois arrivés de l'autre côté de la Grande Muraille et dans la « Chine du sud » (la Chine située au Sud de celle-ci).\nFigure 7 : Un exemplaire du « passeport tamponné » appelé « papier de dédouanement tongguan wendie » que la maître taoïste s'était procuré au guichet du site touristique de la passe de Shanhaiguan en été 2020.\n\n<<< PAGE 321 >>>\n\nFigure 8 : Un homme en costume ancien est en train de rédiger ces passeports.\n(http://blog.sina.cn/dpool/blog/s/blog_4972fa640102uwb8.htm)\nFigure 9 : Un touriste et des employés en costume ancien.\n(http://news.sina.com.cn/c/p/2006-05-04/20159779672.shtml?from=wap)\nQuand j'ai interrogé celles et ceux qui partagent cette opinion sur l'interdiction des animaux Esprits-Immortels de dépasser la passe de Shanhaiguan, voici l'explication de Mme Christal :\n« À mon avis, (cette idée) fait écho à l'autonomie territoriale, comme celle de Hong Kong et de Macao, les troupes doivent se cantonner à leur propre circonscription, et ne peuvent pas donner lieu à des mouvements transfrontiers. Ainsi dans le cas où l'on se déplace dans d'autres régions, les bénéfices obtenus par notre pratique de soi seraient réduits, à priori ça doit se passer ainsi. En outre, ceux qui sont vénérés dans les autres régions sont aussi distincts de ceux que nous\n\n<<< PAGE 322 >>>\n\nvénérons, et donc c'est très différent. » (我理解就像区域自治是一样的，就像香港自治、澳门自治，自己的兵马在自己的区域里面，不能越界到别的区域里去。如果到别的区域，修为就会受到压制，应该是这个意思。而且，别的区域所供奉的也不一样，所以没法互通吧。)\n## Conclusion :\nDans ces temples taoïstes locaux en réseau, ce n'est pas une relation de rivalité qui prévaut entre le taoïsme et le chamanisme à caractère local, mais plutôt une relation bénéfique à l'un comme à l'autre. D'un côté, le taoïsme local peut permettre aux gens étant en mesure d'apprivoiser les animaux esprits-Immortels de devenir « officiellement » médiums à travers diverses pratiques taoïstes, tout en leur accordant une identité à laquelle ces futurs médiums s'attachent, ce qui atteste qu'« une particularité des pratiques chamaniques est qu'elles se sont accommodées de très nombreuses situations historiques différentes, s'organisant le plus souvent à la marge des grandes religions »³⁸¹. De plus, je pense à une comparaison faite par Mme Christal : « Il faut bien sûr avoir une croyance, je pense aussi que ça s'apprend, comme quand on va aller à l'école pour acquérir des connaissances » (肯定要有信仰的，我觉得就像上学一样，想要学知识就要去学校).\nD'un autre côté, le taoïsme local peut s'adapter aux besoins des requérants quand ils estiment que leur vie est affectée par les animaux Esprits-Immortels, les pratiques taoïstes peuvent aussi être accomplies afin de neutraliser ces derniers. Dans ce cas, le taoïsme peut se positionner en tant qu'un réceptacle d'actions précises censées pouvoir délivrer les gens des difficultés présumées causées par des animaux Esprits-Immortels. Localement, dans ces temples en réseau, comme les maîtres et les pratiques taoïstes sont systématiquement appelés à interférer avec des fragments du chamanisme local, cela n'est pas sans rappeler que cette interaction est aussi favorable à l'ancrage local du taoïsme.\n===== FIN DU/DES CHAPITRE(S) =====\n\n## TÂCHE\n\nVoici également les sections `cadre_theorique` et `fil_rouge` de la\nfiche, pour assurer la cohérence :\n\n===== CADRE THÉORIQUE =====\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n===== FIN =====\n\n===== FIL ROUGE =====\nLa passe Shanhai comme frontière symbolique et religieuse structurante (p. 387), reliant la transformation identitaire et politique de la Mandchourie (Partie 1) aux consultations et pratiques rituelles quotidiennes (Partie 2) et aux interactions institutionnelles entre taoïsme et chamanisme (Partie 3) via la délimitation des compétences territoriales des esprits et la légitimation du culte à la Mère Noire (p. 388). Le réseau de temples centré sur le temple Daode et articulé autour du culte à la Mère Noire sert de maillage concret à cette dynamique depuis l'empire Qing jusqu'à l'époque contemporaine (p. 6).\n===== FIN =====\n\nProduis la version DÉFINITIVE (fiche-grade) de la section `concepts_cles`.\nLe contenu actuel sert de base — conser anterre, Laboratoire d'Ethnologie et de Sociologie Comparative\n- **Discipline** : Ethnologie\n- **Pages** : 465\n\n## Mots-clés\n\nreligion taoïste ; vie monacale ; consultations ; pratiques rituelles ; Grande Muraille ; Mandchourie ; ethnographie\n\n## Thèse centrale\n\nLa religion taoïste Quanzhen s'est profondément enracinée en Mandchourie non pas par une simple « sinisation », mais grâce à une « mandchourisation » réciproque qui intègre les éléments chamaniques locaux, notamment le culte à la Mère Noire et aux animaux Esprits-Immortels (p. 381). Cette interaction dynamique permet aux pratiques chamaniques d'être institutionnalisées sous l'égide taoïste, tout en conférant aux temples taoïstes une légitimité et une prospérité locales (p. 381). En retour, le taoïsme doit s'adapter au chamanisme pour survivre et se développer dans cette région, créant ainsi une identité religieuse et territoriale singulière au nord de la Grande Muraille (p. 389). Le réseau de temples est structuré autour du culte à la Mère Noire, divinité centrale reliant les sites depuis l'empire Qing jusqu'à l'époque contemporaine, tandis que la Passe Shanhai fonctionne comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6).\n\n## Questions de recherche\n\n- « étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie » (p. 23)\n- « comprendre le rôle de ces temples dans la société d'aujourd'hui » (p. 23)\n\n## Réponses aux questions de recherche\n\n- Pour la question sur les dynamiques et interactions : « l'interaction dynamique entre le chamanisme à caractère local et les pratiques taoïstes paraît propice à l'ancrage régional du taoïsme, le culte à la Mère Noire est alors important, voire central dans la production de ce type d'interaction » (p. 381) ; « la religion taoïste permet aux éléments propres aux pratiques chamaniques de perdurer tout en les plaçant sous son égide et alors que ailleurs, la religion taoïste ne peut s'enraciner et se répandre en Mandchourie qu'à condition que les strates des éléments chamaniques s'inscrivent dans les activités religieuses du taoïsme local » (p. 389).\n- Pour la question sur le rôle des temples : « les temples sont des lieux destinés à guérir les maladies, qu'elles soient visibles ou invisibles » (p. 383) ; « grâce à elle [la Mère Noire], les communautés taoïstes prospèrent et confortent ainsi leur place dans l'orthodoxie locale au fils du temps » (p. 388) ; « les officiants taoïstes et les fidèles indiquent que les animaux Esprits-Immortels se trouvent partout dans ces régions du Nord-est mais qu'à priori ils ne peuvent pas aller au sud de la passe Shanhai » (p. 387).\n\n## Hypothèses\n\n**Principale** : L'enracinement du taoïsme Quanzhen en Mandchourie ne relève pas d'une sinisation unilatérale mais d'une adaptation réciproque aux substrats chamaniques locaux (p. 381, p. 389). Vérifiée : l'intégration de la Mère Noire « est intimement associée à l'arrivée progressive des vagues de migration des chinois Han sur ce territoire, de même qu'à la diffusion et au développement du taoïsme (de l'ordre de la Perfection totale) dans cette région » (p. 381).\n**Secondaires** :\n- Un même lieu saint peut abriter plusieurs religions sans se réduire à aucune : l'auteur propose « d'appréhender un même lieu saint qui abrite plusieurs religions » (p. 31), le temple Daode étant « un ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste » (p. 6).\n- La Passe Shanhai fonctionne comme une frontière religieuse effective et non seulement historique : elle est perçue par les moines comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6).\n- Le culte à la Mère Noire constitue l'axe structurant du réseau de temples : il « constitue un axe majeur des interférences entre ces temples taoïstes, les religieux, et les fidèles, qui se manifeste pleinement dans les services rituels proposés » (p. 381).\n\n\n## Méthodologie\n\n- **Approche** : « Cette thèse ethnographique porte sur la religion taoïste en Mandchourie » (p. 23) ; « étude ethnographique » (p. 383)\n- **Méthode** : « observations participantes » (p. 23) ; « observations ethnographiques récentes » (p. 383)\n- **Corpus/Données** : « deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin » (p. 23) ; « consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles » (p. 23) ; « plusieurs temples taoïstes en réseau » (p. 383) ; réseau centré sur le temple Daode à Qiqihar, ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste (p. 6)\n- **Justification** : « Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire » (p. 23) ; « cela a permis d'observer et d'aborder les différents aspects et particularités de la société au nord de la Grande Muraille à l'heure actuelle » (p. 383)\n\n## Fil rouge\n\nLa passe Shanhai comme frontière symbolique et religieuse structurante (p. 387), reliant la transformation identitaire et politique de la Mandchourie (Partie 1) aux consultations et pratiques rituelles quotidiennes (Partie 2) et aux interactions institutionnelles entre taoïsme et chamanisme (Partie 3) via la délimitation des compétences territoriales des esprits et la légitimation du culte à la Mère Noire (p. 388). Le réseau de temples centré sur le temple Daode et articulé autour du culte à la Mère Noire sert de maillage concret à cette dynamique depuis l'empire Qing jusqu'à l'époque contemporaine (p. 6).\n\n## Plan (Structure)\n\n- **Première partie La Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier** : Démontre que la Mandchourie a forgé une identité collective distincte malgré l'effacement politique du terme, en montrant comment la passe Shanhai fonctionne comme frontière symbolique entre « chez soi » et « ailleurs » pour les habitants (p. 384).\n- **Epilogue : Une consultation au temple taoïste Daode** : Donne à voir, sur un cas unique, le fonctionnement concret d'une consultation : une femme d'une soixantaine d'années vient déposer des requêtes sous forme de « déclarations votives prenant la forme de formulaires célestes *shuwen* 疏文 », pour son père atteint d'un cancer du pancréas et pour sa fille travaillant dans le Hunan (p. 75).\n- **Deuxième partie Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels** : Démontre que les temples taoïstes répondent à des problèmes quotidiens et historiques profonds, en montrant comment les moines agissent comme médiateurs entre le monde terrestre, le monde céleste et les divinités pour résoudre des maux visibles ou invisibles (p. 383).\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que le taoïsme ne s'enracine qu'en intégrant le chamanisme local, en montrant comment le culte à la Mère Noire institutionnalise les animaux Esprits-Immortels et produit une « mandchourisation » réciproque (p. 389).\n\n## Cadre théorique\n\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n\n## Concepts clés\n\n**CONCEPT** : CHAMANISME À CARACTÈRE LOCAL\n**SENS** : « le chamanisme à caractère local » (p. 303) — [NON DÉFINI EXPLICITEMENT] désigne par l'auteur l'ensemble des pratiques et croyances régionales du Nord-Est fondées sur la possession par des animaux Esprits-Immortels et leur intégration ritualisée au sein des temples taoïstes contemporains.\n**ORIGINE** : propre à l'auteur, construit pour distinguer les pratiques de possession actuelles (souvent qualifiées de *chuma* ou de superstition) du chamanisme historique des peuples indigènes, et souligner leur métamorphose institutionnelle.\n\n**CONCEPT** : MANDCHOURISATION\n**SENS** : « la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation » (p. 389)\n**ORIGINE** : propre à l'auteur, conceptualisé comme processus d'ancrage religieux et identitaire réciproque où le taoïsme institutionnel s'adosse aux pratiques chamaniques locales pour s'enraciner, en rupture avec le discours dominant de sinisation.\n\n**CONCEPT** : MÈRE NOIRE (DIVINITÉ INTERFACIALE)\n**SENS** : « la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local » (p. 388)\n**ORIGINE** : propre à l'auteur, requalifiée en nœud on taoïste ; vie monacale ; consultations ; pratiques rituelles ; Grande Muraille ; Mandchourie ; ethnographie\n\n## Thèse centrale\n\nLa religion taoïste Quanzhen s'est profondément enracinée en Mandchourie non pas par une simple « sinisation », mais grâce à une « mandchourisation » réciproque qui intègre les éléments chamaniques locaux, notamment le culte à la Mère Noire et aux animaux Esprits-Immortels (p. 381). Cette interaction dynamique permet aux pratiques chamaniques d'être institutionnalisées sous l'égide taoïste, tout en conférant aux temples taoïstes une légitimité et une prospérité locales (p. 381). En retour, le taoïsme doit s'adapter au chamanisme pour survivre et se développer dans cette région, créant ainsi une identité religieuse et territoriale singulière au nord de la Grande Muraille (p. 389). Le réseau de temples est structuré autour du culte à la Mère Noire, divinité centrale reliant les sites depuis l'empire Qing jusqu'à l'époque contemporaine, tandis que la Passe Shanhai fonctionne comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6).\n\n## Questions de recherche\n\n- « étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie » (p. 23)\n- « comprendre le rôle de ces temples dans la société d'aujourd'hui » (p. 23)\n\n## Réponses aux questions de recherche\n\n- Pour la question sur les dynamiques et interactions : « l'interaction dynamique entre le chamanisme à caractère local et les pratiques taoïstes paraît propice à l'ancrage régional du taoïsme, le culte à la Mère Noire est alors important, voire central dans la production de ce type d'interaction » (p. 381) ; « la religion taoïste permet aux éléments propres aux pratiques chamaniques de perdurer tout en les plaçant sous son égide et alors que ailleurs, la religion taoïste ne peut s'enraciner et se répandre en Mandchourie qu'à condition que les strates des éléments chamaniques s'inscrivent dans les activités religieuses du taoïsme local » (p. 389).\n- Pour la question sur le rôle des temples : « les temples sont des lieux destinés à guérir les maladies, qu'elles soient visibles ou invisibles » (p. 383) ; « grâce à elle [la Mère Noire], les communautés taoïstes prospèrent et confortent ainsi leur place dans l'orthodoxie locale au fils du temps » (p. 388) ; « les officiants taoïstes et les fidèles indiquent que les animaux Esprits-Immortels se trouvent partout dans ces régions du Nord-est mais qu'à priori ils ne peuvent pas aller au sud de la passe Shanhai » (p. 387).\n\n## Hypothèses\n\n*[Non renseigné]*\n\n## Méthodologie\n\n- **Approche** : « Cette thèse ethnographique porte sur la religion taoïste en Mandchourie » (p. 23) ; « étude ethnographique » (p. 383)\n- **Méthode** : « observations participantes » (p. 23) ; « observations ethnographiques récentes » (p. 383)\n- **Corpus/Données** : « deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin » (p. 23) ; « consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles » (p. 23) ; « plusieurs temples taoïstes en réseau » (p. 383) ; réseau centré sur le temple Daode à Qiqihar, ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste (p. 6)\n- **Justification** : « Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire » (p. 23) ; « cela a permis d'observer et d'aborder les différents aspects et particularités de la société au nord de la Grande Muraille à l'heure actuelle » (p. 383)\n\n## Fil rouge\n\nLa passe Shanhai comme frontière symbolique et religieuse structurante (p. 387), reliant la transformation identitaire et politique de la Mandchourie (Partie 1) aux consultations et pratiques rituelles quotidiennes (Partie 2) et aux interactions institutionnelles entre taoïsme et chamanisme (Partie 3) via la délimitation des compétences territoriales des esprits et la légitimation du culte à la Mère Noire (p. 388). Le réseau de temples centré sur le temple Daode et articulé autour du culte à la Mère Noire sert de maillage concret à cette dynamique depuis l'empire Qing jusqu'à l'époque contemporaine (p. 6).\n\n## Plan (Structure)\n\n- **Première partie La Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier** : Démontre que la Mandchourie a forgé une identité collective distincte malgré l'effacement politique du terme, en montrant comment la passe Shanhai fonctionne comme frontière symbolique entre « chez soi » et « ailleurs » pour les habitants (p. 384).\n- **Epilogue : Une consultation au temple taoïste Daode** : *[Non renseigné]*\n- **Deuxième partie Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels** : Démontre que les temples taoïstes répondent à des problèmes quotidiens et historiques profonds, en montrant comment les moines agissent comme médiateurs entre le monde terrestre, le monde céleste et les divinités pour résoudre des maux visibles ou invisibles (p. 383).\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que le taoïsme ne s'enracine qu'en intégrant le chamanisme local, en montrant comment le culte à la Mère Noire institutionnalise les animaux Esprits-Immortels et produit une « mandchourisation » réciproque (p. 389).\n\n## Cadre théorique\n\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n\n## Concepts clés\n\n**CONCEPT** : CHAMANISME À CARACTÈRE LOCAL\n**SENS** : « le chamanisme à caractère local » (p. 303) — [NON DÉFINI EXPLICITEMENT] désigne par l'auteur l'ensemble des pratiques et croyances régionales du Nord-Est fondées sur la possession par des animaux Esprits-Immortels et leur intégration ritualisée au sein des temples taoïstes contemporains.\n**ORIGINE** : propre à l'auteur, construit pour distinguer les pratiques de possession actuelles (souvent qualifiées de *chuma* ou de superstition) du chamanisme historique des peuples indigènes, et souligner leur métamorphose institutionnelle.\n\n**CONCEPT** : MANDCHOURISATION\n**SENS** : « la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation » (p. 389)\n**ORIGINE** : propre à l'auteur, conceptualisé comme processus d'ancrage religieux et identitaire réciproque où le taoïsme institutionnel s'adosse aux pratiques chamaniques locales pour s'enraciner, en rupture avec le discours dominant de sinisation.\n\n**CONCEPT** : MÈRE NOIRE (DIVINITÉ INTERFACIALE)\n**SENS** : « la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local » (p. 388)\n**ORIGINE** : propre à l'auteur, requalifiée en nœud institutionnel et rituel permettant l'articulation et la légitimation croisée entre l'orthodoxie taoïste et le culte populaire des esprits animaux.\n\n**CONCEPT** : PASSES SHANHAI (FRONTIÈRE SYMBOLIQUE)\n**SENS** : « la passe Shanhai, continuent à exister chez les gens, non plus en tant que frontière physique et administrative entre les deux côtés de la Grande Muraille, comme par le passé, mais bien comme une frontière religieuse qui pose les limites des compétences territoriales des animaux Esprits-Immortels xianjia » (p. 388)\n**ORIGINE** : propre à l'auteur, redéfini à partir d'un marqueur géographique et touristique pour en faire un opérateur de démarcation identitaire, rituelle et de compétence spirituelle.\n\n**CONCEPT** : SINISATION (CRITIQUÉE)\n**SENS** : « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? [...] est-ce vraiment ça la sinisation ? » (p. 99-100)\n**ORIGINE** : emprunté au discours nationaliste et institutionnel, retravaillé par l'auteur pour en révéler les limites en Mandchourie, où l'identité et les pratiques religieuses persistent au-delà des critères linguistiques ou vestimentaires supposés.\n\n## Ancrage empirique (ou concret)\n\n- Temples taoïstes de l'ordre monastique Quanzhen 全真 à Qiqihar (Heilongjiang) et Liuhe (Jilin), dirigés par la même supérieure taoïste (p. 23)\n- Consultations entre officiants taoïstes et fidèles servant de cas d'étude (p. 23)\n- Liste rouge vouée au culte des Esprits-Immortels renard et putois (« 供俸 有求必应 胡仙黄仙 保家平安 胡黄二仙保家仙之位 ») brûlée au temple (p. 380)\n- Papiers de dédouanement rituels « tongguan wendie 通关文牒 » vendus comme souvenirs touristiques à Shanhai mais investis d'une efficacité rituelle pour les esprits d'animaux (p. 387)\n\n## Opposition / Contre-argumentation\n\n- **Sinisation unidirectionnelle** : « ce n'est pas une simple question de sinisation comme cela pourrait paraître, mais aussi une sorte de « mandchourisation » » (p. 381) ; la thèse rejette l'idée que le taoïsme ait simplement remplacé ou absorbé passivement le chamanisme, montrant au contraire une adaptation mutuelle et une conservation des strates chamaniques (p. 389).\n- **Déclin attribué uniquement à des facteurs endogènes** : « on va jusqu'à entendre des discours [...] qui laissent entendre que le déclin de la Mandchourie est en grande partie de de son fait, attribué à un esprit fermé et retardataire, à une idéologie anti-marché, et sur un autre registre au climat froid » (p. 385) ; l'auteur nuance cette vision en rappelant l'exploitation historique des ressources et le sentiment d'abandon face aux réformes économiques (p. 385).\n- **Effacement politique du terme « Mandchourie » comme simple neutralité** : « si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité » (p. 384) ; l'auteur oppose cette interprétation géopolitique active aux discours officiels qui présentent le changement comme anodin ou technique.\n\n## Apport principal\n\n- **Théorique** : Introduce le concept de « mandchourisation » réciproque pour dépasser le paradigme dominant de la « sinisation » unidirectionnelle, montrant comment le taoïsme Quanzhen doit s'adapter au chamanisme local pour s'enraciner (p. 389).\n- **Empirique** : Documente pour la première fois le rôle structurant du culte à la Mère Noire comme interface institutionnelle légitimant les animaux Esprits-Immortels dans les temples taoïstes du Nord-Est, ainsi que l'usage rituel contemporain des papiers de dédouanement de Shanhai (p. 387).\n- **Critique** : Démontre que la frontière religieuse de la passe Shanhai persiste comme opérateur identitaire et territorial malgré l'effacement politique du nom « Mandchourie », révélant une altérité culturelle et spirituelle résiliente face au récit national unificateur (p. 386).\n\n```\n\n## EXEMPLE DE STYLE (à imiter pour le registre, la longueur des paragraphes, le flux)\n\n```markdown\n# [Titre complet de l'ouvrage : nom des directeurs et titre/sous-titre en italique]\n\n**Compte rendu par** [Auteur du compte rendu]\n\n**Date :** 2026-04-24\n\n**Source :** [URL si disponible]\n\n**Référence :** [Auteur·e·s], *Titre complet*, Ville, Éditeur, coll. « Collection », année, xxx p., ISBN : xxx.\n\n---\n\nQuatorze auteurs, parmi lesquels des sociologues clés de l'analyse du secteur social et médico-social analysent, dans cet ouvrage important, les transformations de la « morale » de l'intervention sociale de divers pays (France dont Mayotte, Suisse, Maroc, Québec), ceci à la suite d'un congrès sociologique international tenu à Tunis en 2021. Le texte décrit les tensions traversant l'intervention sociale, entre idéaux de justice sociale, d'égalité et de solidarisme d'une part, et les principes de responsabilisation et d'activation dans un contexte marqué par l'emprise croissante d'une logique managériale, d'autre part. Disons-le d'emblée, le principe de « responsabilisation » mérite d'être interrogé : il renvoie généralement non pas tant à un transfert de pouvoir aux usagers ou citoyens, comme il l'affirme, mais souvent à une « normalisation » du contrôle social reposant, désormais, sur l'individu lui-même. C'est notamment le cas dans les dispositifs de parentalité ou dans la justice restaurative, où la volonté des individus devient l'opérateur du contrôle social.\n\nNotre lecture questionne implicitement les mots-clefs contemporains de l'intervention sociale que sont « responsabiliser » et « activer ». Ces termes sont aussi les items centraux de la Nouvelle Gouvernance Publique (NGP), laquelle tend, pour l'action sociale, à substituer la « relation de service » reposant sur l'efficience et le résultat au « modèle de service public d'action » fondateur. S'impose, alors, un glissement progressif vers un paradigme managérial qui met la focale sur les difficultés de financement, d'efficacité, la qualité du service et le questionnement de la légitimité de l'État social.\n\nDans le premier chapitre, Jean-Pierre Tabin et ses collègues explorent, à partir de la rhétorique de l'État depuis les années 2000, les politiques suisses en direction des personnes invalides. Ils identifient finement une logique « capacitiste » visant la re-marchandisation à tout prix, via un nouvel ordre d'employabilité passant par l'acceptation d'une norme d'emploi « médiocre » et, de fait, réduisant la « crédibilité épistémique » de la personne en situation de handicap psychique. Dans les Structures d'Insertion par l'Activité Économique (SIAE) analysées par Hervé Jory dans le cinquième chapitre, la prévalence des compétences d'adaptation sociale sur la formation didactique et le savoir-faire professionnel correspond à une précarisation du profil attendu des publics. L'inversion du statut de la formation, dans ces structures d'insertion, tend à favoriser des conditions d'acceptation de conditions de travail pénibles pour des emplois sous-qualifiés. Ce nouveau cadre normatif de l'inclusion professionnelle repose sur le postulat « d'insérer pour former » où l'insertion se suffit en elle-même. Il s'agit de privilégier l'adaptation quasi immédiate à l'emploi et ses difficultés, en particulier la capacité à supporter des conditions de travail éprouvantes (port de charges lourdes, intempéries…) plutôt que l'intégration de savoirs professionnels et une qualification capitalisable.\n\nL'analyse de tous ces segments de l'intervention sociale est à même d'identifier une logique de responsabilisation des publics et un tournant managérial souvent pénalisants. Mais la grammaire managériale reste fortement questionnée dans les pratiques concrètes des acteurs. Un deuxième grand apport de l'ouvrage est donc d'étudier les engagements moraux et les micro-résistances éthiques des intervenants·es infléchissant parfois certaines modalités de l'intervention sociale. Au-delà des cadres normatifs, des professionnels inventent dès lors des pratiques d'écarts éthiques pour redonner sens à leur action.\n\nAinsi, dans l'urgence sociale présentée par Hélène Marin et Béatrice Bertho (chapitre 3), la mobilisation bénévole de professionnels illustre la volonté de participer à la neutralisation d'un déficit d'action publique récurrent, en contradiction avec les principes moraux de l'État social. Un engagement solidaire, fait en parallèle de leur travail salarié, s'instaure dans une ville de Suisse romane afin de faire face à une « politique de la pénurie » (p. 48) de l'accueil national des personnes sans-abris. Ce « bénévolat solidaire » définit ce que l'on peut appeler une « résistivité morale », des micro-résistances enracinées dans les principes de justice sociale au regard des besoins de ce public en grande vulnérabilité psychique et sociale.\n\nEn définitive, l'intérêt majeur des thèses de cet ouvrage est de souligner une mutation des cadres normatifs et moraux de l'intervention sociale qui mettent désormais essentiellement l'accent sur une responsabilisation des individus vulnérables, une activation étrécie et pénalisante et privilégiant parfois l'immédiateté de l'insertion par le travail, voire des pratiques de culpabilisation-stigmatisation et des dispositifs d'activation définis par une grammaire managériale. Par contre, ces mutations ne doivent pas oblitérer, car s'exprimant à bas bruit dans les interstices de l'accompagnement, la présence modeste d'un cadre moral et cognitif secondaire d'élargissement du pouvoir d'agir pour les personnes en difficulté. Une responsabilisation que l'on peut qualifier d'« habilitante » est encore visible dans nombre des pratiques d'accompagnement. Ainsi, le Revenu de Solidarité Active (RSA) agricole représente une reconnaissance nouvelle de la vulnérabilité d'une population et un levier d'action potentiel pour des agriculteurs immergés des décennies dans une grande précarité. L'action sociale n'est pas réductible au seul tournant néo-libéral et l'on observe non pas une « nouvelle » morale de l'intervention sociale mais une hybridation de morales dont certaines fondatrices de l'État social et du travail social. Malgré tout, force est de constater que la NGP encadre l'intervention sociale par des normes managériales dissonantes au regard des idéaux universalistes, de l'éthique et de la vulnérabilité des publics et de leurs besoins. Ces nouvelles normes conduisent à une détérioration de l'action pour les usagers et le personnel que l'on retrouve aussi dans l'ensemble des services publics.\n\n---\n\n## Pour citer cet article\n\n**[Auteur]**, « [Titre court de l'ouvrage] », *Comptes rendus*, mis en ligne le [date], consulté le [date].\n\n```\n\n---\n\nRédige maintenant la note de lecture. Vise ~2000 mots, six paragraphes denses, français académique soutenu. Termine par `FINAL(note_markdown)`.\n", "note_md": "# *Religion taoïste et société locale au nord de la Grande Muraille : ethnographie d'un réseau de temples taoïstes en Mandchourie du Nord*\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-07\n\n**Référence :** Binqi Cui, *Religion taoïste et société locale au nord de la Grande Muraille : ethnographie d'un réseau de temples taoïstes en Mandchourie du Nord*, Université Paris Nanterre, 2024, 465 p.\n\n---\n\nDans une région où l'histoire coloniale mandchoue, les migrations massives de population Han et les recompositions politiques de la République populaire de Chine se croisent et se superposent, Binqi Cui livre une ethnographie d'une densité rare consacrée au réseau des temples taoïstes du Nord-Est chinois. Soutenue à l'Université Paris Nanterre en 2024, cette thèse de sociologie et d'ethnologie repose sur seize mois d'enquêtes de terrain menées dans les provinces du Heilongjiang et du Jilin, en Mandchourie septentrionale. Son objet principal est l'étude « des dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie » (p. 23). La thèse centrale défendue par l'auteur est que le taoïsme Quanzhen (de la Perfection totale) s'est enraciné dans cette région non pas par une simple « sinisation » unidirectionnelle — le scénario habituel proposé par les récits nationalistes —, mais par un processus de « mandchourisation » réciproque qui intègre les éléments chamaniques autochtones. Le réseau de temples, structuré autour du temple Daode à Qiqihar et articulé au culte de la Mère Noire (Heimama), fonctionne comme une interface institutionnelle entre orthodoxie taoïste et pratiques chamaniques locales. La passe Shanhai de la Grande Muraille, ancien point d'entrée des armées mandchoues en Chine en 1644, persiste comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6) et comme une frontière symbolique à la fois religieuse et identitaire, délimitant le domaine des animaux Esprits-Immortels (*xianjia* 仙家).\n\nLa démarche méthodologique de Binqi Cui repose sur une ethnographie de terrain approfondie, articulée autour de l'observation participante dans plusieurs temples taoïstes du réseau dirigé par la supérieure Wang Liyan. Cette dernière, née dans les années cinquante dans le Jilin, a embrassé la vie religieuse après un grave accident en montagne en 1975 qui, selon ses propres récits, lui aurait ouvert la perception des « mondes invisibles, tels que les Enfers et les sphères célestes » (p. 194). Ses ordinations collectives de 1995 sur le mont Qingcheng ont fait d'elle une figure charnière de l'ordre Quanzhen en Mandchourie contemporaine. L'auteur a mené deux enquêtes s'échelonnant sur seize mois au total, centrées principalement sur le temple Daode à Qiqihar — ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste — et sur le temple Sanqing du mont Luotong dans le Jilin. Les consultations entre officiants et fidèles constituent le matériau empirique central : elles permettent d'observer comment les moines agissent comme médiateurs entre les requérants, le monde céleste et les divinités. L'originalité de cette approche tient à son double ancrage : d'une part, l'examen des pratiques rituelles au sein même des temples, et d'autre part, la mise en perspective de ces pratiques avec les transformations socio-politiques du territoire — migrations Han, effacement du nom « Mandchourie », héritage communiste —. Cette double lecture, microsociale et macro-territoriale, permet de saisir comment la sphère religieuse fonctionne comme un prisme de lecture de l'identité régionale. L'auteur montre aussi que les fidèles, venus de couches sociales et d'origines ethniques diverses, privilégient certains temples du réseau en fonction de critères personnels : la fidèle Guan Hui, originaire de la bannière autonome daur de Mongolie intérieure, ainsi que le médium chamanique M. Guan, témoignent de l'ancrage trans-ethnique du réseau (p. 220).\n\nLa première partie de la thèse — « La Mandchourie se transforme en \"Nord-est de la Chine\" : Un temple singulier dans un territoire frontalier » — pose les bases historiques et géopolitiques de l'analyse. Binqi Cui y démontre que l'effacement du terme « Mandchourie » au profit de « Nord-est de la Chine » (zhongguo dongbei 中国东北) n'est pas un simple changement sémantique, mais un acte politique profond. Dès 1635, Huang Taiji avait choisi le nom *Manzhou* 满洲 pour désigner à la fois le territoire et le peuple Jurchen ; or aujourd'hui, « la mention de ce nom [...] a même tendance d'être jugée \"politiquement incorrecte\" » (p. 50). L'auteur interroge l'hypothèse officielle selon laquelle ce changement serait anodin : « si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité » (p. 384). La passe Shanhai y est analysée comme une frontière structurelle : elle a historiquement marqué l'entrée des Mandchous en Chine en 1644, et elle continue de fonctionner comme un repère identitaire chez les générations de migrants Han qui y voient une démarcation entre « leur pays natal » et la « nouvelle vie » (p. 49). Dans le chapitre 2, l'auteur aborde la question de la persistance de l'identité mandchoue à travers les mélanges de populations, les patronymes et les affinités spirituelles. Il interroge vigoureusement le concept de « sinisation » — « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? » (p. 99-100) — et montre que des individus enregistrés comme Han sur leurs carnets de résidence maintiennent des liens chamaniques et un sentiment d'appartenance mandchoue. L'identité régionale ainsi produite s'articule à la fois à l'héritage colonial, aux migrations et aux ressentis contemporains d'abandon face aux réformes économiques du Sud (p. 385).\n\nLa deuxième partie — « Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels » — constitue le cœur empirique de la thèse et révèle la complexité des interactions entre temples, fidèles et officiants. Les temples taoïstes du réseau sont présentés comme des lieux spécialisés dans la guérison des « maladies invisibles » (*xubing* 虚病), terme qui désigne des maux attribués à des déséquilibres spirituels plutôt qu'à des causes physiologiques. L'auteur montre comment les moines remplissent les fonctions d'une véritable bureaucratie médiane : ils rédigent des *shuwen* 疏文, des « formulaires célestes » pré-imprimés à compléter avec les informations du requérant, qui servent à transmettre les requêtes aux puis  l'emprise croissante d'une logique managériale, d'autre part. Disons-le d'emblée, le principe de « responsabilisation » mérite d'être interrogé : il renvoie généralement non pas tant à un transfert de pouvoir aux usagers ou citoyens, comme il l'affirme, mais souvent à une « normalisation » du contrôle social reposant, désormais, sur l'individu lui-même. C'est notamment le cas dans les dispositifs de parentalité ou dans la justice restaurative, où la volonté des individus devient l'opérateur du contrôle social.\n\nNotre lecture questionne implicitement les mots-clefs contemporains de l'intervention sociale que sont « responsabiliser » et « activer ». Ces termes sont aussi les items centraux de la Nouvelle Gouvernance Publique (NGP), laquelle tend, pour l'action sociale, à substituer la « relation de service » reposant sur l'efficience et le résultat au « modèle de service public d'action » fondateur. S'impose, alors, un glissement progressif vers un paradigme managérial qui met la focale sur les difficultés de financement, d'efficacité, la qualité du service et le questionnement de la légitimité de l'État social.\n\nDans le premier chapitre, Jean-Pierre Tabin et ses collègues explorent, à partir de la rhétorique de l'État depuis les années 2000, les politiques suisses en direction des personnes invalides. Ils identifient finement une logique « capacitiste » visant la re-marchandisation à tout prix, via un nouvel ordre d'employabilité passant par l'acceptation d'une norme d'emploi « médiocre » et, de fait, réduisant la « crédibilité épistémique » de la personne en situation de handicap psychique. Dans les Structures d'Insertion par l'Activité Économique (SIAE) analysées par Hervé Jory dans le cinquième chapitre, la prévalence des compétences d'adaptation sociale sur la formation didactique et le savoir-faire professionnel correspond à une précarisation du profil attendu des publics. L'inversion du statut de la formation, dans ces structures d'insertion, tend à favoriser des conditions d'acceptation de conditions de travail pénibles pour des emplois sous-qualifiés. Ce nouveau cadre normatif de l'inclusion professionnelle repose sur le postulat « d'insérer pour former » où l'insertion se suffit en elle-même. Il s'agit de privilégier l'adaptation quasi immédiate à l'emploi et ses difficultés, en particulier la capacité à supporter des conditions de travail éprouvantes (port de charges lourdes, intempéries…) plutôt que l'intégration de savoirs professionnels et une qualification capitalisable.\n\nL'analyse de tous ces segments de l'intervention sociale est à même d'identifier une logique de responsabilisation des publics et un tournant managérial souvent pénalisants. Mais la grammaire managériale reste fortement questionnée dans les pratiques concrètes des acteurs. Un deuxième grand apport de l'ouvrage est donc d'étudier les engagements moraux et les micro-résistances éthiques des intervenants·es infléchissant parfois certaines modalités de l'intervention sociale. Au-delà des cadres normatifs, des professionnels inventent dès lors des pratiques d'écarts éthiques pour redonner sens à leur action.\n\nAinsi, dans l'urgence sociale présentée par Hélène Marin et Béatrice Bertho (chapitre 3), la mobilisation bénévole de professionnels illustre la volonté de participer à la neutralisation d'un déficit d'action publique récurrent, en contradiction avec les principes moraux de l'État social. Un engagement solidaire, fait en parallèle de leur travail salarié, s'instaure dans une ville de Suisse romane afin de faire face à une « politique de la pénurie » (p. 48) de l'accueil national des personnes sans-abris. Ce « bénévolat solidaire » définit ce que l'on peut appeler une « résistivité morale », des micro-résistances enracinées dans les principes de justice sociale au regard des besoins de ce public en grande vulnérabilité psychique et sociale.\n\nEn définitive, l'intérêt majeur des thèses de cet ouvrage est de souligner une mutation des cadr
