ui était également brûlée par la suite], ayant vocation à la\nprotéger. Sur la liste, était écrit :\n« Ici sont vénérés les deux Esprits-Immortels qui sont respectivement le renard et le putois Immortels répondant à toute demande, le renard et le putois Immortels [termes répétés une fois sur la liste] protégeant la famille. »\n“供俸 有求必应 胡仙黄仙 保家平安 胡黄二仙保家仙之位”\nPrécisons que la liste était abîmée et qu'une partie manquait, mais grâce à son expérience le moine Cheng Zonghe a indiqué que les termes qui doivent normalement y figurer sont « le putois Immortel huang 黄 », et « deux » er 二, pour former cette phrase : le renard et le putois Immortels protégeant la famille. D'ailleurs, ici, le caractère hu 胡 se substitue aussi à hu 狐 par homophonie. Dans ce cas-là, les pratiques religieuses concrètes attestent que la Mère Noire incarne précisément le rôle de la Protectrice liturgique taoïste, de sorte que les animaux Esprits-Immortels puissent être accueillis par le temple taoïste, qui se montre d'une certaine manière pour eux comme une alternative éventuelle, en cas d'abandon par ceux qui en ont la charge et ne sont plus en mesure de leur rendre un culte. Ainsi, cette pratique d'abandon peut être considérée comme une sorte de rituel de « dé-consécration » de tangdan.\n\n<<< PAGE 381 >>>\n\nFigure 17 : la liste confiée au temple sur le point d’être brûlée.\nConclusion :\nL’intégration de la Mère Noire dans le système de la religion taoïste de la Mandchourie est intimement associée à l’arrivée progressive des vagues de migration des chinois Han sur ce territoire, de même qu’à la diffusion et au développement du taoïsme (de l’ordre de la Perfection totale) dans cette région [De nos jours, dans les temples de la Supérieure Wang Liyan fonctionnant en réseau, le culte à la Mère Noire constitue un axe majeur des interférences entre ces temples taoïstes, les religieux, et les fidèles, qui se manifeste pleinement dans les services rituels proposés. Aussi, la Mère Noire s’incorpore-t-elle particulièrement dans les activités liturgiques d’ordre taoïste, dans la mesure où elle y est appelée à moduler les pratiques religieuses et constitue souvent la solution privilégiée face à toutes sortes de cas rencontrés par les requérants en lien avec les animaux Esprits-Immortels, relevant du chamanisme à caractère local. De ce fait, le culte à la Mère Noire, placé aujourd’hui sous l’égide des temples taoïstes, permet aux éléments propres aux pratiques chamaniques d’être institutionnalisés, et aux temples taoïstes de s’enraciner et de prospérer. Par conséquent, une relation triangulaire s’est mise en place entre le culte à la Mère Noire, les animaux Esprits-Immortels, et le système de la religion taoïste. Si l’interaction dynamique entre le chamanisme à caractère local et les pratiques taoïstes paraît propice à l’ancrage régional du taoïsme, le culte à la Mère Noire est alors important, voire central dans la production de ce type d’interaction, qui n’est pourtant pas unidirectionnelle du fait que les strates des éléments chamaniques sont conservées dans le culte à la Mère Noire, en conséquence, ce n’est pas une simple question de sinisation comme cela pourrait paraître, mais aussi une sorte de « mandchourisation ». Somme toute, nous ne pouvons pas étudier ces temples taoïstes en réseau — et dans une plus large mesure, les temples taoïstes et le système de la religion taoïste en Mandchourie — sans tenir compte du culte à la Mère Noire. Et à l’inverse, le culte à la Mère Noire ne pourrait pas être abordé sans prendre en considération les monastères taoïstes répandus sur l’ensemble de ce territoire.\n\n<<< PAGE 383 >>>\n\nConclusion\nDans cette thèse, nous avons étudié la dynamique de la religion taoïste en Mandchourie, à la lumière du contexte évolutif socio-politique. En m'appuyant sur mes observations ethnographiques récentes au sein de plusieurs temples taoïstes en réseau, nous avons accordé une attention particulière aux interactions et aux interdépendances entre le système taoïste local et les pratiques ainsi que les éléments relevant du chamanisme local. Au quotidien dans les temples, les fidèles consultent les officiants taoïstes, qui, en tant que prestataires de services rituels, offrent des réponses religieuses pour résoudre les problèmes qu'ils rencontrent dans leur vie. Comme le décrivent certains moines taoïstes locaux, les temples sont des lieux destinés à guérir les maladies, qu'elles soient visibles ou invisibles (zhibing de difang 治病的地方). Étant donné que les fidèles fréquentant les temples taoïstes proviennent de diverses couches sociales, cela a permis d'observer et d'aborder les différents aspects et particularités de la société au nord de la Grande Muraille à l'heure actuelle.\nLors des échanges entre les religieux et les fidèles au sein de la sphère religieuse, les premiers\nassument le rôle de médiateurs chargés de communiquer entre les requérants et le monde\ncéleste - le monde terrestre, et les divinités. Pour les temples étudiés dans le cadre de cette\nrecherche ethnographique, les récits que les requérants partagent avec les moines taoïstes\nsemblent souvent plus complexes qu'ils ne paraissent à première vue. Bien que les problèmes,\nque les requérants cherchent à résoudre, semblent concerner directement les aspects courants\nde la vie quotidienne tels que la santé, la quête de richesse, le travail et les études, dans de\nnombreux cas, les questions auxquelles les gens cherchent des réponses religieuses sont aussi\nétroitement liées au contexte des transformations historiques, socio-politiques, et en\nparticulier économiques caractérisant la Mandchourie dans ses multiples dimensions.\nDurant nos enquêtes, la notion de la passe Shanhai a été maintes fois abordée, ce qui nous a\nconduit à interroger les significations que peut revêtir ce lieu dans différentes circonstances.\nHistoriquement, la passe Shanhai marquait la frontière géographique entre l'Empire du milieu\net la Mandchourie, alors terre des Mandchous. Aujourd'hui, le lieu est devenu une des passes\ncélèbres du site touristique de la Grande Muraille (là où elle se jette dans l'océan. En plus\nd'employer l'appellation « le Nord-est/Dongbei », d'autres termes sont utilisés pour désigner\n\n<<< PAGE 384 >>>\n\nles deux côtés de Shanhai : guanli (l'intérieur de la muraille) et guanwai (l'extérieur de la muraille). Par conséquent, en plus de « le Nord-est », le terme guanwai est également utilisé pour parler de la Mandchourie. À l'inverse, de nombreuses personnes ont tendance à utiliser guanli pour préciser qu'elles sont migrants ou desscendants de migrants en Mandchourie depuis des décennies. Par exemple, certaines personnes âgées disent qu'elles sont originaires de guanli (« Moi je suis de guanli 我是关里人 »). Cela renvoie en réalité aux vagues migratoires des Chinois Han en Mandchourie.\nAujourd'hui sur le territoire de la RPC, le terme « Mandchourie » (Manzhou 满洲) a presque été effacé dans divers milieux et a même tendance à être jugé \"politiquement incorrect\" et sensible pour les représentants du pouvoir actuel en RPC. En partant d'abord des explications nos interlocuteurs, nous avons exploré les différents motifs susceptibles d'avoir entraîné la disparition de cette appellation, initialement choisie par l'empereur mandchou Huang Taiji en 1635 pour désigner à la fois son pays situé par-delà la passe Shanhai, ainsi que l'ensemble du peuple Jurchen originaire de ce territoire. On peut penser que si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité.\nEn plus de la question du changement d'appellation du territoire, nous avons aussi analysé la complexité des identités observées chez les habitants sur le terrain ethnographique. Plus précisément, être Mandchou(e) à l'heure actuelle ne repose plus simplement sur l'aspect ethnique, comme c'est le cas dans certaines régions également en RPC, telles que le Tibet et le Xinjiang, mais découle plutôt de la participation à une identité partagée et à des valeurs associées à ce territoire situé au nord de la passe Shanhai.\nAujourd'hui, ces peuples vivant dan « le Nord-est de la Chine » forment en réalité un ensemble qui leur est propre. Depuis les temps anciens jusqu'à aujourd'hui, la Mandchourie a connu ses propres évolutions historiques en concomitance avec celles de l'Empire du milieu. Ce dernier a été par le passé plusieurs fois conquis par les pouvoirs issus de la Mandchourie. Ceci n'est pas sans rappeler le fait que même jusqu'à aujourd'hui, tout ce qui est associé à la Mandchourie semble encore constituer une sorte d'altérité dans la perception des habitants chinois des régions du sud de la Grande Muraille. De plus, les vagues migratoires des Chinois ainsi que les mariages interethniques contribuent également au mélange des populations en profondeur au niveau local. Ceci explique donc la particularité du paysage religieux en\n\n<<< PAGE 385 >>>\n\nMandchourie, la supérieure elle-même du temple taoïste au cœur de cette thèse en est l'illustration.\nAu début de la fondation de la RPC, la Mandchourie, récemment acquise par le pouvoir communiste, représentait un espace à exploiter pour contribuer à l'auto-suffisance du régime. Avec le déplacement constant des équipements industriels, du personnel et des ressources naturelles, ce territoire situé au nord de la Grande Muraille, autrefois le pays natal des fondateurs de l'empire mandchou des Qing, est même devenu « le fils aîné de la République (populaire) de Chine ». Cependant, de nos jours, du fait que la Mandchourie n'ait pas vraiment bénéficié des réformes économiques de la Chine mises en place à partir des années 1980, les habitants locaux se sentent pour certains largement abandonnés à tous égards. Ils ont le sentiment que le pouvoir central aurait quelque peu profité d'eux et que leur voix n'aurait pas été prise en considération autant qu'ils l'auraient souhaité. Quelques-uns affirment même que ce territoire est complètement épuisé et en déclin. Ainsi, ils auraient le sentiment que le fossé entre la Mandchourie et les autres provinces chinoises qui ont bénéficié des réformes d'ouverture et des politiques préférentielles s'exacerbe dans diverses dimensions.\nDe plus, on va jusqu'à entendre des discours (dont certains pourraient être officiels) qui laissent entendre que le déclin de la Mandchourie est en grande partie de de son fait, attribué à un esprit fermé et retardataire, à une idéologie anti-marché, et sur un autre registre au climat froid. Et du coup cela rappelle le fait que de nombreux Chinois, de tous milieux confondus, semblent confondre les corollaires avec les causes. Certains considèrent que le « le phénomène du Nord-est » découle de l'épuisement des ressources naturelles et du manque d'ouverture d'esprit. Ainsi, ce qui est perçu comme différentes formes d'exploitation du pouvoir chinois après la fondation de la RPC contribue également à forger une identité commune unissant les peuples de toute la Mandchourie.\nDans ses discours officiels, la RPC semble revendiquer sa légitimité territoriale sur la Mandchourie depuis les temps anciens, de la même manière qu'elle le fait pour le Tibet, la Mongolie et Taïwan. Parallèlement, le Mandchoukouo est également perçu par la RPC comme une intrusion dans l'histoire de la Chine. Aujourd'hui, la plupart des habitants des régions du Nord-est se désignent également comme « les gens du Nord-Est », principalement parce qu'ils ont été éduqués pendant plus de soixante-dix ans dans un contexte social où même mentionner « la Mandchourie » est souvent considéré comme politiquement incorrect,\n\n<<< PAGE 386 >>>\n\net où l'histoire locale de la Mandchourie est de ce fait presque ignorée. Cependant, la question du changement d'appellation mérite notre attention, car elle implique davantage qu'il n'y paraît. Ainsi, les populations chinoises des provinces du Sud désignent tous les habitants de la Mandchourie comme « les gens du Nord-Est », qu'ils viennent du Liaoning, du Jilin, du Heilongjiang ou de l'Est de la Mongolie, sans tenir compte du fait que ces régions représentent plusieurs provinces différentes.\nNotons que cette situation semble singulière. Par exemple, lorsqu'il est nécessaire de se référer aux habitants d'une région du Sud (comme le Hunan, le Canton et le Guangxi), on utilise directement des désignations spécifiques telles que « les gens du Hunan » (*Hunan ren* 湖南人), « les Cantonnais » (*Guangdong ren* 广东人) ou « les gens du Guangxi » (*Guangxi ren* 广西人), sans les regrouper sous une appellation générale telle que « les gens de la Chine du Sud » (*Huanan ren* 华南人). En d'autres termes, ces provinces du Sud ne sont pas perçues comme un ensemble, et leurs habitants ne se considèrent pas non plus comme « compatriotes » s'ils se retrouvent dans une autre région, comme Pékin. En revanche, pour les habitants de la Mandchourie, c'est presque l'inverse. Non seulement ces régions sont considérées comme formant un ensemble aux yeux de nombreux Chinois (le Nord-est), mais les habitants de ces régions du Nord-Est se considèrent réellement comme « compatriotes » lorsqu'ils se rencontrent en dehors de la Mandchourie, au sud de la Grande Muraille.\nDe même, pour les habitants des régions du Nord-Est, les populations du Sud de la Grande Muraille sont encore désignées comme « les peuples de l'intérieur de la passe Shanhai » (*Guanli ren* 关里人), et la Grande Muraille reste en grande partie une frontière symbolique. Qu'ils viennent du Heilongjiang ou du Liaoning, les habitants du Nord-Est perçoivent unanimement la Grande Muraille comme la frontière entre « chez moi » et « ailleurs ». Ainsi, pour une personne du Nord du Heilongjiang, prendre un train vers le sud signifie toujours se sentir chez soi, même en quittant le Heilongjiang pour le Jilin ou le Liaoning. Ce sentiment disparaît presque instantanément lorsque le train traverse la passe Shanhai pour entrer dans la province du Hebei. De même, pour une personne originaire du Heilongjiang, le fait de prendre un train vers le nord quand il est dans le Sud peut déjà évoquer le sentiment de retour chez soi dès que le train quitte le Hebei pour entrer dans le Liaoning. Les habitants locaux de la Mandchourie se désignent ainsi aussi eux-mêmes comme « les gens du Nord-Est », mais le nom « Mandchourie » n'a pas disparu pour autant. Dans le contexte de la RPC, l'appellation « Dongbei/le Nord-est de Chine » est finalement une continuation du terme « la Mandchourie ».\n\n<<< PAGE 387 >>>\n\nLa frontière symbolique de la passe Shanhai de la Grande Muraille existe également et peut-être avant tout dans la sphère religieuse où elle est perçue comme « une ligne de démarcation des eaux » en matière de croyances et de pratiques rituelles. Dans les régions de la Mandchourie, les animaux Esprits-Immortels xianjia, désignés par une appellation générique mais compris localement de façon très précise en référence à cinq catégories d'animaux : hu huang bai liu hui, ou le renard immortel, le putois immortel, le hérisson immortel, le serpent immortel, et la souris immortelle, sont considérés comme relevant des cultures chamaniques, et sont en général respectés au niveau local. Les moines taoïstes locaux racontent aussi que les taoïstes ainsi que les habitants de la Chine du Sud connaissent en général peu -et quand c'est le cas, ont parfois une attitude supérieure voire méprisante concernant- les animaux Esprits-Immortels et les éléments chamaniques de la Mandchourie.\nCette étude ethnographique m'a amenée à étudier les gens sur qui les animaux Esprits-Immortels sont considérés comme s'accrochant, moins à partir des séances thérapeutiques effectuées par celles et ceux qui sont déjà en capacité de guérir les maladies invisibles des autres, qu'à travers certaines situations observées en lien avec les pratiques taoïstes dans le cadre des temples taoïstes. Dans ces temples taoïstes étudiés, les officiants taoïstes et les fidèles indiquent que les animaux Esprits-Immortels se trouvent partout dans ces régions du Nord-est mais qu'à priori ils ne peuvent pas aller au sud de la passe Shanhai. Sauf dans certains cas où l'on a recours à des pratiques rituelles qui peuvent permettre aux esprits d'animaux de passer de l'autre côté de la Grande Muraille. Comme par exemple la fabrique de laissez-passer ou « papiers de dédouanement tamponnés » dits tongguan wendie 通关文牒 qui permettent aux gens sur qui les animaux Esprits-Immortels sont accrochés d'éviter de rencontrer des difficultés lorsqu'ils doivent se rendre au sud de la Grande Muraille – c'est-à-dire l'Empire du milieu.\nEn réalité, même si ce papier de dédouanement n'est apparemment qu'un simple artéfact qui peut s'acheter aujourd'hui dans les boutiques de souvenirs touristiques sur le site de la passe de Shanhai, il est chargé de significations plus importantes que ce qu'il n'y paraît. Car à partir du moment où les moines taoïstes font de cette sorte de souvenirs touristiques un vrai papier de dédouanement dans la sphère religieuse, ce papier contient désormais une efficacité rituelle. Dans ce cas-là, ce laisser-passer symbolique dans le monde religieux s'apparente en quelques sortes aux passeports administratifs du monde terrestre. Le fait que le passage des animaux Esprits-Immortels de l'autre côté de la Grande Muraille nécessite un \"passeport\"\n\n<<< PAGE 388 >>>\n\nconfère aujourd'hui encore à la Grande Muraille son rôle de frontière symbolique dans la sphère religieuse. Cela explique l'expression utilisée par les moines taoïstes pour décrire le sens de la passe Shanhai dans les pratiques religieuses - \"une ligne de démarcation des eaux/ une ligne de partage des eaux entre les lignées taoïstes\" entre les deux côtés de la Grande Muraille. Et d'un autre côté, le fait que la Grande Muraille soit pensée comme une frontière sur le plan religieux explique le fait que les gens des régions de la Mandchourie voient la passe Shanhai comme une séparation entre \"chez soi\" et \"ailleurs\". Ainsi, nous constatons que la passe Shanhai, continuent à exister chez les gens, non plus en tant que frontière physique et administrative entre les deux côtés de la Grande Muraille, comme par le passé, mais bien comme une frontière religieuse qui pose les limites des compétences territoriales des animaux Esprits-Immortels xianjia et par la même de la proximité (et parfois des échanges mutuels) entre taoïsme et chamanisme.\nAussi, la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local. Elle est à ce double titre vénérée dans les temples taoïstes à l'échelle de la Mandchourie. D'un côté, par l'entremise de son culte placé sous l'égide des temples taoïstes, celui des animaux Esprits-Immortels perçus comme relevant du chamanisme local se voit conférer une légitimité. D'un autre côté, grâce à elle, les communautés taoïstes prospèrent et confortent ainsi leur place dans l'orthodoxie locale au fils du temps. À ma connaissance, elle n'est pas du tout reconnue et vénérée ailleurs [de l'autre côté de la passe de Shanhai, ainsi que dans les régions plus au sud]. Par exemple, dans les régions de la Chine du Nord situées au sud de la Grande Muraille, on dit que c'est la Princesse des Nuages colorés Bixia yuanjun 碧霞元君 qui prend particulièrement en charge les Renards Esprits-Immortels. Mais la frontière dans le monde religieux s'avère opératoire : une fois entré en Mandchourie, le contrôle divin sur les esprits d'animaux passe tout de suite de la Princesse des Nuages colorés à la Mère Noire.\nS'il existe en RPC, à percevoir encore aujourd'hui la Mandchourie comme une altérité et en réalité à la déprécier – même si, en apparence, la Mandchourie semble avoir achevé sa « sinisation » pour devenir le « Nord-est de la Chine » –, les populations de ce territoire au nord de la Grande Muraille continuent néanmoins leurs pratiques singulières refusant de se conformer aux valeurs et aux critères des régions du sud. En même temps, la Mandchourie demeure un territoire historiquement accueillant, où tant les vagues migratoires que les\n\n<<< PAGE 389 >>>\n\néléments religieux ont réussi à trouver leur place. Cependant, tout ce qui pénètre en Mandchourie ne peut parvenir à y rester qu'à condition de se soumettre aux ordres intrinsèques de ce territoire. En ce qui concerne les temples taoïstes en réseau ou d'une manière plus large la sphère religieuse en Mandchourie, l'interaction entre le chamanisme à caractère local et les pratiques taoïstes locales se montre dynamique, favorisant également l'ancrage de la religion taoïste en Mandchourie. Plus précisément, la religion taoïste permet aux éléments propres aux pratiques chamaniques de perdurer tout en les plaçant sous son égide et alors que ailleurs, la religion taoïste ne peut s'enraciner et se répandre en Mandchourie qu'à condition que les strates des éléments chamaniques s'inscrivent dans les activités religieuses du taoïsme local. Autrement dit, la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation. Certes, la sinisation est réelle, et elle paraît être évidente, alors que la mandchourisation l'est moins. Mais la mandchourisation n'est pas mineure, au contraire, elle joue un rôle très important, car sans elle, la sinisation n'aurait pas pu prendre son ampleur. Pour la Mandchourie, la sinisation n'est peut-être pas aussi profonde que ce qu'elle paraît. La religion taoïste, en tant que religion venue de l'extérieur, a besoin d'être « mandchourisée » afin de se faire mieux accepter au niveau local quitte à subir le regard critique des taoïstes du sud de la Chine. Cela a permis l'émergence, parmi les populations de la Mandchourie, d'une sorte d'identité commune, qui se traduit notamment par le fait qu'en général, les gens de ces différentes provinces du Nord-est se reconnaissent comme des « compatriotes », et que géographiquement, la délimitation de cette identité commune renvoie toujours à la passe Shanzhai de la Grande Muraille, correspondant à la frontière historique entre l'Empire du milieu et la terre des « Barbares du Nord ».\n===== FIN DE LA CONCLUSION =====\n\n## TÂCHE\n\nReproduis la fiche dans le même format markdown (un `## <slug>` par\nsection, mêmes 12 slugs dans le même ordre), en l'AMÉLIORANT à partir\nde la conclusion :\n\n1. Remplis les sections marquées `[NULL]` si la conclusion fournit\n   l'information.\n2. AMÉLIORE aussi les sections non-nulles : ajoute des nuances, des\n   citations verbatim de la conclusion (entre « … » avec page), corrige\n   les engagements de l'intro qui se révèlent erronés (« nous\n   montrerons » vs ce qui a réellement été démontré).\n3. C'est ici que `these_centrale` est la plus susceptible d'être\n   remplie : la conclusion énonce ce qui a été démontré (présent).\n4. C'est aussi ici que `opposition` peut gagner les résultats\n   contre-intuitifs (« contrairement à nos attentes… »).\n5. `fil_rouge` — la conclusion est l'endroit idéal pour FINALISER cette\n   section : elle confirme quel concept a réellement traversé toutes les\n   parties. Ne retiens qu'UN seul concept et formule-le en UNE phrase\n   montrant comment il relie chaque partie (pas deux concepts séparés\n   par « et »).\n6. `reponses_questions` — c'est LA section à remplir ici. Pour CHAQUE\n   question listée dans `questions_recherche`, cherche dans la\n   conclusion la réponse explicite que l'auteur y apporte. Cite\n   verbatim entre « … » avec la page. Si une question n'obtient pas de\n   réponse explicite dans la conclusion, indique « Pas de réponse\n   explicite dans la conclusion ».\n7. NE JAMAIS INVENTER. Si l'information manque toujours, garde `[NULL]`.\n8. Ne pas raccourcir les sections déjà bien remplies en 2a — conserve\n   leur contenu et ajoute par-dessus.\n\n### Sections (rappel)\n\n- `these_centrale` — L'argument principal DÉMONTRÉ (au présent, depuis la conclusion). Distinct des « nous montrerons » de l'intro. Format : 2-3 phrases MAXIMUM, concises et précises. Première phrase = l'affirmation centrale. Deuxième phrase = le mécanisme ou le processus démontré. Si l'auteur formule sa thèse en phases/étapes, les nommer.\n- `questions_recherche` — Les questions ouvertes au départ. Interrogatives ou objectifs (« il s'agit de comprendre… »).\n- `reponses_questions` — Les réponses explicites que la conclusion apporte à chaque question de recherche. Pour CHAQUE question, cite la réponse verbatim (« … » + page). Si une question reste sans réponse, indique-le. Cette section est `[NULL]` dans l'introduction et ne se remplit qu'avec la conclusion.\n- `hypotheses` — Propositions VÉRIFIABLES, à tester. Une principale + 2-3 secondaires si présentes. NE PAS confondre avec les questions ni avec les lacunes. L'auteur n'a PAS besoin d'employer le mot « hypothèse » : dans les thèses expérimentales ou quantitatives, les **prédictions chiffrées** (« l'analyse mesurera X avec précision Y »), les **claims comparatifs** (« la méthode surpasse Z de N% »), et les **anticipations testables sur les résultats attendus** comptent comme hypothèses. Extraire aussi bien de l'introduction (attentes de départ) que de la conclusion (prédictions à valider).\n- `methodologie` — Approche / méthode / corpus / justification. UNIQUEMENT ce que l'auteur a fait (pas les corpus cités d'autres chercheurs). Structurer en 4 bullets : **Approche**, **Méthode**, **Corpus/Données**, **Justification**. Dans **Méthode** : identifie CHAQUE méthode ou pipeline d'analyse distinct que la thèse met en œuvre ou compare (chaînes de traitement parallèles, méthodes croisées pour validation, approches alternatives testées) — ne JAMAIS réduire une architecture multi-méthodes à la seule méthode que l'auteur détaille le plus.\n- `fil_rouge` — Le concept unique OU la question unique qui relie toutes les parties. Ce n'est PAS le sujet (« le journalisme boursier »), ni le mécanisme (« la métamorphose textuelle »), mais le PRISME sans lequel les parties ne formeraient pas un tout cohérent. Test : le concept proposé joue-t-il un rôle structurant dans CHAQUE partie ? Si non, ce n'est pas le fil rouge. Format : UNE phrase de la forme « [concept] tel que défini par [auteur] (p.X), reliant [partie 1] à [partie N] via [articulation] ».\n- `plan` — Un bullet par grande partie de la thèse. Utilise le TITRE EXACT de chaque partie **tel qu'il apparaît dans la liste PARTIES/CHAPITRES fournie plus bas**, DANS SA LANGUE D'ORIGINE (anglais, français, allemand, etc.) sans traduction. Ne JAMAIS écrire « [Titre non fourni] » ou « [Titre original non fourni] » : les titres sont dans la liste ci-dessous, il suffit de les recopier. Format : « **Titre exact** : Démontre que X en montrant Y ». Pour chaque partie, UNE phrase énonçant ce qu'elle DÉMONTRE (pas son sujet). Interdit : « Présentation de X », « Analyse de Y ». Requis : « Démontre que X en montrant Y ».\n- `cadre_theorique` — Identifier le **cadre principal** (théorique, mathématique, ou méthodologique) qui structure la question de recherche globale, puis 2-5 **cadres secondaires** qui servent d'outils d'analyse spécifiques. Toute thèse mobilise au moins un cadre : un concept sociologique (« conditions d'acceptabilité » de Foucault), un modèle standard (ΛCDM, mécanique quantique, mécanique classique), un formalisme mathématique publié (« estimateur quadratique de Hu & Okamoto 2002 »), un cadre juridique (« droit administratif »), ou un paradigme méthodologique (« ethnographie de Geertz »). NE JAMAIS mettre [NULL] pour une thèse expérimentale ou théorique : identifier le modèle standard ou le formalisme central mobilisé. Pour CHAQUE cadre, nommer l'auteur/source ET son rôle dans l'an éciser s'il s'agit d'une lacune de la littérature (intro) ou d'un résultat contre-intuitif (conclusion).\n- `apport_principal` — Ce que la thèse ajoute qui n'existait PAS avant. Choisir le type de contribution principal et le nommer explicitement en tête de chaque bullet :\n    - **Empirique** : nouvelles données, sources ou cas analysés\n    - **Théorique** : nouveau concept, cadre ou réinterprétation\n    - **Méthodologique** : nouvelle approche ou combinaison de méthodes\n    - **Critique** : remise en cause d'un consensus\n    2-3 phrases maximum. Interdit : décrire la méthode comme apport. Requis : ce que la thèse apporte AU CHAMP ACADÉMIQUE.\n\nLes PARTIES de la thèse (issus de la table des matières) :\n  - Première partie La Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier\n  - Epilogue : Une consultation au temple taoïste Daode\n  - Deuxième partie Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels\n  - Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local\n\n## FORMAT DE RÉPONSE\n\nMêmes règles qu'en 2a : markdown strict, un `## <slug>` par section,\ndans l'ordre exact, aucun texte hors sections, pas de fences.\n\nSections attendues, dans cet ordre :\n  - these_centrale\n  - questions_recherche\n  - reponses_questions\n  - hypotheses\n  - methodologie\n  - fil_rouge\n  - plan\n  - cadre_theorique\n  - concepts_cles\n  - ancrage_empirique\n  - opposition\n  - apport_principal\n", "reasoning": "Here's a thinking process:\n\n1.  **Analyze User Input:**\n    - **Role:** Expert in analyzing academic theses in humanities and social sciences.\n    - **Task:** Fill out a synthesis sheet based on a provided partial sheet (from introduction) and a complete conclusion (pp. 380-389).\n    - **Rules:**\n        - Strict markdown format with `## <slug>` headers.\n        - Headers must exactly match the provided s ionnalisées sous l'égide taoïste, tout en conférant aux temples taoïstes une légitimité et une prospérité locales (p. 381). En retour, le taoïsme doit s'adapter au chamanisme pour survivre et se développer dans cette région, créant ainsi une identité religieuse et territoriale singulière au nord de la Grande Muraille (p. 389).\n\n## questions_recherche\n- « étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie » (p. 23)\n- « comprendre le rôle de ces temples dans la société d'aujourd'hui » (p. 23)\n\n## reponses_questions\n- Pour la question sur les dynamiques et interactions : « l'interaction dynamique entre le chamanisme à caractère local et les pratiques taoïstes paraît propice à l'ancrage régional du taoïsme, le culte à la Mère Noire est alors important, voire central dans la production de ce type d'interaction » (p. 381) ; « la religion taoïste permet aux éléments propres aux pratiques chamaniques de perdurer tout en les plaçant sous son égide et alors que ailleurs, la religion taoïste ne peut s'enraciner et se répandre en Mandchourie qu'à condition que les strates des éléments chamaniques s'inscrivent dans les activités religieuses du taoïsme local » (p. 389).\n- Pour la question sur le rôle des temples : « les temples sont des lieux destinés à guérir les maladies, qu'elles soient visibles ou invisibles » (p. 383) ; « grâce à elle [la Mère Noire], les communautés taoïstes prospèrent et confortent ainsi leur place dans l'orthodoxie locale au fils du temps » (p. 388) ; « les officiants taoïstes et les fidèles indiquent que les animaux Esprits-Immortels se trouvent partout dans ces régions du Nord-est mais qu'à priori ils ne peuvent pas aller au sud de la passe Shanhai » (p. 387).\n\n## hypotheses\n[NULL]\n\n## methodologie\n- **Approche** : « Cette thèse ethnographique porte sur la religion taoïste en Mandchourie » (p. 23) ; « étude ethnographique » (p. 383)\n- **Méthode** : « observations participantes » (p. 23) ; « observations ethnographiques récentes » (p. 383)\n- **Corpus/Données** : « deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin » (p. 23) ; « consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles » (p. 23) ; « plusieurs temples taoïstes en réseau » (p. 383)\n- **Justification** : « Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire » (p. 23) ; « cela a permis d'observer et d'aborder les différents aspects et particularités de la société au nord de la Grande Muraille à l'heure actuelle » (p. 383)\n\n## fil_rouge\nLa passe Shanhai comme frontière symbolique et religieuse structurante (p. 387), reliant la transformation identitaire et politique de la Mandchourie (Partie 1) aux consultations et pratiques rituelles quotidiennes (Partie 2) et aux interactions institutionnelles entre taoïsme et chamanisme (Partie 3) via la délimitation des compétences territoriales des esprits et la légitimation du culte à la Mère Noire (p. 388).\n\n## plan\n- **Première partie La Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier** : Démontre que la Mandchourie a forgé une identité collective distincte malgré l'effacement politique du terme, en montrant comment la passe Shanhai fonctionne comme frontière symbolique entre « chez soi » et « ailleurs » pour les habitants (p. 384).\n- **Epilogue : Une consultation au temple taoïste Daode** : [NULL]\n- **Deuxième partie Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels** : Démontre que les temples taoïstes répondent à des problèmes quotidiens et historiques profonds, en montrant comment les moines agissent comme médiateurs entre le monde terrestre, le monde céleste et les divinités pour résoudre des maux visibles ou invisibles (p. 383).\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que le taoïsme ne s'enracine qu'en intégrant le chamanisme local, en montrant comment le culte à la Mère Noire institutionnalise les animaux Esprits-Immortels et produit une « mandchourisation » réciproque (p. 389).\n\n## cadre_theorique\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n\n## concepts_cles\n- **CONCEPT** : MANDCHOURISATION\n- **SENS** : « la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation » (p. 389)\n- **ORIGINE** : propre à l'auteur, construit en opposition dialectique à la « sinisation » pour décrire l'adaptation réciproque et l'ancrage local du taoïsme.\n- **CONCEPT** : PASSES SHANHAI (FRONTIÈRE SYMBOLIQUE)\n- **SENS** : « la passe Shanhai, continuent à exister chez les gens, non plus en tant que frontière physique et administrative entre les deux côtés de la Grande Muraille, comme par le passé, mais bien comme une frontière religieuse qui pose les limites des compétences territoriales des animaux Esprits-Immortels xianjia » (p. 388)\n- **ORIGINE** : propre à l'auteur, redéfini à partir d'un marqueur géographique/historique pour en faire un opérateur de démarcation identitaire et rituelle.\n- **CONCEPT** : MÈRE NOIRE (DIVINITÉ INTERFACIALE)\n- **SENS** : « la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local » (p. 388)\n- **ORIGINE** : propre à l'auteur, conceptualisé comme nœud institutionnel permettant l'articulation entre orthodoxie taoïste et chamanisme populaire.\n- **CONCEPT** : ANIMAUX ESPRITS-IMMORTELS (XIANJIA)\n- **SENS** : « les animaux Esprits-Immortels xianjia, désignés par une appellation générique mais compris localement de façon très précise en référence à cinq catégories d'animaux : hu huang bai liu hui, ou le renard immortel, le putois immortel, le hérisson immortel, le serpent immortel, et la souris immortelle, sont considérés comme relevant des cultures chamaniques » (p. 387)\n- **ORIGINE** : emprunté au vocabulaire local chamanique et retravaillé par l'auteur pour analyser leur gestion ritualisée et leur territorialité symbolique.\n\n## ancrage_empirique\n- Temples taoïstes de l'ordre monastique Quanzhen 全真 à Qiqihar (Heilongjiang) et Liuhe (Jilin), dirigés par la même supérieure taoïste (p. 23)\n- Consultations entre officiants taoïstes et fidèles servant de cas d'étude (p. 23)\n- Liste rouge vouée au culte des Esprits-Immortels renard et putois (« 供俸 有求必应 胡仙黄仙 保家平安 胡黄二仙保家仙之位 ») brûlée au temple (p. 380)\n- Papiers de dédouanement rituels « tongguan wendie 通关文牒 » vendus comme souvenirs touristiques à Shanhai mais investis d'une efficacité rituelle pour les esprits d'animaux (p. 387)\n\n## opposition\n- **Sinisation unidirectionnelle** : « ce n'est pas une simple question de sinisation comme cela pourrait paraître, mais aussi une sorte de « mandchourisation » » (p. 381) ; la thèse rejette l'idée que le taoïsme ait simplement remplacé ou absorbé passivement le chamanisme, montrant au contraire une adaptation mutuelle et une conservation des strates chamaniques (p. 389).\n- **Déclin attribué uniquement à des facteurs endogènes** : « on va jusqu'à entendre des discours [...] qui laissent entendre que le déclin de la Mandchourie est en grande partie de de son fait, attribué à un esprit fermé et retardataire, à une idéologie anti-marché, et sur un autre registre au climat froid » (p. 385) ; l'auteur nuance cette vision en rappelant l'exploitation historique des ressources et le sentiment d'abandon face aux réformes économiques (p. 385).\n- **Effacement politique du terme « Mandchourie » comme simple neutralité** : « si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité » (p. 384) ; l'auteur oppose cette interprétation géopolitique active aux discours officiels qui présentent le changement comme anodin ou technique.\n\n## apport_principal\n- **Théorique** : Introduce le concept de « mandchourisation » réciproque pour dépasser le paradigme dominant de la « sinisation » unidirectionnelle, montrant comment le taoïsme Quanzhen doit s'adapter au chamanisme local pour s'enraciner (p. 389).\n- **Empirique** : Documente pour la première fois le rôle structurant du culte à la Mère Noire comme interface institutionnelle légitimant les animaux Esprits-Immortels dan urie.\n**Mots-clefs** : religion taoïste, vie monacale, consultations, pratiques rituelles, Grande Muraille, Mandchourie, ethnographie\n===== FIN RÉSUMÉ =====\n\n## TÂCHE\n\nCompare le résumé à la fiche, section par section. Réponds en MODE\nDELTA : tu ne réécris QUE les sections que le résumé permet d'améliorer.\n\n1. Le résumé contient souvent la **thèse centrale** en forme condensée\n   — vérifie si `these_centrale` peut être complétée ou affinée.\n2. Les **mots-clés** du résumé peuvent suggérer des concepts manquants\n   pour `concepts_cles`.\n3. La **méthodologie** y est souvent résumée en une phrase — ajoute des\n   précisions si elles manquent.\n4. Le résumé peut contenir le **fil rouge** de la thèse de manière\n   très synthétique.\n5. NE JAMAIS INVENTER. NE PAS raccourcir les sections déjà bien\n   remplies — quand tu réécris une section, conserve son contenu\n   existant et ajoute par-dessus ce que le résumé apporte de neuf.\n   RÈGLE ABSOLUE : conserve TOUTES les références de page « (p. N) »\n   déjà présentes dans la section que tu réécris. Le résumé ne\n   contient pas de numéros de page — une réécriture qui perd les\n   ancrages existants est une RÉGRESSION, jamais une amélioration.\n6. Si le résumé n'apporte RIEN de nouveau à une section, écris\n   EXACTEMENT `[INCHANGÉ]` comme seul contenu de la section — NE\n   recopie JAMAIS son texte. La version précédente sera conservée\n   automatiquement.\n\n### Sections (rappel)\n\n- `these_centrale` — L'argument principal DÉMONTRÉ (au présent, depuis la conclusion). Distinct des « nous montrerons » de l'intro. Format : 2-3 phrases MAXIMUM, concises et précises. Première phrase = l'affirmation centrale. Deuxième phrase = le mécanisme ou le processus démontré. Si l'auteur formule sa thèse en phases/étapes, les nommer.\n- `questions_recherche` — Les questions ouvertes au départ. Interrogatives ou objectifs (« il s'agit de comprendre… »).\n- `reponses_questions` — Les réponses explicites que la conclusion apport ssent comme médiateurs entre le monde terrestre, le monde céleste et les divinités pour résoudre des maux visibles ou invisibles (p. 383).\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que le taoïsme ne s'enracine qu'en intégrant le chamanisme local, en montrant comment le culte à la Mère Noire institutionnalise les animaux Esprits-Immortels et produit une « mandchourisation » réciproque (p. 389).\n\n## cadre_theorique\n\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n\n## concepts_cles\n\n- **CONCEPT** : MANDCHOURISATION\n- **SENS** : « la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation » (p. 389)\n- **ORIGINE** : propre à l'auteur, construit en opposition dialectique à la « sinisation » pour décrire l'adaptation réciproque et l'ancrage local du taoïsme.\n- **CONCEPT** : PASSES SHANHAI (FRONTIÈRE SYMBOLIQUE)\n- **SENS**
