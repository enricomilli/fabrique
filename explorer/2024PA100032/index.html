méridionale est la zone nomade des Mongols de Dorbod et de Gorlos, la partie septentrionale est la terre de pêche et de chasse des Daur, des Evenks, des Oroqens, et des autres groupes ethniques. [...] La ville de Qiqihar est un chef-d'œuvre architectural des Daur et d'autres peuples indigènes. De 1699, lorsque le général du Heilongjiang s'est installé dans la ville, à 1954, où le gouvernement provincial du Heilongjiang a déménagé à Harbin, Qiqihar a toujours été le centre politique, militaire et culturel du Heilongjiang. Sous la dynastie mandchoue, la ville était fortifiée par les fonctionnaires et les soldats des huit bannières¹⁵ selon les positions, les bureaux administratifs, les résidences, les temples et les habitations étaient déployés dans des zones distinctes, dont les traces se perpétuent encore aujourd'hui. »\n> \n> “从民族分布看，黑龙江东部地区为满族的势力范围，西部为蒙古、卦勒察、锡伯人游牧之地，南部为杜尔伯特、郭尔罗斯蒙古游牧区域，北部则为达斡尔、鄂温克、鄂伦春等各民族渔猎之地。 [...] 齐齐哈尔城是达斡尔等土著居民的建筑杰作。自康熙三十八年（1699 年）黑龙江将军移驻到 1954 年黑龙江省政府迁往\n\n<<< PAGE 42 >>>\n\n哈尔滨市，齐齐哈尔城始终是黑龙江政治、军事、文化中心。清代，齐齐哈尔城八旗官兵按方位布防，衙署、府邸、庙宇、民居等分片部署，直至现在仍有遗存。”¹⁶\nLa ville de Qiqihar fut la capitale du Heilongjiang entre le début de la dynastie mandchoue et 1954¹⁷. Sa fondation remonte aux conflits militaires de la fin du XVIIème siècle. À cette époque, d'abord, à cause des invasions russes continues, les Daurs et les Evenks qui habitaient originellement dans le Nord du Heilongjiang¹⁸, furent obligés de se déplacer et de s'installer au long de la rivière Nen Nenjiang 嫩江¹⁹. Ensuite, l'arrivée des Mongols khalkhas et des Balgas sur la rive droite de la rivière Nen perturba les Daurs et les Evenks qui y vivaient déjà. Pour reprendre une citation de Zhang Shousheng :\n> « Après l'invasion russe du fleuve Heilongjiang et de ses affluents, les tribus ethniques Daur et Evenk, n'ont pas supporté l'humiliation été submergées par les brimades et se sont déplacées en grand nombre vers le sud. Selon les archives historiques, la vallée de la rivière Nen était à l'époque une vaste prairie, une zone humide, une forêt dense et très peu peuplée. Les peuples Daur et Evenk, qui ont migré vers le sud depuis le fleuve de l'amour (en mandchou : sahaliyan ula, en pinyin : Heilongjiang) et la rivière Zeïa (en mandchou : Jingkiri bira, en pinyin : Jingqili), se sont installés sur les rives de la rivière Nen avec leur bétail, dont les vaches, les chevaux et les moutons, paissant des deux côtés de la rivière, et se sont répartis en dizaines de villages, s'étendant sur plus de cinq cents kilomètres, formant ainsi une zone de peuplement permanent. »\n俄军入侵黑龙江及其各支流后，达斡尔、鄂温克等民族部落不堪欺凌，大量南迁。据史志记载，当时的嫩江流域，草原辽阔、湿地纵横、森林密布、定居居民稀少。从黑龙江、精奇里江一带南迁的达斡尔人、鄂温克人，携牛马羊驼徙嫩江之滨，放牧于两岸，分布为数十屯，绵延千余里，形成永久聚居地带。²⁰\nLes Daurs et les Evenks se trouvèrent donc en proie à des conflits causés par des milliers de Mongols khalkhas et des Balgas arrivés subitement. Dans cette circonstance, le premier\n\n<<< PAGE 43 >>>\n\ngénéral du Heilongjiang, dénommé Sabusu (en mandchou : 萨布素, en chinois : 萨布素), fit un\ndéplacement dans le cadre d'une mission à Pékin. Le 23ème jour du premier mois lunaire de\n1691, à la trentième année du règne de l'empereur Kangxi²¹, Sabusu adressa une demande de\nconstruction d'une nouvelle ville à l'empereur. Ce dernier donna un avis positif en répondant\nainsi :\n« Construisez la ville pendant que vous en avez le temps, sans retarder la saison agricole. » (“著不误农时，乘闲筑城。”)²²\nFigure 4 : Le document officiel écrit en mandchou portant l'autorisation de l'empereur Kangxi de la construction de la ville de Qiqihar. (Source : cité par Zhang Shousheng dans son article « Shishi feifei – Qiqihar jianchengshi gong'an zhiyi » 是是非非 – 齐齐哈尔建城史案之一 (« Le vrai et le faux – L'une des controverses publiques au sujet de l'histoire de la construction de Qiqihar) publié sur son blog https://mp.weixin.qq.com/s/5CSEnInPv5dS0qWYpRKLBg).\nAu moment où la suggestion de la construction d'une nouvelle ville fut approuvée par\nl'empereur Kangxi, celui-ci désigna un endroit situé près du relais de poste²³ Bukui bukui\n\n<<< PAGE 44 >>>\n\nyizhan 卜奎驿站 (dont j'expliquerai le nom par la suite) pour lancer les travaux de construction de la ville en projet. Du fait que le relais de poste Bukui se trouvait sur le côté est de la rivière Nen, l'idée était de construire une ville du même côté, en sorte de faciliter le transport en évitant la traversée de la rivière. En outre, le choix de cet emplacement s'explique par la perspective de se défendre contre les invasions russes²⁴. Dès son retour dans le Heilongjiang, le général Sabusu débattit sans tarder avec Mabudai 玛布岱²⁵, cette consultation entre les deux personnages a rapidement permis de concrétiser la construction de la ville.\n« À la 31ème année du règne de Kangxi, une nouvelle ville fut sortie de terre grâce aux efforts conjoints des Daurs et des soldats stationnés dans la ville. » “康熙三十一年，在达斡尔族与驻城官兵的共同努力下，一座新城拔地而起。”²⁶\nDepuis, dans le bassin de la rivière Nen à l'époque de Kangxi, trois villes de garnison et de bastions militaires du Heilongjiang furent construites, dont Mergen 墨尔根 (en mandchou : Mergen, en pinyin : Moergen)²⁷ en amont de la rivière Nen, Qiqihar au milieu, et la ville de Bedune (en mandchou : Beudun, en pinyin : Boduna)²⁸ sur le cours moyen de la rivière²⁹. Quant au nom de la ville, comme démontre l'historien Tan Yanqiao, il s'agit plutôt de la translittération de la langue daure³⁰, car la ville se situe dans la région de la plaine de Nenjiang (Nenjiang pingyuan 嫩江平原) où l'eau et l'herbe sont en très grande abondance, et formant ainsi une pâture naturelle³¹.\nEn outre, la ville de Qiqihar possède un surnom : Bukui 卜奎. Même de nos jours, celui-ci reste encore si présent que beaucoup de magasins et de restaurants sont nommés Bukui. D'ailleurs, l'un des boulevards principaux de la ville qui va du nord au sud est également\n\n<<< PAGE 45 >>>\n\nappelé le boulevard Bukui (Bukui dajie 卜奎大街). De ce fait, la question qui se pose à nous est de trouver des origines de ce nom. En fait, le terme Bukui se réfère initialement à un personnage historique daur. Toujours dans l'ouvrage de l'historien Tan Yanqiao, quelques pistes nous sont données :\n« Bukui fut à l'origine le nom d'une personne. Il s'agissait du gouverneur en chef des Solons au début du règne de Kangxi. Il se chargeait du transport des familles des soldats Daur vers le Heilongjiang avec un autre gouverneur en chef dénommé Zamusu. Et avec le général du Heilongjiang, Sabusu, il dirigeait la récolte du bois et la construction de logements pour les soldats et leurs familles. Bukui semble avoir eu plus d'influence que les autres gouverneurs et avoir eu son propre territoire [...]. Bukui était au poste du gouverneur général des Solons et des Daurs. En raison de sa présence et de son influence, le village qu'il habitait, ou celui sur lequel il avait juridiction a reçu son propre nom, conformément à la coutume Daur de donner à un lieu le nom d'une personne de grande renommée. » « 卜奎原系人名，他于康熙初年曾任索伦总管，他曾与另一总管扎木苏等共同负责接送达斡尔兵丁的家眷到黑龙江，并与黑龙江将军萨布素一同率领官兵采伐木料、建造官兵及家属住房。卜奎的影响似乎比别的总管要大，并且有自己的占地 [...] 卜奎的职任是索伦、达斡尔总管，由于他的存在和影响，才依照达斡尔族以享有名望的人名命一地之名的习惯，将他本人所居或管辖的村落命以本人之名。»³²\nEn réalité, le village portant également le nom de Bukui mentionné dans la dernière phrase de ce paragraphe cité et traduit, renvoie au village Bukui (Bukui cun 卜奎村), situé sur la rive ouest de la rivière Nen, en face du terrain qui deviendra la ville de Qiqihar. Ce village en question était à l'origine habité par les Daurs. Bukui, en tant que gouverneur des Solons et des Daurs, fut aussi le prédécesseur de Mabudai évoqué plus haut. Sachant qu'autour de l'année où les travaux de construction de la ville de Qiqihar s'apprêtaient à se concrétiser, Bukui tomba malade, souffrant de paralysie de la moitié du corps, c'est alors que, Mabudai lui succéda.\nUne étude des sources concernant les détails de la fondation de la ville de Qiqihar nous aide à comprendre combien les affinités de cette ville de Mandchourie du Nord avec les cultures Daur et Mandchou peuvent être profondes, notamment sur le plan de sa construction, et à\n\n--- 2.1 Les mélanges de populations au niveau local (pp.79-90) ---\n<<< PAGE 79 >>>\n\nnationalistes, définissant les non-Han comme « ethnies-minoritaires » : *Shaoshu minzu* 少数民族.\n## 2.1 Les mélanges de populations au niveau local\n### a) Les Mandchou·e·s et le système des huit bannières\nIl arrive à de nombreux habitants des régions du Nord-est d'avoir été enregistré·e·s comme Han sur leur carnet de résidence *hukou*⁹¹, quel que soit le véritable statut de leur ethnie originelle. Cette situation peut être expliquée tant par les intermariages que par le changement massif de patronymes des ethnies locales durant le siècle précédent. Comme ce que Bijia Chen, Cameron Campbell et Hao Dong indiquaient dans leur article consacré à l'étude sur les mariages mixtes entre les Mandchous et les Chinois Han dans le comté de Shuangcheng, au Heilongjiang, durant les dernières décennies de la dynastie mandchoue : « Sociologists routinely study the assimilation of ethnic groups by examining intermarriage. While assimilation is a complex process that cannot be reduced to a single indicator »⁹². Ainsi, l'idée ne sera pas d'étudier la question de façon exhaustive, mais de l'aborder en nous basant sur les données observées dans la sphère religieuse. Ainsi les temples, en tant qu'interfaces avec la population, nous offrent-ils une approche précieuse pour prendre en considération l'évolution de certaines conséquences sociales, politiques et culturelles de la sinisation sur ce territoire multiethnique, historiquement peuplé de populations indigènes non-Han. Cette façon de procéder nous permettra de mieux comprendre la société par-delà la Grande Muraille, ainsi que la société chinoise contemporaine au sens plus large.\nLa question de la complexité des identités concerne en premier lieu la Supérieure Wang Liyan, gestionnaire de plusieurs temples taoïstes répandus du Jilin au Heilongjiang et l'un des principaux protagonistes de cette recherche. On doit à la Supérieure d'avoir contribué à sauver le site de l'ancien temple aux cinq religions qui allait être détruit lors de la rénovation\n\n<<< PAGE 80 >>>\n\ndu quartier, puis d'y avoir reconstruit un temple taoïste. En tant que gestionnaire de plusieurs autres temples taoïstes, elle est au quotidien souvent en déplacements : soit elle va assister à des réunions à différents échelons politiques, du fait qu'elle est également vice-présidente de l'Association taoïste du Heilongjiang, soit elle va répondre aux demandes de fidèles et de moines en tous lieux. Si bien que même ses disciples ne sont en général pas capables d'indiquer l'endroit précis où elle se trouve quand elle n'est pas au sein des temples. Les quelques conversations que nous avons menées avec elle ont eu lieu lorsqu'elle était présente à Qiqihar, ainsi qu'au mont Luotong à Liuhe, dans le Jilin, d'où elle est originaire, où elle a construit son premier temple et où elle continue à se rendre régulièrement<sup>93<\/sup>.\nPlus spécifiquement, l'intérêt pour nous d'évoquer ici le cas de Wang Liyan est double. En plus d'être la supérieure de plusieurs temples et de les faire fonctionner en réseau, elle est elle-même née dans une famille mixte, avec un père mandchou et une mère chinoise Han<sup>94<\/sup>, et ce, alors qu'il est bel et bien écrit « Han » sur son carnet de résidence, comme c'est le cas de nombreux habitants de la Mandchourie ayant des origines non-Han.\n> « [...] En effet, je suis Mandchoue. Toutefois, nous avons été enregistrés 'Han' sur notre carnet de résidence lors du Recensement général démographique *Renkou pucha* 人口普查 par le passé. Après, cela n'a plus été possible de le corriger... Car mon père était décédé, et c'est lui qui était Mandchou. Autrefois, chez nous, quand j'étais enfant, on se parlait entre nous en utilisant par exemple, *ama* [terme mandchou signifiant père], et *eniye* [terme mandchou signifiant mère], ou encore *nene*, une façon moins formelle d'appeler sa maman. Ma tante paternelle nous parlait en mandchou quand j'étais petite. [...] Notre famille était issue de la bannière jaune *Zhenghuangqi* 正黄旗. [...] Il me semble que l'une de mes tantes paternelles était chamane, mais je n'en suis pas sûre. Mon père, ainsi que ses soeurs, sont tous décédés. Ils auraient près de cent ans s'ils étaient encore vivants aujourd'hui...<sup>95<\/sup> »\nDans les récits de Wang Liyan, la question des mariages mixtes entre les Chinois Han et les populations indigènes apparait de façon prégnante. Du fait que de nombreux Mandchous ont été enregistrés comme Chinois Han sur leur carnet de résidence ces dernières décennies, le\n\n<<< PAGE 81 >>>\n\nnombre exact d'intermariages à notre époque contemporaine est difficile à évaluer. Pourtant, certaines recherches montrent que les mariages mixtes entre Mandchous et Chinois Han ne datent évidemment pas des temps récents. Comme le précise Rawski :\n> « The policies that governed marriages between bannermen and civilians changed over time. Right after the Qing was established, intermarriage between Manchu and Han was encouraged in order to reduce tensions between the two groups. However, the policy did not work well and the Qing court quietly canceled the policy soon afterwards. »⁹⁶\nAilleurs, Bijia Chen, Cameron Campbell et Hao Dong concluent :\n> « [...] The chances of intermarriage increased over time. This may have been the result of a number of factors. The non-Han may have become steadily less privileged in the last decades of the Qing, so that status homogamy no longer contributed to ethnic homogamy. »⁹⁷\nPar extension, il convient aussi de fournir ici un éclairage sur le système de parenté mandchoue, en nous référant à certains témoignages de personnes ayant des origines mandchoues : de Mme Wang Yu, âgée de plus de soixante ans, habitante du village mandchou Zhalong⁹⁸, et du fidèle Guan de la bannière autonome daur de Morin Dawa, la Mongolie intérieure de l'Est. Précisions d'abord que Mme Wang Yu a évoqué dans son récit les questions liées à la parenté mandchoue à partir de ses propres expériences, ainsi que de son l'histoire familiale de ses générations précédentes. Les informations relatées par M. Guan nous permettront quant à elles de mettre en évidence un autre aspect relevant du système de parenté chez les Mandchous : le changement du nom de famille des femmes mariées mandchoues au moment de leur décès.\nD'après M. Guan :\n> « Par exemple, dans le cas où les femmes du clan Yehe épousent [les hommes] du clan Jianzhou⁹⁹, une fois qu'elles seront inscrites (après leur décès) sur le *tangzi*, autrement dit l'autel familial, leur nom prendra naturellement le patronyme de leur mari ; leur nom de famille d'origine sera conservé en dessous, mais celui de leur mari restera le premier. Si un parent de ma famille est décédé et que son nom de famille d'origine est Wang, une fois inscrit sur notre autel familial, le nom devient donc GuanWang : Wang n'est pas changé, mais le nom de famille du mari doit être ajouté devant. C'est quelque chose d'assez ordinaire chez les populations mandchoues, mais par le passé, chez certains nobles ou personnes ayant un certain pouvoir, c'était peut-être différent. »\n\n<<< PAGE 82 >>>\n\n“比如叶赫部女子嫁给建州部，这样的话，她们以后一旦上了所说的堂子，也就是家堂上，她的名字自然就会跟夫姓，然后下面也会保留她的原姓，但是上面要跟夫姓。假如我家一亲属去世，她原姓姓王，但是一旦上了我们的家堂上，就是矣王氏，这个王是不改的，但前面要加夫姓。这件事在普通满族群众里很正常，但以前在一些贵族或有一些势力的人里很难说。”\nDe plus, M. Guan a donné également l'exemple de sa grand-mère paternelle en précisant que le patronyme original de cette dernière était Liu 刘. Après son décès, son nom de famille enregistré sur le registre généalogique est devenu Guan Liu 矣刘.\nLe témoignage de M. Guan nous fait comprendre que, par le passé, chez les Mandchous en général, lorsqu'une femme mariée décédait, au moment où son nom était inscrit sur le registre généalogique, il était usuel que le patronyme de son mari précédât le sien.\nPar ailleurs, il convient également de nous interroger sur une autre notion à laquelle M. Guan s'est référé : tangzi 堂子 (en mandchou : tǎngzǐ, en lettres latines : tangse, en pinyin : tangzi)¹⁰⁰. Il s'agit d'un sanctuaire familial où les ancêtres d'une famille reçoivent le culte rendu par leurs descendants. Lors des conquêtes visant à l'unification des tribus des Jurchens, Nurhachi détruisit les sanctuaires tangzi des tribus conquises en leur imposant ceux du clan Aisin Gioro dont il était issu. Voici ce que conclut Alan Richard Sweeten:\n> « Many Manchu lineages also had a deity altar (Ch. tangzi; Ma. Tangse) where the elite prayed and performed rites. As Nurhachi centralized power, he conducted his imperial domestic rites at a special tangzi in Hetu Ala, then later and new one built in Liaoyang and Shenyang. [...] The tangzi built at the palace in Shenyang thus became an imperial shamanic temple where the ruler communicated with Heaven via a sacred pole. [...]\n\n<<< PAGE 83 >>>\n\nBesides worship of Heaven and ancestors, Buddhist as well as Chinese deities were revered. Rites at the tangzi usually concluded with an expression of Confucian etiquette, three kneelings and nine prostrations. »¹⁰¹\nCette précision nous indique qu'auparavant le *tangzi*, en tant que sanctuaire familial chez les Mandchous, est aussi associé aux croyances chamaniques en plus d'être le lieu où les ancêtres sont vénérés. Aujourd'hui, nous constatons que dans les propos des gens en Mandchourie, le terme *tangzi* existe encore et est devenu une expression courante dans la sphère religieuse, tout en ayant pris une dimension plus étendue. Désormais *tangzi* désigne notamment les sanctuaires familiaux où les entités relevant du chamanisme local – dits les esprits d'animaux –, sont vénérées. En plus d'employer le terme *tangzi*, les gens en Mandchourie utilisent aussi le terme *tangkou 堂口* pour se référer à ce type de sanctuaires.\nQuant aux propos de l'interlocutrice Mme Wang Yu, qui habite dans l'ancien village mandchou Zhalong datant de plus de trois cents ans, dans une banlieue éloignée de Qiqihar (mais datant d'avant Qiqihar), voici ce qu'elle nous rapporte :\n« Les Mandchous prennent le nom de famille de leur père, la transmission lignagère¹⁰² dépend de celle du patronyme en ligne paternelle. Ce qui distingue les Mandchous des autres groupes ethniques, c'est qu'ils attachent une grande importance aux femmes. Après le mariage, le nom de famille de la femme doit être précédé de celui de son mari. Par exemple, si le nom de famille de l'homme est Guan, et celui de la femme Cang, la femme sera donc renommée GuanCang une fois mariée. Lorsque la fille mariée retourne voir sa famille d'origine, elle y est reçue comme une hôte distinguée. [...] Les générations précédentes parlaient bien le mandchou par le passé, alors que pour notre génération, ce n'est plus le cas. Parce que Zhalong était un lieu bien desservi par le réseau routier, beaucoup de Chinois Han sont venus s'y installer, et avec le temps y ont introduit la culture Han, et c'est ainsi que s'est faite la sinisation. À une époque, durant la révolution culturelle, tout le monde fut obligé de parler chinois (le mandarin) ; parler mandchou était proscrit. La répression vis-à-vis de cette culture (la culture mandchoue) a été plutôt violente, parce que (le règne de) la dynastie mandchoue était encore très proche. De ce fait, la langue mandchoue a été particulièrement réprimée. Nous, en tant que peuple, existions bel et bien depuis le temps des Sushens avant de devenir Jurchens. [...] Le vieux Khan\n\n<<< PAGE 84 >>>\n\n(Nurhachi) gouvernait le pays avec beaucoup de sagesse, les Mandchous possédaient un système de huit bannières. Il existait également huit bannières Han, et huit bannières mongoles¹⁰³. [...] Mais les Mandchous perpétuaient aussi leur sang dans ces bannières ; comment faisaient-elles? Ils mariaient leurs filles aux Han : cela permettait la transmission du sang mandchou à une descendance alliée et dévouée aux Mandchous ; [...] Dans les faits, les huit bannières Han se sont formées quand les membres issus de familles royales ont épousé des Han ; ils s'unissaient par le mariage. Il y eut de même des intermariages entre Mandchous et Mongols. Ainsi, les membres tant des huit bannières mandchoues, que des huit bannières mongoles et Han, sont toutes de sang mandchou. Sans ce lien de consanguinité, il n'aurait pas été envisageable de pratiquer le chamanisme. Certaines choses peuvent être négligées, mais pas la consanguinité, sans laquelle il n'est pas possible de recevoir les messages transmis par les divinités (linggan 灵感¹⁰⁴). De ce fait, il est donc juste de parler des huit bannières Han, mais il y a toujours du sang mandchou qui coule dans leurs veines. [...] En ce qui concerne notre famille, mon père était issu de la bannière Han. Le patronyme de mon arrière-grand-mère était Guan. Quand elle a épousé un homme de la famille Wang, elle s'est appelée WangGuan. Et ma mère, elle est également de pure souche mandchoue, car dans cette région, la plupart des gens sont mandchous, et les Han sont minoritaires. [...] Beaucoup de gens considèrent que le fait d'être dénommé Wang équivaut à être \"Han\". Or, ce qu'ils ignorent, c'est que parmi les gens venus s'installer dans les régions du Nord-est, 70% ont déjà des origines mandchoues, y compris ceux qui sont originaires de la province du Shandong¹⁰⁵ (même s'ils sont normalement considérés comme purs Han). Les membres de ma famille sont issus de Xiaowangzhuang (nom d'un endroit du village), et maintenant c'est déjà la 17ème génération. [...] Nous, la famille Xu, sommes de la bannière blanche [des huit bannières Mandchous]. Mais en réalité, c'est plus compliqué que ça, vu que la famille Xu se divise en de nombreuses branches, et que les bannières dépendent des différents princes qu'elles suivent. Comme il s'agissait d'une très grande famille, il y avait aussi la bannière bleue à bordure en plus de la bannière blanche. Ce n'est pas parce qu'une branche de la famille est de la bannière blanche que toute la famille en fait partie. En supposant que dans la famille il y ait deux frères, et que l'un suive tel prince, et l'autre tel autre prince, les deux frères auront des bannières différentes. Quand mon grand-père maternel était en vie, il disait que notre famille était censée être de la bannière bleue à bordure,\n\n<<< PAGE 85 >>>\n\nmais d'autres ont dit que c'était la bannière blanche. Alors qu'est-ce que cela signifie ? La bannière d'un individu est décidée par le prince à qui il est soumis. »\n“满族人随父氏姓，传承血脉都各自姓男家姓氏。满族人和其他民族不一样的是，满族人对女性很重视。女性婚后姓氏前面要加男方姓氏，比如男姓矣，女姓苍，婚后就是矣苍氏。结婚后的女儿回娘家那可是姑奶奶上等客招待。 [...] 家里长辈以前满语说得好，我们这辈子是完了。因为扎龙这个道路交通都方便，进入汉化的人比较多，再说随着历史的改变，就有汉化了。有一阶段是文化大革命阶段，就是那时候都得说汉话，不准说满语，那时候对这文化可能打压得比较狠，因为这朝代挨着太近了，所以满语是被打压最狠的。咱们这个民族在肃慎时就开始了，后来改为女真人。 [...] 老罕王治国很聪明，满族有八旗，还有汉八旗，蒙八旗。还有汉八旗，那怎么把血液传承人往汉族去给？就是把自己家女儿嫁给那个汉人，这血液传承当中自然而然就有满族血液了，你就得为满族人做事。[...] 我跟你说，所谓汉八旗，都是皇亲家的亲属嫁入到汉人那里来形成，就是联姻联亲，就像跟蒙古族一样。所以说八旗，还有蒙八旗，汉八旗，它都是有满族血液传承的。它没有传承就不可能形成萨满教。因为这个什么都可以疏忽，可没有血液传承的东西也来不了神的灵感。所以说汉八旗，也对，可他血液里还是有流淌满族人的血液。 [...] 我们家族，我父亲是汉八旗里的，因为我太奶奶姓矣，虽然姓矣，可嫁到王家，她还是以王矣为称。而我母亲也是纯正满族人，所以说在这个地区，多数都是满族人，汉人是稀少的。 [...] 很多人以为姓王就是汉人。其实他们不知道，来东北地区的，百分之七十，如果不是山东人的前提下，就哪怕是山东人，在一开始也是有满族血统了。我的家族人是小王庄的，到现在已经第十七代了。 [...] 我们徐氏家族，是正白旗。可这个还有不同说法，因为徐氏家族枝叶庞大，跟着不同王爷就有不同的旗。这家族庞大时候，还有镶蓝旗和正白旗，不是说一个家族白旗就都白旗。假设分散的时候，亲哥俩，一个跟这个王爷，一个跟那个王爷，就是不同的旗。我姥爷在世时讲过我们这家族应该是镶蓝旗，可也有记载说是正白旗。这证明啥？不同的人跟着不同的王爷就是不同的旗。”\n\n<<< PAGE 86 >>>\n\nCe récit de Mme Wang Yu permet de prendre en considération des informations issues d'une réalité vécue pour comprendre l'histoire des Mandchous. Plus précisément, et thème par thème, son témoignages rappelle successivement les règles de modification du nom de famille des femmes mariées, les vicissitudes qu'a traversées la langue mandchoue au point qu'elle n'est aujourd'hui parlée que par très peu de personnes. Mais surtout elle explique ce qu'il advient du système des huit bannières, avec des intermariages entre les Mandchous et les autres peuples.\nEn réalité, selon Mme Wang Yu, les huit bannières représentent d'abord une\norganisation à la fois sociale, administrative et militaire stratégique au service de la\ngouvernance du pays. Pour mémoire, elle a été créée par Nurhachi une fois que ce\ndernier avait unifié les tribus Jurchens en 1616. Le fait d'être membre du système dit\n« des huit bannières » (qui en compte en réalité au moins vingt-quatre) constitue un\nstatut et une véritable identité se transmettant de génération en génération dans les\nfamilles mandchoues. Pour Mme Wang, l'identité mandchoue est indissociable du\nsystème des huit bannières. Or, précisons que cette identité mandchoue n'est toutefois\npas seulement définie par les huit bannières, mais aussi par la consanguinité qui en est\nune condition. Pour cela, il convient de nous arrêter sur le système des huit bannières,\ntout en nous basant sur le récit de Mme Wang Yu.\nComme le précisait notre interlocutrice, le système des huit bannières ne s'adresse pas exclusivement aux Mandchous, mais aussi aux Mongols et aux Han. Ceci renvoie à la nature même du système des huit bannières, qui, au fond, est une organisation fondatrice du pouvoir de l'empire mandchou. Dans son ouvrage consacré à l'étude mandchoue, l'historien Mark C. Elliott a décrit de façon minutieuse ce système des huit bannières. Concernant les origines de leur création, il écrit :\n« [...] the Eight Banners (in Chinese, *baqi*, in Manchu, *jakūn gūsa*), created in about 1601. Manchu dominance was written in many forms, as in such bureaucracies as the Grand Council, but none was more explicitly Manchu than the Eight Banners. The Qing court was in the habit of calling the banners the \"root [or foundation] of the nation\" (*guojia zhi genben/gurun-i fulehe da*) [...] the small contingents into which Jurchen hunters were grouped, called niru (from the Manchu word for arrow), became the model for the basic military unit of the Eight Banners, also called niru (Ch. *niu-lu*), usually translated as \"company.\" »¹⁰⁶\n\n<<< PAGE 87 >>>\n\nClaude Chevaleyre en dit :\n« [...] [l]es Huit bannières (Baqi) – c’est-à-dire la structure administrative, sociale et militaire élaborée par Nurhachi 努爾哈赤 (1550-1626) pour organiser les tribus Jürchen (ancêtres des Mandchous), leurs alliés et les populations soumises durant la première phase de l’expansion mandchoue. Élément central dans la construction de l’identité mandchoue et du régime de la dynastie des Qing 清 (fondée en 1636 par Huang Taiji 皇太極), les bannières furent aussi le bras armé de la conquête de la Chine. Conçues sur un modèle héréditaire, les bannières mandchoues – ainsi nommées en raison des bannières de couleur jaune, blanche, rouge et bleue qui les différenciaient – virent leur nombre porté à huit avant de se voir adjoindre huit nouvelles bannières mongoles (en 1635), puis huit bannières d’armées chinoises (Hanjun 漢軍, établies entre 1637 et 1642). »¹⁰⁷\nLes populations se réclamant des huit bannières qiren 旗人 (littéralement : hommes des bannières) n'étaient ainsi pas homogènes au niveau ethnique, mais les huit bannières n'en restent pas moins importantes dans la construction de l'identité mandchoue qu'elles ont contribué à fédérer :\n« But just as Manchus became people of the banners, so the different people of the banners gradually became, for practical purposes, Manchus. In other words, that Manchus shared the same status with others in the banners did not lead to the disappearance of the ethnic component from the label \"Manchu\". [...] while larger, more militarily significant groups such as the Sibe, Solon, Daur, and Butha were also formally constituted at this time into their own companies and banners, and posted to garrisons in Heilongjiang, near the Qing border with Russia. [...] the Sibe and Daur had nominally been affiliated with the Khorchin Mongols. »¹⁰⁸\nEn somme, de façon générale, comme le souligne encore Elliott, les Mandchous se reconnaissant entre eux par cette appartenance au système des Huit bannières, et les Han identifient les hommes et les femmes des bannières aux Mandchous :\n« [...] during the Qing, when the conflation of these categories was common both among the Han population, which called these groups collectively \"banner people\" and tended to assume, correctly or not, that *qiren* were all Manchu, as well as among the court and those in the\n\n<<< PAGE 88 >>>\n\nbanners themselves, who often, though not always, considered banner people as a single group.\n»¹⁰⁹\nAutrement dit, le système des huit bannières a joué un rôle crucial dans la formation et l'évolution de l'identité mandchoue à partir de l'empire Qing, dans le sens où il permettait l'intégration de différentes populations (ou de tribus) dans le même groupe. De nos jours, ce n'est pas parce qu'un individu se dit \"Mandchou\", que ses ancêtres furent strictement issus de clans mandchous. Il peut aussi être par exemple le descendant de personnes ayant été enregistrées dans le système des bannières Han durant l'empire mandchou des Qing. Ainsi, pour reprendre une précision de Elliott :\n> « In other words, not everyone who claims Manchu ethnic status today can be considered Manchu in terms of actual descent from a Manchu clan (not that this means they need be regarded as any less \"Manchu\"). [...] a great number of those people who in recent years have decided to identify themselves as Manchus are Han Chinese whose ancestors were registered somewhere within the banner system - in the Chinese banners [...] »¹¹⁰\nLe fait que Mme Wang Yu ait indiqué que tous les membres issus d'une même famille n'appartiennent pas à la même bannière car « tout dépend de celle du prince que l'individu suit », invite à nous demander s'il existe une hiérarchie entre les différentes bannières.\n## b) La hiérarchie et les mélanges des populations au sein du système des huit bannières\nDe prime abord, le système des huit bannières sert de base fondamentale pour la souveraineté de l'empire mandchou. Cette structure tant militaire que sociale et administrative se caractérise par un mode d'organisation de nature hiérarchique. Pour cela, nous suggérons que la hiérarchie s'identifie à deux dimensions respectivement d'ordre vertical et horizontal. Vertical, parce que comme le précisait Mme Wang Yu, les huit bannières sont distinguées par des couleurs différentes, en fonction des princes que les gens suivent. Toutes les catégories de bannières n'ont pas le même statut, du fait que toutes les couleurs ne se classent pas au même rang. Dans les faits, les huit bannières se divisent principalement en deux catégories : la première contient les « trois bannières supérieures », shang sanqi 上三旗. La second\n\n<<< PAGE 89 >>>\n\nrassemble les « cinq bannières inférieures » xia wuqi 下五旗. Les shang sanqi sont la\nbannière jaune, la bannière jaune à bordure, ainsi que la bannière blanche. Les xia wuqi sont\nla bannière rouge, la bannière blanche à bordure, la bannière rouge à bordure, la bannière\nbleue, et la bannière bleue à bordure¹¹¹. Aussi, comme le précisait Elliott :\n« Apart from interbanner distinctions based on ethnicity, other intra banner divisions were based on birth, occupation, legal status at the time the banners were formed, and the manner of incorporation into the banners. One of the broadest distinctions was that made between the \"Upper Three Banners\" (shang san qi/dergi ilan gūsa), code for the three banners that were the personal property of the emperor, which were more populous and in general enjoyed the lion's share of banner resources, and the \"Lower Five Banners\" (xia wu qil/fejergi sunja gūsa) »¹¹²\nEnsuite, il faut considérer la dimension horizontale de la hiérarchie. Au regard de la position visiblement basse et inférieure que les bannières Han se voient accorder, il existe une disparité d'ordre ethnique dans le cadre des huit bannières. Selon ce que mentionnait Elliott sur les hiérarchies de l'ethnicité et les statuts dans les bannières (*Hierarchies of Ethnicity and status in the banners*), au sein des bannières, tant les Mandchous que les Mongols bénéficient d'un grade supérieur aux bannières Han. « The differenti-ated ethnic hierarchy [...], according to which Manchus generally outranked their Mongol cousins, and both outranked Chinese bannermen [...] »¹¹³\nSur la formation et la présence des bannières des Chinois Han, Pamela Kyle Crossley explique:\n« Les Bannières connurent une évolution au moment de la guerre contre les Ming au Liaodong, principalement en raison de l'afflux d'un très grand nombre de captifs ou de soldats et officiers Ming déserteurs. Certains d'entre eux vinrent avec leur famille, et d'autres épousèrent des femmes Jürchen après leur arrivée. Ces soldats et leurs familles entrèrent dans les unités des Bannières. Rapidement, des unités de Bannières spécifiques furent constituées pour ces hommes parlant chinois – que le premier gouvernement Jürchen appelait les Nikan. »¹¹⁴\nGrâce aux informations rapportées dans le passage ci-dessus, nous comprenons qu'en réalité, l'inscription des premiers Chinois dans les bannières est due au fait que de très\n\n<<< PAGE 90 >>>\n\nnombreux soldats et officiers se dévouèrent en famille aux armées mandchoues (Jurchens) tout en ayant tourné le dos à l'empire chinois des Ming. Par ailleurs, en parfait écho avec les mots de Mme Wang Yu sur le fait que les Mandchous et les Chinois Han s'unissaient par le mariage, les précisions de Crossley nous indiquent également qu'en montrant leur dévouement aux Mandchous, l'entrée de ces Chinois dans les bannières a bien donné lieu aux premiers intermariages entre les femmes Jurchens et les soldats et officiers Chinois. Nous y reviendrons.\nDe ce fait, nous supposons qu'au sein des bannières, les distinctions au niveau ethnique ne sont pas de caractère radical. Cela ne signifie pas pour autant la disparition des catégories ethniques ni celle de l'identité mandchoue. Au contraire : le fait que les mélanges des populations se déroulaient effectivement dans le cadre des bannières contribue en fait à conférer de toutes nouvelles dimensions à l'identité mandchoue, ainsi qu'à la renforcer.\nAutrement dit, durant la période de l'empire Qing, les mélanges des populations, dont les Chinois, les Mongols, et certaines personnes issues d'autres ethnies telles que celles évoquées précédemment, ainsi que leur enrôlement dans les bannières, se traduisent plutôt par le fait que tous finissent par devenir « Mandchous » 满洲人. Dans l'ensemble, ils forment finalement une communauté avec pour objectif commun de servir à la gouvernance de l'empire mandchou des Qing. Toutefois, il importe de souligner que de nos jours, le terme Mandchous en usage se dit davantage manzuren 满族人, laissant circuler l'idée que les individus enregistrés en tant que manzu relèvent d'une seule catégorie ethnique. En revanche, d'après Elliott, il s'agit bien d'une notion se rapportant à une identification ethnique récemment inventée en ce qui concerne les manzuren,\n« Soon after the 1911 revolution, [...] Han nationalist revolutionaries invented a new name, calling themselves qizu, or the \"banner ethnos.\"¹¹⁵ The name did not become widespread - after the establishment of the People's Republic of China the modern name for the Manchus was stabilized as Manzu (Man[chu] ethnos) - yet, significantly, membership in this newly recognized minority nationality was open to anyone who could show that he or she had once been in any of the Eight\n\n--- 2.3 « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? » : à qui revient-il de définir la sinisation ? (pp.98-101) ---\n<<< PAGE 98 >>>\n\n2.3 « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? » : à qui revient-il de définir la sinisation ?\nComme montré précédemment, durant la gouvernance de l'empire mandchou des Qing, ce fut davantage le statut héréditaire relevant du système des huit bannières qui définissait l'identité mandchoue. Aussi, après la fondation de la Chine communiste, un individu est classé dans la catégorie des « Mandchous » *Manzu* 满族 en tant qu'une ethnie minoritaire de la République populaire de Chine à la condition que son statut d'origine (ou celui de ses parents) soit issu du système des huit bannières et pouvant être prouvé. Tant au XVIIe siècle qu'au XXe siècle, l'ethnicité mandchoue reste une catégorie « inventée et construite » pour reprendre la mention de Mark Elliott¹²⁷. En effet, cette identité est à priori étroitement liée au système des huit bannières. C'est également un fait.\nOr, d'un point de vue moins évident, cette même identité peut en réalité être définie et manifestée de manière encore plus étendue, car la classification fondée sur le système des huit bannières se rapporte en réalité à une vision allant de haut en bas. Ainsi, même si certains discours nationalistes chinois contemporains ont tendance à déclarer que « les ethnies minoritaires du Nord-est » sont presque intégralement sinisées, en réalité ce n'est pas vraiment le cas. Cela non seulement parce qu'il y a des Mandchous issus d'intermariages se reconnaissant encore en tant que Mandchous plutôt que Han, mais aussi parce qu'il arrive souvent que d'autres, même s'ils se déclarent non croyants, ou sont enregistrés en tant que «\n\n<<< PAGE 99 >>>\n\nHan » sur leurs carnets de résidence dès la naissance, n'ont pourtant pas coupé le lien avec le chamanisme local. Et ils continuent à manifester des affinités électives avec les esprits d'animaux considérés comme ayant déjà possédé leurs ancêtres : tel est le cas de M. Guan.\nEn résumé, originaire de Moqi, la bannière autonome daur de l'Est de la Mongolie intérieure, M. Guan, âgé de près de quarante-cinq ans, est un habitué des temples gérés par la Supérieure maître taoïste Wang Liyan. Il semble avoir une préférence pour le temple Daode, car d'après lui, c'est dans ce temple-ci qu'il ressent plus de quiétude. M. Guan se définit en tant que médium chamanique *saman* 萨满, ses activités et pratiques se font voir parler le chinois, il est impossible de vivre dans la société actuelle ? Pour aller à l'université, les jeunes Daurs doivent savoir parler chinois, sinon ils ne peuvent pas étudier parce que personne n'y enseigne en daur. »\nEn se référant au fait que la langue mandchoue n'est plus parlée au quotidien par la majorité des populations en Mandchourie, M. Guan ne le renvoie pour autant pas à la sinisation. Plus précisément, il remet en cause les idées couramment répandues aujourd'hui par le nationalisme faisant croire que les peuples non-Han sont censés être sinisés parce qu'ils parlent déjà le mandarin. Ainsi, il s'interroge sur les critères de définition de la sinisation. Ses propos visent à démontrer que les formes extrinsèques allant des vêtements, de la nourriture à la langue, ne suffisent pas à justifier une sinisation supposée. En tant qu'un individu né de parents Han et non-Han, sa perception de l'ethnicité est davantage basée sur les affinités prédestinées qu'il nourrit avec le chamanisme mandchou lui ayant été transmis par la parenté et la consanguinité du lignage patrilinéaire. Aussi, ces affinités sont sélectives¹²⁸ dans la mesure où c'était ce don qui l'avait sélectionné, et qui lui avait été parvenu au moment où il est né, au lieu de lui laisser la possibilité d'orienter son sort de façon autonome¹²⁹. En l'occurrence, les éléments religieux ayant trait au chamanisme de caractère local contribuent de manière intrinsèque au processus de la construction de l'identité individuelle. Comme l'a remarqué la chercheuse Jiang Xiaoli :\n> « In a faith-based organization, religion serves to integrate the organization. Since in shamanism, faith-based and blood ties-based organizations overlap, shamanism plays a pivotal role in integrating and cementing the bonds among Manchu clans. It has played a great role in ensuring the existence of the clan organization of Manchus throughout the Qing Dynasty. »¹³⁰\nAjoutons que Jiang concluait aussi :\n> « [...] the future of  et sont amenés à se fréquenter et échanger les uns avec les autres, toutes ethnies confondues. En effet ces régions du Nord-est constituent un espace multiethnique où différents modes de vie coexistent. Et ce qui peut paraître particulier en Mandchourie, c'est que ce n'est pas parce que les locaux se qualifient eux-mêmes « d'habitants du Nord-est/de Mandchourie », qu'ils en oublient pour autant leurs particularités ethniques. En particulier, dans la sphère religieuse, on constate la présence et l'influence des caractéristiques non-Han. Pourtant, aux yeux de nombreux Chinois, la Mandchourie n'évoque plus désormais « une terre d'ethnies minoritaires». Les gens originaires de différentes ethnies cohabitent et forment une communauté marquée par une compréhension mutuelle à l'échelle de la Mandchourie. Les particularités relevant de leurs origines non-Han n'en jouent pas moins un rôle dynamique.\nDans le présent chapitre, il s'agira d'abord de questionner dans quelle mesure les caractéristiques ethniques se manifestent localement. Pour cela, nous ferons appel aux mélanges des populations au niveau local sous leurs différentes formes. Ensuite, il sera question de nous pencher sur la perception locale de la sinisation. Nous nous demanderons également si ce territoire est vraiment autant sinisé que ce qu'il peut paraître dans les discours\n\n<<< PAGE 79 >>>\n\nnationalistes, définissant les non-Han comme « ethnies-minoritaires » : *Shaoshu minzu* 少数民族.\n## 2.1 Les mélanges de populations au niveau local\n### a) Les Mandchou·e·s et le système des huit bannières\nIl arrive à de nombreux habitants des régions du Nord-est d'avoir été enregistré·e·s comme Han sur leur carnet de résidence *hukou*⁹¹, quel que soit le véritable statut de leur ethnie originelle. Cette situation peut être expliquée tant par les intermariages que par le changement massif de patronymes des ethnies locales durant le siècle précédent. Comme ce que Bijia Chen, Cameron Campbell et Hao Dong indiquaient dans leur article consacré à l'étude sur les mariages mixtes entre les Mandchous et les Chinois Han dans le comté de Shuangcheng, au Heilongjiang, durant les dernières décennies de la dynastie mandchoue : « Sociologists routinely study the assimilation of ethnic groups by examining intermarriage. While assimilation is a complex process that cannot be reduced to a single indicator »⁹². Ainsi, l'idée ne sera pas d'étudier la question de façon exhaustive, mais de l'aborder en nous basant sur les données observées dans la sphère religieuse. Ainsi les temples, en tant qu'interfaces avec la population, nous offrent-ils une approche précieuse pour prendre en considération l'évolution de certaines conséquences sociales, politiques et culturelles de la sinisation sur ce territoire multiethnique, historiquement peuplé de populations indigènes non-Han. Cette façon de procéder nous permettra de mieux comprendre la société par-delà la Grande Muraille, ainsi que la société chinoise contemporaine au sens plus large.\nLa question de la complexité des identités concerne en premier lieu la Supérieure Wang Liyan, gestionnaire de plusieurs temples taoïstes répandus du Jilin au Heilongjiang et l'un des principaux protagonistes de cette recherche. On doit à la Supérieure d'avoir contribué à sauver le site de l'ancien temple aux cinq religions qui allait être détruit lors de la rénovation\n\n<<< PAGE 80 >>>\n\ndu quartier, puis d'y avoir reconstruit un temple taoïste. En tant que gestionnaire de plusieurs autres temples taoïstes, elle est au quotidien souvent en déplacements : soit elle va assister à des réunions à différents échelons politiques, du fait qu'elle est également vice-présidente de l'Association taoïste du Heilongjiang, soit elle va répondre aux demandes de fidèles et de moines en tous lieux. Si bien que même ses disciples ne sont en général pas capables d'indiquer l'endroit précis où elle se trouve quand elle n'est pas au sein des temples. Les quelques conversations que nous avons menées avec elle ont eu lieu lorsqu'elle était présente à Qiqihar, ainsi qu'au mont Luotong à Liuhe, dans le Jilin, d'où elle est originaire, où elle a construit son premier temple et où elle continue à se rendre régulièrement<sup>93<\/sup>.\nPlus spécifiquement, l'intérêt pour nous d'évoquer ici le cas de Wang Liyan est double. En plus d'être la supérieure de plusieurs temples et de les faire fonctionner en réseau, elle est elle-même née dans une famille mixte, avec un père mandchou et une mère chinoise Han<sup>94<\/sup>, et ce, alors qu'il est bel et bien écrit « Han » sur son carnet de résidence, comme c'est le cas de nombreux habitants de la Mandchourie ayant des origines non-Han.\n> « [...] En effet, je suis Mandchoue. Toutefois, nous avons été enregistrés 'Han' sur notre carnet de résidence lors du Recensement général démographique *Renkou pucha* 人口普查 par le passé. Après, cela n'a plus été possible de le corriger... Car mon père était décédé, et c'est lui qui était Mandchou. Autrefois, chez nous, quand j'étais enfant, on se parlait entre nous en utilisant par exemple, *ama* [terme mandchou signifiant père], et *eniye* [terme mandchou signifiant mère], ou encore *nene*, une façon moins formelle d'appeler sa maman. Ma tante paternelle nous parlait en mandchou quand j'étais petite. [...] Notre famille était issue de la bannière jaune *Zhenghuangqi* 正黄旗. [...] Il me semble que l'une de mes tantes paternelles était chamane, mais je n'en suis pas sûre. Mon père, ainsi que ses soeurs, sont tous décédés. Ils auraient près de cent ans s'ils étaient encore vivants aujourd'hui...<sup>95<\/sup> »\nDans les récits de Wang Liyan, la question des mariages mixtes entre les Chinois Han et les populations indigènes apparait de façon prégnante. Du fait que de nombreux Mandchous ont été enregistrés comme Chinois Han sur leur carnet de résidence ces dernières décennies, le\n\n<<< PAGE 81 >>>\n\nnombre exact d'intermariages à notre époque contemporaine est difficile à évaluer. Pourtant, certaines recherches montrent que les mariages mixtes entre Mandchous et Chinois Han ne datent évidemment pas des temps récents. Comme le précise Rawski :\n> « The policies that governed marriages between bannermen and civilians changed over time. Right after the Qing was established, intermarriage between Manchu and Han was encouraged in order to reduce tensions between the two groups. However, the policy did not work well and the Qing court quietly canceled the policy soon afterwards. »⁹⁶\nAilleurs, Bijia Chen, Cameron Campbell et Hao Dong concluent :\n> « [...] The chances of intermarriage increased over time. This may have been the result of a number of factors. The non-Han may have become steadily less privileged in the last decades of the Qing, so that status homogamy no longer contributed to ethnic homogamy. »⁹⁷\nPar extension, il convient aussi de fournir ici un éclairage sur le système de parenté mandchoue, en nous référant à certains témoignages de personnes ayant des origines mandchoues : de Mme Wang Yu, âgée de plus de soixante ans, habitante du village mandchou Zhalong⁹⁸, et du fidèle Guan de la bannière autonome daur de Morin Dawa, la Mongolie intérieure de l'Est. Précisions d'abord que Mme Wang Yu a évoqué dans son récit les questions liées à la parenté mandchoue à partir de ses propres expériences, ainsi que de son l'histoire familiale de ses générations précédentes. Les informations relatées par M. Guan nous permettront quant à elles de mettre en évidence un autre aspect relevant du système de parenté chez les Mandchous : le changement du nom de famille des femmes mariées mandchoues au moment de leur décès.\nD'après M. Guan :\n> « Par exemple, dans le cas où les femmes du clan Yehe épousent [les hommes] du clan Jianzhou⁹⁹, une fois qu'elles seront inscrites (après leur décès) sur le *tangzi*, autrement dit l'autel familial, leur nom prendra naturellement le patronyme de leur mari ; leur nom de famille d'origine sera conservé en dessous, mais celui de leur mari restera le premier. Si un parent de ma famille est décédé et que son nom de famille d'origine est Wang, une fois inscrit sur notre autel familial, le nom devient donc GuanWang : Wang n'est pas changé, mais le nom de famille du mari doit être ajouté devant. C'est quelque chose d'assez ordinaire chez les populations mandchoues, mais par le passé, chez certains nobles ou personnes ayant un certain pouvoir, c'était peut-être différent. »\n\n<<< PAGE 82 >>>\n\n“比如叶赫部女子嫁给建州部，这样的话，她们以后一旦上了所说的堂子，也就是家堂上，她的名字自然就会跟夫姓，然后下面也会保留她的原姓，但是上面要跟夫姓。假如我家一亲属去世，她原姓姓王，但是一旦上了我们的家堂上，就是矣王氏，这个王是不改的，但前面要加夫姓。这件事在普通满族群众里很正常，但以前在一些贵族或有一些势力的人里很难说。”\nDe plus, M. Guan a donné également l'exemple de sa grand-mère paternelle en précisant que le patronyme original de cette dernière était Liu 刘. Après son décès, son nom de famille enregistré sur le registre généalogique est devenu Guan Liu 矣刘.\nLe témoignage de M. Guan nous fait comprendre que, par le passé, chez les Mandchous en général, lorsqu'une femme mariée décédait, au moment où son nom était inscrit sur le registre généalogique, il était usuel que le patronyme de son mari précédât le sien.\nPar ailleurs, il convient également de nous interroger sur une autre notion à laquelle M. Guan s'est référé : tangzi 堂子 (en mandchou : tǎngzǐ, en lettres latines : tangse, en pinyin : tangzi)¹⁰⁰. Il s'agit d'un sanctuaire familial où les ancêtres d'une famille reçoivent le culte rendu par leurs descendants. Lors des conquêtes visant à l'unification des tribus des Jurchens, Nurhachi détruisit les sanctuaires tangzi des tribus conquises en leur imposant ceux du clan Aisin Gioro dont il était issu. Voici ce que conclut Alan Richard Sweeten:\n> « Many Manchu lineages also had a deity altar (Ch. tangzi; Ma. Tangse) where the elite prayed and performed rites. As Nurhachi centralized power, he conducted his imperial domestic rites at a special tangzi in Hetu Ala, then later and new one built in Liaoyang and Shenyang. [...] The tangzi built at the palace in Shenyang thus became an imperial shamanic temple where the ruler communicated with Heaven via a sacred pole. [...]\n\n<<< PAGE 83 >>>\n\nBesides worship of Heaven and ancestors, Buddhist as well as Chinese deities were revered. Rites at the tangzi usually concluded with an expression of Confucian etiquette, three kneelings and nine prostrations. »¹⁰¹\nCette précision nous indique qu'auparavant le *tangzi*, en tant que sanctuaire familial chez les Mandchous, est aussi associé aux croyances chamaniques en plus d'être le lieu où les ancêtres sont vénérés. Aujourd'hui, nous constatons que dans les propos des gens en Mandchourie, le terme *tangzi* existe encore et est devenu une expression courante dans la sphère religieuse, tout en ayant pris une dimension plus étendue. Désormais *tangzi* désigne notamment les sanctuaires familiaux où les entités relevant du chamanisme local – dits les esprits d'animaux –, sont vénérées. En plus d'employer le terme *tangzi*, les gens en Mandchourie utilisent aussi le terme *tangkou 堂口* pour se référer à ce type de sanctuaires.\nQuant aux propos de l'interlocutrice Mme Wang Yu, qui habite dans l'ancien village mandchou Zhalong datant de plus de trois cents ans, dans une banlieue éloignée de Qiqihar (mais datant d'avant Qiqihar), voici ce qu'elle nous rapporte :\n« Les Mandchous prennent le nom de famille de leur père, la transmission lignagère¹⁰² dépend de celle du patronyme en ligne paternelle. Ce qui distingue les Mandchous des autres groupes ethniques, c'est qu'ils attachent une grande importance aux femmes. Après le mariage, le nom de famille de la femme doit être précédé de celui de son mari. Par exemple, si le nom de famille de l'homme est Guan, et celui de la femme Cang, la femme sera donc renommée GuanCang une fois mariée. Lorsque la fille mariée retourne voir sa famille d'origine, elle y est reçue comme une hôte distinguée. [...] Les générations précédentes parlaient bien le mandchou par le passé, alors que pour notre génération, ce n'est plus le cas. Parce que Zhalong était un lieu bien desservi par le réseau routier, beaucoup de Chinois Han sont venus s'y installer, et avec le temps y ont introduit la culture Han, et c'est ainsi que s'est faite la sinisation. À une époque, durant la révolution culturelle, tout le monde fut obligé de parler chinois (le mandarin) ; parler mandchou était proscrit. La répression vis-à-vis de cette culture (la culture mandchoue) a été plutôt violente, parce que (le règne de) la dynastie mandchoue était encore très proche. De ce fait, la langue mandchoue a été particulièrement réprimée. Nous, en tant que peuple, existions bel et bien depuis le temps des Sushens avant de devenir Jurchens. [...] Le vieux Khan\n\n<<< PAGE 84 >>>\n\n(Nurhachi) gouvernait le pays avec beaucoup de sagesse, les Mandchous possédaient un système de huit bannières. Il existait également huit bannières Han, et huit bannières mongoles¹⁰³. [...] Mais les Mandchous perpétuaient aussi leur sang dans ces bannières ; comment faisaient-elles? Ils mariaient leurs filles aux Han : cela permettait la transmission du sang mandchou à une descendance alliée et dévouée aux Mandchous ; [...] Dans les faits, les huit bannières Han se sont formées quand les membres issus de familles royales ont épousé des Han ; ils s'unissaient par le mariage. Il y eut de même des intermariages entre Mandchous et Mongols. Ainsi, les membres tant des huit bannières mandchoues, que des huit bannières mongoles et Han, sont toutes de sang mandchou. Sans ce lien de consanguinité, il n'aurait pas été envisageable de pratiquer le chamanisme. Certaines choses peuvent être négligées, mais pas la consanguinité, sans laquelle il n'est pas possible de recevoir les messages transmis par les divinités (linggan 灵感¹⁰⁴). De ce fait, il est donc juste de parler des huit bannières Han, mais il y a toujours du sang mandchou qui coule dans leurs veines. [...] En ce qui concerne notre famille, mon père était issu de la bannière Han. Le patronyme de mon arrière-grand-mère était Guan. Quand elle a épousé un homme de la famille Wang, elle s'est appelée WangGuan. Et ma mère, elle est également de pure souche mandchoue, car dans cette région, la plupart des gens sont mandchous, et les Han sont minoritaires. [...] Beaucoup de gens considèrent que le fait d'être dénommé Wang équivaut à être \"Han\". Or, ce qu'ils ignorent, c'est que parmi les gens venus s'installer dans les régions du Nord-est, 70% ont déjà des origines mandchoues, y compris ceux qui sont originaires de la province du Shandong¹⁰⁵ (même s'ils sont normalement considérés comme purs Han). Les membres de ma famille sont issus de Xiaowangzhuang (nom d'un endroit du village), et maintenant c'est déjà la 17ème génération. [...] Nous, la famille Xu, sommes de la bannière blanche [des huit bannières Mandchous]. Mais en réalité, c'est plus compliqué que ça, vu que la famille Xu se divise en de nombreuses branches, et que les bannières dépendent des différents princes qu'elles suivent. Comme il s'agissait d'une très grande famille, il y avait aussi la bannière bleue à bordure en plus de la bannière blanche. Ce n'est pas parce qu'une branche de la famille est de la bannière blanche que toute la famille en fait partie. En supposant que dans la famille il y ait deux frères, et que l'un suive tel prince, et l'autre tel autre prince, les deux frères auront des bannières différentes. Quand mon grand-père maternel était en vie, il disait que notre famille était censée être de la bannière bleue à bordure,\n\n<<< PAGE 85 >>>\n\nmais d'autres ont dit que c'était la bannière blanche. Alors qu'est-ce que cela signifie ? La bannière d'un individu est décidée par le prince à qui il est soumis. »\n“满族人随父氏姓，传承血脉都各自姓男家姓氏。满族人和其他民族不一样的是，满族人对女性很重视。女性婚后姓氏前面要加男方姓氏，比如男姓矣，女姓苍，婚后就是矣苍氏。结婚后的女儿回娘家那可是姑奶奶上等客招待。 [...] 家里长辈以前满语说得好，我们这辈子是完了。因为扎龙这个道路交通都方便，进入汉化的人比较多，再说随着历史的改变，就有汉化了。有一阶段是文化大革命阶段，就是那时候都得说汉话，不准说满语，那时候对这文化可能打压得比较狠，因为这朝代挨着太近了，所以满语是被打压最狠的。咱们这个民族在肃慎时就开始了，后来改为女真人。 [...] 老罕王治国很聪明，满族有八旗，还有汉八旗，蒙八旗。还有汉八旗，那怎么把血液传承人往汉族去给？就是把自己家女儿嫁给那个汉人，这血液传承当中自然而然就有满族血液了，你就得为满族人做事。[...] 我跟你说，所谓汉八旗，都是皇亲家的亲属嫁入到汉人那里来形成，就是联姻联亲，就像跟蒙古族一样。所以说八旗，还有蒙八旗，汉八旗，它都是有满族血液传承的。它没有传承就不可能形成萨满教。因为这个什么都可以疏忽，可没有血液传承的东西也来不了神的灵感。所以说汉八旗，也对，可他血液里还是有流淌满族人的血液。 [...] 我们家族，我父亲是汉八旗里的，因为我太奶奶姓矣，虽然姓矣，可嫁到王家，她还是以王矣为称。而我母亲也是纯正满族人，所以说在这个地区，多数都是满族人，汉人是稀少的。 [...] 很多人以为姓王就是汉人。其实他们不知道，来东北地区的，百分之七十，如果不是山东人的前提下，就哪怕是山东人，在一开始也是有满族血统了。我的家族人是小王庄的，到现在已经第十七代了。 [...] 我们徐氏家族，是正白旗。可这个还有不同说法，因为徐氏家族枝叶庞大，跟着不同王爷就有不同的旗。这家族庞大时候，还有镶蓝旗和正白旗，不是说一个家族白旗就都白旗。假设分散的时候，亲哥俩，一个跟这个王爷，一个跟那个王爷，就是不同的旗。我姥爷在世时讲过我们这家族应该是镶蓝旗，可也有记载说是正白旗。这证明啥？不同的人跟着不同的王爷就是不同的旗。”\n\n<<< PAGE 86 >>>\n\nCe récit de Mme Wang Yu permet de prendre en considération des informations issues d'une réalité vécue pour comprendre l'histoire des Mandchous. Plus précisément, et thème par thème, son témoignages rappelle successivement les règles de modification du nom de famille des femmes mariées, les vicissitudes qu'a traversées la langue mandchoue au point qu'elle n'est aujourd'hui parlée que par très peu de personnes. Mais surtout elle explique ce qu'il advient du système des huit bannières, avec des intermariages entre les Mandchous et les autres peuples.\nEn réalité, selon Mme Wang Yu, les huit bannières représentent d'abord une\norganisation à la fois sociale, administrative et militaire stratégique au service de la\ngouvernance du pays. Pour mémoire, elle a été créée par Nurhachi une fois que ce\ndernier avait unifié les tribus Jurchens en 1616. Le fait d'être membre du système dit\n« des huit bannières » (qui en compte en réalité au moins vingt-quatre) constitue un\nstatut et une véritable identité se transmettant de génération en génération dans les\nfamilles mandchoues. Pour Mme Wang, l'identité mandchoue est indissociable du\nsystème des huit bannières. Or, précisons que cette identité mandchoue n'est toutefois\npas seulement définie par les huit bannières, mais aussi par la consanguinité qui en est\nune condition. Pour cela, il convient de nous arrêter sur le système des huit bannières,\ntout en nous basant sur le récit de Mme Wang Yu.\nComme le précisait notre interlocutrice, le système des huit bannières ne s'adresse pas exclusivement aux Mandchous, mais aussi aux Mongols et aux Han. Ceci renvoie à la nature même du système des huit bannières, qui, au fond, est une organisation fondatrice du pouvoir de l'empire mandchou. Dans son ouvrage consacré à l'étude mandchoue, l'historien Mark C. Elliott a décrit de façon minutieuse ce système des huit bannières. Concernant les origines de leur création, il écrit :\n« [...] the Eight Banners (in Chinese, *baqi*, in Manchu, *jakūn gūsa*), created in about 1601. Manchu dominance was written in many forms, as in such bureaucracies as the Grand Council, but none was more explicitly Manchu than the Eight Banners. The Qing court was in the habit of calling the banners the \"root [or foundation] of the nation\" (*guojia zhi genben/gurun-i fulehe da*) [...] the small contingents into which Jurchen hunters were grouped, called niru (from the Manchu word for arrow), became the model for the basic military unit of the Eight Banners, also called niru (Ch. *niu-lu*), usually translated as \"company.\" »¹⁰⁶\n\n<<< PAGE 87 >>>\n\nClaude Chevaleyre en dit :\n« [...] [l]es Huit bannières (Baqi) – c’est-à-dire la structure administrative, sociale et militaire élaborée par Nurhachi 努爾哈赤 (1550-1626) pour organiser les tribus Jürchen (ancêtres des Mandchous), leurs alliés et les populations soumises durant la première phase de l’expansion mandchoue. Élément central dans la construction de l’identité mandchoue et du régime de la dynastie des Qing 清 (fondée en 1636 par Huang Taiji 皇太極), les bannières furent aussi le bras armé de la conquête de la Chine. Conçues sur un modèle héréditaire, les bannières mandchoues – ainsi nommées en raison des bannières de couleur jaune, blanche, rouge et bleue qui les différenciaient – virent leur nombre porté à huit avant de se voir adjoindre huit nouvelles bannières mongoles (en 1635), puis huit bannières d’armées chinoises (Hanjun 漢軍, établies entre 1637 et 1642). »¹⁰⁷\nLes populations se réclamant des huit bannières qiren 旗人 (littéralement : hommes des bannières) n'étaient ainsi pas homogènes au niveau ethnique, mais les huit bannières n'en restent pas moins importantes dans la construction de l'identité mandchoue qu'elles ont contribué à fédérer :\n« But just as Manchus became people of the banners, so the different people of the banners gradually became, for practical purposes, Manchus. In other words, that Manchus shared the same status with others in the banners did not lead to the disappearance of the ethnic component from the label \"Manchu\". [...] while larger, more militarily significant groups such as the Sibe, Solon, Daur, and Butha were also formally constituted at this time into their own companies and banners, and posted to garrisons in Heilongjiang, near the Qing border with Russia. [...] the Sibe and Daur had nominally been affiliated with the Khorchin Mongols. »¹⁰⁸\nEn somme, de façon générale, comme le souligne encore Elliott, les Mandchous se reconnaissant entre eux par cette appartenance au système des Huit bannières, et les Han identifient les hommes et les femmes des bannières aux Mandchous :\n« [...] during the Qing, when the conflation of these categories was common both among the Han population, which called these groups collectively \"banner people\" and tended to assume, correctly or not, that *qiren* were all Manchu, as well as among the court and those in the\n\n<<< PAGE 88 >>>\n\nbanners themselves, who often, though not always, considered banner people as a single group.\n»¹⁰⁹\nAutrement dit, le système des huit bannières a joué un rôle crucial dans la formation et l'évolution de l'identité mandchoue à partir de l'empire Qing, dans le sens où il permettait l'intégration de différentes populations (ou de tribus) dans le même groupe. De nos jours, ce n'est pas parce qu'un individu se dit \"Mandchou\", que ses ancêtres furent strictement issus de clans mandchous. Il peut aussi être par exemple le descendant de personnes ayant été enregistrées dans le système des bannières Han durant l'empire mandchou des Qing. Ainsi, pour reprendre une précision de Elliott :\n> « In other words, not everyone who claims Manchu ethnic status today can be considered Manchu in terms of actual descent from a Manchu clan (not that this means they need be regarded as any less \"Manchu\"). [...] a great number of those people who in recent years have decided to identify themselves as Manchus are Han Chinese whose ancestors were registered somewhere within the banner system - in the Chinese banners [...] »¹¹⁰\nLe fait que Mme Wang Yu ait indiqué que tous les membres issus d'une même famille n'appartiennent pas à la même bannière car « tout dépend de celle du prince que l'individu suit », invite à nous demander s'il existe une hiérarchie entre les différentes bannières.\n## b) La hiérarchie et les mélanges des populations au sein du système des huit bannières\nDe prime abord, le système des huit bannières sert de base fondamentale pour la souveraineté de l'empire mandchou. Cette structure tant militaire que sociale et administrative se caractérise par un mode d'organisation de nature hiérarchique. Pour cela, nous suggérons que la hiérarchie s'identifie à deux dimensions respectivement d'ordre vertical et horizontal. Vertical, parce que comme le précisait Mme Wang Yu, les huit bannières sont distinguées par des couleurs différentes, en fonction des princes que les gens suivent. Toutes les catégories de bannières n'ont pas le même statut, du fait que toutes les couleurs ne se classent pas au même rang. Dans les faits, les huit bannières se divisent principalement en deux catégories : la première contient les « trois bannières supérieures », shang sanqi 上三旗. La second\n\n<<< PAGE 89 >>>\n\nrassemble les « cinq bannières inférieures » xia wuqi 下五旗. Les shang sanqi sont la\nbannière jaune, la bannière jaune à bordure, ainsi que la bannière blanche. Les xia wuqi sont\nla bannière rouge, la bannière blanche à bordure, la bannière rouge à bordure, la bannière\nbleue, et la bannière bleue à bordure¹¹¹. Aussi, comme le précisait Elliott :\n« Apart from interbanner distinctions based on ethnicity, other intra banner divisions were based on birth, occupation, legal status at the time the banners were formed, and the manner of incorporation into the banners. One of the broadest distinctions was that made between the \"Upper Three Banners\" (shang san qi/dergi ilan gūsa), code for the three banners that were the personal property of the emperor, which were more populous and in general enjoyed the lion's share of banner resources, and the \"Lower Five Banners\" (xia wu qil/fejergi sunja gūsa) »¹¹²\nEnsuite, il faut considérer la dimension horizontale de la hiérarchie. Au regard de la position visiblement basse et inférieure que les bannières Han se voient accorder, il existe une disparité d'ordre ethnique dans le cadre des huit bannières. Selon ce que mentionnait Elliott sur les hiérarchies de l'ethnicité et les statuts dans les bannières (*Hierarchies of Ethnicity and status in the banners*), au sein des bannières, tant les Mandchous que les Mongols bénéficient d'un grade supérieur aux bannières Han. « The differenti-ated ethnic hierarchy [...], according to which Manchus generally outranked their Mongol cousins, and both outranked Chinese bannermen [...] »¹¹³\nSur la formation et la présence des bannières des Chinois Han, Pamela Kyle Crossley explique:\n« Les Bannières connurent une évolution au moment de la guerre contre les Ming au Liaodong, principalement en raison de l'afflux d'un très grand nombre de captifs ou de soldats et officiers Ming déserteurs. Certains d'entre eux vinrent avec leur famille, et d'autres épousèrent des femmes Jürchen après leur arrivée. Ces soldats et leurs familles entrèrent dans les unités des Bannières. Rapidement, des unités de Bannières spécifiques furent constituées pour ces hommes parlant chinois – que le premier gouvernement Jürchen appelait les Nikan. »¹¹⁴\nGrâce aux informations rapportées dans le passage ci-dessus, nous comprenons qu'en réalité, l'inscription des premiers Chinois dans les bannières est due au fait que de très\n\n<<< PAGE 90 >>>\n\nnombreux soldats et officiers se dévouèrent en famille aux armées mandchoues (Jurchens) tout en ayant tourné le dos à l'empire chinois des Ming. Par ailleurs, en parfait écho avec les mots de Mme Wang Yu sur le fait que les Mandchous et les Chinois Han s'unissaient par le mariage, les précisions de Crossley nous indiquent également qu'en montrant leur dévouement aux Mandchous, l'entrée de ces Chinois dans les bannières a bien donné lieu aux premiers intermariages entre les femmes Jurchens et les soldats et officiers Chinois. Nous y reviendrons.\nDe ce fait, nous supposons qu'au sein des bannières, les distinctions au niveau ethnique ne sont pas de caractère radical. Cela ne signifie pas pour autant la disparition des catégories ethniques ni celle de l'identité mandchoue. Au contraire : le fait que les mélanges des populations se déroulaient effectivement dans le cadre des bannières contribue en fait à conférer de toutes nouvelles dimensions à l'identité mandchoue, ainsi qu'à la renforcer.\nAutrement dit, durant la période de l'empire Qing, les mélanges des populations, dont les Chinois, les Mongols, et certaines personnes issues d'autres ethnies telles que celles évoquées précédemment, ainsi que leur enrôlement dans les bannières, se traduisent plutôt par le fait que tous finissent par devenir « Mandchous » 满洲人. Dans l'ensemble, ils forment finalement une communauté avec pour objectif commun de servir à la gouvernance de l'empire mandchou des Qing. Toutefois, il importe de souligner que de nos jours, le terme Mandchous en usage se dit davantage manzuren 满族人, laissant circuler l'idée que les individus enregistrés en tant que manzu relèvent d'une seule catégorie ethnique. En revanche, d'après Elliott, il s'agit bien d'une notion se rapportant à une identification ethnique récemment inventée en ce qui concerne les manzuren,\n« Soon after the 1911 revolution, [...] Han nationalist revolutionaries invented a new name, calling themselves qizu, or the \"banner ethnos.\"¹¹⁵ The name did not become widespread - after the establishment of the People's Republic of China the modern name for the Manchus was stabilized as Manzu (Man[chu] ethnos) - yet, significantly, membership in this newly recognized minority nationality was open to anyone who could show that he or she had once been in any of the Eight\n\n<<< PAGE 91 >>>\n\nBanners (Manchu, Mongol, Chinese, bondservant), or was descended from someone with such a pedigree.¹¹⁶ »\nPar conséquent, cette nouvelle catégorie d'identification ethnique qu'est l'ethnie mandchoue Manzu 满族 n'a été que récemment inventée, et ceci après l'établissement de la République populaire de Chine. Elle intègre les populations qualifiées de Mandchoues, dont les principes de classification ne reposent toutefois pas seulement sur le plan ethnique (ou biologique), mais dépendent aussi d'un point de vue institutionnel relevant de l'ancien système des huit bannières de l'empire mandchou. Plus précisément, dans le cadre de la classification ethnique de la République populaire de Chine, un individu peut être identifié à l'ethnie mandchoue dans le cas où il est né de parents issus d'une des huit bannières, quelle qu'elle soit.\n## 2.2 Les patronymes, la langue, et les caractéristiques physiques manifestées aujourd'hui chez certaines personnes d'origine mandchoue\nDans la sous-section précédente, nous avons présenté la manière dont l'ancien système des huit bannières constitue une strate institutionnelle dans le processus de la catégorie d'identification ethnique depuis l'ère républicain. De ce fait, ce n'est que depuis l'effondrement de l'empire mandchou jusqu'au début de la période républicaine, que « le système des huit bannières est, selon la perception de l'époque, passé d'une organisation militaire de caractère multiethnique et une hiérarchie héréditaire à un groupe ethnique (ethnic group). »¹¹⁷\nCette remarque citée ci-dessus renvoie à ce que nous avons montré auparavant sur le fait que les huit bannières se caractérisaient par les mélanges des populations d'ethnies différentes, et qu'au sein des huit bannières, les intermariages – par exemple ceux entre les Han et les Mandchous – ont contribué à la formation d'une communauté multiethnique. En outre, comme il est précisé ici :\n\n<<< PAGE 92 >>>\n\n« [...] in the eyes of the revolutionaries, the Manchus were identical to the banner people, and so it was in the eyes of the Manchus, too. As a descendant of the Qing imperial clan recalls, “The Manchus [Manren] called themselves, and were called by others, ‘banner people’ [qiren].” [...] Nurhaci created the system in 1615 when he divided all the scattered Jurchen tribes in the mountains of eastern and northern “Manchuria” that he had dominated into eight groups called “banners” (qi), each with a number of compagnies (zuoling). Twenty years later, when Hong Taiji bestowed the new name “Manzhou” (from the Manchu “Manju”) upon his people, they became the “Eight Banner Manchus” (Baqi Manzhou). Meanwhile, as Nurhaci and Hong Taiji extended their authority into the plains of southern Manchuria and began overrunning Han settlements and enslaving their inhabitants, they apportioned these captives among the leaders of the original Manchu Eight Banners. [...] Hong Taiji stopped enslaving them and organized them instead into their own set of banners; these Eight Banners composed of Han personnel were known as the *Hanjun*. »¹¹⁸\nPar la suite, lors de l’écroulement de l’empire mandchou des Qing, le système des huit bannières s’est également désagrégé. En conséquence, les populations relevant des huit bannières devaient se soucier de veiller à ce que leur ancien statut fût dissimulé afin de pouvoir survivre. Pour cela, les gens concernés durent s’efforcer de trouver tous les moyens possibles, dont la mise en œuvre de la sinisation des patronymes. Ainsi, nous pouvons mettre en évidence un point commun évident entre la supérieure taoïste Wang Liyan et le fidèle M. Guan, à savoir qu’ils sont tous les deux issus de pères mandchous et de mères chinoises, et qu’ils ont en partage un patronyme sinisé. En revanche, certains patronymes originairement mandchous, ayant été sinisés, se font encore reconnaître. Durant les premiers mois de mes enquêtes, certaines personnes m’ont expliqué d’une façon réifiée :\n> « Tous ceux dont le patronyme est ‘Guan’ sont d’origine mandchoue. » “姓矣的人都是满族。”\nEn effet, cette affirmation s’avère en partie vraie, car elle implique aussi bien un moyen simple pour les gens d’identifier localement celles et ceux qui sont potentiellement issus des Mandchous ou plus précisément, des huit bannières¹¹⁹. Cette réalité révèle une\n\n<<< PAGE 93 >>>\n\nexplication historique : le changement de patronyme massif chez les Mandchous au début du\nsiècle précédent. Comme l'a relevé Mark C. Elliott :\n« [...] La fin de la dernière dynastie impériale entraîna dans son sillage la brusque disparition des protagonistes mandchous de la scène politique de Chine et d'Asie intérieure, pour inaugurer une période de plusieurs décennies d'oubli de cette ancienne minorité dirigeante. Accusés collectivement de tous les maux du pays, les Mandchous furent frappés d'ostracisme après 1911. [...] Ils n'évitèrent pas d'être victimes d'un mépris quasi unanime. Les anciens membres de l'élite et de l'aristocratie furent réduits à la misère [...] Russes et Japonais se disputèrent leur ancienne patrie [la Mandchourie], colonisée par les Han, et la plupart n'eurent guère d'autre choix que de finir misérablement leurs jours à Pékin. [...] Beaucoup de Mandchous préférèrent renoncer complètement à leur identité et changèrent de patronyme, cherchant à effacer toute trace de filiation avec les infatigables cavaliers, leurs ancêtres, qui avaient conquis la Chine plusieurs générations auparavant. »¹²⁰\nAussi le changement massif de patronymes fut pour certains un moyen collectif de se cacher,\nafin de survivre dans le contexte social et historique de l'époque. Le nom de famille sinisé «\nGuan » trouve son origine mandchoue dans le nom de clan Gūwalgiya (en chinois: 瓜尔佳\n[氏]). Une explication apportée par l'historienne Pamela Kyle Crossley relative à la sinisation\nde ce nom mandchou est que :\n« [...] Clan names as historical (rather than personal) signs, however, were the source of Manchu unity. [...] While Gūwalgiya is a prominent Manchu name [...] Indeed, they were the first of the “Eight Great Houses”(ba dajia) upon which the Manchu elite was founded. Members of the Gūwalgiya clans, many of whoms began to use the surnames such as Gu, Gua, Guan, Guang [...] today Guan remains a surname common among those of Manchu descent, and rare among those who do not trace their surname to a Manchu ancestor. »¹²¹\nS'il nous est possible aujourd'hui de trouver des données remontant aux origines mandchoues\ndu nom Guan, autrement dit le nom de clan mandchou Gūwalgiya, ce n'est toutefois pas le\ncas pour le patronyme d'origine de la Supérieure Wang Liyan, car il n'est plus en usage dans\nsa famille depuis des générations, au point qu'elle ne s'en souvient plus. Pourtant, une autre\ninformation est susceptible de fournir une piste pertinente d'analyse concernant les origines\n\n<<< PAGE 94 >>>\n\nmandchoues du patronyme sinisé Wang¹²². La langue mandchoue est aujourd'hui considérée comme étant en voie de disparition, les rares personnes étant encore en mesure de maîtriser et de parler couramment cette langue sont âgées, ayant souvent plus de soixante-cinq ans. Beaucoup d'entre elles habitent la Mandchourie. Selon une recherche de Juha Janhunen sur la langue mandchoue :\n> « [...] Today, with some 10 million officially registered individuals, the Manchu continue to be one of the largest ethnic groups in China, but the Manchu language is among the most seriously endangered in the country. [...] Individuals still speaking Manchu are reported to survive in three localities in Manchuria: In the village of Sanjiazi of Fuyu County37, in the Nonni basin just north of the city of Tsitsikar (qiqihaer); the current number of speakers is unlikely to exceed 50, being probably much less and containing no children speaking the language; in the village of Daxing of Tailai County, also in the Nonni basin south of Tsitsikar; with a handful of speakers, all belonging to the oldest generation (over 60 years of age). »¹²³\nPourtant, un certain nombre de jeunes individus se mobilisent en vue de sauvegarder et transmettre la langue mandchoue. Ils lancent des mouvements visant à vulgariser le mandchou en profitant de la commodité de l'ère numérique, par exemple à travers des cours gratuits de mandchou en ligne. Parmi eux, il y a notamment M. Wang Shuo, mentionné précédemment dans la 8e note. Il s'agit d'un jeune chercheur mandchou du Jilin, spécialisé dans la recherche sur la langue mandchoue. Ces dernières années, il a créé ses propres chaînes sur plusieurs réseaux sociaux chinois, sur lesquelles nous pouvons trouver de nombreux cours progressifs de langue mandchoue, ainsi que des vidéos sur les traditions et les mœurs mandchoues, accessibles gratuitement par les internautes. Précisons que son nom figurant sur les chaînes n'est pas le nom sinisé qu'est Wang, mais bien son patronyme mandchou Wanyan 完颜 (en mandchou : Wanggiyan)¹²⁴. De ce fait, nous supposons qu'il est possible que le patronyme mandchou de la Supérieure Wang Liyan soit aussi Wanyan 完颜.\n\n<<< PAGE 95 >>>\n\nAinsi, grâce à ce « principe local d'identification » relatif au patronyme Guan, j'ai pu également trouver un autre individu d'origine mandchoue : l'adepte taoïste laïc Guan Zongqiang 关宗强, auparavant chargé de remplir les formulaires rituels dans le temple Daode, engagé en fin d'année 2019 par la Maître Wang Liyan au temple Guandi en tant que cuisinier en chef. Quand j'ai eu connaissance de ce « principe », je lui ai demandé s'il était Mandchou, et en en obtenant un « oui » de sa part, j'ai donc pu confirmer ce « principe d'identification ». Le patronyme mandchou de Guan Zongqiang est aussi Gūwalgiya. De même, une autre femme rencontrée durant l'enquête, également dénommée Guan, et âgée d'une soixantaine d'années aujourd'hui, est de l'ethnie mandchoue, tandis que son mari est Han. Elle a indiqué dans un bref échange qu'elle avait fait enregistrer leur fille en tant que « Mandchoue » sur leur carnet de résidence, peu après la naissance de celle-ci dans les années quatre-vingt. Elle avait ainsi voulu privilégier l'ethnie mandchoue pour leur fille née du mariage mixte entre une Mandchoue et un Chinois Han. Ensuite, raconte-t-elle :\n> « Mais... Ma fille, mariée avec un jeune homme Han dans la ville de Tianjin, a fait enregistrer comme 'Han' leur fille... [La petite-fille de cette femme interrogée]. »\nUn autre cas de mariage mixte mérite également d'être exposé dans le cadre de la recherche présente. En effet, ce cas spécifique nous permet de nous rendre compte qu'en Mandchourie, ce n'est pas parce qu'un individu est enregistré comme Han qu'il est simplement d'origine Han, car le fait d'être Chinois Han peut au bout du compte renvoyer à des situations sensiblement différentes.\nEn l'espèce, une jeune femme de 28 ans, dénommée Zhao, vient d'apprendre que sa mère est en fait Mandchoue. Dénommée Ru 茹 [le patronyme mandchou reste inconnu], celle-ci n'avait jusque-là jamais parlé de ses origines à sa fille. Mme Zhao se croyait depuis toujours Chinoise Han « comme les autres ».\nAu passage, comme indiqué en haut, malgré le fait que le mélange des populations existe déjà dans l'institution des huit bannières durant la période impériale mandchoue des Qing, et que les « hommes des bannières/ banner people » (qir
