23)\n\n## Réponses aux questions de recherche\n\n- Pour la question sur les dynamiques et interactions : « l'interaction dynamique entre le chamanisme à caractère local et les pratiques taoïstes paraît propice à l'ancrage régional du taoïsme, le culte à la Mère Noire est alors important, voire central dans la production de ce type d'interaction » (p. 381) ; « la religion taoïste permet aux éléments propres aux pratiques chamaniques de perdurer tout en les plaçant sous son égide et alors que ailleurs, la religion taoïste ne peut s'enraciner et se répandre en Mandchourie qu'à condition que les strates des éléments chamaniques s'inscrivent dans les activités religieuses du taoïsme local » (p. 389).\n- Pour la question sur le rôle des temples : « les temples sont des lieux destinés à guérir les maladies, qu'elles soient visibles ou invisibles » (p. 383) ; « grâce à elle [la Mère Noire], les communautés taoïstes prospèrent et confortent ainsi leur place dans l'orthodoxie locale au fils du temps » (p. 388) ; « les officiants taoïstes et les fidèles indiquent que les animaux Esprits-Immortels se trouvent partout dans ces régions du Nord-est mais qu'à priori ils ne peuvent pas aller au sud de la passe Shanhai » (p. 387).\n\n## Hypothèses\n\n**Principale** : L'enracinement du taoïsme Quanzhen en Mandchourie ne relève pas d'une sinisation unilatérale mais d'une adaptation réciproque aux substrats chamaniques locaux (p. 381, p. 389). Vérifiée : l'intégration de la Mère Noire « est intimement associée à l'arrivée progressive des vagues de migration des chinois Han sur ce territoire, de même qu'à la diffusion et au développement du taoïsme (de l'ordre de la Perfection totale) dans cette région » (p. 381).\n**Secondaires** :\n- Un même lieu saint peut abriter plusieurs religions sans se réduire à aucune : l'auteur propose « d'appréhender un même lieu saint qui abrite plusieurs religions » (p. 31), le temple Daode étant « un ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste » (p. 6).\n- La Passe Shanhai fonctionne comme une frontière religieuse effective et non seulement historique : elle est perçue par les moines comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6).\n- Le culte à la Mère Noire constitue l'axe structurant du réseau de temples : il « constitue un axe majeur des interférences entre ces temples taoïstes, les religieux, et les fidèles, qui se manifeste pleinement dans les services rituels proposés » (p. 381).\n\n\n## Méthodologie\n\n- **Approche** : « Cette thèse ethnographique porte sur la religion taoïste en Mandchourie » (p. 23) ; « étude ethnographique » (p. 383)\n- **Méthode** : « observations participantes » (p. 23) ; « observations ethnographiques récentes » (p. 383)\n- **Corpus/Données** : « deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin » (p. 23) ; « consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles » (p. 23) ; « plusieurs temples taoïstes en réseau » (p. 383) ; réseau centré sur le temple Daode à Qiqihar, ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste (p. 6)\n- **Justification** : « Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire » (p. 23) ; « cela a permis d'observer et d'aborder les différents aspects et particularités de la société au nord de la Grande Muraille à l'heure actuelle » (p. 383)\n\n## Fil rouge\n\nLa passe Shanhai comme frontière symbolique et religieuse structurante (p. 387), reliant la transformation identitaire et politique de la Mandchourie (Partie 1) aux consultations et pratiques rituelles quotidiennes (Partie 2) et aux interactions institutionnelles entre taoïsme et chamanisme (Partie 3) via la délimitation des compétences territoriales des esprits et la légitimation du culte à la Mère Noire (p. 388). Le réseau de temples centré sur le temple Daode et articulé autour du culte à la Mère Noire sert de maillage concret à cette dynamique depuis l'empire Qing jusqu'à l'époque contemporaine (p. 6).\n\n## Plan (Structure)\n\n- **Première partie La Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier** : Démontre que la Mandchourie a forgé une identité collective distincte malgré l'effacement politique du terme, en montrant comment la passe Shanhai fonctionne comme frontière symbolique entre « chez soi » et « ailleurs » pour les habitants (p. 384).\n- **Epilogue : Une consultation au temple taoïste Daode** : Donne à voir, sur un cas unique, le fonctionnement concret d'une consultation : une femme d'une soixantaine d'années vient déposer des requêtes sous forme de « déclarations votives prenant la forme de formulaires célestes *shuwen* 疏文 », pour son père atteint d'un cancer du pancréas et pour sa fille travaillant dans le Hunan (p. 75).\n- **Deuxième partie Un paysage religieux composite : Les consultations, les pratiques religieuses, et les rituels** : Démontre que les temples taoïstes répondent à des problèmes quotidiens et historiques profonds, en montrant comment les moines agissent comme médiateurs entre le monde terrestre, le monde céleste et les divinités pour résoudre des maux visibles ou invisibles (p. 383).\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que le taoïsme ne s'enracine qu'en intégrant le chamanisme local, en montrant comment le culte à la Mère Noire institutionnalise les animaux Esprits-Immortels et produit une « mandchourisation » réciproque (p. 389).\n\n## Cadre théorique\n\n- **Cadre principal** : Ethnographie religieuse / Anthropologie des religions — observation participante et analyse des interactions rituelles (p. 383) — structure l'analyse globale en reliant les pratiques micro-sociales des temples aux transformations macro-socio-politiques de la région.\n- **Cadres secondaires** :\n  - Géographie culturelle / Études frontalières — la frontière symbolique et la construction identitaire territoriale (p. 386) — sert à analyser comment la passe Shanhai délimite les appartenances ethniques, politiques et religieuses.\n  - Sociologie de la religion / Institutionnalisation — légitimation et orthodoxie locale (p. 388) — permet d'étudier comment les temples taoïstes intègrent et codifient des pratiques chamaniques pour assurer leur pérennité.\n  - Histoire politique / Nationalisme d'État — effacement toponymique et récit officiel (p. 384) — éclaire les motivations de la RPC à remplacer « Mandchourie » par « Nord-est » pour renforcer sa légitimité territoriale.\n\n## Concepts clés\n\n**CONCEPT** : CHAMANISME À CARACTÈRE LOCAL\n**SENS** : « le chamanisme à caractère local » (p. 303) — [NON DÉFINI EXPLICITEMENT] désigne par l'auteur l'ensemble des pratiques et croyances régionales du Nord-Est fondées sur la possession par des animaux Esprits-Immortels et leur intégration ritualisée au sein des temples taoïstes contemporains.\n**ORIGINE** : propre à l'auteur, construit pour distinguer les pratiques de possession actuelles (souvent qualifiées de *chuma* ou de superstition) du chamanisme historique des peuples indigènes, et souligner leur métamorphose institutionnelle.\n\n**CONCEPT** : MANDCHOURISATION\n**SENS** : « la religion taoïste doit s'adapter au chamanisme local pour pouvoir se développer en Mandchourie. D'où une véritable « mandchourisation », et non pas seulement une sinisation » (p. 389)\n**ORIGINE** : propre à l'auteur, conceptualisé comme processus d'ancrage religieux et identitaire réciproque où le taoïsme institutionnel s'adosse aux pratiques chamaniques locales pour s'enraciner, en rupture avec le discours dominant de sinisation.\n\n**CONCEPT** : MÈRE NOIRE (DIVINITÉ INTERFACIALE)\n**SENS** : « la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local » (p. 388)\n**ORIGINE** : propre à l'auteur, requalifiée en nœud institutionnel et rituel permettant l'articulation et la légitimation croisée entre l'orthodoxie taoïste et le culte populaire des esprits animaux.\n\n**CONCEPT** : PASSES SHANHAI (FRONTIÈRE SYMBOLIQUE)\n**SENS** : « la passe Shanhai, continuent à exister chez les gens, non plus en tant que frontière physique et administrative entre les deux côtés de la Grande Muraille, comme par le passé, mais bien comme une frontière religieuse qui pose les limites des compétences territoriales des animaux Esprits-Immortels xianjia » (p. 388)\n**ORIGINE** : propre à l'auteur, redéfini à partir d'un marqueur géographique et touristique pour en faire un opérateur de démarcation identitaire, rituelle et de compétence spirituelle.\n\n**CONCEPT** : SINISATION (CRITIQUÉE)\n**SENS** : « S'agit-il vraiment d'une sinisation juste parce que l'on parle le mandarin ? [...] est-ce vraiment ça la sinisation ? » (p. 99-100)\n**ORIGINE** : emprunté au discours nationaliste et institutionnel, retravaillé par l'auteur pour en révéler les limites en Mandchourie, où l'identité et les pratiques religieuses persistent au-delà des critères linguistiques ou vestimentaires supposés.\n\n## Ancrage empirique (ou concret)\n\n- Temples taoïstes de l'ordre monastique Quanzhen 全真 à Qiqihar (Heilongjiang) et Liuhe (Jilin), dirigés par la même supérieure taoïste (p. 23)\n- Consultations entre officiants taoïstes et fidèles servant de cas d'étude (p. 23)\n- Liste rouge vouée au culte des Esprits-Immortels renard et putois (« 供俸 有求必应 胡仙黄仙 保家平安 胡黄二仙保家仙之位 ») brûlée au temple (p. 380)\n- Papiers de dédouanement rituels « tongguan wendie 通关文牒 » vendus comme souvenirs touristiques à Shanhai mais investis d'une efficacité rituelle pour les esprits d'animaux (p. 387)\n\n## Opposition / Contre-argumentation\n\n- **Sinisation unidirectionnelle** : « ce n'est pas une simple question de sinisation comme cela pourrait paraître, mais aussi une sorte de « mandchourisation » » (p. 381) ; la thèse rejette l'idée que le taoïsme ait simplement remplacé ou absorbé passivement le chamanisme, montrant au contraire une adaptation mutuelle et une conservation des strates chamaniques (p. 389).\n- **Déclin attribué uniquement à des facteurs endogènes** : « on va jusqu'à entendre des discours [...] qui laissent entendre que le déclin de la Mandchourie est en grande partie de de son fait, attribué à un esprit fermé et retardataire, à une idéologie anti-marché, et sur un autre registre au climat froid » (p. 385) ; l'auteur nuance cette vision en rappelant l'exploitation historique des ressources et le sentiment d'abandon face aux réformes économiques (p. 385).\n- **Effacement politique du terme « Mandchourie » comme simple neutralité** : « si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité » (p. 384) ; l'auteur oppose cette interprétation géopolitique active aux discours officiels qui présentent le changement comme anodin ou technique.\n\n## Apport principal\n\n- **Théorique** : Introduce le concept de « mandchourisation » réciproque pour dépasser le paradigme dominant de la « sinisation » unidirectionnelle, montrant comment le taoïsme Quanzhen doit s'adapter au chamanisme local pour s'enraciner (p. 389).\n- **Empirique** : Documente pour la première fois le rôle structurant du culte à la Mère Noire comme interface institutionnelle légitimant les animaux Esprits-Immortels dans les temples taoïstes du Nord-Est, ainsi que l'usage rituel contemporain des papiers de dédouanement de Shanhai (p. 387).\n- **Critique** : Démontre que la frontière religieuse de la passe Shanhai persiste comme opérateur identitaire et territorial malgré l'effacement politique du nom « Mandchourie », révélant une altérité culturelle et spirituelle résiliente face au récit national unificateur (p. 386).\n", "intro_md": "<!-- thesis: 2024PA100032 -->\n<!-- intro pp.23-23 -->\n<!-- conclusion pp.380-389 -->\n<!-- abstract p.6 -->\n\n# Step 2 — content (intro + conclusion + abstract merged)\n\n## these_centrale\n\nLa religion taoïste Quanzhen s'est profondément enracinée en Mandchourie non pas par une simple « sinisation », mais grâce à une « mandchourisation » réciproque qui intègre les éléments chamaniques locaux, notamment le culte à la Mère Noire et aux animaux Esprits-Immortels (p. 381). Cette interaction dynamique permet aux pratiques chamaniques d'être institutionnalisées sous l'égide taoïste, tout en conférant aux temples taoïstes une légitimité et une prospérité locales (p. 381). En retour, le taoïsme doit s'adapter au chamanisme pour survivre et se développer dans cette région, créant ainsi une identité religieuse et territoriale singulière au nord de la Grande Muraille (p. 389). Le réseau de temples est structuré autour du culte à la Mère Noire, divinité centrale reliant les sites depuis l'empire Qing jusqu'à l'époque contemporaine, tandis que la Passe Shanhai fonctionne comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6).\n\n## questions_recherche\n\n- « étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie » (p. 23)\n- « comprendre le rôle de ces temples dans la société d'aujourd'hui » (p. 23)\n\n## reponses_questions\n\n- Pour la question sur les dynamiques et interactions : « l'interaction dynamique entre le x Esprits-Immortels xianjia » (p. 388)\n- **ORIGINE** : propre à l'auteur, redéfini à partir d'un marqueur géographique/historique pour en faire un opérateur de démarcation identitaire et rituelle.\n- **CONCEPT** : MÈRE NOIRE (DIVINITÉ INTERFACIALE)\n- **SENS** : « la Mère Noire est perçue par les gens en Mandchourie comme une divinité très importante car elle est à la fois en charge de la gestion des animaux Esprits-Immortels dans le chamanisme et à la tête du panthéon taoïste local » (p. 388)\n- **ORIGINE** : propre à l'auteur, conceptualisé comme nœud institutionnel permettant l'articulation entre orthodoxie taoïste et chamanisme populaire.\n- **CONCEPT** : ANIMAUX ESPRITS-IMMORTELS (XIANJIA)\n- **SENS** : « les animaux Esprits-Immortels xianjia, désignés par une appellation générique mais compris localement de façon très précise en référence à cinq catégories d'animaux : hu huang bai liu hui, ou le renard immortel, le putois immortel, le hérisson immortel, le serpent immortel, et la souris immortelle, sont considérés comme relevant des cultures chamaniques » (p. 387)\n- **ORIGINE** : emprunté au vocabulaire local chamanique et retravaillé par l'auteur pour analyser leur gestion ritualisée et leur territorialité symbolique.\n- **CONCEPT** : LIGNÉES TAOÏSTES\n- **SENS** : La Passe Shanhai est perçue aujourd'hui par les moines taoïstes comme une « ligne de partage des eaux qui sépare les lignées taoïstes » (p. 6)\n- **ORIGINE** : propre à l'auteur, mobilisé pour conceptualiser la segmentation religieuse et généalogique induite par la frontière historique de la Grande Muraille.\n\n## ancrage_empirique\n\n- Temples taoïstes de l'ordre monastique Quanzhen 全真 à Qiqihar (Heilongjiang) et Liuhe (Jilin), dirigés par la même supérieure taoïste (p. 23)\n- Consultations entre officiants taoïstes et fidèles servant de cas d'étude (p. 23)\n- Liste rouge vouée au culte des Esprits-Immortels renard et putois (« 供俸 有求必应 胡仙黄仙 保家平安 胡黄二仙保家仙之位 ») brûlée au temple (p. 380)\n- Papiers de dédouanement rituels « tongguan wendie 通关文牒 » vendus comme souvenirs touristiques à Shanhai mais investis d'une efficacité rituelle pour les esprits d'animaux (p. 387)\n\n## opposition\n\n- **Sinisation unidirectionnelle** : « ce n'est pas une simple question de sinisation comme cela pourrait paraître, mais aussi une sorte de « mandchourisation » » (p. 381) ; la thèse rejette l'idée que le taoïsme ait simplement remplacé ou absorbé passivement le chamanisme, montrant au contraire une adaptation mutuelle et une conservation des strates chamaniques (p. 389).\n- **Déclin attribué uniquement à des facteurs endogènes** : « on va jusqu'à entendre des discours [...] qui laissent entendre que le déclin de la Mandchourie est en grande partie de de son fait, attribué à un esprit fermé et retardataire, à une idéologie anti-marché, et sur un autre registre au climat froid » (p. 385) ; l'auteur nuance cette vision en rappelant l'exploitation historique des ressources et le sentiment d'abandon face aux réformes économiques (p. 385).\n- **Effacement politique du terme « Mandchourie » comme simple neutralité** : « si la RPC tend à priver la Mandchourie de son appellation, ce n'est pas seulement pour minimiser la souveraineté de l'empire Qing ou pour délégitimer le Mandchoukouo, mais aussi pour justifier et renforcer sa propre autorité » (p. 384) ; l'auteur oppose cette interprétation géopolitique active aux discours officiels qui présentent le changement comme anodin ou technique.\n\n## apport_principal\n\n- **Théorique** : Introduce le concept de « mandchourisation » réciproque pour dépasser le paradigme dominant de la « sinisation » unidirectionnelle, montrant comment le taoïsme Quanzhen doit s'adapter au chamanisme local pour s'enraciner (p. 389).\n- **Empirique** : Documente pour la première fois le rôle structurant du culte à la Mère Noire comme interface institutionnelle légitimant les animaux Esprits-Immortels dans les temples taoïstes du Nord-Est, ainsi que l'usage rituel contemporain des papiers de dédouanement de Shanhai (p. 387).\n- **Critique** : Démontre que la frontière religieuse de la passe Shanhai persiste comme opérateur identitaire et territorial malgré l'effacement politique du nom « Mandchourie », révélant une altérité culturelle et spirituelle résiliente face au récit national unificateur (p. 386).\n\n---\n\n# Step 2 — scoring\n\n| section | score | gaps | refs |\n|---|---|---|---|\n| these_centrale | 8 | La synthèse est solide mais manque de nuances sur la dimension historique précise de l'empire Qing vs RPC mentionnée dans le plan | [chapter] 1. La Mandchourie : un territoire singulier ; [chapter] 2. L'importance actuelle de la Grande Muraille comme délimitation |\n| questions_recherche | 9 | Les questions sont bien identifiées, mais on pourrait chercher si d'autres sous-questions émergent des chapitres intermédiaires | [chapter] Chapitre 1 Territoire rebaptisé « Le Nord-Est », territoire (en partie seulement) sinisé ? ; [chapter] Chapitre 2 Qu'est-ce qui fait encore que les gens sont Mandchous ? |\n| reponses_questions | 7 | Les réponses sont partielles, surtout pour la question sur le rôle des temples qui pourrait être enrichie par les détails des consultations | [chapter] Chapitre 6 Quelques services rituels et leur mode d'acheminement ; [chapter] Chapitre 5 La vie monacale et les temples taoïstes en réseau |\n| hypotheses | 0 | Aucune hypothèse explicite trouvée dans l'introduction ou la conclusion fournie | [chapter] 1. La Mandchourie : un territoire singulier ; [chapter] 2. L'importance actuelle de la Grande Muraille comme délimitation |\n| methodologie | 6 | La méthode ethnographique est décrite, mais les détails sur le corpus (nombre d'entretiens, durée exacte par site) et l'analyse des données manquent | [chapter] 1. La Mandchourie : un territoire singulier ; [chapter] 2. L'importance actuelle de la Grande Muraille comme délimitation ; [chapter] 3. La ville de Qiqihar |\n| fil_rouge | 8 | Le fil rouge est b d'hui et en particulier les consultations entre les officiants taoïstes et les fidèles, à la lumière des changements socio-politiques connus par ce territoire. L'étude révèle que la Passe Shanhai de la Grande Muraille en Chine, historiquement une frontière entre la Mandchourie et l'Empire du milieu, est perçue aujourd'hui par les moines taoïstes vivant dans les temples comme une « ligne de partage des eaux qui sépare les lignées taoïstes ». Les observations de terrain montrent également que le culte à la Mère Noire, une divinité locale très importante, est au cœur du réseau associant les temples taoïstes les uns aux autres dans l'ensemble de la Mandchourie depuis l'empire mandchou des Qing, jusqu'à l'époque contemporaine. La thèse s'intéresse de la sorte aux interactions entre la religion taoïste et le chamanisme local, à travers la croyance en des animaux Esprits-Immortels xianjia 仙家 et la manière dont ces échanges aident le taoïsme à s'ancrer localement et le chamanisme à s'institutionnaliser. Cette dynamique complexe façonne le paysage religieux de la Mandchourie.\n**Mots-clefs** : religion taoïste, vie monacale, consultations, pratiques rituelles, Grande Muraille, Mandchourie, ethnographie\n3\n\n<<< PAGE 7 >>>\n\n4\n\n<<< PAGE 8 >>>\n\nAbstract :\nThis thesis focuses on a network of Taoist temples centered on the Daode temple erected in\nthe city of Qiqihar, in Heilongjiang in northern China. an ancient temple to the five religions\nclosed in 1947 and reopened in 2014 as a Taoist temple. As well as on the dynamics of\ninteractions between Taoist temples and inhabitants in contemporary times. Through an\nethnographic investigation of sixteen months spent on site, its ambition is to describe and\nanalyze life within the temples and in particular the consultations between the Taoist\nofficiants and the faithful, in the light of the socio-political changes experienced by this\nterritory. The study reveals that the Shanhai Pass of the Great Wall in China, historically a\nborder between Manchuria and the Middle Kingdom, is seen today by Taoist monks living in\nthe temples as a \"watershed that separates Taoist lineages.\" Field observations also show that\nthe cult of the Black Mother, a very important local deity, is at the heart of the network\nassociating Taoist temples with each other throughout Manchuria from the Manchu Empire\nof the Qing, until contemporary China. The thesis is thus interested in the interactions\nbetween the Taoist religion and local shamanism, through the belief in animal Spirits-\nImmortals *xianjia* 仙家 and the way in which these exchanges help Taoism to take root\nlocally and shamanism to become institutionalized. These complex dynamics shape the\nreligious landscape of Manchuria.\n**Keywords:** Taoist religion, monastic life, Taoists and faithful, ritual practices, Great Wall, Manchuria, ethnography\n5\n\n<<< PAGE 9 >>>\n\n6\n\n<<< PAGE 10 >>>\n\n# Table des matières\n<table><tr><td>Résumé<\/td><td>3<\/td><\/tr><tr><td>Abstract<\/td><td>5<\/td><\/tr><tr><td>Remerciements<\/td><td>15<\/td><\/tr><tr><td>Notices<\/td><td>18<\/td><\/tr><tr><td>Introduction<\/td><td>20<\/td><\/tr><tr><td>1. La Mandchourie : un territoire singulier<\/td><td>20<\/td><\/tr><tr><td>2. L'importance actuelle de la Grande Muraille comme délimitation<\/td><td>22<\/td><\/tr><tr><td>3. La ville de Qiqihar<\/td><td>24<\/td><\/tr><\/table>\n## Première partie\nLa Mandchourie se transforme en « Nord-est de la Chine » : Un temple singulier dans un territoire frontalier 31\nChapitre 1 Territoire rebaptisé « Le Nord-Est », territoire (en partie seulement) sinisé ? 32\n1.1 La passe Shanzhai de la Grande Muraille : une passe, deux mondes 33\n1.2 Qiqihar, un nom daur - « la pâture naturelle » 38\n1.3 L'arrivée des migrants Chinois Han 43\n1.4 La Mandchourie sous le régime communiste 46\na) Comment « la Mandchourie » est devenue « le Nord-est de la Chine » 46\n7\n\n<<< PAGE 11 >>>\n\nb) « Les fils aînés de la RPC » : un concept inventé sur l sion** .................................................................................................................. 380\n12\n\n<<< PAGE 16 >>>\n\nRéférences bibliographiques .................................................................................... 387\nSources primaires ........................................................................................................ 387\nLittérature secondaire .................................................................................................... 388\nAnnexes ............................................................................................................................ 405\nAnnexe 1. Rapport de construction rédigé et publié par l'ancien temple Daode aux cinq religions .................................................................................................................... 405\nAnnexe 2. Extraits d'autres textes imprimés par l'ancien temple Daode aux cinq religion .................................................................................................................... 426\nAnnexe 3. Anthologie des cas véridiques de recherche de l'aide des Immortels (Qiuxian yingyan shili xuan 求仙应验事例选) - le livret sur la Mère Noire emprunté au moine Cheng Zonghe .................................................................................................................... 435\n13\n\n<<< PAGE 17 >>>\n\n14\n\n<<< PAGE 18 >>>\n\nRemerciements\nJ'exprime tout d'abord ma gratitude à tous les membres du jury d'avoir accepté de lire ma\nthèse et d'être présents lors de la soutenance. Le cheminement de cette étude durant cinq ans\net demi a été parsemé d'amertumes, de douleurs, de doutes, de pertes de confiance totale et\nde précarité financière, faute de financement. Je pensais depuis longtemps ne jamais pouvoir\nm'en sortir. À partir de l'année 2023, sous la pression des idées noires et de la dégradation de\nma santé, j'ai sérieusement envisagé de quitter définitivement le monde de la recherche.\nCependant, je n'ai jamais regretté d'avoir entrepris cette aventure particulière et enrichissante.\nGrâce à elle, je suis passée d'une débutante qui n'était pas très assurée en ethnologie et en\nanthropologie et qui connaissait peu les changements historiques en Mandchourie, à\nquelqu'un qui en sait désormais un peu plus.\nMon intérêt pour l'étude de la religion taoïste a commencé à se développer au mois d'octobre\n2018, un mois après l'obtention de mon master. C'était un mardi après-midi où, par hasard,\nj'ai assisté à un séminaire d'anthropologie de ma future directrice, Adeline Herrou, à\nNanterre, portant sur l'efficacité rituelle des temples taoïstes dans le Shaanxi, une province\nsituée au centre-nord de la Chine. Ayant peu de connaissances sur la religion taoïste, je\npercevais les taoïstes comme des personnes superstitieuses pratiquant les arts martiaux. Ce\njour-là, j'ai trouvé le séminaire très intéressant. En même temps, je me suis rendue compte\nque mon regard sur le monde était limité. Ce séminaire a été le déclencheur qui m'a rappelé\nl'existence d'un bâtiment dans ma ville natale, autrefois un établissement aux cinq religions,\nqui était devenu récemment un temple taoïste habité par des moines taoïstes. C'est ainsi que\nmon futur terrain ethnographique a commencé à prendre forme. Ainsi, je tiens à exprimer ma\nprofonde gratitude avant tout à ma directrice, qui a consacré beaucoup de temps à la relecture\nde mes textes et à me prodiguer des conseils rigoureux pour l'élaboration de ce travail. Je lui\nsuis extrêmement reconnaissante de m'avoir véritablement guidée sur le chemin de la\nrecherche et d'avoir suscité mon intérêt et ma curiosité. Elle est pour moi un modèle\nd'érudition, une chercheuse sérieuse qui m'a accompagnée tout au long de l'achèvement de\ncette étude. Sans son soutien, ses critiques et ses suggestions incessantes, je n'aurais pas pu\n15\n\n<<< PAGE 19 >>>\n\nmener à bien ce travail. Je tiens également à souligner qu'e es issues de deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin.\nDirigés par la même supérieure taoïste, il s'agit de temples fonctionnant en réseau au sein de l'ordre monastique Quanzhen 全真 (de la Perfection totale). Le temple où s'est principalement déroulée notre enquête est localisé dans la ville de Qiqihar, province du Heilongjiang, dans la Mandchourie du nord.\nCette recherche a pour objectif d'étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie. Les consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles fourniront des cas d'étude tout au long de cette recherche pour comprendre le rôle de ces temples dans la société d'aujourd'hui. Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire.\n## 1. La Mandchourie : un territoire singulier\nHistoriquement, la Mandchourie était peuplée par des groupes toungouses non Han. Actuellement, elle constitue un territoire intégré à la République populaire de Chine, désignée officiellement comme « le Nord-est de la Chine » (zhongguo dongbei 中国东北). La Mandchourie est subdivisée en plusieurs régions distinctes, du nord au sud : le Heilongjiang, le Jilin, le Liaoning, ainsi que certaines parties de l'est de la Mongolie intérieure.\n20\n\n<<< PAGE 24 >>>\n\nLes autorités centrales soulignent que ce vaste territoire d'Asie du Nord-est, habité par des populations de divers groupes ethniques, a toujours fait partie intégrante de la Chine, communément désignée comme « l'Empire du Milieu ». Elles insistent sur le fait que son histoire doit être interprétée dans le cadre de celle de la civilisation chinoise (zhonghua wenming 中华文明). Du point de vue idéologique, les connaissances relatives à ce territoire doivent s'aligner sur s'aligner sur celles de la société chinoise, dans une perspective à la fois sino-centrée et reconnaissant les différentes ethnies (minzu 民族) qui composent le grand minzu¹.\nCependant, il convient de rappeler que la Mandchourie, terre d'origine des Mandchous qui ont conquis l'Empire du Milieu pendant près de trois siècles (dynastie mandchoue des Qing : 1644-1912), n'a été réellement « intégrée » à la Chine qu'après 1947. À cette date, le régime communiste a pris le contrôle de ce territoire au nord de la Grande Muraille, au lendemain de la défaite du Japon à l'issue de la seconde guerre mondiale. À cette époque, tant les nationalistes que les communistes aspiraient à s'approprier la Mandchourie, qui avait été sous le contrôle du Japon (1932-1945), la faisant ainsi devenir leur champ de bataille décisif.\nAvec le soutien de l'URSS, les communistes ont acquis une position dominante face aux nationalistes. En 1947, la ville de Qiqihar est tombée sous le contrôle des communistes. Par la suite, les communistes ont maintenu une position avantageuse jusqu'à la fondation de la République populaire de Chine en 1949. Simultanément, cette période a contraint les nationalistes vaincus à fuir et à s'installer à Taïwan.\nDe longue date, il est courant en Chine comme hors de Chine de considérer les Mandchous, fondateurs de l'Empire des Qing, comme la « dernière dynastie chinoise ». Cependant, il convient de noter que, dans les manuels scolaires chinois contemporains, lorsque les Mandchous, ou les Jürchens (ancêtres des Mandchous, principalement connus pour avoir repoussé la dynastie chinoise des Song vers le Sud) sont mentionnés, ils sont souvent catégorisés à travers le prisme de l'altérité, désignés comme « les ethnies du Nord » (beifang minzu 北方民族) ou de manière plus péjorative comme « les Barbares du Nord » (beifang manzu 北方蛮族).\n¹ Voir par exemple Thoraval, 1991, p. 9.\n21\n\n<<< PAGE 25 >>>\n\nEn réalité, tout au long de la période des Qing, la classe gouvernementale mandchoue a accordé une importance particulière au maintien de son identité mandchoue, mettant en œuvre différentes mesures politiques en ce sens.\n## 2. L'importance actuelle de la Grande Muraille comme délimitation\nLa Grande Muraille a historiquement marqué la frontière entre la Mandchourie et l'Empire du Milieu, limitant les échanges entre les peuples des deux côtés. La Mandchourie, située au nord de la Grande Muraille, représente une terre avec une histoire propre, un espace naturel et géographique distinct de celui au sud de la Grande Muraille, et abrite des populations de groupes ethniques divers ainsi qu'un paysage religieux particulier. À travers deux enquêtes ethnographiques centrées sur plusieurs temples taoïstes disséminés dans divers endroits de la Mandchourie, notre étude adopte une approche qui part du local pour aller vers le global, mettant l'accent sur les perspectives, les expériences et les pratiques des gens locaux dans le domaine religieux. L'observation participante offre un accès non seulement aux faits religieux, mais aussi aux contextes socio-économiques et historiques qui les sous-tendent en Mandchourie. Les caractéristiques de ce champ religieux sont plus complexes qu'il n'y paraît. C'est une réalité encore très présente localement et qui m'a été donnée à comprendre sur place : à parler avec les gens, j'ai pris la mesure son importance, en relevant une expression qui revient très souvent dans les discours \"Shanhaiguan 山海关\". Localement, pour évoquer la Grande Muraille, c'est généralement le terme \"Shanhaiguan\" (littéralement : la passe Shanhai, « shan » signifiant la montagne, et « hai » la mer) qui est utilisé.\nDurant mes enquêtes, la Grande Muraille, cette ancienne frontière géographique, est fréquemment mentionnée dans le milieu religieux. À notre grande surprise, même aujourd'hui en Mandchourie, la Grande Muraille est toujours perçue comme une sorte de frontière. Nous avons réalisé que le fait qu'elle ne serve plus de confins géographiques officiels n'efface toutefois pas son caractère de frontière dans d'autres dimensions, notamment symboliques. Selon les religieux, c'est-à-dire les officiants taoïstes, la passe Shanhai représente « une ligne de démarcation des eaux » (fenshuiling 分水岭) entre le nord (la Mandchourie) et le sud\n22\n===== FIN DU BLOB =====\n\n## TÂCHE\n\nProduis une sortie en TEXTE BRUT (PAS de JSON) en DEUX sections :\n(1) les métadonnées, une clé par ligne, (2) la table des matières, une\nentrée par ligne. Format compact conçu pour minimiser le nombre de tokens.\n\n### Section 1 — Métadonnées\n\nExactement ces 6 lignes, dans cet ordre, format `CLÉ: valeur` :\n\nTITRE: <titre complet, sous-titre inclus si présent>\nAUTEUR: <nom complet>\nANNEE: <année de soutenance, ex. 2024>\nETABLISSEMENT: <université + laboratoire/école doctorale si présent>\nDISCIPLINE: <mention ou discipline>\nMOTS_CLES: <mot-clé 1; mot-clé 2; mot-clé 3; ...>\n\nRègles :\n  - Une seule ligne par champ (pas de saut de ligne à l'intérieur d'une valeur).\n  - Si une information est absente du blob, écris `null` après les deux-points.\n  - Les mots-clés sont séparés par `; ` (point-virgule espace). Liste vide → `null`.\n  - NE PAS inventer. NE PAS inclure le résumé/abstract. NE PAS ajouter d'autres champs.\n\n### Section 2 — Table des matières\n\nAprès les métadonnées, laisse UNE ligne vide puis écris exactement cette\nligne marqueur :\n\nTOC\n\nPuis une ligne par entrée de la TOC, dans leur ordre exact d'apparition,\nau format :\n\n<level>|<page_start>|<title>\n\nOù :\n  - `<level>` = profondeur hiérarchique (entier) :\n      · 0 = parties de plus haut niveau (Introduction, Partie I, Chapitre 1,\n            Conclusion, Bibliographie, Annexes, Résumé, Abstract, …)\n      · 1 = sections numéroté es\nDirectrice de recherche :\nCentre national de la recherche\nscientifique (CNRS)\n\n<<< PAGE 4 >>>\n\nReligion taoïste et société locale au nord de la Grande Muraille\nEthnographie d'un réseau de temples taoïstes en Mandchourie du Nord\nPar Binqi CUI\n1\n\n<<< PAGE 5 >>>\n\n2\n\n<<< PAGE 6 >>>\n\nRésumé :\nCette thèse porte sur un réseau de temples taoïstes centré sur le temple Daode érigé dans la ville de Qiqihar, au Heilongjiang en Chine du Nord, un ancien temple aux cinq religions fermé en 1947 et rouvert en 2014 en tant que temple taoïste. Fondée sur une enquête ethnographique de seize mois passés sur place, elle a pour ambition de décrire et analyser la vie au sein des temples aujourd'hui et en particulier les consultations entre les officiants taoïstes et les fidèles, à la lumière des changements socio-politiques connus par ce territoire. L'étude révèle que la Passe Shanhai de la Grande Muraille en Chine, historiquement une frontière entre la Mandchourie et l'Empire du milieu, est perçue aujourd'hui par les moines taoïstes vivant dans les temples comme une « ligne de partage des eaux qui sépare les lignées taoïstes ». Les observations de terrain montrent également que le culte à la Mère Noire, une divinité locale très importante, est au cœur du réseau associant les temples taoïstes les uns aux autres dans l'ensemble de la Mandchourie depuis l'empire mandchou des Qing, jusqu'à l'époque contemporaine. La thèse s'intéresse de la sorte aux interactions entre la religion taoïste et le chamanisme local, à travers la croyance en des animaux Esprits-Immortels xianjia 仙家 et la manière dont ces échanges aident le taoïsme à s'ancrer localement et le chamanisme à s'institutionnaliser. Cette dynamique complexe façonne le paysage religieux de la Mandchourie.\n**Mots-clefs** : religion taoïste, vie monacale, consultations, pratiques rituelles, Grande Muraille, Mandchourie, ethnographie\n3\n\n<<< PAGE 7 >>>\n\n4\n\n<<< PAGE 8 >>>\n\nAbstract :\nThis thesis focuses on a network of Taoist temples centered on the Daode temple erected in\nthe city of Qiqihar, in Heilongjiang in northern China. an ancient temple to the five religions\nclosed in 1947 and reopened in 2014 as a Taoist temple. As well as on the dynamics of\ninteractions between Taoist temples and inhabitants in contemporary times. Through an\nethnographic investigation of sixteen months spent on site, its ambition is to describe and\nanalyze life within the temples and in particular the consultations between the Taoist\nofficiants and the faithful, in the light of the socio-political changes experienced by this\nterritory. The study reveals that the Shanhai Pass of the Great Wall in China, historically a\nborder between Manchuria and the Middle Kingdom, is seen today by Taoist monks living in\nthe temples as a \"watershed that separates Taoist lineages.\" Field observations also show that\nthe cult of the Black Mother, a very important local deity, is at the heart of the network\nassociating Taoist temples with each other throughout Manchuria from the Manchu Empire\nof the Qing, until contemporary China. The thesis is thus interested in the interactions\nbetween the Taoist religion and local shamanism, through the belief in animal Spirits-\nImmortals *xianjia* 仙家 and the way in which these exchanges help Taoism to take root\nlocally and shamanism to become institutionalized. These complex dynamics shape the\nreligious landscape of Manchuria.\n**Keywords:** Taoist religion, monastic life, Taoists and faithful, ritual practices, Great Wall, Manchuria, ethnography\n5\n\n<<< PAGE 9 >>>\n\n6\n\n<<< PAGE 10 >>>\n\n# Table des matières\n<table><tr><td>Résumé<\/td><td>3<\/td><\/tr><tr><td>Abstract<\/td><td>5<\/td><\/tr><tr><td>Remerciements<\/td><td>15<\/td><\/tr><tr><td>Notices<\/td><td>18<\/td><\/tr><tr><td>Introduction<\/td><td>20<\/td><\/tr><tr><td>1. La Mandchourie : un territoire singulier<\/td><td>20<\/td><\/tr><tr><td>2. L'importance actuelle de la Grande Muraille comme délim .................................................................................... 435\n13\n\n<<< PAGE 17 >>>\n\n14\n\n<<< PAGE 18 >>>\n\nRemerciements\nJ'exprime tout d'abord ma gratitude à tous les membres du jury d'avoir accepté de lire ma\nthèse et d'être présents lors de la soutenance. Le cheminement de cette étude durant cinq ans\net demi a été parsemé d'amertumes, de douleurs, de doutes, de pertes de confiance totale et\nde précarité financière, faute de financement. Je pensais depuis longtemps ne jamais pouvoir\nm'en sortir. À partir de l'année 2023, sous la pression des idées noires et de la dégradation de\nma santé, j'ai sérieusement envisagé de quitter définitivement le monde de la recherche.\nCependant, je n'ai jamais regretté d'avoir entrepris cette aventure particulière et enrichissante.\nGrâce à elle, je suis passée d'une débutante qui n'était pas très assurée en ethnologie et en\nanthropologie et qui connaissait peu les changements historiques en Mandchourie, à\nquelqu'un qui en sait désormais un peu plus.\nMon intérêt pour l'étude de la religion taoïste a commencé à se développer au mois d'octobre\n2018, un mois après l'obtention de mon master. C'était un mardi après-midi où, par hasard,\nj'ai assisté à un séminaire d'anthropologie de ma future directrice, Adeline Herrou, à\nNanterre, portant sur l'efficacité rituelle des temples taoïstes dans le Shaanxi, une province\nsituée au centre-nord de la Chine. Ayant peu de connaissances sur la religion taoïste, je\npercevais les taoïstes comme des personnes superstitieuses pratiquant les arts martiaux. Ce\njour-là, j'ai trouvé le séminaire très intéressant. En même temps, je me suis rendue compte\nque mon regard sur le monde était limité. Ce séminaire a été le déclencheur qui m'a rappelé\nl'existence d'un bâtiment dans ma ville natale, autrefois un établissement aux cinq religions,\nqui était devenu récemment un temple taoïste habité par des moines taoïstes. C'est ainsi que\nmon futur terrain ethnographique a commencé à prendre forme. Ainsi, je tiens à exprimer ma\nprofonde gratitude avant tout à ma directrice, qui a consacré beaucoup de temps à la relecture\nde mes textes et à me prodiguer des conseils rigoureux pour l'élaboration de ce travail. Je lui\nsuis extrêmement reconnaissante de m'avoir véritablement guidée sur le chemin de la\nrecherche et d'avoir suscité mon intérêt et ma curiosité. Elle est pour moi un modèle\nd'érudition, une chercheuse sérieuse qui m'a accompagnée tout au long de l'achèvement de\ncette étude. Sans son soutien, ses critiques et ses suggestions incessantes, je n'aurais pas pu\n15\n\n<<< PAGE 19 >>>\n\nmener à bien ce travail. Je tiens également à souligner qu'elle m'a apporté une aide précieuse dans ma vie quotidienne et dans mes recherches de travail à temps partiel dans le domaine de l'éthnologie. Elle a toujours pris en considération les aspects significatifs de mes enquêtes.\nCette thèse a pu voir le jour également grâce à Alain Arrault et à Nicolas Prévôt, membres de mon comité de suivi depuis le mois de juin 2020. Cette année-là, l'entretien du comité de suivi s'est même déroulé en visioconférence, malgré les inconvénients. Ils ont toujours été patients, et leurs conseils annuels m'ont permis de progresser dans mes enquêtes et dans mon écriture. Ils ont relu très attentivement chacun de mes chapitres et m'ont fait des remarques importantes. Leurs compétences académiques m'ont largement encouragée à avancer et ont façonné ma vision de la discipline. Je tiens également à exprimer ma gratitude envers Brigitte Baptandier, Sabine Trebinjac et Gladys Chicharro pour m'avoir accompagnée de très près lors des discussions collectives de l'Atelier Chine pendant plusieurs années, ainsi que pour m'avoir activement impliquée dans le séminaire. Je dois aussi ce travail à mon institution de rattachement, l'Université Paris Nanterre, et l'École Doctorale 395, ainsi qu'au Laboratoire d'ethnologie et de sociologie comparative qui m'a accueillie pendant ma thèse, et m'a apporté un soutien financier pour faire mon terrain. Je remercie tous les membres du Laboratoire. Je remercie également Claire Vidal pour ses suggestions.\nJe tiens à remercier sincèrement Hélène Bloch qui m'a aidée à relire au moins deux longs chapitres de ma thèse lors de la première rédaction, ce qui lui a demandé beaucoup de temps. Mes pensées vont aussi à mes compagnons de l'Atelier des doctorants, en particulier Ludivine Ricou, qui m'a généreusement soutenue à l'été 2023.\nJe tiens à exprimer ma gratitude envers tous mes interlocuteurs rencontrés dans divers endroits en Mandchourie au cours de mes enquêtes. Je pense notamment à la communauté des moines taoïstes, aux fidèles, aux habitants ordinaires et aux chercheurs locaux. Dans la plupart de nos échanges, ils m'ont accueillie avec une hospitalité étonnante.\nMalgré de longues heures passées seule dans mon travail, je remercie Jia Junyuan, Li Jingyi, Kou Meng, Ha Chengru, Liu Ruojing, Zhao Yue et Solenn Deler d'avoir toujours pensé à moi.\n16\n\n<<< PAGE 20 >>>\n\nJe voudrais également exprimer ma gratitude envers Mimi Caou, Pascal Tartarin et Bernard Meier, qui m'ont soit aidée à relire ma thèse, soit donné des conseils très utiles. Je suis reconnaissante à Jiang Lan et à sa famille, ainsi qu'à Xu Ye et à sa famille, pour m'avoir respectivement conduit à mon nouveau logement après mon retour en France au printemps 2022 après ma deuxième enquête, et pour avoir gardé mes valises et mes affaires pendant que je menais mes enquêtes. Je tiens également à remercier le pasteur Kim Tae-Seong pour sa bienveillance depuis des années, Son Geonu pour la joie et la force qu'il m'apporte, ainsi que Park Woong-Cheol pour son soutien moral durable.\nEnfin, je remercie ma chère maman pour son soutien indéfectible malgré les obstacles auxquels elle est confrontée depuis ces dernières années.\n17\n\n<<< PAGE 21 >>>\n\n## Notices\nDans cette thèse, la méthode de transcription utilisée est le pinyin. Les noms propres et les noms de lieu sont principalement indiqués en caractères chinois, parfois en hangeul et en écriture mandchoue selon le contexte. Les sources primaires, la littérature secondaire ainsi que les documents d'archives originaux utilisés dans cette étude sont respectivement écrits en caractères chinois traditionnels et simplifiés, afin de préserver leur forme originale. Sauf indication contraire, les traductions du chinois vers le français des citations et des passages sont de ma propre rédaction.\n18\n\n<<< PAGE 22 >>>\n\n19\n\n<<< PAGE 23 >>>\n\n## Introduction\nCette thèse ethnographique porte sur la religion taoïste en Mandchourie. Elle se fonde sur les observations participantes issues de deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin.\nDirigés par la même supérieure taoïste, il s'agit de temples fonctionnant en réseau au sein de l'ordre monastique Quanzhen 全真 (de la Perfection totale). Le temple où s'est principalement déroulée notre enquête est localisé dans la ville de Qiqihar, province du Heilongjiang, dans la Mandchourie du nord.\nCette recherche a pour objectif d'étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie. Les consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles fourniront des cas d'étude tout au long de cette recherche pour comprendre le rôle de ces temples dans la société d'aujourd'hui. Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire.\n## 1. La Mandchourie : un territoire singulier\nHistoriquement, la Mandchourie était peuplée par des groupes toungouses non Han. Actuellement, elle constitue un territoire intégré à la République populaire de Chine, désignée officiellement comme « le Nord-est de la Chine » (zhongguo dongbei 中国东北). La Mandchourie est subdivisée en plusieurs régions distinctes, du nord au sud : le Heilongjiang, le Jilin, le Liaoning, ainsi que certaines parties de l'est de la Mongolie intérieure.\n20\n\n<<< PAGE 24 >>>\n\nLes autorités centrales soulignent que ce vaste territoire d'Asie du Nord-est, habité par des populations de divers groupes ethniques, a toujours fait partie intégrante de la Chine, communément désignée comme « l'Empire du Milieu ». Elles insistent sur le fait que son histoire doit être interprétée dans le cadre de celle de la civilisation chinoise (zhonghua wenming 中华文明). Du point de vue idéologique, les connaissances relatives à ce territoire doivent s'aligner sur s'aligner sur celles de la société chinoise, dans une perspective à la fois sino-centrée et reconnaissant les différentes ethnies (minzu 民族) qui composent le grand minzu¹.\nCependant, il convient de rappeler que la Mandchourie, terre d'origine des Mandchous qui ont conquis l'Empire du Milieu pendant près de trois siècles (dynastie mandchoue des Qing : 1644-1912), n'a été réellement « intégrée » à la Chine qu'après 1947. À cette date, le régime communiste a pris le contrôle de ce territoire au nord de la Grande Muraille, au lendemain de la défaite du Japon à l'issue de la seconde guerre mondiale. À cette époque, tant les nationalistes que les communistes aspiraient à s'approprier la Mandchourie, qui avait été sous le contrôle du Japon (1932-1945), la faisant ainsi devenir leur champ de bataille décisif.\nAvec le soutien de l'URSS, les communistes ont acquis une position dominante face aux nationalistes. En 1947, la ville de Qiqihar est tombée sous le contrôle des communistes. Par la suite, les communistes ont maintenu une position avantageuse jusqu'à la fondation de la République populaire de Chine en 1949. Simultanément, cette période a contraint les nationalistes vaincus à fuir et à s'installer à Taïwan.\nDe longue date, il est courant en Chine comme hors de Chine de considérer les Mandchous, fondateurs de l'Empire des Qing, comme la « dernière dynastie chinoise ». Cependant, il convient de noter que, dans les manuels scolaires chinois contemporains, lorsque les Mandchous, ou les Jürchens (ancêtres des Mandchous, principalement connus pour avoir repoussé la dynastie chinoise des Song vers le Sud) sont mentionnés, ils sont souvent catégorisés à travers le prisme de l'altérité, désignés comme « les ethnies du Nord » (beifang minzu 北方民族) ou de manière plus péjorative comme « les Barbares du Nord » (beifang manzu 北方蛮族).\n¹ Voir par exemple Thoraval, 1991, p. 9.\n21\n\n<<< PAGE 25 >>>\n\nEn réalité, tout au long de la période des Qing, la classe gouvernementale mandchoue a accordé une importance particulière au maintien de son identité mandchoue, mettant en œuvre différentes mesures politiques en ce sens.\n## 2. L'importance actuelle de la Grande Muraille comme délimitation\nLa Grande Muraille a historiquement marqué la frontière entre la Mandchourie et l'Empire du Milieu, limitant les échanges entre les peuples des deux côtés. La Mandchourie, située au nord de la Grande Muraille, représente une terre avec une histoire propre, un espace naturel et géographique distinct de celui au sud de la Grande Muraille, et abrite des populations de groupes ethniques divers ainsi qu'un paysage religieux particulier. À travers deux enquêtes ethnographiques centrées sur plusieurs temples taoïstes disséminés dans divers endroits de la Mandchourie, notre étude adopte une approche qui part du local pour aller vers le global, mettant l'accent sur les perspectives, les expériences et les pratiques des gens locaux dans le domaine religieux. L'observation participante offre un accès non seulement aux faits religieux, mais aussi aux contextes socio-économiques et historiques qui les sous-tendent en Mandchourie. Les caractéristiques de ce champ religieux sont plus complexes qu'il n'y paraît. C'est une réalité encore très présente localement et qui m'a été donnée à comprendre sur place : à parler avec les gens, j'ai pris la mesure son importance, en relevant une expression qui revient très souvent dans les discours \"Shanhaiguan 山海关\". Localement, pour évoquer la Grande Muraille, c'est généralement le terme \"Shanhaiguan\" (littéralement : la passe Shanhai, « shan » signifiant la montagne, et « hai » la mer) qui est utilisé.\nDurant mes enquêtes, la Grande Muraille, cette ancienne frontière géographique, est fréquemment mentionnée dans le milieu religieux. À notre grande surprise, même aujourd'hui en Mandchourie, la Grande Muraille est toujours perçue comme une sorte de frontière. Nous avons réalisé que le fait qu'elle ne serve plus de confins géographiques officiels n'efface toutefois pas son caractère de frontière dans d'autres dimensions, notamment symboliques. Selon les religieux, c'est-à-dire les officiants taoïstes, la passe Shanhai représente « une ligne de démarcation des eaux » (fenshuiling 分水岭) entre le nord (la Mandchourie) et le sud\n22\n===== FIN DU BLOB =====\n\n## TÂCHE\n\nProduis une sortie en TEXTE BRUT (PAS de JSON) en DEUX sections :\n(1) les métadonnées, une clé par ligne, (2) la table des matières, une\nentrée par ligne. Format compact conçu pour minimiser le nombre de tokens.\n\n### Section 1 — Métadonnées\n\nExactement ces 6 lignes, dans cet ordre, format `CLÉ: valeur` :\n\nTITRE: <titre complet, sous-titre inclus si présent>\nAUTEUR: <nom complet>\nANNEE: <année de soutenance, ex. 2024>\nETABLISSEMENT: <université + laboratoire/école doctorale si présent>\nDISCIPLINE: <mention ou discipline>\nMOTS_CLES: <mot-clé 1; mot-clé 2; mot-clé 3; ...>\n\nRègles :\n  - Une seule ligne par champ (pas de saut de ligne à l'intérieur d'une valeur).\n  - Si une information est absente du blob, écris `nu eux contenus situés sur des pages différentes ; si une phrase enchaîne deux éléments de pages différentes, chacun reçoit son propre (p. N) juste après lui — ou sépare-les en deux bullets. Un intervalle (p. N-M) est permis quand la phrase ou le paragraphe cité s'étend réellement sur les pages N à M (chevauchement) — préfère alors l'intervalle à la seule page de début.", "prompt": "Voici l'introduction COMPLÈTE d'une thèse de doctorat (parquet pp.23-23).\n\n===== DÉBUT DE L'INTRODUCTION =====\n<<< PAGE 23 >>>\n\n## Introduction\nCette thèse ethnographique porte sur la religion taoïste en Mandchourie. Elle se fonde sur les observations participantes issues de deux enquêtes de terrain menées pendant seize mois au total, dans plusieurs temples taoïstes situés respectivement à Qiqihar, au Heilongjiang, et à Liuhe, dans le Jilin.\nDirigés par la même supérieure taoïste, il s'agit de temples fonctionnant en réseau au sein de l'ordre monastique Quanzhen 全真 (de la Perfection totale). Le temple où s'est principalement déroulée notre enquête est localisé dans la ville de Qiqihar, province du Heilongjiang, dans la Mandchourie du nord.\nCette recherche a pour objectif d'étudier les dynamiques complexes, les interactions et les interdépendances entre les pratiques relevant du système taoïste local et celles liées à l'évolution des comportements socio-politiques de la Mandchourie. Les consultations qui ont lieu dans les temples entre les officiants taoïstes et les fidèles fourniront des cas d'étude tout au long de cette recherche pour comprendre le rôle de ces temples dans la société d'aujourd'hui. Les matériaux résultant des observations participantes ont montré qu'il sera important d'appréhender les expériences des requérants et les rituels aujourd'hui à la lumière des changements sociaux et politiques connus par cette région durant les dernières décennies et dans l'histoire.\n## 1. La Mandchourie : un territoire singulier\nHistoriquement, la Mandchourie était peuplée par des groupes toungouses non Han. Actuellement, elle constitue un territoire intégré à la République populaire de Chine, désignée officiellement comme « le Nord-est de la Chine » (zhongguo dongbei 中国东北). La Mandchourie est subdivisée en plusieurs régions distinctes, du nord au sud : le Heilongjiang, le Jilin, le Liaoning, ainsi que certaines parties de l'est de la Mongolie intérieure.\n===== FIN DE L'INTRODUCTION =====\n\n## TÂCHE\n\nRemplis chaque section ci-dessous à partir de l'INTRODUCTION SEULE.\nPour chaque section :\n- Cite verbatim quand l'auteur a employé une formulation explicite, entre\n  guillemets français « … » et indique la page entre parenthèses si possible.\n- N'INVENTE JAMAIS. Si l'introduction ne contient PAS l'information, écris\n  uniquement `[NULL]` sur une ligne (rien d'autre).\n- Une section partiellement remplie reste partielle — ne complète pas avec\n  des suppositions, laisse les manques pour les passes suivantes.\n\n### Sections à remplir\n\n- `these_centrale` — L'argument principal DÉMONTRÉ (au présent, depuis la conclusion). Distinct des « nous montrerons » de l'intro. Format : 2-3 phrases MAXIMUM, concises et précises. Première phrase = l'affirmation centrale. Deuxième phrase = le mécanisme ou le processus démontré. Si l'auteur formule sa thèse en phases/étapes, les nommer.\n- `questions_recherche` — Les questions ouvertes au départ. Interrogatives ou objectifs (« il s'agit de comprendre… »).\n- `reponses_questions` — Les réponses explicites que la conclusion apporte à chaque question de recherche. Pour CHAQUE question, cite la réponse verbatim (« … » + page). Si une question reste sans réponse, indique-le. Cette section est `[NULL]` dans l'introduction et ne se remplit qu'avec la conclusion.\n- `hypotheses` — Propositions VÉRIFIABLES, à tester. Une principale + 2-3 secondaires si présentes. NE PAS confondre avec les questions ni avec les lacunes. L'auteur n'a PAS besoin d'employer le mot « hypothèse » : dans les thèses expérimentales ou quanti montre que la particularité des paysages religieux mandchous résulte de la fusion des groupes ethniques en montrant comment les consultations et rituels intègrent des éléments multiples au sein d'une communauté unifiée (p. 74)\n- **Troisième partie Les interactions entre la religion taoïste Quanzhen et les éléments relevant du chamanisme local** : Démontre que les interactions religieuses locales contribuent à l'émergence d'une identité partagée en montrant comment le mélange des systèmes taoïste et chamanique participe à la formation d'un ensemble propre à la Mandchourie (p. 74)\n\n## cadre_theorique\n[NULL]\n\n## concepts_cles\n[NULL]\n\n## ancrage_empirique\n- Temples taoïstes dirigés par la même supérieure, fonctionnant en réseau au sein de l'ordre monastique Quanzhen 全真 (p. 23)\n- Site principal : temple de Qiqihar, province du Heilongjiang, Mandchourie du nord (p. 23)\n- Données empiriques : consultations entre officiants taoïstes et fidèles servant de cas d'étude (p. 23)\n- Frontière symbolique active : la passe Shanhai, marquant toujours une distinction identitaire pour les citoyens de la Mandchourie malgré la chute de l'empire Qing et l'établissement de la RPC (p. 74)\n\n## opposition\n[NULL]\n\n## apport_principal\n- **Empirique** : Documentation ethnographique de seize mois sur les consultations taoïstes dans un réseau de temples du Nord-est de la Chine, révélant comment les pratiques rituelles contemporaines participent à la construction d'une identité régionale distincte (p. 23, p. 74)\n- **Théorique** : Réinterprétation de la frontière comme marqueur symbolique d'appartenance collective plutôt que comme simple limite géographique ou politique, démontrant que l'identité mandchoue se sustente sur des parcours historiques parallèles et des fusions ethniques profondes (p. 74)<|im_end|>", "meta": {"budget": 500, "temperature": 0.6, "top_p": 0.95, "top_k": 40, "max_tokens": 10000, "elapsed_s": 14.68, "first_content_s": 4.35, "reasoning_est_tokens": 545, "loo
