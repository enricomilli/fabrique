** : L'initiative étatique de 1919 révèle « une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés, bien au-delà des impératifs de guerre » (p. 288), visant à « préserver un contrôle acquis en temps de crise plutôt qu'à développer l'enseignement technique cinématographique » (p. 288). Pour les professionnels, le motif est inverse : ils perçoivent l'école « comme une initiative visant à fédérer les professionnels » (p. 290) et à reprendre la main sur leurs intérêts face à l'État.\n- **Objectif principal de la formation** : La formation technique n'est pas une fin en soi ; elle sert à « former un profil intermédiaire, ni ouvrier ni ingénieur, mais un cadre technique apte à répondre aux exigences croissantes de l'industrie » (p. 290), s'inscrivant dans « une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur » (p. 290).\n- **Influence sur d'autres aspects** : Le contrôle de la formation influence la structuration corporative et les normes de production, en « rassembl[ant] un large éventail de représentants du cinéma, y compris des exploitants traditionnellement distants des autres branches du secteur » (p. 290), et en participant à un « processus de normalisation du cinéma » (p. 23) qui précède et dépasse les réformes du Front populaire.\n\n## Hypothèses\n\n**Principale** : « l'enseignement technique pourrait être un facteur supplémentaire dans les interactions entre l'État et les industriels, visant à façonner, orienter et contrôler les normes du secteur cinématographique. » (p. 18)\n**Secondaires** :\n- « la proposition d'une école nationale [...] semble être une tentative de maintenir le contrôle de l'État sur le cinéma en se réorientant vers un domaine d'intervention plus légitime comme l'enseignement. » (p. 18)\n- « les professionnels [...] aient perçu dans le soutien et la création de l'ETPC une opportunité de reprendre en main leurs intérêts et de se prémunir contre toute tentative de réappropriation de leur domaine par l'État. » (p. 18)\n- **Vérification/Précision issue de la conclusion** : L'hypothèse de la logique malthusienne des industriels est confirmée : « Cette approche s'inscrit dans une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur. » (p. 290)\n\n## Méthodologie\n\n- **Approche** : « approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs impliqués dans la scolarisation des techniques cinématographiques. » (p. 22)\n- **Méthode** : « L'analyse des documents s'est effectuée par une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions. » (p. 22) ; reconstruction chronologique et analyse des dynamiques institutionnelles à partir de fonds d'archives privés et publics.\n- **Corpus/Données** : Archives de la Médiathèque du patrimoine et de la photographie (sections de l'armée, procès-verbaux de la commission de transformation) (p. 21) ; archives de Paul Montel, revues *Le Photographe* et *L'Informateur de la photographie* (p. 21-22) ; fonds Paul Montel à la Société française de photographie (correspondances avec la famille Lumière) (p. 22) ; fonds Léon Gaumont à la Cinémathèque française (p. 22) ; quatre brochures de l'ENSLL (p. 21) ; note de réunion du 25 octobre 1937 sur la création d'enseignements cinématographiques artistiques (p. 294-295).\n- **Justification** : « privilégier des archives peu explorées pour renouveler les perspectives sur ce processus, tout en incluant l'exemple de l'ETPC comme cas d'étude représentatif. » (p. 22) ; limitation à 1915-1937 pour « construire une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle. » (p. 23) ; découverte tardive de certains fonds (Grieshaber-As de Trèfle, note de 1937) intégrée en perspective (p. 289, 296). Le résumé confirme que la recherche s'appuie sur « des archives inédites ou peu exploitées » (p. 5) pour examiner ce développement.\n\n## Fil rouge\n\nLa négociation du contrôle institutionnel et normatif du cinéma tel que défini par l'auteur (p. 18), reliant l'échec du projet d'école nationale (1915-1919) à la fondation patronale de l'ETPC (1919-1923) puis à son cycle d'activité et sa nationalisation (1924-1937) via la scolarisation technique comme levier de compromis entre velléités étatiques et autonomie industrielle. Le résumé synthétise ce fil en montrant comment « les différentes parties cherchent à renforcer leur influence sur l'industrie du film » et comment la formation, « d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur ».\n\n## Plan (Structure)\n\n- **Première partie L'École nationale de photographie et de cinématographie Chronique d'un échec (1915-1919)** : Démontre que la tentative étatique de pérenniser le contrôle des sections de l'armée via une école nationale échoue face à la méfiance des professionnels et au retour aux logiques libérales d'après-guerre, révélant « une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés » (p. 288).\n- **Deuxième partie L'École technique de photographie et de cinématographie Membres et principes fondateurs (1919-1923)** : Démontre que la création de l'ETPC par les industriels, majoritairement issus de la CSFNP, vise à reprendre la main sur leurs intérêts et à se prémunir contre les intrusions de l'État en « fédér[ant] les professionnels » (p. 290) autour d'un programme calibré.\n- **Troisième partie L'École technique de photographie et de cinématographie Premier cycle d'activité (1924-1937)** : Démontre que le rôle de l'ETPC dépasse la simple formation technique pour participer à l'orientation des normes du secteur, culminant avec une nationalisation consensuelle en 1937 qui « facilite une prise en main sans avoir à tout reconstruire » (p. 292) tout en préservant la légitimité des pionniers.\n\n## Cadre théorique\n\n- **Cadre principal** : Histoire des institutions et de l'enseignement technique — « une approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs impliqués dans la scolarisation des techniques cinématographiques » (p. 22) — structure l'analyse globale en traitant l'école non comme un objet pédagogique mais comme l'enjeu d'un rapport de forces entre professionnels et pouvoirs publics.\n- **Cadres secondaires** :\n  - Critique des sources par lecture croisée — « une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions » (p. 22) — outil indispensable ici, puisque l'essentiel du corpus provient d'acteurs « ayant directement contribué à la fondation ou au développement de l'ETPC » (p. 22).\n  - Sociohistoire des rapports profession/État — l'enseignement technique est pris comme révélateur des « dynamiques et [d]es interactions entre les professionnels et les pouvoirs publics » (p. 23) — fournit la grille de lecture du passage de l'échec étatique de 1919 à la nationalisation consensuelle de 1937.\n  - Monographie resserrée plutôt que comparatisme — « nous avons délibérément limité notre analyse à la période 1915-1937 » afin de construire « une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle » (p. 23) — assume explicitement le choix de la profondeur archivistique contre l'extension.\n\n\n## Concepts clés\n\n\n**CONCEPT** : SCOLARISATION DE L'APPRENTISSAGE\n**SENS** : « scolarisation de l'apprentissage des techniques cinématographiques » (p. 15) — [NON DÉFINI EXPLICITEMENT] : processus de transfert de la formation des techniques cinématographiques vers un cadre scolaire ou apparenté, en opposition à l'apprentissage sur le lieu de production ou l'autoformation.\n**ORIGINE** : propre à l'auteur\n\n**CONCEPT** : ENSEIGNEMENT TECHNIQUE\n**SENS** : « enseignement technique, dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives. » (p. 14) — [NON DÉFINI EXPLICITEMENT] : forme d'enseignement institutionnalisé et structuré administrativement, servant de levier de contrôle et de normalisation sectorielle.\n**ORIGINE** : propre à l'auteur\n\n**CONCEPT** : NORMALISATION DU CINÉMA\n**SENS** : « processus de normalisation du cinéma, en révélant l'impact structurel que ces débats ont eu sur l'évolution de la profession et de l'industrie. » (p. 23) — [NON DÉFINI EXPLICITEMENT] : dynamique graduelle par laquelle les normes professionnelles, techniques et institutionnelles du cinéma sont façonnées par les interactions entre pouvoirs publics et acteurs économiques.\n**ORIGINE** : propre à l'auteur\n\n**CONCEPT** : LOGIQUE MALTHUSIENNE (de formation)\n**SENS** : « Cette approche s'inscrit dans une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur. » (p. 290) — [NON DÉFINI EXPLICITEMENT] : stratégie de régulation de l'offre de main-d'œuvre qualifiée visant à contenir les coûts et les revendications salariales.\n**ORIGINE** : propre à l'auteur\n\n**CONCEPT** : ESPACE STRATÉGIQUE (de la formation)\n**SENS** : « La formation, d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur. » (p. 5) — [NON DÉFINI EXPLICITEMENT] : reconfiguration du champ éducatif technique comme terrain de négociation du pouvoir institutionnel, dépassant sa fonction pédagogique apparente.\n**ORIGINE** : propre à l'auteur\n\n## Ancrage empirique (ou concret)\n\n- Projet d'école nationale de photographie et de cinématographie (1919) : « entre le 17 février et le 14 avril 1919 [...] les pouvoirs publics envisagent la création d'une école nationale [...] finalement abandonné » (p. 17) ; rejet par l'administration des Finances (p. 288).\n- École technique de photographie et de cinématographie (ETPC) : « à partir de 1926, devient le premier établissement dont la structure administrative est dédiée à l'enseignement technique photographique et cinématographique. » (p. 15) ; nationalisée en 1937 (p. 15) ; déficit gérable mais refus des professionnels de le couvrir (p. 291).\n- Archives spécifiques : « procès-verbaux de la commission dédiée à la transformation des sections en service civil » (p. 21) ; correspondances Paul Montel / famille Lumière (p. 22) ; fonds Léon Gaumont (p. 22) ; note de réunion du 25 octobre 1937 sur les enseignements cinématographiques artistiques (p. 294-295).\n- Critique terrain : témoignage de Marcel Carné sur les lacunes de l'ETPC pour les métiers de plateau (opérateur, électricien) vs efficacité pour les labos et la photo (p. 292-293).\n\n## Opposition / Contre-argumentation\n\n- « les données concernant leur enseignement et leur apprentissage [...] demeurent dans l'angle mort de ces études : potentiellement présentes, mais invisibles. » (p. 14) — lacune historiographique comblée par le corpus.\n- « les travaux existants convergent pour indiquer que l'ETPC est fondée avec le soutien d'industriels et de commerçants [...] les conditions favorables à la scolarisation [...] ne sont pas réunies [...] Cette situation soulève donc des interrogations sur les motivations réelles des industriels à soutenir ce projet. » (p. 16) — nuancé par la découverte d'une logique de fédération corporative s la scolarisation des techniques cinématographiques. » (p. 22)\n- **Méthode** : « L'analyse des documents s'est effectuée par une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions. » (p. 22) ; reconstruction chronologique et analyse des dynamiques institutionnelles à partir de fonds d'archives privés et publics.\n- **Corpus/Données** : Archives de la Médiathèque du patrimoine et de la photographie (sections de l'armée, procès-verbaux de la commission de transformation) (p. 21) ; archives de Paul Montel, revues *Le Photographe* et *L'Informateur de la photographie* (p. 21-22) ; fonds Paul Montel à la Société française de photographie (correspondances avec la famille Lumière) (p. 22) ; fonds Léon Gaumont à la Cinémathèque française (p. 22) ; quatre brochures de l'ENSLL (p. 21) ; note de réunion du 25 octobre 1937 sur la création d'enseignements cinématographiques artistiques (p. 294-295).\n- **Justification** : « privilégier des archives peu explorées pour renouveler les perspectives sur ce processus, tout en incluant l'exemple de l'ETPC comme cas d'étude représentatif. » (p. 22) ; limitation à 1915-1937 pour « construire une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle. » (p. 23) ; découverte tardive de certains fonds (Grieshaber-As de Trèfle, note de 1937) intégrée en perspective (p. 289, 296). Le résumé confirme que la recherche s'appuie sur « des archives inédites ou peu exploitées » pour examiner ce développement.\n\n## fil_rouge\n\nLa négociation du contrôle institutionnel et normatif du cinéma tel que défini par l'auteur (p. 18), reliant l'échec du projet d'école nationale (1915-1919) à la fondation patronale de l'ETPC (1919-1923) puis à son cycle d'activité et sa nationalisation (1924-1937) via la scolarisation technique comme levier de compromis entre velléités étatiques et autonomie industrielle. Le résumé synthétise ce fil en montrant comment « les différentes parties cherchent à renforcer leur influence sur l'industrie du film » et comment la formation, « d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur ».\n\n## plan\n\n- **Première partie L'École nationale de photographie et de cinématographie Chronique d'un échec (1915-1919)** : Démontre que la tentative étatique de pérenniser le contrôle des sections de l'armée via une école nationale échoue face à la méfiance des professionnels et au retour aux logiques libérales d'après-guerre, révélant « une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés » (p. 288).\n- **Deuxième partie L'École technique de photographie et de cinématographie Membres et principes fondateurs (1919-1923)** : Démontre que la création de l'ETPC par les industriels, majoritairement issus de la CSFNP, vise à reprendre la main sur leurs intérêts et à se prémunir contre les intrusions de l'État en « fédér[ant] les professionnels » (p. 290) autour d'un programme calibré.\n- **Troisième partie L'École technique de photographie et de cinématographie Premier cycle d'activité (1924-1937)** : Démontre que le rôle de l'ETPC dépasse la simple formation technique pour participer à l'orientation des normes du secteur, culminant avec une nationalisation consensuelle en 1937 qui « facilite une prise en main sans avoir à tout reconstruire » (p. 292) tout en préservant la légitimité des pionniers.\n\n## cadre_theorique\n\n[NULL]\n\n## concepts_cles\n\n- **SCOLARISATION DE L'APPRENTISSAGE** : « scolarisation de l'apprentissage des techniques cinématographiques » (p. 15) — [NON DÉFINI EXPLICITEMENT] : processus de transfert de la formation des techniques cinématographiques vers un cadre scolaire ou apparenté, en opposition à l'apprentissage sur le lieu de production ou l'autoformation. — propre à l'auteur\n- **ENSEIGNEMENT TECHNIQUE** : « enseignement technique, dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives. » (p. 14) — [NON DÉFINI EXPLICITEMENT] : forme d'enseignement institutionnalisé et structuré administrativement, servant de levier de contrôle et de normalisation sectorielle. — propre à l'auteur\n- **NORMALISATION DU CINÉMA** : « processus de normalisation du cinéma, en révélant l'impact structurel que ces débats ont eu sur l'évolution de la profession et de l'industrie. » (p. 23) — [NON DÉFINI EXPLICITEMENT] : dynamique graduelle par laquelle les normes professionnelles, techniques et institutionnelles du cinéma sont façonnées par les interactions entre pouvoirs publics et acteurs économiques. — propre à l'auteur\n- **LOGIQUE MALTHUSIENNE (de formation)** : « Cette approche s'inscrit dans une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur. » (p. 290) — [NON DÉFINI EXPLICITEMENT] : stratégie de régulation de l'offre de main-d'œuvre qualifiée visant à contenir les coûts et les revendications salariales. — propre à l'auteur\n- **ESPACE STRATÉGIQUE (de la formation)** : « La formation, d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur. » (p. 5) — [NON DÉFINI EXPLICITEMENT] : reconfiguration du champ éducatif technique comme terrain de négociation du pouvoir institutionnel, dépassant sa fonction pédagogique apparente. — propre à l'auteur\n\n## ancrage_empirique\n\n- Projet d'école nationale de photographie et de cinématographie (1919) : « entre le 17 février et le 14 avril 1919 [...] les pouvoirs publics envisagent la création d'une école nationale [...] finalement abandonné » (p. 17) ; rejet par l'administration des Finances (p. 288).\n- École technique de photographie et de cinématographie (ETPC) : « à partir de 1926, devient le premier établissement dont la structure administrative est dédiée à l'enseignement technique photographique et cinématographique. » (p. 15) ; nationalisée en 1937 (p. 15) ; déficit gérable mais refus des professionnels de le couvrir (p. 291).\n- Archives spécifiques : « procès-verbaux de la commission dédiée à la transformation des sections en service civil » (p. 21) ; correspondances Paul Montel / famille Lumière (p. 22) ; fonds Léon Gaumont (p. 22) ; note de réunion du 25 octobre 1937 sur les enseignements cinématographiques artistiques (p. 294-295).\n- Critique terrain : témoignage de Marcel Carné sur les lacunes de l'ETPC pour les métiers de plateau (opérateur, électricien) vs efficacité pour les labos et la photo (p. 292-293).\n\n## opposition\n\n- « les données concernant leur enseignement et leur apprentissage [...] demeurent dans l'angle mort de ces études : potentiellement présentes, mais invisibles. » (p. 14) — lacune historiographique comblée par le corpus.\n- « les travaux existants convergent pour indiquer que l'ETPC est fondée avec le soutien d'industriels et de commerçants [...] les conditions favorables à la scolarisation [...] ne sont pas réunies [...] Cette situation soulève donc des interrogations sur les motivations réelles des industriels à soutenir ce projet. » (p. 16) — nuancé par la découverte d'une logique de fédération corporative et de contrôle malthusien (p. 290).\n- « si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire [...] ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. » (p. 24) — résultat contre-intuitif confirmé par la conclusion : la normalisation et la nationalisation s'amorcent bien avant 1936 via les compromis techniques de l'entre-deux-guerres.\n\n## apport_principal\n\n- **Empirique** : « La constitution du corpus autour des sections photographiques et cinématographiques de l'armée visait un renouvellement des sources [...] accès à des documents administratifs peu explorés [...] procès-verbaux [...] dévoilent le programme d'une école jusqu'alors inconnue. » (p. 21) ; mise au jour de la logique malthusienne et des correspondances privées éclairant les fondations de l'ETPC (p. 290-291).\n- **Théorique** : « L'enseignement technique [...] a peut-être contribué à décentrer les discussions, nous incitant à repenser les dynamiques institutionnelles de manière plus progressive. » (p. 24) ; réinterprétation de la nationalisation de 1937 non comme une rupture, mais comme l'aboutissement d'un compromis graduel entre État et industrie (p. 292).\n- **Critique** : « si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire [...] ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. » (p. 24) ; démontre que la scolarisation technique a précédé et préparé les réformes culturelles de l'État, relativisant le rôle exclusif du Front populaire dans la structuration institutionnelle du cinéma français.\n\n---\n\n# Step 2 — scoring\n\n## INSTRUCTION SPÉCIALE POUR `methodologie`\n\nPour la section `methodologie`, cherche dans la table des matières une\nentrée de niveau 0 ou 1 dont le titre contient un mot apparenté à\n« méthodologie », « méthodes », « methodology », « methods », « corpus »,\nou une combinaison (ex. « Corpus et méthodologies », « Cadre\nméthodologique », « Un cadre méthodologique pour l'étude… »). Ce chapitre\nest la source PRIORITAIRE pour combler les lacunes méthodologiques en\nStep 3. Inclus-le dans les `refs` de la ligne `methodologie`, même si\nle score est déjà élevé.\n\n## scoring\n\n| section | score | gaps | refs |\n|---|---|---|---|\n| these_centrale | 8 | La nuance sur la \"nationalisation consensuelle\" pourrait être affinée par la lecture du chapitre final | 8 La nationalisation de l'ETPC ; [backmatte octorat Lettres et Arts\nMention études cinématographiques et audiovisuelles\nUniversité de Montréal\nFaculté des arts et des sciences\nDépartement d'histoire de l'art et d'études cinématographiques\nDoctorat\nMention études cinématographiques\nFormer c'est normer\nLe développement de l'enseignement technique cinématographique en France (1915-1937)\nPar René OSI\nThèse de doctorat réalisée en cotutelle à l'Université Lumière Lyon 2 et à l'Université de Montréal\nDirigée par Martin BARNIER et André GAUDREAULT\nPrésentée et soutenue publiquement à l'Université Lumière Lyon 2, le 6 décembre 2024\nDevant un jury composé de :\nMartin BARNIER, professeur des universités, Université Lumière Lyon 2\nAndré GAUDREAULT, professeur titulaire, Université de Montréal\nPriska MORRISSEY, professeure des universités, Université Rennes 2\nGiusy PISANO, professeure des universités, École nationale supérieure Louis-Lumière\nLaurent VERAY, professeur des universités, Université Sorbonne-Nouvelle\nValérie VIGNAUX, professeure des universités, Université de Caen\n\n<<< PAGE 4 >>>\n\n## Informations sur cette version du dépôt\nCette version correspond à celle qui a été soumise au jury, le 30 septembre 2024. Une seule modification a été apportée : la correction d'une faute d'orthographe dans le résumé en page n°3, remplacement du mot dénué par dénuée. La bibliographie, initialement mal réalisée, a fait l'objet d'une correction portée à la connaissance du jury, le 6 décembre 2024, jour de la soutenance. Cette correction a été annexée à la présente version tout en maintenant la version originale, afin de respecter l'intégrité du processus et ses imperfections, ainsi que les critiques formulées par les rapporteurs. Je travaille actuellement à la correction, à l'amélioration et au développement de ces travaux. Si des mises à jour ou des échanges scientifiques vous intéressent, je vous invite à me contacter aux deux adresses suivantes : r.osi@univ-lyon2.fr et reneosipro@gmail.com. Je vous remerc nABSTRACT\nBased on previously unexplored or little-used archives, this thesis examines the development of practical filmmaking courses in France between 1915 and 1937. It demonstrates that the schooling of film techniques, initiated by both the State and industrial actors, occurs in the absence of major economic or technological imperatives. This approach, though disconnected from the market's immediate needs, reveals that the different parties aim to strengthen their influence over the film industry.\nThe analysis of the abandoned project for a national school of photography and cinematography in 1919, along with the creation of the *École technique de photographie et de cinématographie* in 1926 by manufacturers and merchants of equipment, shows how these initiatives fueled debates between the State and industrialists. Education, seemingly neutral and devoid of regulatory weight, is, in reality, a strategic area that each party seeks to control to shape the sector's evolution.\nWhile it is generally believed that exchanges between the State and industrialists focus on fiscal and market regulation issues, especially from the 1930s onward, this research, through the example of the schooling of filmmaking techniques, reveals that institutional dynamics under the Third Republic are in fact more nuanced in their stakes and develop progressively over time.\n**Keywords:** history of French cinema; practical filmmaking courses; Third Republic.\n4\n\n<<< PAGE 7 >>>\n\nTABLES DES MATIÈRES\nRÉSUMÉ.................................................................................................................................................. 3\nABSTRACT............................................................................................................................................ 4\nTABLES DES MATIÈRES ........................................................................................................ 5\nFIGURES ................................................. 4<\/td><td>Annonce d'un cours de sensitométrie<\/td><td>258<\/td><\/tr><tr><td>Figure.45<\/td><td>Annonce et programme des conférences, 2 feuillets<\/td><td>259<\/td><\/tr><tr><td>Figure.46<\/td><td>Annonce de la création d'un laboratoire de recherches à l'ETPC<\/td><td>262<\/td><\/tr><tr><td>Figure.47<\/td><td>Note sur le laboratoire de recherches, 2 feuillets<\/td><td>264<\/td><\/tr><tr><td>Figure.48<\/td><td>Appel au versement de la taxe d'apprentissage à l'ETPC<\/td><td>269<\/td><\/tr><tr><td>Figure.49<\/td><td>Note sur la création d'enseignements cinématographiques artistiques, 2 feuillets<\/td><td>292<\/td><\/tr><\/table>\n10\n\n<<< PAGE 13 >>>\n\n# INTRODUCTION\n11\n\n<<< PAGE 14 >>>\n\nSujet\nBien que la recherche se soit penchée sur le développement des techniques cinématographiques en France, les données concernant leur enseignement et leur apprentissage, conditions essentielles de leur utilisation, demeurent dans l'angle mort de ces études : potentiellement présentes, mais invisibles.\nAvant de déterminer une période précise, il était nécessaire de choisir parmi les premières modalités de formation professionnelle, incluant l'apprentissage sur le lieu de production, l'autoformation et l'enseignement technique au sein d'une structure scolaire. Ce choix préliminaire était motivé par le peu de recherches détaillées sur ces sujets et par la nécessité d'éviter la dispersion de nos investigations, chaque déclinaison nécessitant la constitution d'un corpus spécifique et une approche méthodologique adaptée.\nPour la formation réalisée sur le lieu de travail, les interactions entre techniciens et apprentis sont fondées sur l'observation, les échanges verbaux et la répétition de gestes. Ces processus sont, par exemple, rapportés dans des mémoires ou des nécrologies, des sources qui offrent principalement un retour d'expérience du point de vue de l'apprenant. Quant à documenter l'enseignement, on dispose théoriquement d'autant de méthodes que de tuteurs. Concernant l'autoformation, la constitution d'un corpus est complexe en raison de la diversité des supports pédagogiques impliqués. Des éléments aussi variés qu'un traité d'optique, une visite de musée ou le visionnage d'un film peuvent, après tout, contribuer à cette forme d'apprentissage. Notre choix s'est donc porté sur l'enseignement technique, dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives.\n12\n\n<<< PAGE 15 >>>\n\nD'après les connaissances disponibles, l'offre initiale d'enseignement cinématographique dans\nun cadre scolaire ou apparenté comprend les initiatives suivantes :\n- Des groupements et des sociétés savantes qui proposent ponctuellement des cours et des conférences ;\n- Des formateurs qui, à titre individuel, dispensent des cours¹ ;\n- Des écoles d'ingénieurs et d'art qui donnent des cours adaptés ou adaptables aux métiers du cinéma ;\n- Enfin, l'École technique de photographie et de cinématographie (ETPC) qui, à partir de 1926, devient le premier établissement dont la structure administrative est dédiée à l'enseignement technique photographique et cinématographique.\nIntégrée au système éducatif d'État en 1937, l'ETPC, toujours en activité sous le nom d'École nationale supérieure Louis-Lumière (ENSLL), est, jusqu'en 1943 et l'ouverture de l'Institut des hautes études cinématographiques² (IDHEC), le seul établissement de ce type en France. Nous avons envisagé l'ETPC comme point de départ pour examiner la scolarisation de l'apprentissage des techniques cinématographiques, plutôt que d'autres formes d'enseignement, en raison de sa structure administrative spécialisée, de la pérennité de son fonctionnement et de l'engagement des pouvoirs publics, autant d'aspects qui laissaient présager d'une éventuelle richesse documentaire.\n\nDe plus, la nationalisation de cette institution en 1937 nous permettait d'envisager la possibilité d'une fin de cycle, peut-être même d'une rupture, ouvrant la voie à une périodisation dont la limite serait dépendante de l'objet à périodiser³.\n¹ « Avec le passage au parlant, plusieurs comédiens reconnus proposent à leur tour des formations, tandis que la pertinence et les modalités de création d'un éventuel conservatoire du cinéma ne cessent d'être débattues. » Myriam Juan, « « On naît acteur de cinéma... on ne le devient pas ». Artiste cinématographique : un métier en quête de formation (1919-1939) », 1895 : Revue d'histoire du cinéma, 2011/3 (n°65), p.180-199, p.188.\n² L'école est toujours en activité sous le nom d'École nationale supérieure des métiers de l'image et du son, plus communément appelée La Fémis ou FEMIS.\n³ « La périodisation reste finalement toujours dépendante de l'objet à périodiser. En effet, l'historien doit toujours se demander de « quoi », au juste, il est en train de faire l'histoire. » André Gaudreault et Philippe Marion, « Pour une nouvelle approche de la périodisation en histoire du cinéma », Cinémas, 2007/2-3 (n°17), p.215-232, p.221.\n13\n\n<<< PAGE 16 >>>\n\nÉtat de l'art\nLes travaux existants convergent pour indiquer que l'ETPC est fondée avec le soutien\nd'industriels et de commerçants du secteur de la photographie et du cinéma. Bien que l'implication\ndes professionnels dans le développement de l'enseignement technique soit conforme aux pratiques\nde l'époque, les conditions favorables à la scolarisation de l'apprentissage, telles qu'une\nrestructuration profonde du secteur ou des besoins technologiques pressants, ne sont pas réunies\nlorsque son développement commence en 1921. Cette situation soulève donc des interrogations sur\nles motivations réelles des industriels à soutenir ce projet.\nAvant la Première Guerre mondiale, la production cinématographique française, alors\nflorissante, se tourne principalement en studio, lieu où la formation se déroule⁴. Cette méthode est\nprivilégiée car elle est économique pour les employeurs, le matériel et les tuteurs étant déjà sur\nplace. Elle est également avantageuse pour les techniciens et ouvriers, car la maîtrise et la rétention\ndes savoir-faire leur permettent de se rendre indispensables. Les techniques cinématographiques\nne subissent pas de changements majeurs jusqu'à la standardisation du cinéma parlant à la fin des\nannées 1920⁵. Sur le plan économique, la crise qui marque cette décennie, exacerbée par la\nconcurrence des productions américaines et allemandes, ne conduit pas les industriels à réévaluer\nla formation. Au lieu de cela, leurs revendications se concentrent sur le contingentement des films\nétrangers et l'allègement fiscal⁶.\n⁴ Stéphanie Salmon, *Pathé : À la conquête du cinéma (1896-1929)*, Paris, Tallandier, 2014, p.136-174.\n⁵ Avec l'arrivée du cinéma parlant, on observe notamment l'émergence d'un profil hybride d'ingénieur-technicien, qui exige des compétences théoriques ne pouvant plus être acquises uniquement sur le terrain. Martin Barnier, « Les premiers ingénieurs du son français », 1895, 2011/3 (n°65), p.200-217.\n⁶ Paul Leglise, « Le cinéma parlant (1929-1940) », dans *Histoire de la politique du cinéma français : Le cinéma et la IIIe République*, Paris, Librairie générale de droit et de jurisprudence, 1970, p.71-299.\n14\n\n<<< PAGE 17 >>>\n\n## Problématique\nNe trouvant pas d'explication satisfaisante dans le contexte immédiat, nous avons exploré la production cinématographique durant la Première Guerre mondiale, cherchant un lien ou une continuité pouvant éclairer le développement de l'ETPC. Au cours de ces investigations, nous avons découvert qu'entre le 17 février et le 14 avril 1919, au moment de la démobilisation, les pouvoirs publics envisagent la création d'une école nationale de photographie et de cinématographie. Ce projet, lié à la transformation des sections photographiques et cinématographiques de l'armée en service civil, est finalement abandonné, la fin de la guerre rendant obsolète la gestion publique de la production d'images. Parmi les opposants à ce projet figurent des acteurs majeurs des corporations de la photographie et du film, qui participeront par la suite à la création de l'ETPC.\nEntre 1919 et 1921, à deux reprises et avec des mêmes personnalités impliquées, survient la volonté de scolariser l'apprentissage des techniques cinématographiques. D'abord par les pouvoirs publics, qui échouent, puis par les industriels, qui y parviennent. Cette récurrence se produit sans qu'un besoin clairement défini, tel qu'une transformation technologique majeure ou une demande accrue de main-d'œuvre spécialisée, ne justifie de telles initiatives. Une perspective de recherche s'est alors consolidée autour d'une série de questions.\nQuels sont les motifs derrière ces tentatives de scolarisation ? La formation est-elle la préoccupation principale ou sert-elle un autre objectif ? Le contrôle de la formation influence-t-il d'autres aspects des pratiques cinématographiques, et si oui, lesquels ? C'est à ces interrogations que notre recherche tâchera de répondre.\n15\n\n<<< PAGE 18 >>>\n\nHypothèses\nNotre recherche part du constat que la scolarisation de l'apprentissage des techniques cinématographiques s'opère à contretemps des exigences du marché. Cela nous conduit à formuler des hypothèses sur les motivations sous-jacentes des acteurs industriels et des instances gouvernementales.\nEn 1919, la proposition d'une école nationale, avancée par les pouvoirs publics à la fin de la Première Guerre mondiale, semble être une tentative de maintenir le contrôle de l'État sur le cinéma en se réorientant vers un domaine d'intervention plus légitime comme l'enseignement. Cette initiative, visant à transformer les services de propagande de l'armée en conservatoire de la photographie et du cinéma, est envisagée précisément au moment où la démobilisation et le retour à la paix auraient normalement rendu ce type de contrôle non conforme aux principes libéraux du commerce et de l'entreprise privée.\nConcernant la création de l'ETPC, si l'engagement du corps patronal correspond aux pratiques de l'époque, les conditions économiques et technologiques ne justifient pas à elles seules cette initiative. Il semblerait que les professionnels, impactés par les restrictions et la confiscation de la production durant la guerre, aient perçu dans le soutien et la création de l'ETPC une opportunité de reprendre en main leurs intérêts et de se prémunir contre toute tentative de réappropriation de leur domaine par l'État. En façonnant l'ETPC, ils auraient donc consolidé leur vision spécifique de l'industrie cinématographique.\nEn résumé, l'enseignement technique pourrait être un facteur supplémentaire dans les interactions entre l'État et les industriels, visant à façonner, orienter et contrôler les normes du secteur cinématographique.\n16\n\n<<< PAGE 19 >>>\n\nRésolution\nPour aborder ces hypothèses, nous revisiterons d'abord l'activité des sections photographiques et cinématographiques de l'armée, établies dès le premier semestre de 1915 et démantelées lors de la démobilisation en avril 1919. Notre analyse portera sur le cadre administratif et réglementaire qui a permis l'extension de l'influence étatique, d'abord centrée sur la propagande, vers des domaines commerciaux touchant directement les professionnels du secteur. Le prolongement de ce contrôle dans l'après-guerre, envisagé notamment à travers le projet d'une école nationale de photographie et de cinématographie, est perçu par les professionnels comme une expansion de l'ingérence de l'État, renforçant leur méfiance face aux intrusions potentielles.\nNous approfondirons ensuite le développement de l'ETPC en identifiant précisément ses fondateurs. L'implication de certains d'entre eux dans les sections photographiques et cinématographiques de l'armée, ainsi que leur connaissance des ambitions étatiques, nous amène à interroger les véritables motivations de leur engagement. Majoritairement issus de la Chambre syndicale des fabricants et négociants de la photographie (CSFNP), nous analyserons comment la défense de leurs intérêts a potentiellement influencé la création et l'évolution de l'école.\nNous retracerons enfin l'activité de l'ETPC afin de déterminer si son rôle se limite à la formation\ntechnique ou s'il répond également à d'autres objectifs. En examinant la nationalisation de\nl'établissement en 1937, nous chercherons à comprendre si cette étape constitue une tentative de\nl'État pour renforcer son contrôle sur l'industrie cinématographique.\n17\n\n<<< PAGE 20 >>>\n\nLimites\nSi notre focalisation sur l'enseignement technique permettait de découvrir des archives, elle\nconduisait également à une impasse. Entre 1915 et 1937, seules une tentative inachevée et l'ETPC\nsont documentées, un échantillon restreint qui limite les perspectives. Ce spectre réduit pourrait\ndonner l'impression que notre recherche se concentre uniquement sur l'ETPC, ce qui est en partie\nvrai, l'ETPC étant le seul établissement d'enseignement technique en activité sur cette période.\nÉtendre la périodisation jusqu'à l'IDHEC en 1943 aurait permis de diversifier l'analyse et de fournir\nun point de comparaison. Cependant, la recherche d'archives liées à l'ETPC a monopolisé le temps\nalloué à cette thèse, rendant impossible une étude aussi poussée d'une autre institution.\nPar ailleurs, que l'on étudie l'école nationale inachevée ou l'ETPC, le problème reste le même.\nLa majorité des archives disponibles provient des représentants des pouvoirs publics ou des\nfondateurs de l'ETPC, avec des documents souvent orientés. Nous avons veillé à indiquer\nclairement le caractère partial de ces sources, en précisant leur orientation chaque fois que\nnécessaire.\nEnfin, une dernière limite à prendre en compte est la nature hybride de cette recherche, qui se\nsitue au carrefour de deux champs historiographiques distincts : l'histoire institutionnelle du\ncinéma⁷ et celle des institutions scolaires. Ce positionnement peut donner l'impression de s'éloigner\ndu cinéma proprement dit, car il nous amène à naviguer entre des perspectives parfois très\ndifférentes. Bien que ces deux domaines se rejoignent autour de l'enseignement technique, cette\n⁷⁷ « Il s'agit au fond d'une histoire surtout centrée sur les rapports du politique et de la profession, progressivement encadrée et protégée. » Michèle Lagny, De l'histoire du cinéma. Méthode historique et histoire du cinéma., Paris, Armand Colin, 1992, p.203.\n18\n\n<<< PAGE 21 >>>\n\napproche élargie peut parfois soulever des doutes sur le champ historiographique auquel cette étude\ncontribue réellement.\nCorpus\nLa constitution du corpus autour des sections photographiques et cinématographiques de l'armée\nvisait un renouvellement des sources, indispensable pour approfondir les connaissances actuelles.\nNous avons donc privilégié les archives de la Médiathèque du patrimoine et de la photographie,\nafin de bénéficier d'un éventail documentaire moins exploité que celui de l'Établissement de\ncommunication et de production audiovisuelle de la Défense et du Service historique de la Défense.\nCe choix nous a permis d'accéder à des documents administratifs peu explorés, exposant\nnotamment les interactions des professionnels avec les sections, leur exclusion et la progressive\nprise de contrôle par l'État. Parmi ces documents, les procès-verbaux de la commission dédiée à la\ntransformation des sections en service civil se distinguent et dévoilent le programme d'une école\njusqu'alors inconnue.\nLa constitution du corpus sur l'ETPC représentait un défi majeur, notamment en raison de\nl'absence d'archives directement liées à l'établissement. Par exemple, l'ENSLL ne possède que\nquatre brochures couvrant la période de la création de l'école jusqu'à sa nationalisation en 1937⁸.\nPour surmonter ces contraintes, nous avons exploré les archives des fondateurs de l'école, en\nparticulier celles de Paul Montel, directeur de l'ETPC jusqu'en 1946 et membre de la CSFNP, pour\nlaquelle il est responsable de la production du bulletin mensuel. Nous avons examiné en détail deux\nrevues qu'il édite entre 1919 et 1937, à savoir *Le Photographe*, une publication technique\n⁸ Nous tenons à remercier M. Florent Fajole, responsable du centre de ressources documentaires Léon Gaumont à l'ENSLL, pour son accueil chaleureux.\n19\n\n<<< PAGE 22 >>>\n\ngénéraliste qui expose les facettes de l'école destinées au grand public, et *L'Informateur de la photographie*, le bulletin de la CSFNP, qui reflète les intérêts du syndicat étroitement lié à l'ETPC.\nEn ciblant les archives liées à Paul Montel, nous avons découvert deux collections riches et jusqu'alors sous-exploitées. La première, à la Société française de photographie, contient des correspondances entre Paul Montel et la famille Lumière, révélant les discussions ayant conduit à l'implication des professionnels dans le projet de l'école. Jusqu'à présent, ce fonds n'a pas été pleinement utilisé, probablement car il est classé comme une annexe du fonds Paul Montel. La seconde, à la Cinémathèque française, est un fonds consacré à Léon Gaumont, qui détaille son implication dans l'école à partir des années 1930. Catalogué sous le nom de son fils cadet, Louis Gaumont, ce classement pourrait expliquer pourquoi il a été peu étudié.\n## Méthodologie\nLa méthodologie appliquée à cette recherche repose sur une approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs impliqués dans la scolarisation des techniques cinématographiques. En nous concentrant sur le développement de l'enseignement technique, nous avons privilégié des archives peu explorées pour renouveler les perspectives sur ce processus, tout en incluant l'exemple de l'ETPC comme cas d'étude représentatif.\nL'analyse des documents s'est effectuée par une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions. Cette méthode critique s'est avérée essentielle pour éviter de reproduire des discours orientés, particulièrement lorsque les documents proviennent d'acteurs ayant directement contribué à la fondation ou au développement de l'ETPC.\n20\n\n<<< PAGE 23 >>>\n\nConcernant la périodisation, nous avons délibérément limité notre analyse à la période 1915-1937 pour concentrer nos efforts sur les prémices et le développement de l'enseignement technique en France. Ces choix méthodologiques reflètent notre volonté de construire une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle.\n## Contributions\nBien que notre recherche apporte des données factuelles nouvelles, nous souhaitons mettre l'accent sur la manière dont l'étude de l'enseignement technique éclaire les dynamiques et les interactions entre les professionnels et les pouvoirs publics. Ces échanges contribuent à nuancer et à approfondir la compréhension du processus de normalisation du cinéma, en révélant l'impact structurel que ces débats ont eu sur l'évolution de la profession et de l'industrie.\nLe projet inachevé d'une école nationale, ainsi que l'activité des sections photographiques et cinématographiques de l'armée, nous rappellent une incongruité structurelle propre au cinéma français, à savoir la place centrale des ministères et des administrations en lien avec l'éducation et la culture. Bien que cette tutelle soit aujourd'hui normalisée, la dimension culturelle du cinéma étant admise, cette conception n'était pas partagée au moment de la création des sections. Il est probable que les fonctionnaires qui ont œuvré pour impliquer l'Instruction publique et les Beaux-Arts dans l'activité des sections soient les mêmes qui aient envisagé de prolonger ce rapprochement avec le projet d'une école nationale. Ces initiatives, finalement contrecarrées par les logiques du marché et la stricte séparation entre le public et le privé, nous invitent à repenser l'origine de cette - heureuse - anomalie.\n21\n\n<<< PAGE 24 >>>\n\nL'école inachevée et l'ETPC nous poussent également à reconsidérer les jalons parfois rigides de l'histoire institutionnelle du cinéma. Si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire aux élections législatives de 1936, lorsque les revendications des artistes, techniciens et ouvriers trouvent une représentation politique, ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. L'enseignement technique, bien que marginal et apparu précocement en marge de ces débats, a peut-être contribué à décentrer les discussions, nous incitant à repenser les dynamiques institutionnelles de manière plus progressive.\n22\n\n<<< PAGE 25 >>>\n\nPremière partie\n\nL'École nationale de photographie et de cinématographie\n\nChronique d'un échec (1915-1919)\nFigure.1 Le commandant Carence, les capitaines Delorme et de Gonay Pierre-Marcel Lévi et Paul Léon⁹.\n⁹ Le commandant Carence, chef du Bureau des informations à la presse, figure au centre, flanqué des capitaines Delorme et de Gonay. Au fond à gauche se trouve Pierre-Marcel Lévi, chef de la Section photographique de l'armée, puis de la Section photographique et cinématographique des armées, et à droite, Paul Léon, chef de la Division d'architecture du sous-secrétariat d'État aux Beaux-Arts. Nous avons choisi de reproduire cette photographie car Pierre-Marcel Lévi et Paul Léon sont probablement les principaux promoteurs du rapprochement entre l'administration de l'Instruction publique et des Beaux-Arts et les sections, et vraisemblablement à l'origine du projet d'école nationale. Jules Fortin [photographe], Bureau des informations à la presse. Le commandant Carence [légende d'origine], Le commandant Carence est photographié en compagnie des capitaines Delorme et de Gonay, de Pierre-Marcel Lévi et de Paul Léon, directeur des Beaux-Arts [légende attribuée par le fonds]. Base Images Défense, Établissement de communication et de production audiovisuelle de la Défense, SPA 7 Z 134.\n23\n===== FIN DU BLOB =====\n\n## TÂCHE\n\nProduis une sortie en TEXTE BRUT (PAS de JSON) en DEUX sections :\n(1) les métadonnées, une clé par ligne, (2) la table des matières, une\nentrée par ligne. Format compact conçu pour minimiser le nombre de tokens.\n\n### Section 1 — Métadonnées\n\nExactement ces 6 lignes, dans cet ordre, format `CLÉ: valeur` :\n\nTITRE: <titre complet, sous-titre inclus si présent>\nAUTEUR: <nom complet>\nANNEE: <année de soutenance, ex. 2024>\nETABLISSEMENT: <université + laboratoire/école doctorale si présent>\nDISCIPLINE: <mention ou discipline>\nMOTS_CLES: <mot-clé 1; mot-clé 2; mot-clé 3; ...>\n\nRègles :\n  - Une seule ligne par champ (pas de saut de ligne à l'intérieur d'une valeur).\n  - Si une information est absente du blob, écris `null` après les deux-points.\n  - Les mots-clés sont séparés par `; ` (point-virgule espace). Liste vide → `null`.\n  - NE PAS inventer. NE PAS inclure le résumé/abstract. NE PAS ajouter d'autres champs.\n\n### Section 2 — Table des matières\n\nAprès les métadonnées, laisse UNE ligne vide puis écris exactement cette\nligne marqueur :\n\nTOC\n\nPuis une ligne par entrée de la TOC, dans leur ordre exact d'apparition,\nau format :\n\n<level>|<page_start>|<title>\n\nOù :\n  - `<level>` = profondeur hiérarchique (entier) :\n      · 0 = parties de plus haut niveau (Introduction, Partie I, Chapitre 1,\n            Conclusion, Bibliographie, Annexes, Résumé, Abstract, …)\n      · 1 = sections numérotées \"X.Y\" (ex. \"1.1. Titre\")\n      · 2 = sous-sections \"X.Y.Z\" (ex. \"1.1.1. Titre\")\n      · 3 = puces lettrées \"a)\", \"b)\"\n      · 4+ = niveaux plus profonds si présents\n  - `<page_start>` = numéro de page IMPRIMÉ dans la TOC (entier), ou `null`\n                     si le numéro n'est pas lisible. C'est le numéro écrit à\n                     côté de l'entrée, PAS le num e sur l'industrie du film.\nL'analyse du projet inabouti d'une école nationale de photographie et de cinématographie en 1919, ainsi que de la création de l'École technique de photographie et de cinématographie en 1926 par les fabricants et marchands d'appareils, montre comment ces initiatives ont alimenté les débats entre l'État et les industriels. La formation, d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur.\nAlors qu'on considère généralement que les échanges entre l'État et les industriels se focalisent sur des questions de fiscalité et de régulation du marché, surtout à partir des années 1930, cette recherche montre, à travers l'exemple de la scolarisation des techniques cinématographiques, que les dynamiques institutionnelles sous la Troisième République se révèlent plus nuancées dans leurs enjeux et se développent progressivement dans le temps.\n**Mots-clés** : histoire du cinéma français ; enseignement technique ; Troisième République\n3\n\n<<< PAGE 6 >>>\n\nABSTRACT\nBased on previously unexplored or little-used archives, this thesis examines the development of practical filmmaking courses in France between 1915 and 1937. It demonstrates that the schooling of film techniques, initiated by both the State and industrial actors, occurs in the absence of major economic or technological imperatives. This approach, though disconnected from the market's immediate needs, reveals that the different parties aim to strengthen their influence over the film industry.\nThe analysis of the abandoned project for a national school of photography and cinematography in 1919, along with the creation of the *École technique de photographie et de cinématographie* in 1926 by manufacturers and merchants of equipment, shows how these initiatives fueled debates between the State and industrialists. Education, seemingly neutral and devoid of regulatory weight, is, in reality, a strategic area that each party seeks to control to shape the sector's evolution.\nWhile it is generally believed that exchanges between the State and industrialists focus on fiscal and market regulation issues, especially from the 1930s onward, this research, through the example of the schooling of filmmaking techniques, reveals that institutional dynamics under the Third Republic are in fact more nuanced in their stakes and develop progressively over time.\n**Keywords:** history of French cinema; practical filmmaking courses; Third Republic.\n4\n\n<<< PAGE 7 >>>\n\nTABLES DES MATIÈRES\nRÉSUMÉ.................................................................................................................................................. 3\nABSTRACT............................................................................................................................................ 4\nTABLES DES MATIÈRES ........................................................................................................ 5\nFIGURES ............................................................................................................................................ 8\nINTRODUCTION.................................................................................................................................. 11\nPremière partie L'École nationale de photographie et de cinématographie Chronique d'un échec (1915-1919) 23\nChapitre 1 Le contexte règlementaire .................................................................................. 30\n1. Les mesures d'exception.................................................................................................... 31\n2. La mobilisation de l'industrie.......................................................................................... 38\nChapitre 2 La tutelle de l'État sur les sections photographiques et cinématographiques.................. 45\n1. Interventions préalables.............................................. ation, demeurent dans l'angle mort de ces études : potentiellement présentes, mais invisibles.\nAvant de déterminer une période précise, il était nécessaire de choisir parmi les premières modalités de formation professionnelle, incluant l'apprentissage sur le lieu de production, l'autoformation et l'enseignement technique au sein d'une structure scolaire. Ce choix préliminaire était motivé par le peu de recherches détaillées sur ces sujets et par la nécessité d'éviter la dispersion de nos investigations, chaque déclinaison nécessitant la constitution d'un corpus spécifique et une approche méthodologique adaptée.\nPour la formation réalisée sur le lieu de travail, les interactions entre techniciens et apprentis sont fondées sur l'observation, les échanges verbaux et la répétition de gestes. Ces processus sont, par exemple, rapportés dans des mémoires ou des nécrologies, des sources qui offrent principalement un retour d'expérience du point de vue de l'apprenant. Quant à documenter l'enseignement, on dispose théoriquement d'autant de méthodes que de tuteurs. Concernant l'autoformation, la constitution d'un corpus est complexe en raison de la diversité des supports pédagogiques impliqués. Des éléments aussi variés qu'un traité d'optique, une visite de musée ou le visionnage d'un film peuvent, après tout, contribuer à cette forme d'apprentissage. Notre choix s'est donc porté sur l'enseignement technique, dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives.\n12\n\n<<< PAGE 15 >>>\n\nD'après les connaissances disponibles, l'offre initiale d'enseignement cinématographique dans\nun cadre scolaire ou apparenté comprend les initiatives suivantes :\n- Des groupements et des sociétés savantes qui proposent ponctuellement des cours et des conférences ;\n- Des formateurs qui, à titre individuel, dispensent des cours¹ ;\n- Des écoles d'ingénieurs et d'art qui donnent des cours adaptés ou adaptables aux métiers du cinéma ;\n- Enfin, l'École technique de photographie et de cinématographie (ETPC) qui, à partir de 1926, devient le premier établissement dont la structure administrative est dédiée à l'enseignement technique photographique et cinématographique.\nIntégrée au système éducatif d'État en 1937, l'ETPC, toujours en activité sous le nom d'École nationale supérieure Louis-Lumière (ENSLL), est, jusqu'en 1943 et l'ouverture de l'Institut des hautes études cinématographiques² (IDHEC), le seul établissement de ce type en France. Nous avons envisagé l'ETPC comme point de départ pour examiner la scolarisation de l'apprentissage des techniques cinématographiques, plutôt que d'autres formes d'enseignement, en raison de sa structure administrative spécialisée, de la pérennité de son fonctionnement et de l'engagement des pouvoirs publics, autant d'aspects qui laissaient présager d'une éventuelle richesse documentaire.\n\nDe plus, la nationalisation de cette institution en 1937 nous permettait d'envisager la possibilité d'une fin de cycle, peut-être même d'une rupture, ouvrant la voie à une périodisation dont la limite serait dépendante de l'objet à périodiser³.\n¹ « Avec le passage au parlant, plusieurs comédiens reconnus proposent à leur tour des formations, tandis que la pertinence et les modalités de création d'un éventuel conservatoire du cinéma ne cessent d'être débattues. » Myriam Juan, « « On naît acteur de cinéma... on ne le devient pas ». Artiste cinématographique : un métier en quête de formation (1919-1939) », 1895 : Revue d'histoire du cinéma, 2011/3 (n°65), p.180-199, p.188.\n² L'école est toujours en activité sous le nom d'École nationale supérieure des métiers de l'image et du son, plus communément appelée La Fémis ou FEMIS.\n³ « La périodisation reste finalement toujours dépendante de l'objet à périodiser. En effet, l'historien doit toujours se demander de « quoi », au juste, il est en train de faire l'histoire. » André Gaudreault et Philippe Marion, « Pour une nouvelle approche de la périodisation en histoire du cinéma », Cinémas, 2007/2-3 (n°17), p.215-232, p.221.\n13\n\n<<< PAGE 16 >>>\n\nÉtat de l'art\nLes travaux existants convergent pour indiquer que l'ETPC est fondée avec le soutien\nd'industriels et de commerçants du secteur de la photographie et du cinéma. Bien que l'implication\ndes professionnels dans le développement de l'enseignement technique soit conforme aux pratiques\nde l'époque, les conditions favorables à la scolarisation de l'apprentissage, telles qu'une\nrestructuration profonde du secteur ou des besoins technologiques pressants, ne sont pas réunies\nlorsque son développement commence en 1921. Cette situation soulève donc des interrogations sur\nles motivations réelles des industriels à soutenir ce projet.\nAvant la Première Guerre mondiale, la production cinématographique française, alors\nflorissante, se tourne principalement en studio, lieu où la formation se déroule⁴. Cette méthode est\nprivilégiée car elle est économique pour les employeurs, le matériel et les tuteurs étant déjà sur\nplace. Elle est également avantageuse pour les techniciens et ouvriers, car la maîtrise et la rétention\ndes savoir-faire leur permettent de se rendre indispensables. Les techniques cinématographiques\nne subissent pas de changements majeurs jusqu'à la standardisation du cinéma parlant à la fin des\nannées 1920⁵. Sur le plan économique, la crise qui marque cette décennie, exacerbée par la\nconcurrence des productions américaines et allemandes, ne conduit pas les industriels à réévaluer\nla formation. Au lieu de cela, leurs revendications se concentrent sur le contingentement des films\nétrangers et l'allègement fiscal⁶.\n⁴ Stéphanie Salmon, *Pathé : À la conquête du cinéma (1896-1929)*, Paris, Tallandier, 2014, p.136-174.\n⁵ Avec l'arrivée du cinéma parlant, on observe notamment l'émergence d'un profil hybride d'ingénieur-technicien, qui exige des compétences théoriques ne pouvant plus être acquises uniquement sur le terrain. Martin Barnier, « Les premiers ingénieurs du son français », 1895, 2011/3 (n°65), p.200-217.\n⁶ Paul Leglise, « Le cinéma parlant (1929-1940) », dans *Histoire de la politique du cinéma français : Le cinéma et la IIIe République*, Paris, Librairie générale de droit et de jurisprudence, 1970, p.71-299.\n14\n\n<<< PAGE 17 >>>\n\n## Problématique\nNe trouvant pas d'explication satisfaisante dans le contexte immédiat, nous avons exploré la production cinématographique durant la Première Guerre mondiale, cherchant un lien ou une continuité pouvant éclairer le développement de l'ETPC. Au cours de ces investigations, nous avons découvert qu'entre le 17 février et le 14 avril 1919, au moment de la démobilisation, les pouvoirs publics envisagent la création d'une école nationale de photographie et de cinématographie. Ce projet, lié à la transformation des sections photographiques et cinématographiques de l'armée en service civil, est finalement abandonné, la fin de la guerre rendant obsolète la gestion publique de la production d'images. Parmi les opposants à ce projet figurent des acteurs majeurs des corporations de la photographie et du film, qui participeront par la suite à la création de l'ETPC.\nEntre 1919 et 1921, à deux reprises et avec des mêmes personnalités impliquées, survient la volonté de scolariser l'apprentissage des techniques cinématographiques. D'abord par les pouvoirs publics, qui échouent, puis par les industriels, qui y parviennent. Cette récurrence se produit sans qu'un besoin clairement défini, tel qu'une transformation technologique majeure ou une demande accrue de main-d'œuvre spécialisée, ne justifie de telles initiatives. Une perspective de recherche s'est alors consolidée autour d'une série de questions.\nQuels sont les motifs derrière ces tentatives de scolarisation ? La formation est-elle la préoccupation principale ou sert-elle un autre objectif ? Le contrôle de la formation influence-t-il d'autres aspects des pratiques cinématographiques, et si oui, lesquels ? C'est à ces interrogations que notre recherche tâchera de répondre.\n15\n\n<<< PAGE 18 >>>\n\nHypothèses\nNotre recherche part du constat que la scolarisation de l'apprentissage des techniques cinématographiques s'opère à contretemps des exigences du marché. Cela nous conduit à formuler des hypothèses sur les motivations sous-jacentes des acteurs industriels et des instances gouvernementales.\nEn 1919, la proposition d'une école nationale, avancée par les pouvoirs publics à la fin de la Première Guerre mondiale, semble être une tentative de maintenir le contrôle de l'État sur le cinéma en se réorientant vers un domaine d'intervention plus légitime comme l'enseignement. Cette initiative, visant à transformer les services de propagande de l'armée en conservatoire de la photographie et du cinéma, est envisagée précisément au moment où la démobilisation et le retour à la paix auraient normalement rendu ce type de contrôle non conforme aux principes libéraux du commerce et de l'entreprise privée.\nConcernant la création de l'ETPC, si l'engagement du corps patronal correspond aux pratiques de l'époque, les conditions économiques et technologiques ne justifient pas à elles seules cette initiative. Il semblerait que les professionnels, impactés par les restrictions et la confiscation de la production durant la guerre, aient perçu dans le soutien et la création de l'ETPC une opportunité de reprendre en main leurs intérêts et de se prémunir contre toute tentative de réappropriation de leur domaine par l'État. En façonnant l'ETPC, ils auraient donc consolidé leur vision spécifique de l'industrie cinématographique.\nEn résumé, l'enseignement technique pourrait être un facteur supplémentaire dans les interactions entre l'État et les industriels, visant à façonner, orienter et contrôler les normes du secteur cinématographique.\n16\n\n<<< PAGE 19 >>>\n\nRésolution\nPour aborder ces hypothèses, nous revisiterons d'abord l'activité des sections photographiques et cinématographiques de l'armée, établies dès le premier semestre de 1915 et démantelées lors de la démobilisation en avril 1919. Notre analyse portera sur le cadre administratif et réglementaire qui a permis l'extension de l'influence étatique, d'abord centrée sur la propagande, vers des domaines commerciaux touchant directement les professionnels du secteur. Le prolongement de ce contrôle dans l'après-guerre, envisagé notamment à travers le projet d'une école nationale de photographie et de cinématographie, est perçu par les professionnels comme une expansion de l'ingérence de l'État, renforçant leur méfiance face aux intrusions potentielles.\nNous approfondirons ensuite le développement de l'ETPC en identifiant précisément ses fondateurs. L'implication de certains d'entre eux dans les sections photographiques et cinématographiques de l'armée, ainsi que leur connaissance des ambitions étatiques, nous amène à interroger les véritables motivations de leur engagement. Majoritairement issus de la Chambre syndicale des fabricants et négociants de la photographie (CSFNP), nous analyserons comment la défense de leurs intérêts a potentiellement influencé la création et l'évolution de l'école.\nNous retracerons enfin l'activité de l'ETPC afin de déterminer si son rôle se limite à la formation\ntechnique ou s'il répond également à d'autres objectifs. En examinant la nationalisation de\nl'établissement en 1937, nous chercherons à comprendre si cette étape constitue une tentative de\nl'État pour renforcer son contrôle sur l'industrie cinématographique.\n17\n\n<<< PAGE 20 >>>\n\nLimites\nSi notre focalisation sur l'enseignement technique permettait de découvrir des archives, elle\nconduisait également à une impasse. Entre 1915 et 1937, seules une tentative inachevée et l'ETPC\nsont documentées, un échantillon restreint qui limite les perspectives. Ce spectre réduit pourrait\ndonner l'impression que notre recherche se concentre uniquement sur l'ETPC, ce qui est en partie\nvrai, l'ETPC étant le seul établissement d'enseignement technique en activité sur cette période.\nÉtendre la périodisation jusqu'à l'IDHEC en 1943 aurait permis de diversifier l'analyse et de fournir\nun point de comparaison. Cependant, la recherche d'archives liées à l'ETPC a monopolisé le temps\nalloué à cette thèse, rendant impossible une étude aussi poussée d'une autre institution.\nPar ailleurs, que l'on étudie l'école nationale inachevée ou l'ETPC, le problème reste le même.\nLa majorité des archives disponibles provient des représentants des pouvoirs publics ou des\nfondateurs de l'ETPC, avec des documents souvent orientés. Nous avons veillé à indiquer\nclairement le caractère partial de ces sources, en précisant leur orientation chaque fois que\nnécessaire.\nEnfin, une dernière limite à prendre en compte est la nature hybride de cette recherche, qui se\nsitue au carrefour de deux champs historiographiques distincts : l'histoire institutionnelle du\ncinéma⁷ et celle des institutions scolaires. Ce positionnement peut donner l'impression de s'éloigner\ndu cinéma proprement dit, car il nous amène à naviguer entre des perspectives parfois très\ndifférentes. Bien que ces deux domaines se rejoignent autour de l'enseignement technique, cette\n⁷⁷ « Il s'agit au fond d'une histoire surtout centrée sur les rapports du politique et de la profession, progressivement encadrée et protégée. » Michèle Lagny, De l'histoire du cinéma. Méthode historique et histoire du cinéma., Paris, Armand Colin, 1992, p.203.\n18\n\n<<< PAGE 21 >>>\n\napproche élargie peut parfois soulever des doutes sur le champ historiographique auquel cette étude\ncontribue réellement.\nCorpus\nLa constitution du corpus autour des sections photographiques et cinématographiques de l'armée\nvisait un renouvellement des sources, indispensable pour approfondir les connaissances actuelles.\nNous avons donc privilégié les archives de la Médiathèque du patrimoine et de la photographie,\nafin de bénéficier d'un éventail documentaire moins exploité que celui de l'Établissement de\ncommunication et de production audiovisuelle de la Défense et du Service historique de la Défense.\nCe choix nous a permis d'accéder à des documents administratifs peu explorés, exposant\nnotamment les interactions des professionnels avec les sections, leur exclusion et la progressive\nprise de contrôle par l'État. Parmi ces documents, les procès-verbaux de la commission dédiée à la\ntransformation des sections en service civil se distinguent et dévoilent le programme d'une école\njusqu'alors inconnue.\nLa constitution du corpus sur l'ETPC représentait un défi majeur, notamment en raison de\nl'absence d'archives directement liées à l'établissement. Par exemple, l'ENSLL ne possède que\nquatre brochures couvrant la période de la création de l'école jusqu'à sa nationalisation en 1937⁸.\nPour surmonter ces contraintes, nous avons exploré les archives des fondateurs de l'école, en\nparticulier celles de Paul Montel, directeur de l'ETPC jusqu'en 1946 et membre de la CSFNP, pour\nlaquelle il est responsable de la production du bulletin mensuel. Nous avons examiné en détail deux\nrevues qu'il édite entre 1919 et 1937, à savoir *Le Photographe*, une publication technique\n⁸ Nous tenons à remercier M. Florent Fajole, responsable du centre de ressources documentaires Léon Gaumont à l'ENSLL, pour son accueil chaleureux.\n19\n\n<<< PAGE 22 >>>\n\ngénéraliste qui expose les facettes de l'école destinées au grand public, et *L'Informateur de la photographie*, le bulletin de la CSFNP, qui reflète les intérêts du syndicat étroitement lié à l'ETPC.\nEn ciblant les archives liées à Paul Montel, nous avons découvert deux collections riches et jusqu'alors sous-exploitées. La première, à la Société française de photographie, contient des correspondances entre Paul Montel et la famille Lumière, révélant les discussions ayant conduit à l'implication des professionnels dans le projet de l'école. Jusqu'à présent, ce fonds n'a pas été pleinement utilisé, probablement car il est classé comme une annexe du fonds Paul Montel. La seconde, à la Cinémathèque française, est un fonds consacré à Léon Gaumont, qui détaille son implication dans l'école à partir des années 1930. Catalogué sous le nom de son fils cadet, Louis Gaumont, ce classement pourrait expliquer pourquoi il a été peu étudié.\n## Méthodologie\nLa méthodologie appliquée à cette recherche repose sur une approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs impliqués dans la scolarisation des techniques cinématographiques. En nous concentrant sur le développement de l'enseignement technique, nous avons privilégié des archives peu explorées pour renouveler les perspectives sur ce processus, tout en incluant l'exemple de l'ETPC comme cas d'étude représentatif.\nL'analyse des documents s'est effectuée par une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions. Cette méthode critique s'est avérée essentielle pour éviter de reproduire des discours orientés, particulièrement lorsque les documents proviennent d'acteurs ayant directement contribué à la fondation ou au développement de l'ETPC.\n20\n\n<<< PAGE 23 >>>\n\nConcernant la périodisation, nous avons délibérément limité notre analyse à la période 1915-1937 pour concentrer nos efforts sur les prémices et le développement de l'enseignement technique en France. Ces choix méthodologiques reflètent notre volonté de construire une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle.\n## Contributions\nBien que notre recherche apporte des données factuelles nouvelles, nous souhaitons mettre l'accent sur la manière dont l'étude de l'enseignement technique éclaire les dynamiques et les interactions entre les professionnels et les pouvoirs publics. Ces échanges contribuent à nuancer et à approfondir la compréhension du processus de normalisation du cinéma, en révélant l'impact structurel que ces débats ont eu sur l'évolution de la profession et de l'industrie.\nLe projet inachevé d'une école nationale, ainsi que l'activité des sections photographiques et cinématographiques de l'armée, nous rappellent une incongruité structurelle propre au cinéma français, à savoir la place centrale des ministères et des administrations en lien avec l'éducation et la culture. Bien que cette tutelle soit aujourd'hui normalisée, la dimension culturelle du cinéma étant admise, cette conception n'était pas partagée au moment de la création des sections. Il est probable que les fonctionnaires qui ont œuvré pour impliquer l'Instruction publique et les Beaux-Arts dans l'activité des sections soient les mêmes qui aient envisagé de prolonger ce rapprochement avec le projet d'une école nationale. Ces initiatives, finalement contrecarrées par les logiques du marché et la stricte séparation entre le public et le privé, nous invitent à repenser l'origine de cette - heureuse - anomalie.\n21\n\n<<< PAGE 24 >>>\n\nL'école inachevée et l'ETPC nous poussent également à reconsidérer les jalons parfois rigides de l'histoire institutionnelle du cinéma. Si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire aux élections législatives de 1936, lorsque les revendications des artistes, techniciens et ouvriers trouvent une représentation politique, ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. L'enseignement technique, bien que marginal et apparu précocement en marge de ces débats, a peut-être contribué à décentrer les discussions, nous incitant à repenser les dynamiques institutionnelles de manière plus progressive.\n22\n\n<<< PAGE 25 >>>\n\nPremière partie\n\nL'École nationale de photographie et de cinématographie\n\nChronique d'un
