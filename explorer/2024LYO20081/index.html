n que « déconnectée des besoins immédiats du marché » (p. 5), a révélé que « les différentes parties cherchent à renforcer leur influence sur l'industrie du film » (p. 5).\n\n## Questions de recherche\n\n- « Quels sont les motifs derrière ces tentatives de scolarisation ? » (p. 17)\n- « La formation est-elle la préoccupation principale ou sert-elle un autre objectif ? » (p. 17)\n- « Le contrôle de la formation influence-t-il d'autres aspects des pratiques cinématographiques, et si oui, lesquels ? » (p. 17)\n\n## Réponses aux questions de recherche\n\n- **Motifs de la scolarisation** : L'initiative étatique de 1919 révèle « une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés, bien au-delà des impératifs de guerre » (p. 288), visant à « préserver un contrôle acquis en temps de crise plutôt qu'à développer l'enseignement technique cinématographique » (p. 288). Pour les professionnels, le motif est inverse : ils perçoivent l'école « comme une initiative visant à fédérer les professionnels » (p. 290) et à reprendre la main sur leurs intérêts face à l'État.\n- **Objectif principal de la formation** : La formation technique n'est pas une fin en soi ; elle sert à « former un profil intermédiaire, ni ouvrier ni ingénieur, mais un cadre technique apte à répondre aux exigences croissantes de l'industrie » (p. 290), s'inscrivant dans « une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur » (p. 290).\n- **Influence sur d'autres aspects** : Le contrôle de la formation influence la structuration corporative et les normes de production, en « rassembl[ant] un large éventail de représentants du cinéma, y compris des exploitants traditionnellement distants des autres branches du secteur » (p. 290), et en participant à un « processus de normalisation du cinéma » (p. 23) qui précède et dépasse les réformes du Front populaire.\n\n## Hypothèses\n\n**Principale** : « l'enseignement technique pourrait être un facteur supplémentaire dans les interactions entre l'État et les industriels, visant à façonner, orienter et contrôler les normes du secteur cinématographique. » (p. 18)\n**Secondaires** :\n- « la proposition d'une école nationale [...] semble être une tentative de maintenir le contrôle de l'État sur le cinéma en se réorientant vers un domaine d'intervention plus légitime comme l'enseignement. » (p. 18)\n- « les professionnels [...] aient perçu dans le soutien et la création de l'ETPC une opportunité de reprendre en main leurs intérêts et de se prémunir contre toute tentative de réappropriation de leur domaine par l'État. » (p. 18)\n- **Vérification/Précision issue de la conclusion** : L'hypothèse de la logique malthusienne des industriels est confirmée : « Cette approche s'inscrit dans une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur. » (p. 290)\n\n## Méthodologie\n\n- **Approche** : « approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs impliqués dans la scolarisation des techniques cinématographiques. » (p. 22)\n- **Méthode** : « L'analyse des documents s'est effectuée par une lecture croisée, visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions. » (p. 22) ; reconstruction chronologique et analyse des dynamiques institutionnelles à partir de fonds d'archives privés et publics.\n- **Corpus/Données** : Archives de la Médiathèque du patrimoine et de la photographie (sections de l'armée, procès-verbaux de la commission de transformation) (p. 21) ; archives de Paul Montel, revues *Le Photographe* et *L'Informateur de la photographie* (p. 21-22) ; fonds Paul Montel à la Société française de photographie (correspondances avec la famille Lumière) (p. 22) ; fonds Léon Gaumont à la Cinémathèque française (p. 22) ; quatre brochures de l'ENSLL (p. 21) ; note de réunion du 25 octobre 1937 sur la création d'enseignements cinématographiques artistiques (p. 294-295).\n- **Justification** : « privilégier des archives peu explorées pour renouveler les perspectives sur ce processus, tout en incluant l'exemple de l'ETPC comme cas d'étude représentatif. » (p. 22) ; limitation à 1915-1937 pour « construire une analyse approfondie sur un corpus restreint mais riche, plutôt que de privilégier une approche comparative qui aurait été plus superficielle. » (p. 23) ; découverte tardive de certains fonds (Grieshaber-As de Trèfle, note de 1937) intégrée en perspective (p. 289, 296). Le résumé confirme que la recherche s'appuie sur « des archives inédites ou peu exploitées » (p. 5) pour examiner ce développement.\n\n## Fil rouge\n\nLa négociation du contrôle institutionnel et normatif du cinéma tel que défini par l'auteur (p. 18), reliant l'échec du projet d'école nationale (1915-1919) à la fondation patronale de l'ETPC (1919-1923) puis à son cycle d'activité et sa nationalisation (1924-1937) via la scolarisation technique comme levier de compromis entre velléités étatiques et autonomie industrielle. Le résumé synthétise ce fil en montrant comment « les différentes parties cherchent à renforcer leur influence sur l'industrie du film » et comment la formation, « d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur ».\n\n## Plan (Structure)\n\n- **Première partie L'École nationale de photographie et de cinématographie Chronique d'un échec (1915-1919)** : Démontre que la tentative étatique de pérenniser le contrôle des sections de l'armée via une école nationale échoue face à la méfiance des professionnels et au retour aux logiques libérales d'après-guerre, révélant « une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés » (p. 288).\n- **Deuxième partie L'École technique de photographie et de cinématographie Membres et principes fondateurs (1919-1923)** : Démontre que la création de l'ETPC par les industriels, majoritairement issus de la CSFNP, vise à reprendre la main sur leurs intérêts et à se prémunir contre les intrusions de l'État en « fédér[ant] les professionnels » (p. 290) autour d'un programme calibré.\n- **Troisième partie L'École technique de photographie et de cinématographie Premier cycle d'activité (1924-1937)** : Démontre que le rôle de l'ETPC dépasse la simple formation technique pour participer à l'orientation des normes du secteur, culminant avec une nationalisation consensuelle en 1937 qui « facilite une prise en main sans avoir à tout reconstruire » (p. 292) tout en préservant la légitimité des pionniers.\n\n## Cadre théorique\n\n*[Non renseigné]*\n\n## Concepts clés\n\n- **SCOLARISATION DE L'APPRENTISSAGE** : « scolarisation de l'apprentissage des techniques cinématographiques » (p. 15) — [NON DÉFINI EXPLICITEMENT] : processus de transfert de la formation des techniques cinématographiques vers un cadre scolaire ou apparenté, en opposition à l'apprentissage sur le lieu de production ou l'autoformation. — propre à l'auteur\n- **ENSEIGNEMENT TECHNIQUE** : « enseignement technique, dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives. » (p. 14) — [NON DÉFINI EXPLICITEMENT] : forme d'enseignement institutionnalisé et structuré administrativement, servant de levier de contrôle et de normalisation sectorielle. — propre à l'auteur\n- **NORMALISATION DU CINÉMA** : « processus de normalisation du cinéma, en révélant l'impact structurel que ces débats ont eu sur l'évolution de la profession et de l'industrie. » (p. 23) — [NON DÉFINI EXPLICITEMENT] : dynamique graduelle par laquelle les normes professionnelles, techniques et institutionnelles du cinéma sont façonnées par les interactions entre pouvoirs publics et acteurs économiques. — propre à l'auteur\n- **LOGIQUE MALTHUSIENNE (de formation)** : « Cette approche s'inscrit dans une logique malthusienne, où les compétences transmises sont soigneusement calibrées, probablement dans le but de limiter les coûts liés à la formation et d'éviter une hausse des salaires dans le secteur. » (p. 290) — [NON DÉFINI EXPLICITEMENT] : stratégie de régulation de l'offre de main-d'œuvre qualifiée visant à contenir les coûts et les revendications salariales. — propre à l'auteur\n- **ESPACE STRATÉGIQUE (de la formation)** : « La formation, d'apparence neutre et dénuée de poids normatif, est en réalité un espace stratégique que chacun souhaite contrôler pour orienter l'évolution du secteur. » (p. 5) — [NON DÉFINI EXPLICITEMENT] : reconfiguration du champ éducatif technique comme terrain de négociation du pouvoir institutionnel, dépassant sa fonction pédagogique apparente. — propre à l'auteur\n\n## Ancrage empirique (ou concret)\n\n- Projet d'école nationale de photographie et de cinématographie (1919) : « entre le 17 février et le 14 avril 1919 [...] les pouvoirs publics envisagent la création d'une école nationale [...] finalement abandonné » (p. 17) ; rejet par l'administration des Finances (p. 288).\n- École technique de photographie et de cinématographie (ETPC) : « à partir de 1926, devient le premier établissement dont la structure administrative est dédiée à l'enseignement technique photographique et cinématographique. » (p. 15) ; nationalisée en 1937 (p. 15) ; déficit gérable mais refus des professionnels de le couvrir (p. 291).\n- Archives spécifiques : « procès-verbaux de la commission dédiée à la transformation des sections en service civil » (p. 21) ; correspondances Paul Montel / famille Lumière (p. 22) ; fonds Léon Gaumont (p. 22) ; note de réunion du 25 octobre 1937 sur les enseignements cinématographiques artistiques (p. 294-295).\n- Critique terrain : témoignage de Marcel Carné sur les lacunes de l'ETPC pour les métiers de plateau (opérateur, électricien) vs efficacité pour les labos et la photo (p. 292-293).\n\n## Opposition / Contre-argumentation\n\n- « les données concernant leur enseignement et leur apprentissage [...] demeurent dans l'angle mort de ces études : potentiellement présentes, mais invisibles. » (p. 14) — lacune historiographique comblée par le corpus.\n- « les travaux existants convergent pour indiquer que l'ETPC est fondée avec le soutien d'industriels et de commerçants [...] les conditions favorables à la scolarisation [...] ne sont pas réunies [...] Cette situation soulève donc des interrogations sur les motivations réelles des industriels à soutenir ce projet. » (p. 16) — nuancé par la découverte d'une logique de fédération corporative et de contrôle malthusien (p. 290).\n- « si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire [...] ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. » (p. 24) — résultat contre-intuitif confirmé par la conclusion : la normalisation et la nationalisation s'amorcent bien avant 1936 via les compromis techniques de l'entre-deux-guerres.\n\n## Apport principal\n\n- **Empirique** : « La constitution du corpus autour des sections photographiques et cinématographiques de l'armée visait un renouvellement des sources [...] accès à des documents administratifs peu explorés [...] procès-verbaux [...] dévoilent le programme d'une école jusqu'alors inconnue. » (p. 21) ; mise au jour de la logique malthusienne et des correspondances privées éclairant les fondations de l'ETPC (p. 290-291).\n- **Théorique** : « L'enseignement technique [...] a peut-être contribué à décentrer les discussions, nous incitant à repenser les dynamiques institutionnelles de manière plus progressive. » (p. 24) ; réinterprétation de la nationalisation de 1937 non comme une rupture, mais comme l'aboutissement d'un compromis graduel entre État et industrie (p. 292).\n- **Critique** : « si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire [...] ce processus s'inscrit, peut-être, dans une dynamique plus graduelle. » (p. 24) ; démontre que la scolarisation technique a précédé et préparé les réformes culturelles de l'État, relativisant le rôle exclusif du Front populaire dans la structuration institutionnelle du cinéma français.\n\n```\n\n## EXEMPLE DE STYLE (à imiter pour le registre, la longueur des paragraphes, le flux)\n\n```markdown\n# [Titre complet de l'ouvrage : nom des directeurs et titre/sous-titre en italique]\n\n**Compte rendu par** [Auteur du compte rendu]\n\n**Date :** 2026-04-24\n\n**Source :** [URL si disponible]\n\n**Référence :** [Auteur·e·s], *Titre complet*, Ville, Éditeur, coll. « Collection », année, xxx p., ISBN : xxx.\n\n---\n\nQuatorze auteurs, parmi lesquels des sociologues clés de l'analyse du secteur social et médico-social analysent, dans cet ouvrage important, les transformations de la « morale » de l'intervention sociale de divers pays (France dont Mayotte, Suisse, Maroc, Québec), ceci à la suite d'un congrès sociologique international tenu à Tunis en 2021. Le texte décrit les tensions traversant l'intervention sociale, entre idéaux de justice sociale, d'égalité et de solidarisme d'une part, et les principes de responsabilisation et d'activation dans un contexte marqué par l'emprise croissante d'une logique managériale, d'autre part. Disons-le d'emblée, le principe de « responsabilisation » mérite d'être interrogé : il renvoie généralement non pas tant à un transfert de pouvoir aux usagers ou citoyens, comme il l'affirme, mais souvent à une « normalisation » du contrôle social reposant, désormais, sur l'individu lui-même. C'est notamment le cas dans les dispositifs de parentalité ou dans la justice restaurative, où la volonté des individus devient l'opérateur du contrôle social.\n\nNotre lecture questionne implicitement les mots-clefs contemporains de l'intervention sociale que sont « responsabiliser » et « activer ». Ces termes sont aussi les items centraux de la Nouvelle Gouvernance Publique (NGP), laquelle tend, pour l'action sociale, à substituer la « relation de service » reposant sur l'efficience et le résultat au « modèle de service public d'action » fondateur. S'impose, alors, un glissement progressif vers un paradigme managérial qui met la focale sur les difficultés de financement, d'efficacité, la qualité du service et le questionnement de la légitimité de l'État social.\n\nDans le premier chapitre, Jean-Pierre Tabin et ses collègues explorent, à partir de la rhétorique de l'État depuis les années 2000, les politiques suisses en direction des personnes invalides. Ils identifient finement une logique « capacitiste » visant la re-marchandisation à tout prix, via un nouvel ordre d'employabilité passant par l'acceptation d'une norme d'emploi « médiocre » et, de fait, réduisant la « crédibilité épistémique » de la personne en situation de handicap psychique. Dans les Structures d'Insertion par l'Activité Économique (SIAE) analysées par Hervé Jory dans le cinquième chapitre, la prévalence des compétences d'adaptation sociale sur la formation didactique et le savoir-faire professionnel correspond à une précarisation du profil attendu des publics. L'inversion du statut de la formation, dans ces structures d'insertion, tend à favoriser des conditions d'acceptation de conditions de travail pénibles pour des emplois sous-qualifiés. Ce nouveau cadre normatif de l'inclusion professionnelle repose sur le postulat « d'insérer pour former » où l'insertion se suffit en elle-même. Il s'agit de privilégier l'adaptation quasi immédiate à l'emploi et ses difficultés, en particulier la capacité à supporter des conditions de travail éprouvantes (port de charges lourdes, intempéries…) plutôt que l'intégration de savoirs professionnels et une qualification capitalisable.\n\nL'analyse de tous ces segments de l'intervention sociale est à même d'identifier une logique de responsabilisation des publics et un tournant managérial souvent pénalisants. Mais la grammaire managériale reste fortement questionnée dans les pratiques concrètes des acteurs. Un deuxième grand apport de l'ouvrage est donc d'étudier les engagements moraux et les micro-résistances éthiques des intervenants·es infléchissant parfois certaines modalités de l'intervention sociale. Au-delà des cadres normatifs, des professionnels inventent dès lors des pratiques d'écarts éthiques pour redonner sens à leur action.\n\nAinsi, dans l'urgence sociale présentée par Hélène Marin et Béatrice Bertho (chapitre 3), la mobilisation bénévole de professionnels illustre la volonté de participer à la neutralisation d'un déficit d'action publique récurrent, en contradiction avec les principes moraux de l'État social. Un engagement solidaire, fait en parallèle de leur travail salarié, s'instaure dans une ville de Suisse romane afin de faire face à une « politique de la pénurie » (p. 48) de l'accueil national des personnes sans-abris. Ce « bénévolat solidaire » définit ce que l'on peut appeler une « résistivité morale », des micro-résistances enracinées dans les principes de justice sociale au regard des besoins de ce public en grande vulnérabilité psychique et sociale.\n\nEn définitive, l'intérêt majeur des thèses de cet ouvrage est de souligner une mutation des cadres normatifs et moraux de l'intervention sociale qui mettent désormais essentiellement l'accent sur une responsabilisation des individus vulnérables, une activation étrécie et pénalisante et privilégiant parfois l'immédiateté de l'insertion par le travail, voire des pratiques de culpabilisation-stigmatisation et des dispositifs d'activation définis par une grammaire managériale. Par contre, ces mutations ne doivent pas oblitérer, car s'exprimant à bas bruit dans les interstices de l'accompagnement, la présence modeste d'un cadre moral et cognitif secondaire d'élargissement du pouvoir d'agir pour les personnes en difficulté. Une responsabilisation que l'on peut qualifier d'« habilitante » est encore visible dans nombre des pratiques d'accompagnement. Ainsi, le Revenu de Solidarité Active (RSA) agricole représente une reconnaissance nouvelle de la vulnérabilité d'une population et un levier d'action potentiel pour des agriculteurs immergés des décennies dans une grande précarité. L'action sociale n'est pas réductible au seul tournant néo-libéral et l'on observe non pas une « nouvelle » morale de l'intervention sociale mais une hybridation de morales dont certaines fondatrices de l'État social et du travail social. Malgré tout, force est de constater que la NGP encadre l'intervention sociale par des normes managériales dissonantes au regard des idéaux universalistes, de l'éthique et de la vulnérabilité des publics et de leurs besoins. Ces nouvelles normes conduisent à une détérioration de l'action pour les usagers et le personnel que l'on retrouve aussi dans l'ensemble des services publics.\n\n---\n\n## Pour citer cet article\n\n**[Auteur]**, « [Titre court de l'ouvrage] », *Comptes rendus*, mis en ligne le [date], consulté le [date].\n\n```\n\n---\n\nRédige maintenant la note de lecture. Vise ~2000 mots, six paragraphes denses, français académique soutenu. Termine par `FINAL(note_markdown)`.\n", "note_md": "# *Former c'est normer. Le développement de l'enseignement technique cinématographique en France (1915-1937)*\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-07\n\n**Référence :** René OSI, *Former c'est normer. Le développement de l'enseignement technique cinématographique en France (1915-1937)*, Université Lumière Lyon 2 ; Université de Montréal, 2024, 317 p.\n\n---\n\nDans sa thèse de doctorat, René OSI examine, sur une période de vingt-deux ans, les conditions et les logiques qui ont présidé à la scolarisation de l'apprentissage des techniques cinématographiques en France. L'objet est en apparence modeste — la création et le fonctionnement d'une école —, mais il sert de loupe à un enjeu bien plus vaste : la négociation du contrôle institutionnel et normatif du cinéma sous la Troisième République. La thèse centrale peut être formulée ainsi : la formation technique des métiers du cinéma ne répond pas à des impératifs pédagogiques, mais constitue un levier de négociation permettant aux industriels de consolider leur autonomie face aux velléités de contrôle de l'État. En étudiant d'abord l'échec du projet d'école nationale de 1919, puis la fondation et l'évolution de l'École technique de photographie et de cinématographie (ETPC), René OSI démontre que l'enseignement technique a servi à fédérer les professionnels, à calibrer les compétences selon une logique malthusienne et à anticiper une normalisation sectorielle progressive. La périodisation retenue (1915-1937) encadre précisément trois phases : l'échec de l'initiative étatique pendant et après la Grande Guerre, la genèse d'un projet industriel privé entre 1919 et 1923, et enfin le premier cycle d'activité de l'ETPC jusqu'à sa nationalisation consensuelle en 1937. Cette trichotomie, qui structure les trois parties de la thèse, trace un arc narratif allant du rejet des ambitions étatiques à la reconquête par les professionnels, puis à un compromis qui aboutit à la cession volontaire de l'école à l'État.\n\nL'originalité de la démarche réside dans le choix d'un corpus largement constitué d'archives peu ou pas exploitées. Renonçant à l'apprentissage sur le lieu de travail — « fondé sur l'observation, les échanges verbaux et la répétition de gestes » — et à l'autoformation — « complexe » à documenter en raison de la « diversité des supports pédagogiques impliqués » —, l'auteur se concentre sur l'enseignement technique, « dont l'acceptation est stable depuis la fin du XIXe siècle et dont le caractère formel offrait un accès potentiel à des archives » (p. 14). Le corpus principal s'articule autour des sections photographiques et cinématographiques de l'armée de la Grande Guerre — dont les procès-verbaux de la commission de transformation en service civil « dévoilent le programme d'une école jusqu'alors inconnue » (p. 21) — et des archives des fondateurs de l'ETPC, en particulier les correspondances entre Paul Montel et la famille Lumière, conservées à la Société française de photographie (p. 22). La méthode repose sur une « approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours produits par les acteurs » (p. 22), complétée par une « lecture croisée » des sources « visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions » (p. 22). Ce choix méthodologique vise à « renouveler les perspectives » en privilégiant des archives inédites sur une période restreinte mais riche, plutôt qu'une « approche comparative qui aurait été plus superficielle » (p. 23).\n\n\nLa première partie, intitulée « L'École nationale de photographie et de cinématographie. Chronique d'un échec (1915-1919) », retrace comment l'État a utilisé la Grande Guerre pour s'immiscer dans des secteurs traditionnellement privés, puis a tenté — en vain — de pérenniser cette emprise par la création d'une école nationale. Entre avril et mai 1915, des sections photographiques et cinématographiques sont instaurées au sein de l'armée pour répondre à la propagande allemande. Initialement, l'État a fait appel aux professionnels du secteur : la section cinématographique s'associe avec la Chambre syndicale de la cinématographie (CSCIR) et la section photographique avec la Chambre syndicale française de la photographie (CSFPA) (p. 68). Cependant, moins de six mois après leur engagement, ces contrats sont « abruptement résiliés » (p. 67). Les professionnels jouent un rôle tampon le temps que les sections se dotent d'équipements et d'infrastructures autonomes, puis sont progressivement marginalisés. L'ingérence étatique s'étend ensuite à l'expansion commerciale : les sections obtiennent un quasi-monopole sur la production et la vente d'images, avec des crédits parlementaires passant de 30 000 francs en 1915 à 260 000 francs au troisième trimestre 1917 (p. 82). Cette gestion hybride, qualifiée par le contrôleur Jaillet de « bâtarde », brouille la chaîne de commandement et suscite les plaintes des milieux professionnels. En août 1918, sous la pression du rapport Petit et des critiques de professionnels mécontents de la concurrence d'État, Jules Jeanneney sollicite une restructuration. Il exhorte le ministère des Finances à « agir vite », précisant que « l'affaire pouvant donner lieu à des interventions qu'il vaudrait mieux éviter » (p. 90). Lors de la démobilisation, entre février et avril 1919, la commission d'examen de la transformation des sections en service civil envisage la création d'une école nationale, projet « finalement abandonné » (p. 17). Ce projet « révèle une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés, bien au-delà des impératifs de guerre » (p. 288) et visait à « préserver un contrôle acquis en temps de crise » (p. 288). Le rejet par l'administration des Finances, hostile à la pérennisation d'un secteur de formation à vocation privée, met fin à l'ambition étatique et ouvre la voie à la reconquête par les industriels.\n\n\nLa deuxième partie, « Membres et principes fondateurs (1919-1923) », montre comment les industriels ont saisi l'opportunité offerte par l'échec de l'initiative étatique pour reprendre la main. Au cœur de cette entreprise se profile la figure de Paul Montel, issu d'un milieu « apparemment éloigné des sphères de la photographie et du cinéma » (p. 129). Né en 1879 à Tours d'un père chemisier, Montel lance en mai 1919 la revue *Le Photographe*, dont il assurera la direction pendant près de deux décennies. Grâce aux correspondances inédites avec la famille Lumière, l'auteur reconstitue avec finesse une stratégie de courtisanerie éditoriale : Montel propose gratuitement de mettre en valeur les travaux des Lumière dans ses publications, gagnant progressivement leur confiance pour les amener à rejoindre le projet (p. 130). Cette approche, combinée à l'édition en 1921 de *L'Informateur de la photographie* — organe officiel de la Chambre syndicale des fabricants et négociants de la photographie (CSFNP) —, permet à Montel de se constituer un réseau d'influence au sein du corps patronal. La CSFNP, fondée en 1889, joue un rôle déterminant : bien qu'elle ne soit « sans affiliation formelle avec l'école », la plupart des fondateurs de la société d'études qui prépare l'ETPC en sont membres ou sympathisants (p. 290). C'est donc sous l'égide de ce syndicat que le projet se concrétise financièrement. Parallèlement, les visites que Montel et Louis-Philippe Clerc effectuent dans des écoles européennes — Manchester, Londres, Berlin — nourrissent l'élaboration du programme. Clerc distingue soigneusement les établissements de « perfectionnement » pour ouvriers déjà employés des écoles offrant un « cursus complet » (p. 164), ce qui préfigure la volonté de former un profil intermédiaire spécifique. Cette différenciation s'accompagne d'un travail d'orientations rédactionnelles : dans *L'Informateur*, organe syndical, les aspects théoriques du programme sont systématiquement omis au profit des enseignements pratiques, une stratégie destinée à « rassurer les plus conservateurs » sensibles au scepticisme des professionnels envers « l'approche scientifique de la photographie » (p. 173). À la fin de 1923, le programme et la structure administrative sont finalisés, consolidant un projet qui s'inscrit dans la volonté de « fédérer les professionnels » (p. 290) autour d'un enseignement calibré selon leurs propres critères.\n\n\n ciale, entre idéaux de justice sociale, d'égalité et de solidarisme d'une part, et les principes de responsabilisation et d'activation dans un contexte marqué par l'emprise croissante d'une logique managériale, d'autre part. Disons-le d'emblée, le principe de « responsabilisation » mérite d'être interrogé : il renvoie généralement non pas tant à un transfert de pouvoir aux usagers ou citoyens, comme il l'affirme, mais souvent à une « normalisation » du contrôle social reposant, désormais, sur l'individu lui-même. C'est notamment le cas dans les dispositifs de parentalité ou dans la justice restaurative, où la volonté des individus devient l'opérateur du contrôle social.\n\nNotre lecture questionne implicitement les mots-clefs contemporains de l'intervention sociale que sont « responsabiliser » et « activer ». Ces termes sont aussi les items centraux de la Nouvelle Gouvernance Publique (NGP), laquelle tend, pour l'action sociale, à substituer la « relation de service » reposant sur l'efficience et le résultat au « modèle de service public d'action » fondateur. S'impose, alors, un glissement progressif vers un paradigme managérial qui met la focale sur les difficultés de financement, d'efficacité, la qualité du service et le questionnement de la légitimité de l'État social.\n\nDans le premier chapitre, Jean-Pierre Tabin et ses collègues explorent, à partir de la rhétorique de l'État depuis les années 2000, les politiques suisses en direction des personnes invalides. Ils identifient finement une logique « capacitiste » visant la re-marchandisation à tout prix, via un nouvel ordre d'employabilité passant par l'acceptation d'une norme d'emploi « médiocre » et, de fait, réduisant la « crédibilité épistémique » de la personne en situation de handicap psychique. Dans les Structures d'Insertion par l'Activité Économique (SIAE) analysées par Hervé Jory dans le cinquième chapitre, la prévalence des compétences d'adaptation sociale sur la formation didactique et le savoir-faire ins de ce public en grande vulnérabilité psychique et sociale.\n\nEn définitive, l'intérêt majeur des thèses de cet ouvrage est de souligner une mutation des cadres normatifs et moraux de l'intervention sociale qui mettent désormais essentiellement l'accent sur une responsabilisation des individus vulnérables, une activation étrécie et pénalisante et privilégiant parfois l'immédiateté de l'insertion par le travail, voire des pratiques de culpabilisation-stigmatisation et des dispositifs d'activation définis par une grammaire managériale. Par contre, ces mutations ne doivent pas oblitérer, car s'exprimant à bas bruit dans les interstices de l'accompagnement, la présence modeste d'un cadre moral et cognitif secondaire d'élargissement du pouvoir d'agir pour les personnes en difficulté. Une responsabilisation que l'on peut qualifier d'« habilitante » est encore visible dans nombre des pratiques d'accompagnement. Ainsi, le Revenu de Solidarité Active (RSA) agricole représente une reconnaissance nouvelle de la vulnérabilité d'une population et un levier d'action potentiel pour des agriculteurs immergés des décennies dans une grande précarité. L'action sociale n'est pas réductible au seul tournant néo-libéral et l'on observe non pas une « nouvelle » morale de l'intervention sociale mais une hybridation de morales dont certaines fondatrices de l'État social et du travail social. Malgré tout, force est de constater que la NGP encadre l'intervention sociale par des normes managériales dissonantes au regard des idéaux universalistes, de l'éthique et de la vulnérabilité des publics et de leurs besoins. Ces nouvelles normes conduisent à une détérioration de l'action pour les usagers et le personnel que l'on retrouve aussi dans l'ensemble des services publics.\n\n---\n\n## Pour citer cet article\n\n**[Auteur]**, « [Titre court de l'ouvrage] », *Comptes rendus*, mis en ligne le [date], consulté le [date].\n\n```\n\n---\n\nRédige maintenant la note de lecture. Vise ~2000 mots, six n service civil se distinguent et dévoilent le programme d'une école\njusqu'alors inconnue.\nLa constitution du corpus sur l'ETPC représentait un défi majeur, notamment en raison de\nl'absence d'archives directement liées à l'établissement. Par exemple, l'ENSLL ne possède que\nquatre brochures couvrant la période de la création de l'école jusqu'à sa nationalisation en 1937⁸.\nPour surmonter ces contraintes, nous avons exploré les archives des fondateurs de l'école, en\nparticulier celles de Paul Montel, directeur de l'ETPC jusqu'en 1946 et membre de la CSFNP, pour\nlaquelle il est responsable de la production du bulletin mensuel. Nous avons examiné en détail deux\nrevues qu'il édite entre 1919 et 1937, à savoir *Le Photographe*, une publication technique\n[fn] ⁸ Nous tenons à remercier M. Florent Fajole, responsable du centre de ressources documentaires Léon Gaumont à l'ENSLL, pour son accueil chaleureux.\n[p.22]\ngénéraliste qui expose les facettes de l'école destinées au grand public, et *L'Informateur de la photographie*, le bulletin de la CSFNP, qui reflète les intérêts du syndicat étroitement lié à l'ETPC.\nEn ciblant les archives liées à Paul Montel, nous avons découvert deux collections riches et jusqu'alors sous-exploitées. La première, à la Société française de photographie, contient des correspondances entre Paul Montel et la famille Lumière, révélant les discussions ayant conduit à l'implication des professionnels dans le projet de l'école. Jusqu'à présent, ce fonds n'a pas été pleinement utilisé, probablement car il est classé comme une annexe du fonds Paul Montel. La seconde, à la Cinémathèque française, est un fonds consacré à Léon Gaumont, qui détaille son implication dans l'école à partir des années 1930. Catalogué sous le nom de son fils cadet, Louis Gaumont, ce classement pourrait expliquer pourquoi il a été peu étudié.\n## Méthodologie\nLa méthodologie appliquée à cette recherche repose sur une approche interdisciplinaire, mêlant l'analyse des archives historiques, l'étude des institutions et l'interprétation critique des discours\n\n--- CHAP 2 INGÉRENCE (p.67-80) ---\n[p.67]\nDans le domaine public, ce contrôle se manifeste au travers des avis et des directives du ministère des Finances. La gestion des sections doit respecter des normes de transparence et de conformité réglementaire, tant pour l'utilisation des budgets alloués que pour l'enregistrement des recettes issues de la vente des images. Nous approfondirons ces aspects en détail lorsque nous reviendrons sur le rapport Petit. Du côté des acteurs privés, certains regroupements expriment ouvertement leur désaccord avec les pratiques commerciales des sections.\nLe contrôle démocratique engendre deux conséquences. Premièrement, il restreint les interventions de l'État, qui est tenu de justifier ses actions. Deuxièmement, bien que ce mécanisme autorise la critique, son ampleur est limitée en temps de guerre. La priorité accordée à l'unité nationale réduit l'espace pour les voix contestataires, réticentes à défier les mesures de défense adoptées par le pouvoir exécutif.\n## 4. L'ingérence de l'État\nPour combler les besoins en matériel, les sections ont initialement fait appel à des professionnels. Cependant, moins de six mois après leur engagement, ces contrats sont abruptement résiliés. Que s'est-il donc passé pour que cette collaboration prenne fin si rapidement ?\n### La signature des contrats\nDans le cadre de leur engagement initial avec le secteur privé, la section cinématographique et la section photographique s'associent avec des syndicats professionnels. Les contrats passés par le ministère de la Guerre ont des clauses similaires pour les deux sections. Chaque groupement est chargé de désigner des firmes qui fournissent non seulement les opérateurs, mais également le\n[p.68]\nmatériel nécessaire aux prises de vues. En contrepartie, les sociétés sélectionnés obtiennent le droit\nd'exploiter les images qu'elles produisent.\nLe 6 mai 1915, la section cinématographique s'associe avec la Chambre syndicale de la cinématographie et des industries s'y rattachent (CSCIR). Crée le 18 juillet 1912, ce groupement succède à la Chambre syndicale des éditeurs autrefois présidée par Georges Méliès¹¹⁵. Exclusivement patronal, ce syndicat regroupe des fabricants, des marchands de matière première et d'appareils, ainsi que des producteurs de films. Les exploitants de salles n'y adhèrent pas et ont plutôt tendance à s'affilier au Syndicat français des directeurs de cinématographe, en raison de leurs relations conflictuelles avec les producteurs¹¹⁶.\nLe 15 avril 1915, la section photographique s'associe avec la Chambre syndicale française de la photographie et de ses applications (CSFPA). Fondée en 1862 et comptant Paul Nadar parmi ses présidents les plus célèbres, ce groupement vise notamment à faire reconnaître la photographie comme une forme d'art¹¹⁷. Plus diversifiée que la CSCIR, la CSFPA rassemble non seulement des photographes mais également des fabricants et des marchands de matières premières et d'appareils.\nUne différence notable se manifeste dans le choix des firmes associées à chacune des sections.\nLa section cinématographique collabore avec des firmes renommées, contrairement à la section\nphotographique qui s'appuie sur des maisons nettement moins connues. Cette distinction est\nfréquemment soulignée dans l'enquête du contrôleur Jaillet, qui critique ouvertement la sélection\n[fn] ¹¹⁵ Leglise, *Histoire de la politique du cinéma français : Le cinéma et la IIIe République*, p.37.\n[fn] ¹¹⁶ Les relations conflictuelles trouvent leur origine dans la question épineuse de la billetterie et des remontées de recettes. *Ibid*, p.38.\n[fn] 117 Paul Nadar, né Paul Tournachon (1856-1939), est également désigné par le pseudonyme Nadar, emprunté à son père, Félix Tournachon (1820-1910). Xavier Lesage, « « Réussir quand même », la saga des Nadar, photographes-entrepreneurs », *Entreprendre & Innover*, 2023/4 (n°57), p.82-87, p.83. ; Paul Nadar, *Bulletin de la Chambre syndicale de la photographie et de ses applications*, octobre 1901, p.3.\n[p.69]\nde la CSFPA : « *Il\n\n--- CHAP 2 TRANSFORMATION (p.89-116) ---\n[p.89]\ncet élan, le ministère des Finances, mieux positionné pour réagir, n'a pas hésité à formuler des réserves, non sans conséquences dans le cadre des restructurations qui affectent les sections à partir de 1918.\n## 6. La transformation des sections\nLe 16 novembre 1917, Georges Clemenceau prend la tête du Gouvernement, se réserve le ministère de la Guerre, et opère une reprise en main autoritaire des armées. Dans ce contexte, les réserves exprimées par l'Inspection des finances, alliées à de nouvelles plaintes émanant des professionnels, poussent son cabinet ministériel à intervenir dans les discussions, qui impliquaient auparavant uniquement les ministères de tutelle des sections et le ministère des Finances. En août 1918, ces échanges aboutissent à une restructuration qui restreint les ambitions commerciales des sections et les réoriente vers des missions d'archivage. Cette réorganisation esquisse le cadre des attributions envisagées pour les sections après la guerre, un sujet débattu tout au long de la période de démobilisation, de novembre 1918 à janvier 1920. En parcourant les archives de la commission d'examen consacrée à la transformation des sections en service civil, nous avons découvert des documents qui permettent potentiellement d'éclairer la compréhension du développement de l'enseignement technique du cinéma en France. Durant les délibération, la création d'une école nationale de photographie et de cinématographie est envisagée, mais rejetée. Parmi les membres de la commission figurent des représentants influents de l'industrie photographique et cinématographique, qui sont ensuite impliqués dans la création de l'École technique de photographie et de cinématographie (ETPC). Dans cette dernière partie, nous reviendrons d'abord sur les circonstances qui conduisent à la réorganisation des sections avant de détailler les discussions de la commission d'examen consacrée à l'étude de leur transformation en service civil.\n[p.90]\nL'intervention de la présidence du Conseil\nMécontent des conclusions du rapport Petit, Jules Jeanneney est également alerté par certains professionnels de la concurrence commerciale exercée par les sections¹⁶². Jeanneney, sous-secrétaire d'État à la présidence du Conseil et au ministère de la Guerre, sollicite une enquête approfondie pour évaluer leur fonctionnement en préparation d'une restructuration. Le 1er février 1918, dans une lettre adressée au ministre des Finances, Jeanneney pointe les lacunes des investigations menées par l'inspecteur Petit, en particulier l'évaluation incomplète des produits commerciaux générés par les sections¹⁶³. Appelant à des investigations plus approfondies, Jeanneney exprime également ses préoccupations face aux plaintes des milieux professionnels. Sa démarche est empreinte d'ambiguïté. Tout en demandant l'ouverture d'une enquête, il précise déjà les changements qu'il envisage pour les sections, cela sans attendre les conclusions de l'investigation qu'il exige. Cette posture ambivalente, qui entremêle des suggestions et des injonctions, culmine avec une mise en garde qui s'apparente à une menace politique à peine voilée : « J'appelle votre attention sur la nécessité d'agir vite, l'affaire pouvant donner lieu à des interventions qu'il vaudrait mieux éviter¹⁶⁴. » Cette assertion implique-t-elle d'agir promptement pour prévenir l'intervention de Clemenceau, qui d'autre sinon pourrait être visé ?\n[fn] 162 « D'autre part, l'Association Syndicale des photographes français se plaint de la concurrence commerciale que lui fait l'Etat grâce à l'utilisation d'un personnel mobilisé et fait observer qu'il est choquant de voir des soldats courir les salles de rédaction des journaux pour offrir à des prix arbitrairement fixés par leurs Chefs, des clichés pris par d'autres soldats en service commandé. » Lettre du 1er février 1918 de Jules Janneney, sous-secrétaire d'État à la présidence du Conseil et à la Guerre à Louis-Lucien Klotz, ministre des Finances, Médiathèque du patri\n\n--- CHAP 3 CORRESPONDANCES (p.129-147) ---\n[p.129]\nPaul Montel, issu d'un milieu apparemment éloigné des sphères de la photographie et du cinéma, a opéré un passage remarquable du commerce à l'édition spécialisée. La genèse de son activité d'éditeur, souvent datée à 1910 par certaines sources, est remise en question par nos archives qui suggèrent plutôt des débuts en 1919, au sortir de la guerre. Ce qui est certain, c'est son sens des affaires, son talent pour la communication et l'édition, comme en témoignent le succès et la longévité de ses revues.\n## 2. Correspondances Montel-Lumière : Courtisaneries\nL'histoire du développement de l'ETPC est fragmentée en raison de la disponibilité limitée des archives. Les correspondances retrouvées à la Société française de photographie nous offrent désormais la possibilité de combler certaines lacunes. Ces lettres permettent d'affiner la chronologie des événements et d'apporter des données précieuses sur la stratégie de Paul Montel pour se rapprocher de la famille Lumière, puis les convaincre de se joindre au projet qui vise à la création d'une école de photographie et de cinématographie en France.\nNous allons examiner une partie de la correspondance, en particulier les lettres échangées entre le 10 juin 1919 et le 8 janvier 1921. Dans ces courriers, Montel adopte une approche courtisane en proposant gratuitement de mettre en avant les travaux des membres de la famille Lumière dans ses revues, une stratégie qui lui permet de gagner progressivement leur confiance. Analyser ces lettres va nous permettre de comprendre comment Montel s'impose d'abord comme un habile communicant, puis évolue pour devenir l'homme de confiance d'une partie du milieu industriel.\nLe corpus présente un caractère fragmenté. Les lettres sont réparties de façon inégale sur le plan chronologique, avec des écarts significatifs entre elles. Par ailleurs, ces correspondances, échangées de manière irrégulière entre les membres de la famille Lumière et Paul Montel,\n[p.130]\nsoulèvent une question récurrente dans notre étude : les conclusions tirées de cet ensemble de\ndocuments peuvent-elles être représentatives de l'ensemble des dynamiques à l'œuvre ? Nous\ndevons donc envisager que les généralisations issues de cet échantillon restent conditionnées à la\ndécouverte de nouvelles archives. Quant à la nature même des échanges, ils impliquent\nprincipalement la famille Lumière, acteurs majeurs de l'industrie photographique et\ncinématographique de l'époque. La question se pose donc de savoir si les méthodes employées par\nMontel sont représentatives de tactiques employées avec d'autres figures influentes du secteur.\nCette interrogation sera partiellement explorée dans une autre partie de notre étude, où nous\nanalyserons les correspondances entre Paul Montel et Léon Gaumont, offrant ainsi une base de\ncomparaison pour mieux cerner les pratiques relationnelles de Montel.\nNous adopterons une approche chronologique et thématique, mettant de côté les éléments\nanecdotiques ou purement conversationnels, pour concentrer notre attention sur la stratégie\ndéployée par Paul Montel. Ce cadre nous permettra d'explorer comment il parvient\nprogressivement à se rapprocher et à gagner la confiance de la famille Lumière.\nL'accès restreint à la famille Lumière\nLes détails formels de la première lettre fournissent un premier ensemble de données qui\nconcordent avec nos archives et les connaissances disponibles²⁴¹. Le courrier est daté du 10 juin\n1919 et selon sa fiche matricule, Paul Montel est alors libre de ses engagements militaires depuis\nle 28 janvier 1919. De plus, la revue *Le Photographe*, interrompue depuis juillet 1914, a repris le\ncours de sa publication en mai 1919. Pour ce qui concerne les adresses, celles-ci sont conformes\n[fn] 241 Lettre du 10 juin 1919 de M. Collet, secrétaire des frères Lumière à M. Paul Montel, Société française de photographie, 262 Dossier Lumière.\n[p.131]\naux domiciliations connues des interlocuteurs. La lettre est rédigée sur un papier à en-tête portant\nl'adr\n\n--- CHAP 5 PROGRAMME (p.172-188) ---\n[p.172]\n## 2. Les plans et le programme de l'ETPC\nLes articles publiés à la fin de l'année 1923, à la suite des comptes rendus de Louis-Philippe Clerc, marquent la fin d'une première phase dans le développement de l'ETPC. Ils retracent plusieurs étapes clés : le ralliement et le soutien de personnalités et syndicats influents, les visites d'établissements en Europe, ainsi que l'élaboration des plans architecturaux pour l'école, prévue sur un terrain acquis par la société d'études. L'ensemble de ces informations se divise en deux catégories. D'une part, les détails concernant le programme et les infrastructures de l'école, élaborés et commentés par Louis-Philippe Clerc, et d'autre part, les aspects administratifs gérés par Paul Montel.\n### *Des conclusions orientées*\nSi les comptes rendus sur les écoles européennes n'étaient pas publiés simultanément ni dans le même ordre entre *L'Informateur de la photographie* et *Le Photographe*, leur contenu demeurait néanmoins semblable dans les deux revues. Différemment, ces nouvelles données ne sont pas publiées de manière identique. Tandis que *L'Informateur* présente uniquement les plans, l'approche pédagogique globale et le programme des enseignements pratiques, *Le Photographe* publie en plus le programme théorique, un descriptif complet des cours, le programme des enseignements cinématographiques, et des informations administratives additionnelles.\nCette disparité pourrait s'expliquer de deux façons. Premièrement, et pour une raison liée à sa ligne éditoriale, *L'Informateur de la Photographie*, en tant qu'organe syndical, pourrait s'être limité aux aspects jugés essentiels en évitant de s'étendre sur des détails considérés comme moins prioritaires pour son lectorat. Deuxièmement, en lien avec la première explication, il est notable que, bien que *L'Informateur* ait maintenu le programme pratique, les détails des enseignements\n[p.173]\nthéoriques et les informations sur la branche cinématographique n'ont pas été reproduits. Ce qui\npeut paraître un simple choix éditorial ne l'est peut-être pas tant, car il oriente subtilement l'image\nque l'on souhaite véhiculer de l'école dans l'organe professionnel qui la soutient. Autrement dit,\ncette omission instaure une hiérarchie entre les enseignements pratiques au détriment des\nenseignements théoriques. Dans ses comptes rendus, Clerc a relayé les témoignages de directeurs\nd'écoles exprimant le scepticisme de certains professionnels envers l'approche scientifique de la\nphotographie, privilégiant un travail plus artisanal et manuel, ainsi que leur crainte de voir des\ntechniciens plus qualifiés les concurrencer. L'omission des aspects théoriques dans *L'Informateur*\npourrait être interprétée comme une tentative de répondre à ces inquiétudes, en préservant une\nimage traditionnelle et pratique de l'enseignement afin de rassurer les plus conservateurs.\nLe programme\nConcernant les aspects liés au programme de l'école, Louis-Philippe Clerc fait preuve de\ntransparence concernant les éléments qu'il a emprunté aux écoles étrangères. Nous suivrons le plan\net la progression qu'il détaille dans son article, ce qui nous permettra de comprendre précisément\nce qui est envisagé en France³⁰⁴.\nL'article s'ouvre sur une section intitulée *Buts poursuivis*³⁰⁵, qui reprend l'argumentaire traditionnel pour justifier la création de l'école. En résumé, l'établissement vise à élever le niveau\n[fn] 304 Louis-Philippe Clerc, « École profesionnelle française de photographie et de cinématographie, Son but - Ses programmes - Son fonctionnement », *Le Photographe*, 5 novembre 1923, p.251-254. ; Louis-Philippe Clerc, « École profesionnelle fr istrateurs pour encourager cette transformation, il s'agit en réalité d'un compromis mutuellement bénéfique, plutôt que d'un processus coercitif. D'un côté, cela offre aux pouvoirs publics l'opportunité d'accroître leur influence dans un secteur qu'ils convoitent, tandis que de l'autre, les administrateurs de l'école, conscients que l'établissement ne générera pas de revenus, saisissent cette opportunité comme une chance de sécuriser l'avenir de l'institution et de consolider leur héritage en tant que pionniers de l'enseignement spécialisé.\nNous commencerons par l'analyse détaillée des données financières de l'ETPC en nous appuyant sur les bilans comptables que nous avons trouvés. Nous revisiterons ensuite un aspect spécifique de ce contexte, en nous concentrant sur le discours prononcé par Jean Zay devant l'Assemblée nationale le 3 février 1937. Au cours de son intervention, le ministre critique l'ETPC tout en exposant ses projets pour le cinéma français, notamment la création d'un conservatoire du cinéma, une prise de position marquante mais relativement isolée dans le débat global. Enfin, nous détaillerons les tractations qui s'opèrent entre les administrateurs de l'ETPC et les représentants des pouvoirs publics dans le cadre de la nationalisation de l'établissement.\n# 1. La situation financière de l'ETPC\nL'ETPC a été présentée à ses investisseurs comme une institution capable de générer des revenus, notamment grâce aux frais de scolarité. Toutefois, lors de l'installation du studio destiné\n[p.270]\nà l'enseignement des techniques du cinéma sonore, les pouvoirs publics qui contribuent financièrement à sa construction soulignent leur incapacité à assumer seuls les coûts de cette extension, rappelant leur soutien financier régulier à l'école⁴³⁹. Cette tension entre les aspirations à l'autofinancement et la réalité d'une dépendance aux subventions publiques soulève des questions importantes sur la situation financière de l'ETPC.\nLes bilans comptables retrouvés tifs. Ces derniers se divisent en deux catégories. D'une part, un nombre important de feuillets qui fournissent des\n[fn] ⁸⁴ Pierre-Marcel Lévi signe cet article sous le nom de Pierre Marcel, chef de la Section photographique de l'armée. Pierre-Marcel Lévi, « L'Histoire de la grande guerre : Des archives, des documents, des preuves », *Les Annales politiques et littéraires*, 18 juillet 1915 (n°1673), p.72.\n[p.54]\néclairages ponctuels sur des aspects spécifiques et d'autre part, des rapports d'activité, plus rares,\nmais qui synthétisent l'activité des sections sur une période donnée. Pour étudier le cadre\nadministratif et l'intégration des sections au sein des structures militaires et gouvernementales,\nnotre analyse s'appuiera principalement sur un rapport produit en 1917, qui constitue la source\nprincipale de documentation sur les aspects structurels dans les recherches existantes. Ce\ndocument, essentiel pour le reste du c\n\n--- CH7 RApprochement DGET (p.220-225) ---\n[p.220]\npermettre de poser les jalons structurels au sein desquels s'opèrent les différentes activités. Nous\nreviendrons notamment sur les liens entre l'ETPC et la Direction générale de l'enseignement\ntechnique (DGET) pour comprendre comment l'école interagit avec les pouvoirs publics. Ensuite,\nnous porterons notre attention sur l'activité pédagogique, précisément, les cycles complets\nd'enseignements ainsi que le profil et le parcours des étudiants. Le troisième volet explore les\nactivités annexes, incluant les cours de perfectionnement, les cours du soir, et les développements\nautour du laboratoire de recherches.\n# 1. Le rapprochement entre l'ETPC et la Direction générale de l'enseignement technique\nSous la direction d'Edmond Labbé, la Direction générale de l'enseignement technique (DGET)\ndevient rapidement l'un des premiers soutiens institutionnels du projet, fournissant une aide à la\nfois morale et financière. Les subventions accordées par la DGET se révèlent crucales, facilitant\nnon seulement l'aménagements des locaux, mais aussi le fonctionnement de l'école années après\nannées.\nPour appréhender en profondeur les fondements, la portée et les implications de l'engagement\nde la DGET, il est essentiel d'examiner les principes qui ont orienté l'enseignement technique\ndurant l'entre-deux-guerres. Cette exploration ne se propose pas de répéter l'histoire exhaustive de\ncette filière ou de détailler la biographie de ses figures clés, mais plutôt de clarifier les principes\nfondamentaux qui ont guidé le soutien à l'ETPC.\n*Cadre historique et principe généraux de l'enseignement technique*\nNous adopterons une définition simplifiée de l'enseignement technique applicable de la fin du\nXIXe siècle, marquée par les premières lois organisant ce type d'enseignement, jusqu'aux années\n[p.221]\n1940 et sa démocratisation, en particulier dans les couches sociales modestes de la société française³⁶². Durant cette période, l'enseignement technique est essentiellement perçu comme une transposition institutionnelle de l'apprentissage traditionnel du lieu de travail à l'environnement scolaire³⁶³.\nLa transformation des moyens de production, conséquence directe de la révolution industrielle, nécessite la formation d'une main-d'œuvre qualifiée. L'enseignement technique s'impose progressivement, remplaçant l'apprentissage traditionnel et le compagnonnage, désormais inadaptés aux nouveaux modes de production. Contrairement à ces méthodes, l'enseignement en milieu scolaire permet de transmettre plus efficacement les connaissances théoriques et les compétences techniques nécessaires pour opérer et entretenir les nouvelles machines. De la seconde moitié du XVIIIe siècle à la fin du XIXe siècle, cet enseignement se structure autour d'établissements issus tant d'initiatives privées que publiques, chacun incarnant divers idéaux sociaux, politiques ou religieux. Les industriels veulent améliorer la productivité pour faire face à la concurrence étrangère, tandis que l'État cherche à \n\n--- CH8 FINANCE (p.269-273) ---\n[p.269]\nemblématique de ces réformes, dans lequel il critique l'ETPC et propose la création d'un institut du cinéma, cet enjeu reste secondaire. Les questions d'allègement fiscal, de financement de la production cinématographique et de régulation des revenus de l'exploitation demeurent les préoccupations dominantes.\nSi l'État, en conditionnant le renouvellement des subventions à la nationalisation de l'ETPC, exerce une certaine pression sur les administrateurs pour encourager cette transformation, il s'agit en réalité d'un compromis mutuellement bénéfique, plutôt que d'un processus coercitif. D'un côté, cela offre aux pouvoirs publics l'opportunité d'accroître leur influence dans un secteur qu'ils convoitent, tandis que de l'autre, les administrateurs de l'école, conscients que l'établissement ne générera pas de revenus, saisissent cette opportunité comme une chance de sécuriser l'avenir de l'institution et de consolider leur héritage en tant que pionniers de l'enseignement spécialisé.\nNous commencerons par l'analyse détaillée des données financières de l'ETPC en nous appuyant sur les bilans comptables que nous avons trouvés. Nous revisiterons ensuite un aspect spécifique de ce contexte, en nous concentrant sur le discours prononcé par Jean Zay devant l'Assemblée nationale le 3 février 1937. Au cours de son intervention, le ministre critique l'ETPC tout en exposant ses projets pour le cinéma français, notamment la création d'un conservatoire du cinéma, une prise de position marquante mais relativement isolée dans le débat global. Enfin, nous détaillerons les tractations qui s'opèrent entre les administrateurs de l'ETPC et les représentants des pouvoirs publics dans le cadre de la nationalisation de l'établissement.\n# 1. La situation financière de l'ETPC\nL'ETPC a été présentée à ses investisseurs comme une institution capable de générer des revenus, notamment grâce aux frais de scolarité. Toutefois, lors de l'installation du studio destiné\n[p.270]\nà l'enseignement des techniques du cinéma sonore, les pouvoirs publics qui contribuent financièrement à sa construction soulignent leur incapacité à assumer seuls les coûts de cette extension, rappelant leur soutien financier régulier à l'école⁴³⁹. Cette tension entre les aspirations à l'autofinancement et la réalité d'une dépendance aux subventions publiques soulève des questions importantes sur la situation financière de l'ETPC.\nLes bilans comptables retrouvés dans les fonds Lumière et Louis Gaumont, couvrant le\n\n--- CH8 ZAY (p.274-277) ---\n[p.274]\néquipements mais limitée en liquidités, expose une fragilité économique, accentuée par le fait que les bâtiments ne lui appartiennent pas. Les subventions de l'État, notamment celles de l'enseignement technique, permettent d'équilibrer ses comptes, mais cette aide gouvernementale soulève la question de la durabilité de ce modèle économique.\nIl convient toutefois de nuancer l'interprétation des données financières. La subvention de l'enseignement technique oscille entre 60 000 et 90 000 francs par an, une somme significative mais à relativiser. À titre indicatif, les salaires annuels prévus dans le laboratoire de recherches atteignent 60 000 francs pour le chef de travaux et 30 000 pour son adjoint, des montants que les industriels sont prêts à investir. Ce cadre financier suggère un compromis où l'école bénéficie du soutien financier des pouvoirs publics, améliorant sa crédibilité, sans que la contribution de l'État ne devienne disproportionnée. L'État, quant à lui, y trouve un moyen d'encadrer des domaines qu'il convoite, par exemple, pour leurs applications pédagogiques ou leur influence sociale et culturelle.\n## 2. L'intervention de Jean Zay\nEntre décembre 1936 et mai 1937, d'éminentes personnalités du cinéma français témoignent devant l'Assemblée nationale et le Sénat, dans le cadre d'une enquête visant à : « [...] définir exactement la situation actuelle de l'industri s produits par les acteurs » (p. 22), complétée par une « lecture croisée » des sources « visant à confronter les différentes sources pour détecter les éventuels biais ou contradictions » (p. 22). Ce choix méthodologique vise à « renouveler les perspectives » en privilégiant des archives inédites sur une période restreinte mais riche, plutôt qu'une « approche comparative qui aurait été plus superficielle » (p. 23).\n\n\nLa première partie, intitulée « L'École nationale de photographie et de cinématographie. Chronique d'un échec (1915-1919) », retrace comment l'État a utilisé la Grande Guerre pour s'immiscer dans des secteurs traditionnellement privés, puis a tenté — en vain — de pérenniser cette emprise par la création d'une école nationale. Entre avril et mai 1915, des sections photographiques et cinématographiques sont instaurées au sein de l'armée pour répondre à la propagande allemande. Initialement, l'État a fait appel aux professionnels du secteur : la section cinématographique s'associe avec la Chambre syndicale de la cinématographie (CSCIR) et la section photographique avec la Chambre syndicale française de la photographie (CSFPA) (p. 68). Cependant, moins de six mois après leur engagement, ces contrats sont « abruptement résiliés » (p. 67). Les professionnels jouent un rôle tampon le temps que les sections se dotent d'équipements et d'infrastructures autonomes, puis sont progressivement marginalisés. L'ingérence étatique s'étend ensuite à l'expansion commerciale : les sections obtiennent un quasi-monopole sur la production et la vente d'images, avec des crédits parlementaires passant de 30 000 francs en 1915 à 260 000 francs au troisième trimestre 1917 (p. 82). Cette gestion hybride, qualifiée par le contrôleur Jaillet de « bâtarde », brouille la chaîne de commandement et suscite les plaintes des milieux professionnels. En août 1918, sous la pression du rapport Petit et des critiques de professionnels mécontents de la concurrence d'État, Jules Jeanneney sollicite une restructuration. Il exhorte le ministère des Finances à « agir vite », précisant que « l'affaire pouvant donner lieu à des interventions qu'il vaudrait mieux éviter » (p. 90). Lors de la démobilisation, entre février et avril 1919, la commission d'examen de la transformation des sections en service civil envisage la création d'une école nationale, projet « finalement abandonné » (p. 17). Ce projet « révèle une volonté claire de prolonger l'ingérence de l'État dans des secteurs traditionnellement privés, bien au-delà des impératifs de guerre » (p. 288) et visait à « préserver un contrôle acquis en temps de crise » (p. 288). Le rejet par l'administration des Finances, hostile à la pérennisation d'un secteur de formation à vocation privée, met fin à l'ambition étatique et ouvre la voie à la reconquête par les industriels.\n\n\nLa deuxième partie, « Membres et principes fondateurs (1919-1923) », montre comment les industriels ont saisi l'opportunité offerte par l'échec de l'initiative étatique pour reprendre la main. Au cœur de cette entreprise se profile la figure de Paul Montel, issu d'un milieu « apparemment éloigné des sphères de la photographie et du cinéma » (p. 129). Né en 1879 à Tours d'un père chemisier, Montel lance en mai 1919 la revue *Le Photographe*, dont il assurera la direction pendant près de deux décennies. Grâce aux correspondances inédites avec la famille Lumière, l'auteur reconstitue avec finesse une stratégie de courtisanerie éditoriale : Montel propose gratuitement de mettre en valeur les travaux des Lumière dans ses publications, gagnant progressivement leur confiance pour les amener à rejoindre le projet (p. 130). Cette approche, combinée à l'édition en 1921 de *L'Informateur de la photographie* — organe officiel de la Chambre syndicale des fabricants et négociants de la photographie (CSFNP) —, permet à Montel de se constituer un réseau d'influence au sein du corps patronal. La CSFNP, fondée en 1889, joue un rôle déterminant : bien qu \n\n\nL'apport de cette thèse est triple : empirique, théorique et historiographique. Sur le plan empirique, la découverte de fonds inédits — en particulier les correspondances Montel-Lumière à la Société française de photographie et les bilans comptables dans les fonds Gaumont — permet de reconstituer la genèse de l'ETPC avec un degré de précision jusque-là inégalé. Ces sources « dévoilent le programme d'une école jusqu'alors inconnue » (p. 21) et éclairent les stratégies relationnelles qui ont conduit au ralliement de la famille Lumière. Sur le plan théorique, l'auteur propose une réinterprétation majeure : loin d'être « déconnectée des besoins immédiats du marché » (p. 5), la formation technique sert un projet normatif et corporatif. La logique malthusienne qui sous-tend le programme — former un « profil intermédiaire, ni ouvrier ni ingénieur » dont les compétences sont « soigneusement calibrées » pour « limiter les coûts liés à la formation et éviter une hausse des salaires » (p. 290) — révèle que la scolarisation a été instrumentalisée par les industriels comme un outil de régulation de l'offre de main-d'œuvre qualifiée. Cette thèse relativise également l'importance du Front populaire dans la structuration institutionnelle du cinéma français : « si l'on associe souvent l'émergence d'enjeux dépassant les considérations fiscales et réglementaires à la victoire du Front populaire […] ce processus s'inscrit, peut-être, dans une dynamique plus graduelle » (p. 24). La nationalisation de 1937 n'est pas une rupture révolutionnaire, mais l'aboutissement d'un compromis progressif entre l'État et l'industrie. Quant aux limites, on notera que l'absence d'archives directes de l'ETPC pour les premières années d'activité (1924-1926) contraint l'auteur à se reposer sur des revues éditées par l'un des protagonistes, Paul Montel, ce qui introduit un biais inhérent au matériau source. L'auteur le reconnaît lui-même : les conclusions « restent conditionnées à la découverte de nouv
