<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raisonnement — 2024ESMA0001</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app bar, then a reading map (section band + two lists), a KPI row, and a two-column
   iteration timeline (cards left, duration bars right). */
:root {
  --bg: #efeee9; --panel: #f8f7f3; --ink: #1d1f23; --mute: #6c6f76; --line: #d9d7cf;
  --read: #2f4a8a; --unread: #e3e1da; --ochre: #c9a45e; --ochre-deep: #7e5c1d; --ochre-soft: #f4ead6;
  --serif: "Spectral", Georgia, serif; --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
    --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #1f2125; --ink: #e8e6df; --mute: #9a9da4; --line: #33363c;
  --read: #7f9ce0; --unread: #2a2d33; --ochre: #c9a45e; --ochre-deep: #e2bf78; --ochre-soft: #2b2518; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.brand::before { content: ""; width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); }
.doc { color: var(--mute); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs span { font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); }
.tabs .on { border-color: var(--ochre); background: var(--ochre-soft); color: var(--ochre-deep); font-weight: 500; }
main { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 64px; }
h1 { font: 500 30px/1.2 var(--serif); margin: 0; display: inline; }
.sub { font: 13px var(--mono); color: var(--mute); margin-left: 14px; }
.label { font: 500 11.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.panel { background: var(--panel); border: 1px solid var(--line); }

/* section band */
.band { display: flex; height: 112px; margin-top: 18px; border: 1px solid var(--line); background: var(--panel); }
.sec { position: relative; border-right: 1px solid var(--line); background: var(--unread); cursor: pointer; min-width: 3px; }
.sec:last-child { border-right: 0; }
.sec .fill { position: absolute; left: 6%; right: 6%; bottom: 0; background: var(--read); }
.sec:hover, .sec:focus-visible { outline: 2px solid var(--ochre); outline-offset: -2px; z-index: 1; }
.ticks { display: flex; height: 22px; font: 11px var(--mono); color: var(--mute); }
.ticks div { text-align: center; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mute); margin-top: 4px; }
.legend i { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; }
.tip { font: 12px var(--mono); color: var(--ink); min-height: 18px; margin-top: 6px; }

.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
.lists .panel { padding: 18px 22px; min-width: 0; }
.lists ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.lists li { display: flex; justify-content: space-between; gap: 12px; }
.lists li b { font: 500 13px var(--mono); color: var(--read); white-space: nowrap; }
.lists li a { color: inherit; text-decoration: none; }
.lists li a:hover { text-decoration: underline; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 22px; }
.kpis > div { padding: 18px 22px; border-right: 1px solid var(--line); }
.kpis > div:last-child { border-right: 0; }
.kpis strong { display: block; font: 600 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.kpis span { color: var(--mute); font-size: 14px; }

.timeline { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 26px; align-items: start; }
.cards { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 16px 22px 18px; scroll-margin-top: 16px; }
.card.sel { border-color: var(--ochre); box-shadow: 0 0 0 1px var(--ochre); }
.card header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.card header .label { color: var(--ochre-deep); }
.kind { font: 12px var(--mono); color: var(--mute); }
.part { border-left: 3px solid var(--ochre); background: color-mix(in srgb, var(--unread) 55%, var(--panel)); padding: 10px 16px; margin-top: 10px; }
.part.ret { border-left-color: var(--read); }
.part .label { color: var(--ochre-deep); font-size: 11px; }
.part.ret .label { color: var(--read); }
.intent { font: 400 17px/1.55 var(--serif); margin: 6px 0 0; }
.lang { font: 11px var(--mono); color: var(--mute); margin-left: 8px; }
details { margin-top: 8px; }
summary { cursor: pointer; font: 12px var(--mono); color: var(--mute); }
details pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; max-height: 360px; overflow: auto; }
.geste { margin: 6px 0 0; }
.geste em { font-style: normal; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.chip { font: 12px var(--mono); color: var(--read); border: 1px solid var(--read); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.chip:hover { background: var(--read); color: var(--panel); }
.empty { color: var(--mute); font-size: 14px; }
.err { margin: 6px 0 2px; font-size: 14px; color: #b3422b; }
.err code { font: 12.5px var(--mono); }

.durs { padding: 14px 18px; position: sticky; top: 16px; }
.dur { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; background: none; border: 0; width: 100%; color: inherit; font: inherit; text-align: left; }
.dur .num { font: 12px var(--mono); color: var(--mute); }
.dur .track { display: flex; align-items: center; gap: 8px; }
.dur .b { height: 7px; background: var(--ochre); }
.dur .v { font: 12px var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; }
.dur .k { font: 10.5px var(--mono); color: var(--mute); margin-left: auto; }
.dur.sel .num { color: var(--ink); font-weight: 600; }
.dur.sel .b { background: var(--ochre-deep); }
.dur:focus-visible { outline: 2px solid var(--ochre); }
.note { color: var(--mute); font-size: 13px; margin-top: 10px; }
.mock { font: 11px var(--mono); color: var(--mute); text-align: right; margin-top: 30px; }
@media (max-width: 860px) {
  .lists, .timeline { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpis > div:nth-child(2) { border-right: 0; }
  .durs { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s, border-color .15s; } }
</style>

. 99: 34 seconds calculation time\n- p. 100: non-optimal configuration, gigue acceptable\n- p. 104: Ch8 intro, individual per-switch config\n- p. 105: constant number of switches\n- p. 106: MDP formulation for individual config\n- p. 109: adaptation to application changes\n- p. 110: topology adaptation\n- p. 111: dynamic TSN network experiment\n- p. 116: conclusion, two contributions\n- p. 117: agent capable on different topologies\n- p. 118: MARL perspective\n- p. 120: SDN architecture, Network Calculus validation\n\nNow I'm moving forward with writing the first two paragraphs of the note, drawing from these detailed extraction points.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para1 (340 mots), para2 (299 mots).", "readings": [], "drafts": [{"variable": "para1", "words": 340}, {"variable": "para2", "words": 299}], "code": "# Write paragraphs 1 (opening) and 2 (methodology)\n# Using all the verified extractions above\n\npara1 = \"\"\"# *Ordonnancer le trafic dans des réseaux déterministes grâce à l'apprentissage par renforcement*\n\n**Compte rendu par** Note générée automatiquement (Qwen3.6-27B-Q6_K.gguf)\n\n**Date :** 2026-10-08\n\n**Référence :** Adrien Roberty, *Ordonnancer le trafic dans des réseaux déterministes grâce à l'apprentissage par renforcement*, ISAE-ENSMA, Laboratoire des Systèmes Communicants, 2024, 141 p.\n\n---\n\nSoutenue en 2024 à l'ISAE-ENSMA de Poitiers, la thèse d'Adrien Roberty se situe au carrefour des réseaux industriels temps-réel et de l'intelligence artificielle. Son objet est de déterminer si un agent d'apprentissage par renforcement profond peut décider dynamiquement un ordonnancement du trafic dans les réseaux Time-Sensitive Networking (TSN), sans nécessiter de connaissance préalable sur les flux de données et en s'adaptant aux changements de topologie. Le contexte général dans lequel s'inscrit cette recherche est celui de l'industrie 4.0 et de ses prolongements en industrie 5.0, qui imposent « une connectivité à faible latence et à haut débit de données pour la surveillance en temps réel » (p. 29). La mise en réseau des installations de production — machines, robots, capteurs — rend indispensable la résolution de problèmes de communication déterministe que les réseaux Ethernet traditionnels « ont souvent du mal à résoudre » (p. 28). L'ensemble des standards TSN, édictés par l'IEEE, fournit un cadre prometteur en ajoutant « des caractéristiques temps-réel à Ethernet en fournissant des capacités de déterminisme, de bande passante garantie et de synchronisation du temps » (p. 29). Cependant, la configuration de ces mécanismes, en particulier celle du Time-Aware Shaper (TAS), se heurte à une difficulté fondamentale : « dans un réseau ouvert (où plus de flux sont ajoutés au réseau et la topologie du réseau est dynamique), l'ordonnancement dans TSN peut entraîner des problèmes NP-difficile » (p. 14). La thèse centrale de Roberty est donc clairement formulée : « Le but de cette thèse est de montrer qu'un agent peut, à l'aide de méthode d'IA, décider un ordonnancement sans connaissances préalables sur les flux, en étant capable de s'adapter à un changement de topologie et dans un délai raisonnable (de l'ordre de la minute) » (p. 30).\"\"\"\n\npara2 = \"\"\"La démarche méthodologique s'appuie sur une approche computationnelle et expérimentale, couplant la formulation d'un problème d'apprentissage par renforcement à sa validation dans des environnements de simulation réseau. L'auteur part du constat que « la plupart des méthodes existantes, basées sur des solveurs ou des heuristiques, se heurtent soit au problème du temps nécessaire avant d'arriver à un résultat, soit à la dynamicité du système » (p. 30). En effet, les approches conventionnelles — formulations par programmation linéaire entière (ILP), solveurs SMT, ou méthodes de Design-Space Exploration —, bien qu'efficaces sur de petits réseaux, « nécessitent beaucoup de temps pour converger » et constituent « des techniques hors ligne qui ne conviennent pas aux réseaux ouverts et reconfigurables » (p. 78). Pour surmonter ces limites, Roberty formule le problème de configuration en un Processus de Décision Markovien (MDP), où l'agent explore l'espace des configurations du TAS (durée du cycle, ouverture et fermeture des portes) en recevant une récompense dépendant de la latence de bout en bout du flux critique et du respect de ses échéances. La conception de cet espace d'états et de cette fonction de récompense constitue l'innovation méthodologique centrale de la thèse. Comme l'explique l'auteur dans sa conclusion, « la clé pour atteindre cet objectif consiste à traduire le problème en un MDP adéquat. La bonne formulation de la récompense, en particulier, est critique » (p. 116). L'entraînement de l'agent se fait sur des simulations réalisées avec OMNeT++/INET et NeSTiNg, des environnements fournissant « une modélisation de réseau détaillée et précise » (p. 100). La validation finale des configurations produites par l'agent fait appel à un module de vérification basé sur le calcul réseau (« *Network Calculus* »), une méthode d'analyse pire-cas garantissant que les délais de traversée demeurent dans les limites acceptables avant déploiement effectif (p. 120).\"\"\"\n\nprint(para1)\nprint(\"\\n\" + \"=\"*60 + \"\\n\")\nprint(para2)\n\n# Store for later assembly\npart1_text = para1 + \"\\n\\n\" + para2"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 9, "kind": "rédaction", "seconds": 27.43, "header_label": "Itération 9 · 27,4 s", "selected_by_default": false, "intention": {"headline": "Good, I've written paragraphs 1 and 2. Now I need to extract new passages from the core of the contributions chapters before writing paragraphs 3, 4, and 5.", "full": "Good, I've written paragraphs 1 and 2. Now I need to extract new passages from the core of the contributions chapters before writing paragraphs 3, 4, and 5. Let me extract more from the heart of Chapter 7 and Chapter 8 to get the details for paragraphs 3 (first contribution) and 4 (second contribution). Then I'll write those paragraphs.\n\nFor paragraph 3 (first contribution - Chapter 7), I need more details from the core experiments and limitations.\nFor paragraph 4 (second contribution - Chapter 8), I need more details from the refined experiments.\n\nI already have good material from my earlier extractions. Let me now write paragraphs 3 and 4 using what I have.\n\nKey citations for paragraph 3 (Ch7):\n- p. 92: Ch7 intro - simplified environment, identical config on each switch\n- p. 93: linear topology, 1-10 switches, cycle duration as single parameter\n- p. 94: MDP state vector with 11 entries\n- p. 97: training evaluation every 10,000 steps\n- p. 98: reward improvement from -23 to -20\n- p. 99: 34 seconds calculation, cycle of 490,000 ns\n- p. 100: non-optimal, acceptable gigue\n- p. 101: sparse rewards problem\n\nKey citations for paragraph 4 (Ch8):\n- p. 104: Ch8 intro - individual per-switch config\n- p. 105: constant number of switches, critical vs BE traffic\n- p. 106: MDP reformulation, reward reformulation\n- p. 109: adaptation to varying clients (1-5)\n- p. 110: topology adaptation (mesh, ring, linear)\n- p. 111: dynamic TSN experiment, new reward formula\n\nLet me write paragraphs 3 and 4 now.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para3 (367 mots), para4 (305 mots).", "readings": [], "drafts": [{"variable": "para3", "words": 367}, {"variable": "para4", "words": 305}], "code": "# Write paragraphs 3 (first contribution - Ch7) and 4 (second contribution - Ch8)\n# Using verified page citations from earlier extractions\n\npara3 = \"\"\"La première contribution de la thèse, développée dans le chapitre 7, consiste à concevoir un agent capable de configurer le TAS de manière identique sur chaque commutateur, dans un environnement simplifié. L'auteur fait l'hypothèse que « l'ordonnancement est le même sur chaque commutateur », ce qui le conduit à ne considérer que des topologies linéaires composées de 1 à 10 commutateurs (p. 92-93). La configuration du TAS se réduit alors à un seul paramètre — la durée du cycle *d*<sub>cycle<\/sub> en nanosecondes —, tandis que la durée de la séquence réservée au trafic critique est fixée à deux fois le temps nécessaire pour envoyer une trame (p. 93). L'état du MDP est un vecteur à onze entrées, regroupant les paramètres topologiques (nombre de stations émettrices et réceptrices, nombre de commutateurs, capacité des liens), les caractéristiques des flux (longueur des trames, intervalle d'émission) et les contraintes temporelles (latence maximale du trafic critique) (p. 94). L'agent, entraîné sur 50 000 pas de temps avec évaluation tous les 10 000 pas, montre une progression mesurable : la durée moyenne des épisodes diminue (de 27 à 24 essais en moyenne entre la troisième et la cinquième évaluation), et la récompense moyenne s'améliore de −23 à −20, indiquant que « l'agent reçoit moins de récompenses négatives au fil du temps » (p. 97-98). Sur l'environnement de test, l'agent parvient à proposer une configuration valide — cycle de 490 000 ns, séquence critique de 16 000 ns — en environ 34 secondes, dont la majeure partie est consacrée à l'exécution de la simulation de validation (p. 99). Roberty souligne toutefois que « l'agent n'est pas efficace » : il souffre du problème classique des « récompenses clairsemées », « trop d'états qui retournent la même récompense », ce qui l'empêche de bien distinguer les séquences d'actions menant au succès (p. 100). De plus, « l'agent privilégie très clairement les flux critiques au détriment des flux BE », la récompense initiale ne prenant en compte que les flux critiques (p. 117). Cette première contribution demeure néanmoins essentielle : elle « a démontré la pertinence et la faisabilité d'une telle approche » et justifie la poursuite des travaux avec un modèle plus sophistiqué (p. 116).\"\"\"\n\npara4 = \"\"\"La deuxième contribution, exposée dans le chapitre 8, lève la restriction de configuration identique et permet à l'agent de décider individuellement les paramètres du TAS sur chaque commutateur. Cette liberté accrue impose cependant de maintenir un nombre constant de commutateurs durant l'entraînement, « car en RL, l'espace des actions ne peut varier au cours de l'entraînement » (p. 105). L'auteur réformule intégralement le problème RL : l'agent ne se contente plus d'ajouter ou de retrancher une valeur au cycle, mais « choisit directement chaque valeur », incluant la durée du décalage (*offset*) et la durée d'ouverture des portes pour chaque file d'attente (p. 106). La récompense a été reconstruite afin de résoudre le problème des récompenses trop maigres de la contribution précédente, en distinguant plus finement les états avec latence acceptable de ceux avec latence excessive. Plusieurs expériences successives testent la robustesse du modèle. La première évalue la capacité de l'agent à s'adapter à un changement applicatif — variation du nombre de clients de 1 à 5 à chaque épisode —, et montre que « l'agent parvient à trouver des configurations acceptables à partir d'environ 30 000 pas d'apprentissage », même si la convergence nécessite plus de temps (p. 109). La seconde fait varier la topologie (maillée, en anneau, linéaire) avec un nombre fixe de clients ; l'auteur observe « l'augmentation drastique du temps d'entraînement » mais constate que « le modèle parvient toujours à trouver la convergence vers des configurations intéressantes », même si ces dernières se stabilisent « vers une configuration moyenne adaptée à différentes topologies sans être excellente dans chaque cas » (p. 110). Une troisième expérience fusionne ces deux dimensions en introduisant à la fois une variation des clients et de la topologie, avec une récompense reformulée visant la minimisation d'une pénalité liée à l'écart entre échéance et latence (p. 111).\"\"\"\n\nprint(para3)\nprint(\"\\n\" + \"=\"*60 + \"\\n\")\nprint(para4)\n\n# Store for later\npart2_text = para3 + \"\\n\\n\" + para4"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucun extrait : le REPL confirme les paragraphes écrits."}}, {"n": 10, "kind": "lecture", "seconds": 17.85, "header_label": "Itération 10 · 17,9 s", "selected_by_default": false, "intention": {"headline": "I've written paragraphs 3 and 4. Now I need to write paragraph 5 (perspectives/extension of agent) and paragraph 6 (synthesis critique).", "full": "I've written paragraphs 3 and 4. Now I need to write paragraph 5 (perspectives/extension of agent) and paragraph 6 (synthesis critique). Let me extract more passages from the perspectives section (p.118-123) for paragraph 5, and then write paragraphs 5 and 6.\n\nFrom my earlier extraction, I have:\n- p. 118: MARL (Multi-Agent Reinforcement Learning) perspective\n- p. 119: new reward formulation proposal (Algorithm 9)\n- p. 120: SDN architecture, Network Calculus\n- p. 121: latency validation and re-request loop\n\nLet me also check what other perspectives are mentioned. Let me extract the rest of the perspectives section.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Lit 8 passages : Conclusion générale et perspectives (p.119) · Conclusion générale et perspectives (p.120) · Conclusion générale et perspectives (p.121) · Conclusion générale et perspectives (p.122) · Conclusion générale et perspectives (p.123) · Bibliographie (p.124) · Conclusion générale et perspectives (p.116) · Conclusion générale et perspectives (p.118)", "readings": [{"type": "page_jump", "page": 119, "section_title": "Conclusion générale et perspectives", "pdf_page": 119}, {"type": "page_jump", "page": 120, "section_title": "Conclusion générale et perspectives", "pdf_page": 120}, {"type": "page_jump", "page": 121, "section_title": "Conclusion générale et perspectives", "pdf_page": 121}, {"type": "page_jump", "page": 122, "section_title": "Conclusion générale et perspectives", "pdf_page": 122}, {"type": "page_jump", "page": 123, "section_title": "Conclusion générale et perspectives", "pdf_page": 123}, {"type": "page_jump", "page": 124, "section_title": "Bibliographie", "pdf_page": 124}, {"type": "page_jump", "page": 116, "section_title": "Conclusion générale et perspectives", "pdf_page": 116}, {"type": "page_jump", "page": 118, "section_title": "Conclusion générale et perspectives", "pdf_page": 118}], "drafts": [], "code": "# Extract remaining perspectives for paragraphs 5-6\np119 = context.find(\"[p.119]\")\np120 = context.find(\"[p.120]\")\np121 = context.find(\"[p.121]\")\np122 = context.find(\"[p.122]\")\np123 = context.find(\"[p.123]\")\np124 = context.find(\"[p.124]\")\n\nprint(\"===== EXTRAIT [p.119] → [p.121] =====\")\nprint(context[p119:p121+1000])\nprint()\n\nprint(\"===== EXTRAIT [p.122] → [p.123] =====\")\nprint(context[p122:p124][:2500])\nprint()\n\n# Also get the full conclusion paragraph for synthesis\nconcl = context.find(\"[p.116]\")\nprint(\"===== EXTRAIT [p.116] → [p.117] (full conclusion) =====\")\nprint(context[concl:context.find(\"[p.118]\")][:3000])"}, "feedback": {"extracts": [{"page_start": 119, "page_end": 121, "label": "p. 119–121", "pdf_page": 119}, {"page_start": 122, "page_end": 123, "label": "p. 122–123", "pdf_page": 122}, {"page_start": 116, "page_end": 117, "label": "p. 116–117", "pdf_page": 116}], "error": null, "empty_message": null}}, {"n": 11, "kind": "rédaction", "seconds": 31.41, "header_label": "Itération 11 · 31,4 s", "selected_by_default": false, "intention": {"headline": "I now have all the material I need. Let me write paragraphs 5 (perspectives/extension) and 6 (synthesis critique), then assemble the full note and call FINAL(). For paragraph 5, I'll cover:", "full": "I now have all the material I need. Let me write paragraphs 5 (perspectives/extension) and 6 (synthesis critique), then assemble the full note and call FINAL().\n\nFor paragraph 5, I'll cover:\n- The MARL perspective (p. 118)\n- The variable action space problem (p. 119)\n- The wireless networks extension (p. 119)\n- The SDN architecture with Network Calculus (p. 120-121)\n\nFor paragraph 6, I'll provide:\n- Overall synthesis of the contribution\n- Critical evaluation of strengths and limitations\n- Opening to future research\n\nLet me also make sure I have enough page references. Current count:\n- p. 14 ✓\n- p. 28 ✓\n- p. 29 ✓\n- p. 30 ✓\n- p. 78 ✓\n- p. 92-93 ✓\n- p. 93 ✓\n- p. 94 ✓\n- p. 97-98 ✓\n- p. 99 ✓\n- p. 100 ✓\n- p. 105 ✓\n- p. 106 ✓\n- p. 109 ✓\n- p. 110 ✓\n- p. 111 ✓\n- p. 116 ✓\n- p. 117 ✓\n- p. 120 ✓\n\nI have plenty of page references. Let me write the final two paragraphs.", "language": "en", "language_note": "raisonnement du modèle, en anglais"}, "gesture": {"summary": "Rédige para5 (286 mots), para6 (316 mots).", "readings": [], "drafts": [{"variable": "para5", "words": 286}, {"variable": "para6", "words": 316}], "code": "# Write paragraphs 5 (perspectives) and 6 (synthesis critique), then assemble full note\n\npara5 = \"\"\"L'auteur articule ses perspectives d'amélioration autour de trois axes. Le premier concerne le passage à l'apprentissage multi-agent (MARL), où « chaque commutateur est représenté par un agent » coopérant « afin de trouver leurs ordonnancements respectifs permettant d'atteindre des latences globales basses » (p. 118). Cette piste exige cependant de migrer vers des bibliothèques plus complexes telles que RLlib ou PettingZoo, et de réécrire l'environnement d'apprentissage. Le second axe vise à résoudre le problème récurrent de l'espace d'actions statique : l'agent ne gère actuellement que des GCL à deux entrées, alors que « d'un point de vue théorique, cette GCL pourrait très bien être à trois entrées ou plus, et ce, de manière indépendante sur chaque commutateur » (p. 119). Roberty explore des solutions telles que les actions basées sur la séquence (via des réseaux récurrents), le masquage binaire des actions illégales, ou l'usage de réseaux neuronaux distincts pour chaque espace d'action — autant de pistes qu'il qualifie de « problème complètement ouvert » (p. 119). Le troisième axe, plus appliquée, envisage l'extension aux réseaux sans-fil 5G/6G, où les interférences et les délais variables complexifieront le modèle, ainsi que la configuration conjointe de plusieurs mécanismes TSN, notamment GPTP et TAS (p. 119-120). Sur le plan architectural, l'auteur propose une intégration de l'agent au sein d'une architecture SDN centralisée conforme au modèle IEEE 802.1Qcc, où la Centralized Network Controller (CNC) détecte les changements, interroge l'agent, et soumet la configuration à un module de validation par calcul réseau (p. 120). Si les latences pires-cas excèdent les échéances, la CNC demande une nouvelle configuration avec « des contraintes de temps plus exigeantes » — boucle itérative qui illustre le couplage indispensable entre apprentissage simulé et vérification formelle (p. 121).\"\"\"\n\npara6 = \"\"\"En définitive, la thèse d'Adrien Roberty apporte une contribution originale à la question de la configuration dynamique de l'ordonnancement dans les réseaux TSN. Son apport principal est méthodologique : la démonstration qu'un agent d'apprentissage par renforcement profond, entraîné sur des simulations et intégré dans une boucle de validation par calcul réseau, peut déterminer — dans un délai de l'ordre de la minute et sans connaissance préalable des flux — des configurations d'ordonnancement acceptables, y compris sur des topologies variées (maillées, en anneau) et en présence de variations applicatives. La force du travail réside dans l'itération progressive entre les deux contributions : les limites identifiées dans le chapitre 7 (récompenses clairsemées, biais en faveur des flux critiques, espace d'actions trop contraint) servent de fondation à la reformulation plus ambitieuse du chapitre 8 (configurations individuelles par commutateur, réécriture de la récompense, augmentation de la complexité topologique). On peut néanmoins relever plusieurs tensions. La contrainte d'un espace d'actions statique, inhérente aux algorithmes RL courants, limite la généralité des configurations produites et empêche de faire varier le nombre de commutateurs durant l'entraînement (p. 105, p. 119). L'agent, si elle trouve des configurations acceptables, ne recherche pas l'optimalité — il « prend la première qu'il trouve » (p. 100) —, ce qui le distingue fondamentalement des solveurs analytiques. Enfin, le pessimisme inhérent au calcul réseau peut entraîner des itérations inutiles entre l'agent et le module de validation, lorsque le délai pire-cas calculé dépasse l'échéance alors que le délai réel serait acceptable (p. 121). Ces limites n'infirment pas la pertinence de l'approche : elles en dessinent plutôt les contours et ouvrent la voie à des prolongements naturels — apprentissage multi-agent, actions séquentielles, intégration 5G/6G — qui constituent les principaux chantiers de la recherche future dans ce domaine. La thèse réussit ainsi à poser les bases d'une nouvelle approche de configuration réseau, à mi-chemin entre les méthodes analytiques rigides et l'intelligence artificielle adaptative.\"\"\"\n\n# Assemble the full note\nfull_note = part1_text + \"\\n\\n\" + para3 + \"\\n\\n\" + para4 + \"\\n\\n\" + para5 + \"\\n\\n\" + para6 + \"\"\"\n\n---\n\n## Pour citer ce document\n\n**Note générée automatiquement**, « Compte rendu de *Ordonnancer le trafic dans des réseaux déterministes grâce à l'apprentissage par renforcement* », 2026-10-08.\"\"\"\n\nprint(full_note)\nprint(\"\\n\\n\" + \"=\"*60)\nprint(f\"LENGTH: {len(full_note)} characters\")\n# Count approximate word count\nimport re\nwords = re.findall(r'\\b\\w+\\b', full_note)\nprint(f\"APPROX WORDS: {len(words)}\")"}, "feedback": {"extracts": [], "error": null, "empty_message": "Aucu document.querySelectorAll(".sec").forEach(el => {
  const s = secs[+el.dataset.i];
  const show = () => $("tip").textContent = `${s.title} · p. ${s.page_start}–${s.page_end} · ${s.pages_read}/${s.pages} pages lues (${pct(s.share_read)})`;
  el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
  const open = () => window.open(pdfAt(s.pdf_page), "_blank");
  el.addEventListener("click", open);
  el.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
});
$("legend-read").textContent = M.legend.read; $("legend-unread").textContent = M.legend.unread; $("legend-hint").textContent = M.legend.hint;

// most_read / never_opened
$("toptitle").textContent = L.most_read;
$("top").innerHTML = S.most_read.items.map(s => `<li><span>${esc(s.title)}</span><b>${esc(s.display_value)}</b></li>`).join("");
$("nevertitle").textContent = L.never_opened;
$("never").innerHTML = S.never_opened.items.map(s => `<li><a href="${pdfAt(s.pdf_page)}" target="_blank" rel="noopener">${esc(s.title)}</a><b style="color:var(--mute)">p. ${s.page_start}</b></li>`).join("")
  || `<li class="empty">${esc(S.never_opened.empty_message)}</li>`;

// kpis
$("kpis").innerHTML = S.kpis.items.map(k => `<div data-key="${k.key}"><strong>${esc(k.value)}</strong><span>${esc(k.caption)}</span></div>`).join("");

// iterations
const IT = S.iterations.items;
$("cards").innerHTML = IT.map(it => {
  const g = it.gesture, f = it.feedback, i = it.intention;
  return `
  <article class="card" id="it${it.n}" aria-labelledby="h${it.n}">
    <header><span class="label" id="h${it.n}">${esc(it.header_label)}</span><span class="kind">${it.kind}</span></header>
    <div class="part"><div class="label">Intention<span class="lang">${esc(i.language_note)}</span></div>
      <p class="intent">${esc(i.headline)}</p>
      ${i.full.length > i.headline.length + 2 ? `<details><summary>raisonnement complet · ${i.full.length} caractères</summary><pre>${esc(i.full)}</pre></details>` : ""}</div>
    <div class="part"><div class="label">Geste</div><p class="geste">${esc(g.summary)}</p>
      ${g.code ? `<details><summary>voir le code</summary><pre>${esc(g.code)}</pre></details>` : ""}</div>
    <div class="part ret"><div class="label">Retour</div>
      ${f.error ? `<p class="err">Le code s'arrête sur une erreur : <code>${esc(f.error)}</code></p>` : ""}
      ${f.extracts.length
        ? `<div class="chips">${f.extracts.length} extrait${f.extracts.length > 1 ? "s" : ""} ${f.extracts.map(x => `<a class="chip" href="${pdfAt(x.pdf_page)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("")}</div>`
        : `<p class="empty" style="margin:6px 0 0">${esc(f.empty_message)}</p>`}
    </div>
  </article>`; }).join("");

// iteration_bars
const B = S.iteration_bars;
$("durtitle").textContent = L.iteration_bars;
$("durcap").textContent = B.caption;
$("durs").innerHTML = B.items.map(b => `<button class="dur" data-n="${b.n}" aria-label="Itération ${b.n}, ${b.kind}, ${b.seconds} secondes">
  <span class="num">${b.n}</span><span class="track"><span class="b" style="width:${(b.seconds / B.max_seconds * 70).toFixed(1)}%"></span><span class="v">${String(b.seconds.toFixed(1)).replace(".", ",")}</span><span class="k">${b.kind}</span></span></button>`).join("");
function select(n, scroll) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.id === "it" + n));
  document.querySelectorAll(".dur").forEach(b => b.classList.toggle("sel", +b.dataset.n === n));
  if (scroll) $("it" + n).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
document.querySelectorAll(".dur").forEach(b => b.addEventListener("click", () => select(+b.dataset.n, true)));
select((IT.find(i => i.selected_by_default) || IT[0]).n, false);
$("mock").textContent = `maquette · run ${C.source.thesis_id}/${C.source.run_id} · ${C.schema} · généré par ${C.source.generator}`;
</script>
</body>
</html>
